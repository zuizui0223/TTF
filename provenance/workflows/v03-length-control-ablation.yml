name: v03-length-control-ablation

on:
  push:
    branches:
      - "analysis/gate-i-geometry-calibration"
    paths:
      - "scripts/ablate_v03_length_control.py"
      - ".github/workflows/v03-length-control-ablation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ablate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - name: Require failed I-B geometry is development-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b = json.loads(Path('results/gate_i_b_rgfca_precision_v0.1.json').read_text())
          d = json.loads(Path('results/v03_gate_i_b_edge_length_diagnostic.json').read_text())
          assert b['gate_pass'] is False
          assert d['claim_ready'] is False
          assert d['may_qualify_successor'] is False
          print({'failed_gate_i_b_reuse':'development_only'})
          PY
      - name: Run paired three-way correction ablation
        run: >-
          python scripts/ablate_v03_length_control.py
          --input benchmarks/frozen/gate_i_b_rgfca_outer0_geometry.csv
          --coordinate-columns x_km,y_km,z_km
          --min-records 20
          --replicates 500
          --resamples 999
          --k 3
          --bandwidth 500
          --batch-size 25
          --seed 20260907
          --output results/v03_length_control_ablation.json
      - name: Freeze development lineage
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('results/v03_length_control_ablation.json')
          d = json.loads(p.read_text())
          assert d['claim_ready'] is False
          assert d['fresh_external_qualification_required'] is True
          d['lineage'] = {
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_head_sha': os.environ['GITHUB_SHA'],
              'failed_gate_i_b_result': 'results/gate_i_b_rgfca_precision_v0.1.json',
              'parent_length_diagnostic': 'results/v03_gate_i_b_edge_length_diagnostic.json',
          }
          p.write_text(json.dumps(d, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v03-length-control-ablation
          path: results/v03_length_control_ablation.json
          if-no-files-found: error
      - name: Commit development ablation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v03_length_control_ablation.json
          git commit -m "Freeze v0.3 length-control ablation"
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
