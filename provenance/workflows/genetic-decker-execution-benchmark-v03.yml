name: genetic Decker execution benchmark v0.3

on:
  push:
    branches:
      - "method/genetic-ibd-crossfit"
    paths:
      - ".github/workflows/genetic-decker-execution-benchmark-v03.yml"
      - "docs/supporting/genetic_decker_execution_benchmark_authorization_v0.3.json"
  workflow_dispatch:

jobs:
  benchmark-v03:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: skdecker/PhylogeographicBreaks
          ref: 11534ba70fbe3705e667651030edef5b849fa949
          path: external/decker
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Verify frozen v0.3 code lineage
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          def blob(path):
              return subprocess.check_output(['git','hash-object',path],text=True).strip()
          a=json.loads(Path('docs/supporting/genetic_decker_execution_benchmark_authorization_v0.3.json').read_text())
          checks={
            'benchmarks/frozen/genetic_decker_pilot_geometry_source_v0.2.json':'source_ledger_blob_sha',
            'docs/supporting/genetic_ibd_successor_v03_rule.json':'successor_rule_blob_sha',
            'scripts/benchmark_genetic_decker_pipeline_v03.py':'runner_blob_sha',
            'src/ttf/genetic_simulate.py':'genetic_simulate_blob_sha',
            'src/ttf/genetic_ibd.py':'genetic_ibd_blob_sha',
            'src/ttf/genetic_gate.py':'genetic_gate_blob_sha',
          }
          for path,key in checks.items():
              assert blob(path)==a[key],(path,blob(path),a[key])
          PY
      - name: Reconstruct frozen v0.2 geometry
        run: |
          python scripts/census_decker_genetic_geometry.py --root external/decker --output results/decker_genetic_geometry_census_v0.1.json --min-localities 12 --min-endpoint-training-edges 5 --neighbor-fraction 0.15
          python scripts/freeze_decker_genetic_pilot_geometry_v02.py --root external/decker --census results/decker_genetic_geometry_census_v0.1.json --rule docs/supporting/genetic_decker_pilot_rule_v0.1.json --output-csv results/decker_genetic_pilot_geometry_v0.2.csv --output-manifest results/decker_genetic_pilot_geometry_v0.2.json
      - name: Run exactly three frozen v0.3 benchmark worlds
        run: |
          python scripts/benchmark_genetic_decker_pipeline_v03.py \
            --geometry results/decker_genetic_pilot_geometry_v0.2.csv \
            --manifest results/decker_genetic_pilot_geometry_v0.2.json \
            --source-ledger benchmarks/frozen/genetic_decker_pilot_geometry_source_v0.2.json \
            --rule docs/supporting/genetic_decker_pilot_rule_v0.1.json \
            --successor-rule docs/supporting/genetic_ibd_successor_v03_rule.json \
            --authorization docs/supporting/genetic_decker_execution_benchmark_authorization_v0.3.json \
            --output results/decker_genetic_execution_benchmark_v0.3.json
      - name: Enforce benchmark boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('results/decker_genetic_execution_benchmark_v0.3.json').read_text())
          assert p['schema']=='ttf_genetic_decker_execution_benchmark_v0.3'
          assert p['status']=='successor_execution_benchmark_only_not_qualification'
          assert p['empirical_genetic_outcomes_opened'] is False
          assert p['qualification_claim_made'] is False
          assert p['v02_failure_remains_immutable'] is True
          assert p['species_count']==221 and p['train_species']==111 and p['eval_species']==110
          assert len(p['cases'])==3
          assert all(c['finite_eval_species_scores']==110 for c in p['cases'])
          print(json.dumps(p,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: decker-genetic-execution-benchmark-v0.3
          path: results/decker_genetic_execution_benchmark_v0.3.json
          if-no-files-found: error
