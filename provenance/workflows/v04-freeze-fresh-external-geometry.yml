name: v04-freeze-fresh-external-geometry

on:
  push:
    branches:
      - "analysis/gate-i-geometry-calibration"
    paths:
      - "benchmarks/v04_fresh_animal_geometry_manifest.csv"
      - ".github/workflows/v04-freeze-fresh-external-geometry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Require v0.4 panel is declared before candidate qualification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v03 = json.loads(Path('results/v03_fresh_external_precision_v0.1.json').read_text())
          reserve = json.loads(Path('benchmarks/frozen/v03_rgfca_reserve_geometry_source.json').read_text())
          assert v03['v03_fresh_external_pass'] is False
          assert reserve['synthetic_worlds_run_at_freeze'] == 0
          assert reserve['candidate_performance_evaluated_at_freeze'] is False
          assert not Path('docs/supporting/v03_reserve_qualification_authorization.json').exists()
          print({'v03_failed': True, 'reserve_opened': False, 'v04_candidate_qualified': False})
          PY
      - name: Freeze second fresh North American animal geometry
        run: >-
          python scripts/freeze_gbif_animal_geometry.py
          --manifest benchmarks/v04_fresh_animal_geometry_manifest.csv
          --output benchmarks/frozen/v04_fresh_animal_geometry.csv
          --ledger benchmarks/frozen/v04_fresh_animal_geometry_source.json
          --fetch-limit 1000
          --cap-per-species 100
          --minimum-records 80
          --seed 20260909
          --allow-canonical-fuzzy
      - name: Enforce disjoint panel and freeze geometry-only execution scale
        run: |
          python - <<'PY'
          import csv, json
          from collections import defaultdict
          from pathlib import Path
          import numpy as np
          from ttf import knn_edges

          prior = set()
          for path in (
              'benchmarks/gate_i_animal_geometry_manifest.csv',
              'benchmarks/v03_fresh_animal_geometry_manifest.csv',
          ):
              with open(path, newline='') as h:
                  prior |= {r['scientific_name'].strip() for r in csv.DictReader(h)}
          grouped = defaultdict(list)
          with open('benchmarks/frozen/v04_fresh_animal_geometry.csv', newline='') as h:
              for r in csv.DictReader(h):
                  grouped[r['species']].append([
                      float(r['x_km']), float(r['y_km']), float(r['z_km'])
                  ])
          fresh = set(grouped)
          overlap = sorted(prior & fresh)
          if overlap:
              raise SystemExit(f'v0.4 fresh panel overlaps prior Gate-I taxa: {overlap}')
          if len(fresh) != 48:
              raise SystemExit(f'expected 48 fresh taxa, found {len(fresh)}')

          medians = []
          for name in sorted(grouped):
              coords = np.asarray(grouped[name], dtype=float)
              edges = knn_edges(coords, k=4)
              lengths = np.linalg.norm(coords[edges[:,0]] - coords[edges[:,1]], axis=1)
              medians.append(float(np.median(lengths)))
          bandwidth = float(np.median(medians))

          p = Path('benchmarks/frozen/v04_fresh_animal_geometry_source.json')
          d = json.loads(p.read_text())
          d['validation_role'] = 'prospectively_frozen_second_external_geometry_for_v04_or_successor'
          d['confirmatory_holdout'] = True
          d['prior_gate_i_taxa_overlap'] = overlap
          d['candidate_performance_evaluated_at_freeze'] = False
          d['synthetic_worlds_run_at_freeze'] = 0
          d['prospective_execution'] = {
              'k': 4,
              'bandwidth_rule': 'median_of_species_median_kNN_edge_length',
              'bandwidth_km': bandwidth,
              'eval_fraction': 0.5,
              'train_species': 24,
              'eval_species': 24,
              'seed': 20260909,
          }
          d['claim_boundary'] = (
              'This freezes a second fresh external animal sampling geometry before any v0.4 '
              'candidate qualification. No synthetic candidate performance is evaluated here.'
          )
          p.write_text(json.dumps(d, indent=2, sort_keys=True) + '\n')
          print({'fresh_species': len(fresh), 'bandwidth_km': bandwidth, 'overlap': overlap})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v04-fresh-external-geometry
          path: |
            benchmarks/frozen/v04_fresh_animal_geometry.csv
            benchmarks/frozen/v04_fresh_animal_geometry_source.json
          if-no-files-found: error
      - name: Commit untouched second external geometry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/frozen/v04_fresh_animal_geometry.csv benchmarks/frozen/v04_fresh_animal_geometry_source.json
          git commit -m "Freeze untouched v0.4 external validation geometry"
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
