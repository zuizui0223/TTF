name: v05-freeze-confirmation-panels

on:
  push:
    branches:
      - "analysis/gate-i-geometry-calibration"
    paths:
      - "benchmarks/v05_fresh_birds_geometry_manifest.csv"
      - "benchmarks/v05_fresh_butterflies_geometry_manifest.csv"
      - ".github/workflows/v05-freeze-confirmation-panels.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  BRANCH: analysis/gate-i-geometry-calibration

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require both panels declared before v0.5 diagnostic outcome inspection
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          v04 = json.loads(Path('results/v04_fresh_external_precision_v0.1.json').read_text())
          reserve = json.loads(Path('benchmarks/frozen/v03_rgfca_reserve_geometry_source.json').read_text())
          assert v04['v04_fresh_external_pass'] is False
          assert v04['precision_qualification']['type1_pass'] is True
          assert v04['precision_qualification']['power_pass'] is False
          assert reserve['synthetic_worlds_run_at_freeze'] == 0
          assert reserve['candidate_performance_evaluated_at_freeze'] is False
          prior = set()
          for path in (
              'benchmarks/gate_i_animal_geometry_manifest.csv',
              'benchmarks/v03_fresh_animal_geometry_manifest.csv',
              'benchmarks/v04_fresh_animal_geometry_manifest.csv',
          ):
              with open(path, newline='') as h:
                  prior |= {r['scientific_name'].strip() for r in csv.DictReader(h)}
          panels = {}
          for key, path in {
              'birds':'benchmarks/v05_fresh_birds_geometry_manifest.csv',
              'butterflies':'benchmarks/v05_fresh_butterflies_geometry_manifest.csv',
          }.items():
              with open(path, newline='') as h:
                  names = [r['scientific_name'].strip() for r in csv.DictReader(h)]
              assert len(names) == 48 and len(set(names)) == 48
              assert not (set(names) & prior), (key, sorted(set(names) & prior))
              panels[key] = set(names)
          assert not (panels['birds'] & panels['butterflies'])
          print({'declared_before_v05_diagnostic_outcome': True, 'birds':48, 'butterflies':48, 'reserve_opened':False})
          PY

  freeze:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - panel: birds
            manifest: benchmarks/v05_fresh_birds_geometry_manifest.csv
            seed: 20260910
          - panel: butterflies
            manifest: benchmarks/v05_fresh_butterflies_geometry_manifest.csv
            seed: 20260911
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Freeze outcome-free panel geometry
        run: >-
          python scripts/freeze_gbif_animal_geometry.py
          --manifest "${{ matrix.manifest }}"
          --output "benchmarks/frozen/v05_fresh_${{ matrix.panel }}_geometry.csv"
          --ledger "benchmarks/frozen/v05_fresh_${{ matrix.panel }}_geometry_source.json"
          --fetch-limit 1000
          --cap-per-species 100
          --minimum-records 80
          --seed "${{ matrix.seed }}"
          --allow-canonical-fuzzy
      - uses: actions/upload-artifact@v4
        with:
          name: v05-freeze-${{ matrix.panel }}
          path: |
            benchmarks/frozen/v05_fresh_${{ matrix.panel }}_geometry.csv
            benchmarks/frozen/v05_fresh_${{ matrix.panel }}_geometry_source.json
          if-no-files-found: error

  seal:
    needs: freeze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: v05-freeze-*
          path: .
          merge-multiple: true
      - name: Enforce disjointness and freeze geometry-only scales
        run: |
          python - <<'PY'
          import csv, json
          from collections import defaultdict
          from pathlib import Path
          import numpy as np
          from ttf import knn_edges

          prior = set()
          for path in (
              'benchmarks/gate_i_animal_geometry_manifest.csv',
              'benchmarks/v03_fresh_animal_geometry_manifest.csv',
              'benchmarks/v04_fresh_animal_geometry_manifest.csv',
          ):
              with open(path, newline='') as h:
                  prior |= {r['scientific_name'].strip() for r in csv.DictReader(h)}

          panel_names = {}
          specs = {'birds':20260910, 'butterflies':20260911}
          summary = {}
          for panel, seed in specs.items():
              csv_path = Path(f'benchmarks/frozen/v05_fresh_{panel}_geometry.csv')
              ledger_path = Path(f'benchmarks/frozen/v05_fresh_{panel}_geometry_source.json')
              grouped = defaultdict(list)
              with csv_path.open(newline='') as h:
                  for r in csv.DictReader(h):
                      grouped[r['species']].append([float(r['x_km']), float(r['y_km']), float(r['z_km'])])
              names = set(grouped)
              assert len(names) == 48, (panel, len(names))
              assert not (names & prior), (panel, sorted(names & prior))
              assert all(len(rows) == 100 for rows in grouped.values())
              medians=[]
              for name in sorted(grouped):
                  coords=np.asarray(grouped[name], dtype=float)
                  edges=knn_edges(coords, k=4)
                  lengths=np.linalg.norm(coords[edges[:,0]]-coords[edges[:,1]], axis=1)
                  medians.append(float(np.median(lengths)))
              bandwidth=float(np.median(medians))
              d=json.loads(ledger_path.read_text())
              d['validation_role']=f'prospectively_frozen_v05_confirmation_panel_{panel}'
              d['confirmatory_holdout']=True
              d['prior_gate_i_taxa_overlap']=[]
              d['candidate_performance_evaluated_at_freeze']=False
              d['synthetic_worlds_run_at_freeze']=0
              d['prospective_execution']={
                  'k':4,
                  'bandwidth_rule':'median_of_species_median_kNN_edge_length',
                  'bandwidth_km':bandwidth,
                  'eval_fraction':0.5,
                  'train_species':24,
                  'eval_species':24,
                  'seed':seed,
              }
              d['confirmation_policy']='v0.5 confirmation requires BOTH predeclared birds and butterflies panels to pass Wilson precision before any RGFCA reserve authorization'
              d['claim_boundary']='Outcome-free external sampling geometry only; no synthetic candidate performance is evaluated during freeze.'
              ledger_path.write_text(json.dumps(d, indent=2, sort_keys=True)+'\n')
              panel_names[panel]=names
              summary[panel]={'species':48,'records':4800,'bandwidth_km':bandwidth,'seed':seed}
          assert not (panel_names['birds'] & panel_names['butterflies'])
          Path('benchmarks/frozen/v05_confirmation_panels_source.json').write_text(json.dumps({
              'schema':'ttf_v05_confirmation_panels_v0.1',
              'status':'both_panels_frozen_before_v05_candidate_confirmation',
              'panels':summary,
              'panel_taxa_overlap':[],
              'prior_gate_i_taxa_overlap':[],
              'candidate_performance_evaluated_at_freeze':False,
              'synthetic_worlds_run_at_freeze':0,
              'conjunctive_confirmation_required':True,
              'rgfca_reserve_opened':False,
          }, indent=2, sort_keys=True)+'\n')
          print(summary)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v05-confirmation-panels
          path: |
            benchmarks/frozen/v05_fresh_birds_geometry.csv
            benchmarks/frozen/v05_fresh_birds_geometry_source.json
            benchmarks/frozen/v05_fresh_butterflies_geometry.csv
            benchmarks/frozen/v05_fresh_butterflies_geometry_source.json
            benchmarks/frozen/v05_confirmation_panels_source.json
          if-no-files-found: error
      - name: Commit untouched v0.5 confirmation geometries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/frozen/v05_fresh_birds_geometry.csv benchmarks/frozen/v05_fresh_birds_geometry_source.json benchmarks/frozen/v05_fresh_butterflies_geometry.csv benchmarks/frozen/v05_fresh_butterflies_geometry_source.json benchmarks/frozen/v05_confirmation_panels_source.json
          git commit -m "Freeze untouched v0.5 confirmation panels"
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
