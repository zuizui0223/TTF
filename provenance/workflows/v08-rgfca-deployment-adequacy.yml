name: v08-rgfca-deployment-adequacy

on:
  push:
    branches:
      - "analysis/gate-i-geometry-calibration"
    paths:
      - "docs/supporting/v08_gate_d_authorization.json"
  workflow_dispatch:

permissions:
  contents: write

env:
  BRANCH: analysis/gate-i-geometry-calibration

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - name: Require fresh Gate-V pass and exact unopened reserve authorization
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          auth=json.loads(Path('docs/supporting/v08_gate_d_authorization.json').read_text())
          gate_v=json.loads(Path('results/v08_external_validity_v0.1.json').read_text())
          rule=json.loads(Path('docs/supporting/v08_validity_detectability_rule.json').read_text())
          reserve=json.loads(Path('benchmarks/frozen/v03_rgfca_reserve_geometry_source.json').read_text())
          assert auth['status']=='authorize_exactly_one_v08_rgfca_deployment_adequacy_run'
          assert gate_v['gate_v_pass'] is True
          assert gate_v['shared_positive_control_opened'] is False
          assert rule['gate_d_deployment_adequacy']['may_run_only_after_gate_v_passes'] is True
          assert reserve['candidate_performance_evaluated_at_freeze'] is False
          assert reserve['synthetic_worlds_run_at_freeze']==0
          assert reserve['empirical_trait_or_colour_fields_read'] is False
          audit=reserve.get('source_audit',{})
          assert audit.get('candidate_pixels_opened_by_audit') is False
          assert audit.get('colour_fields_parsed') is False
          assert audit.get('measurement_authorized') is False
          def blob(path): return subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()
          expected={
              'rule_blob_sha':'docs/supporting/v08_validity_detectability_rule.json',
              'gate_v_result_blob_sha':'results/v08_external_validity_v0.1.json',
              'reserve_source_blob_sha':'benchmarks/frozen/v03_rgfca_reserve_geometry_source.json',
              'runner_blob_sha':'scripts/run_v08_gate_d_statistics.py',
              'aggregator_blob_sha':'scripts/aggregate_v08_gate_d.py',
          }
          for key,path in expected.items(): assert auth[key]==blob(path),(key,auth[key],blob(path))
          print({'gate_v_pass':True,'reserve_empirical_outcome_opened':False,'gate_d_authorized':True})
          PY

  observed:
    needs: invariants
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shared: 0, amplitude: 0.5}
          - {shared: 0, amplitude: 1}
          - {shared: 0, amplitude: 2}
          - {shared: 0, amplitude: 3}
          - {shared: 1, amplitude: 2}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run frozen RGFCA reserve Gate-D observed cell
        run: >-
          python scripts/run_v08_gate_d_statistics.py
          --mode observed
          --input benchmarks/frozen/v03_rgfca_reserve_geometry.csv
          --source-ledger benchmarks/frozen/v03_rgfca_reserve_geometry_source.json
          --shared-fraction "${{ matrix.shared }}"
          --amplitude "${{ matrix.amplitude }}"
          --noise-sd 0.8
          --replicates 500
          --world-batch-size 25
          --strength-neighbours 4
          --transition-width 0.2
          --output "results/v08_gate_d_cells/observed-s${{ matrix.shared }}-a${{ matrix.amplitude }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v08-gate-d-observed-s${{ matrix.shared }}-a${{ matrix.amplitude }}
          path: results/v08_gate_d_cells/*.json
          if-no-files-found: error

  reference:
    needs: invariants
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: A0, amplitude: 0, noise: 0.8}
          - {label: A0p5, amplitude: 0.5, noise: 0.8}
          - {label: A1, amplitude: 1, noise: 0.8}
          - {label: A2, amplitude: 2, noise: 0.8}
          - {label: A3, amplitude: 3, noise: 0.8}
          - {label: A5, amplitude: 5, noise: 0.8}
          - {label: A10, amplitude: 10, noise: 0.8}
          - {label: infinite_snr, amplitude: 1, noise: 0}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run frozen RGFCA reserve private reference
        run: >-
          python scripts/run_v08_gate_d_statistics.py
          --mode reference
          --input benchmarks/frozen/v03_rgfca_reserve_geometry.csv
          --source-ledger benchmarks/frozen/v03_rgfca_reserve_geometry_source.json
          --shared-fraction 0
          --amplitude "${{ matrix.amplitude }}"
          --noise-sd "${{ matrix.noise }}"
          --configuration-label "${{ matrix.label }}"
          --replicates 1999
          --world-batch-size 25
          --strength-neighbours 4
          --transition-width 0.2
          --output "results/v08_gate_d_cells/reference-${{ matrix.label }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v08-gate-d-reference-${{ matrix.label }}
          path: results/v08_gate_d_cells/*.json
          if-no-files-found: error

  aggregate:
    needs: [observed, reference]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: v08-gate-d-*
          path: results/v08_gate_d_cells
          merge-multiple: true
      - name: Require exact Gate-D input set
        run: test "$(find results/v08_gate_d_cells -name '*.json' | wc -l)" -eq 13
      - name: Apply frozen deployment adequacy rule
        run: >-
          python scripts/aggregate_v08_gate_d.py
          --input-dir results/v08_gate_d_cells
          --rule docs/supporting/v08_validity_detectability_rule.json
          --source-ledger benchmarks/frozen/v03_rgfca_reserve_geometry_source.json
          --output results/v08_gate_d_rgfca_reserve_v0.1.json
      - name: Freeze Gate-D authorization lineage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/v08_gate_d_rgfca_reserve_v0.1.json'); d=json.loads(p.read_text())
          d['authorization']=json.loads(Path('docs/supporting/v08_gate_d_authorization.json').read_text())
          d['lineage']={'workflow_run_id':int('${{ github.run_id }}'),'workflow_head_sha':'${{ github.sha }}'}
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v08-gate-d-rgfca-reserve-result
          path: results/v08_gate_d_rgfca_reserve_v0.1.json
          if-no-files-found: error
      - name: Commit immutable Gate-D result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v08_gate_d_rgfca_reserve_v0.1.json
          git commit -m "Freeze v0.8 RGFCA deployment adequacy result"
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
