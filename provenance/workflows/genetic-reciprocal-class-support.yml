name: genetic reciprocal class support census

on:
  push:
    branches:
      - "method/genetic-ibd-crossfit"
    paths:
      - ".github/workflows/genetic-reciprocal-class-support.yml"
      - "scripts/census_genetic_reciprocal_class_support.py"
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: skdecker/PhylogeographicBreaks
          ref: 11534ba70fbe3705e667651030edef5b849fa949
          path: external/decker
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Reconstruct canonical response-blind geometry
        run: |
          python scripts/census_decker_genetic_geometry.py \
            --root external/decker \
            --output results/decker_genetic_geometry_census_v0.1.json \
            --min-localities 12 \
            --min-endpoint-training-edges 5 \
            --neighbor-fraction 0.15
          python scripts/freeze_decker_genetic_pilot_geometry_v02.py \
            --root external/decker \
            --census results/decker_genetic_geometry_census_v0.1.json \
            --rule docs/supporting/genetic_decker_pilot_rule_v0.1.json \
            --output-csv results/decker_genetic_pilot_geometry_v0.2.csv \
            --output-manifest results/decker_genetic_pilot_geometry_v0.2.json
      - name: Census reciprocal class support
        run: |
          python scripts/census_genetic_reciprocal_class_support.py \
            --geometry results/decker_genetic_pilot_geometry_v0.2.csv \
            --manifest results/decker_genetic_pilot_geometry_v0.2.json \
            --pilot-rule docs/supporting/genetic_decker_pilot_rule_v0.1.json \
            --output results/genetic_reciprocal_class_support_v0.1.json
      - name: Enforce response-blind boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('results/genetic_reciprocal_class_support_v0.1.json').read_text())
          assert p['schema']=='ttf_genetic_reciprocal_class_support_census_v0.1'
          assert p['empirical_genetic_outcomes_opened'] is False
          assert p['qualification_claim_made'] is False
          assert p['class_counts']=={'Aves':149,'Chiroptera':72}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: genetic-reciprocal-class-support-v0.1
          path: results/genetic_reciprocal_class_support_v0.1.json
          if-no-files-found: error
