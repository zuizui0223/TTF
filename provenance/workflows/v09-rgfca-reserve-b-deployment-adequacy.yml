name: v09-rgfca-reserve-b-deployment-adequacy

on:
  push:
    branches:
      - "analysis/gate-i-geometry-calibration"
    paths:
      - "docs/supporting/v09_gate_d_authorization.json"

permissions:
  contents: write

env:
  GEOMETRY: benchmarks/frozen/v09_rgfca_reserve_b_max_density_geometry.csv
  SOURCE: benchmarks/frozen/v09_rgfca_reserve_b_max_density_geometry_source.json
  RULE: docs/supporting/v09_reserve_b_max_density_rule.json
  AUTH: docs/supporting/v09_gate_d_authorization.json

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - name: Require exact v0.9 authorization and unopened successor design
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          auth=json.loads(Path('docs/supporting/v09_gate_d_authorization.json').read_text())
          rule=json.loads(Path('docs/supporting/v09_reserve_b_max_density_rule.json').read_text())
          source=json.loads(Path('benchmarks/frozen/v09_rgfca_reserve_b_max_density_geometry_source.json').read_text())
          gate_v=json.loads(Path('results/v08_external_validity_v0.1.json').read_text())
          failed=json.loads(Path('results/v08_gate_d_rgfca_reserve_v0.1.json').read_text())
          assert auth['status']=='authorize_exactly_one_v09_rgfca_reserve_b_deployment_adequacy_run'
          assert gate_v['gate_v_pass'] is True
          assert failed['gate_d_pass'] is False and failed['empirical_colour_outcome_opened'] is False
          assert rule['status']=='frozen_before_v09_reserve_b_geometry_is_materialized'
          assert source['schema']=='ttf_v09_rgfca_reserve_b_max_density_geometry_v0.1'
          assert source['output']['species']==250 and source['output']['records']==25000
          assert source['predecessor']['species_overlap']==[] and source['predecessor']['photo_overlap']==[]
          assert source['empirical_trait_or_colour_fields_read'] is False
          assert source['synthetic_worlds_run_at_freeze']==0
          assert source['candidate_performance_evaluated_at_freeze'] is False
          assert source['source_audit']['candidate_pixels_opened_by_audit'] is False
          assert source['source_audit']['colour_fields_parsed'] is False
          assert source['source_audit']['measurement_authorized'] is False
          def blob(path): return subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()
          assert blob('docs/supporting/v09_reserve_b_max_density_rule.json')==auth['rule_blob_sha']
          assert blob('benchmarks/frozen/v09_rgfca_reserve_b_max_density_geometry_source.json')==auth['source_blob_sha']
          assert blob('scripts/run_v09_gate_d_statistics.py')==auth['runner_blob_sha']
          assert blob('scripts/aggregate_v09_gate_d.py')==auth['aggregator_blob_sha']
          assert blob('.github/workflows/v09-rgfca-reserve-b-deployment-adequacy.yml')==auth['workflow_blob_sha']
          assert blob('results/v08_external_validity_v0.1.json')==auth['gate_v_blob_sha']
          assert blob('results/v08_gate_d_rgfca_reserve_v0.1.json')==auth['failed_gate_d_blob_sha']
          assert auth['geometry_sha256']==source['output']['sha256']
          assert auth['mandatory_cells']==[[0.0,0.5],[0.0,1.0],[0.0,2.0],[0.0,3.0],[1.0,2.0]]
          assert auth['observed_worlds_per_cell']==500 and auth['reference_worlds_per_configuration']==1999
          assert auth['profile_strength_draws']==999 and auth['calibration_statistic_draws']==1000
          assert auth['type1_wilson_upper_ceiling']==0.10 and auth['power_wilson_lower_floor']==0.80
          assert auth['k']==3 and auth['bandwidth_km']==500.0 and auth['seed']==20260920
          print({'authorized':True,'species':250,'records':25000,'empirical_colour_opened':False})
          PY

  observed:
    needs: invariants
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {shared: 0, amplitude: 0.5}
          - {shared: 0, amplitude: 1}
          - {shared: 0, amplitude: 2}
          - {shared: 0, amplitude: 3}
          - {shared: 1, amplitude: 2}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run frozen v0.9 reserve-B observed cell
        run: >-
          python scripts/run_v09_gate_d_statistics.py
          --mode observed
          --input "$GEOMETRY"
          --source-ledger "$SOURCE"
          --shared-fraction ${{ matrix.shared }}
          --amplitude ${{ matrix.amplitude }}
          --noise-sd 0.8
          --replicates 500
          --world-batch-size 5
          --output "out/observed_s${{ matrix.shared }}_a${{ matrix.amplitude }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v09-gated-observed-${{ strategy.job-index }}
          path: out/*.json
          if-no-files-found: error

  reference:
    needs: invariants
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {label: A0, amplitude: 0, noise: 0.8}
          - {label: A0p5, amplitude: 0.5, noise: 0.8}
          - {label: A1, amplitude: 1, noise: 0.8}
          - {label: A2, amplitude: 2, noise: 0.8}
          - {label: A3, amplitude: 3, noise: 0.8}
          - {label: A5, amplitude: 5, noise: 0.8}
          - {label: A10, amplitude: 10, noise: 0.8}
          - {label: infinite_snr, amplitude: 1, noise: 0}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run frozen v0.9 reserve-B private reference
        run: >-
          python scripts/run_v09_gate_d_statistics.py
          --mode reference
          --input "$GEOMETRY"
          --source-ledger "$SOURCE"
          --shared-fraction 0
          --amplitude ${{ matrix.amplitude }}
          --noise-sd ${{ matrix.noise }}
          --configuration-label "${{ matrix.label }}"
          --replicates 1999
          --world-batch-size 5
          --output "out/reference_${{ matrix.label }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v09-gated-reference-${{ matrix.label }}
          path: out/*.json
          if-no-files-found: error

  aggregate:
    needs: [observed, reference]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: v09-gated-*
          path: gathered
          merge-multiple: true
      - name: Require exact v0.9 Gate-D input set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('gathered').glob('*.json'))
          modes=[]
          for p in files:
              d=json.loads(p.read_text())
              if d.get('schema')=='ttf_v09_gate_d_statistics_v0.1': modes.append((d['mode'],d['config']['configuration_label'],d['config']['shared_fraction'],d['config']['amplitude']))
          assert len(modes)==13, modes
          print({'statistics_files':len(modes)})
          PY
      - name: Apply frozen v0.9 deployment adequacy rule
        run: >-
          python scripts/aggregate_v09_gate_d.py
          --input-dir gathered
          --rule "$RULE"
          --source-ledger "$SOURCE"
          --output results/v09_gate_d_rgfca_reserve_b_v0.1.json
      - name: Freeze authorization lineage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/v09_gate_d_rgfca_reserve_b_v0.1.json')
          d=json.loads(p.read_text())
          d['authorization']=json.loads(Path('docs/supporting/v09_gate_d_authorization.json').read_text())
          d['lineage']={'workflow_run_id':${{ github.run_id }},'workflow_head_sha':'${{ github.sha }}'}
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v09-rgfca-reserve-b-gate-d-result
          path: results/v09_gate_d_rgfca_reserve_b_v0.1.json
      - name: Commit immutable v0.9 Gate-D result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v09_gate_d_rgfca_reserve_b_v0.1.json
          git commit -m "Freeze v0.9 RGFCA reserve-B deployment adequacy result"
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
