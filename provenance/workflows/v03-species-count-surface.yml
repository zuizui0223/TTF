name: v03-species-count-surface

on:
  push:
    branches:
      - "analysis/gate-i-geometry-calibration"
    paths:
      - ".github/workflows/v03-species-count-surface.yml"
      - "scripts/aggregate_species_count_surface.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - name: Freeze v0.3 development interpretation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("results/gate_i_a_animal_precision_v0.1.json").read_text())
          assert result["gate_i_a_pass"] is False
          assert result["split"] and len(result["split"]["eval_species"]) == 8
          assert result["precision_qualification"]["max_zero_shared_upper95"] > 0.10
          assert result["precision_qualification"]["full_shared_moderate_lower95"] < 0.80
          print({"i_a_v01_failure_frozen": True, "heldout_species": 8})
          PY

  cell:
    needs: invariants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - species: 12
            shared: 0.0
            amplitude: 3.0
          - species: 12
            shared: 1.0
            amplitude: 2.0
          - species: 16
            shared: 0.0
            amplitude: 3.0
          - species: 16
            shared: 1.0
            amplitude: 2.0
          - species: 20
            shared: 0.0
            amplitude: 3.0
          - species: 20
            shared: 1.0
            amplitude: 2.0
          - species: 30
            shared: 0.0
            amplitude: 3.0
          - species: 30
            shared: 1.0
            amplitude: 2.0
          - species: 40
            shared: 0.0
            amplitude: 3.0
          - species: 40
            shared: 1.0
            amplitude: 2.0
          - species: 60
            shared: 0.0
            amplitude: 3.0
          - species: 60
            shared: 1.0
            amplitude: 2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Run frozen species-count surface cell
        run: >-
          python scripts/run_calibration_cell.py
          --shared-fraction ${{ matrix.shared }}
          --amplitude ${{ matrix.amplitude }}
          --replicates 500
          --resamples 1999
          --species ${{ matrix.species }}
          --records-per-species 60
          --bandwidth 0.2
          --alpha 0.05
          --seed 20260908
          --inference heldout_species_bootstrap
          --output "results/v03_species_count_cells/cell-n${{ matrix.species }}-s${{ matrix.shared }}-a${{ matrix.amplitude }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: "v03-n${{ matrix.species }}-s${{ matrix.shared }}-a${{ matrix.amplitude }}"
          path: "results/v03_species_count_cells/cell-n${{ matrix.species }}-s${{ matrix.shared }}-a${{ matrix.amplitude }}.json"
          if-no-files-found: error

  aggregate:
    needs: cell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: v03-*
          path: results/v03_species_count_cells
          merge-multiple: true
      - name: Require complete frozen surface
        run: test "$(find results/v03_species_count_cells -maxdepth 1 -name 'cell-*.json' | wc -l)" -eq 12
      - name: Reduce v0.3 development surface
        run: >-
          python scripts/aggregate_species_count_surface.py
          --input-dir results/v03_species_count_cells
          --type1-upper-ceiling 0.10
          --power-lower-floor 0.80
          --output results/v03_species_count_surface_v0.1.json
      - name: Print surface result
        run: cat results/v03_species_count_surface_v0.1.json
      - uses: actions/upload-artifact@v4
        with:
          name: v03-species-count-surface
          path: results/v03_species_count_surface_v0.1.json
          if-no-files-found: error
      - name: Freeze development surface on branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v03_species_count_surface_v0.1.json
          if git diff --cached --quiet; then
            echo "No species-count surface change to commit"
            exit 0
          fi
          git commit -m "Freeze v0.3 species-count development surface"
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
