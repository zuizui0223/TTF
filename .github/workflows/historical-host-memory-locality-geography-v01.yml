name: TTF historical host-memory geographic locality influence checks (synthetic only)

on:
  push:
    branches:
      - prospective/historical-host-memory-v0-1
    paths:
      - ".github/workflows/historical-host-memory-locality-geography-v01.yml"
      - "scripts/audit_locality_geography_drivers.py"
      - "tests/test_geography_drivers.py"
      - "benchmarks/frozen/historical_host_memory_postoutcome_geographic_locality_drivers_v0.1.json"
      - "benchmarks/frozen/historical_host_memory_postoutcome_geographic_locality_drivers_independent_v0.1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-geometry-descriptive-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run artificial localities and sign stability checks without source sequences
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"
          python -m pytest -q tests/test_audit_drivers.py tests/test_geography_drivers.py
      - name: Verify source identity and original NOT_EVALUABLE result remain unchanged
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          geo=json.loads(Path("benchmarks/frozen/historical_host_memory_postoutcome_geographic_locality_drivers_v0.1.json").read_text())
          orig=json.loads(Path("benchmarks/frozen/historical_host_memory_259_one_shot_empirical_result_v0.1.json").read_text())
          check=json.loads(Path("benchmarks/frozen/historical_host_memory_postoutcome_geographic_locality_drivers_independent_v0.1.json").read_text())
          assert orig["status"] == geo["original_confirmatory_status"] == "NOT_EVALUABLE_EMPIRICAL_RESPONSE"
          assert orig["primary_statistic"] is None and orig["monte_carlo_p"] is None
          assert geo["original_species"] == 259 and geo["original_zero_species"] == 4
          assert geo["original_sign_flipping_species"] == 129
          assert geo["site_deletions_reversing_sign"] == check["strict_flip_sites"] == 420
          assert geo["defined_deletions_nonzero"] == check["n_site_defined_nonzero"] == 6308
          assert geo["input_sha256"]["frozen_localities"] == "037cd8fa1f059fb67c349a465540d3d5fac469b5d14a2a4d2658d74c036c0ae9"
          assert geo["input_sha256"]["frozen_edges"] == "ab10a876895cf00817e8ce555665ebb78a0f2ac64323d2e93c213e1857738ba9"
          assert geo["interpretation"]["no_p_values_or_new_significance_claims"] is True
          assert geo["interpretation"]["does_not_demonstrate_paleogeographic_barriers"] is True
          print("PASS_EXPLORATORY_SAMPLE_GEOGRAPHY_ONLY; ORIGINAL_NOT_EVALUABLE")
          PY
