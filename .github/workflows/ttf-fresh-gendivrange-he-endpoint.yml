name: ttf-fresh-GenDivRange-He-independent-endpoint
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  one-shot-independent-response:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Validate estimator on synthetic truths before the actual genetic response
        run: python -m unittest discover -s research/quaternary-genetics/tests -v
      - name: Load exact pre-response sampled climate and verify archive digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/climate
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12882494523/zip" > /tmp/gendivrange_climate.zip
          echo 'f7ae6bdc5f6488b2544db9be5d13ee9d29b921b4d57daa740c110083371d52bb  /tmp/gendivrange_climate.zip' | sha256sum -c -
          unzip -q /tmp/gendivrange_climate.zip -d inputs/climate
      - name: Reconfirm all mandatory source and outcome firewalls
        run: |
          python - <<'PY'
          import json,numpy as np,hashlib
          a=json.load(open('research/quaternary-genetics/authorize_he_v01.json'))
          r=json.load(open('inputs/climate/results/gendivrange-climate/climate_receipt.json'))
          g=json.load(open('inputs/climate/eligible_geometry.json'))
          assert a['status']=='AUTHORIZE_NEW_GENDIVRANGE_HE_ONLY'
          assert r['genetic_He_values_opened'] is False
          assert len(r['raster_source_receipts'])==8
          assert len(g['adult_terrestrial_frozen_manifest'])==882
          x=np.load('inputs/climate/results/gendivrange-climate/climate_values.npy',allow_pickle=False)
          assert len(x)==a['source_climate']['sites']
          assert hashlib.sha256(x.tobytes()).hexdigest()==a['source_climate']['matrix_raw_sha256']
          assert np.isfinite(x).all(axis=1).sum()==a['source_climate']['sites_all_eight_finite']
          print('AUTHORIZE: independent new He only, all climate and geographic firewalls intact')
          PY
      - name: Fetch public source and run ONE frozen species-heldout He endpoint
        run: |
          python research/quaternary-genetics/figshare_preflight.py --output figshare.json
          python research/quaternary-genetics/run_he_holdout.py \
            --authorization research/quaternary-genetics/authorize_he_v01.json \
            --metadata figshare.json \
            --climate-dir inputs/climate \
            --output results/fresh_He_holdout_result_v01.json
      - name: Preserve aggregated empirical endpoint only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: independent-gendivrange-He-heldout-oneshot
          path: results/fresh_He_holdout_result_v01.json
          retention-days: 30
          if-no-files-found: error
