name: ttf-mammal-break-spatial-overlap-gate
on:
  push:
    branches: [research/break-location-na-mammals-v01]
    paths:
      - '.github/workflows/ttf-mammal-break-overlap-gate.yml'
      - 'research/break-location-na-mammals/source_overlap_gate.py'
      - 'research/break-location-na-mammals/spatial_overlap_gate_v01.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ttf-mammal-break-overlap-gate.yml'
      - 'research/break-location-na-mammals/source_overlap_gate.py'
      - 'research/break-location-na-mammals/spatial_overlap_gate_v01.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  break-versus-surveyed-range:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIS libraries only
        run: python -m pip install 'pyshp>=2.3,<3' 'pyproj>=3.7,<4' 'shapely>=2,<3'
      - name: Verify original MD5 then check spatial support and mixed CRS
        run: |
          python research/break-location-na-mammals/source_overlap_gate.py \
            --manifest research/break-location-na-mammals/original_files_v02.json \
            --rule research/break-location-na-mammals/spatial_overlap_gate_v01.json \
            --work /tmp/jensen-break-geometries \
            --out results/ttf-mammal-breaks/spatial_overlap_gate.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ttf-mammal-break-spatial-support-gate
          path: results/ttf-mammal-breaks/spatial_overlap_gate.json
          retention-days: 30
          if-no-files-found: error
