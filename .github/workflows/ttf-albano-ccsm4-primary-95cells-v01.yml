name: Albano frozen primary CCSM4 LGM 95-cell raster extraction
on:
  push:
    branches:
      - 'prospective/original-gps-transplant-panel-20261119'
    paths:
      - '.github/workflows/ttf-albano-ccsm4-primary-95cells-v01.yml'
      - 'research/fresh_transplant/albano2025_CCSM4_primary_LGM_raster_unlabeled_v01.py'
      - 'research/fresh_transplant/test_albano2025_CCSM4_primary_LGM_raster_unlabeled_v01.py'
      - 'research/fresh_transplant/source_registry/albano2025_CCSM4_primary_LGM_tiff_members_v01.json'
      - 'research/fresh_transplant/albano2025_MPI_LGM_raster_values_unlabeled_v01.py'
      - 'research/fresh_transplant/source_registry/albano2025_unlabeled_worldclim_2_5m_cells_v01.json'
jobs:
  precommitted-primary-ccsm4-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Six frozen first-shot primary GCM tests
        run: python -m unittest discover -s research/fresh_transplant -p test_albano2025_CCSM4_primary_LGM_raster_unlabeled_v01.py -v
      - name: Install original TIFF raster reader
        run: python -m pip install --quiet 'rasterio>=1.4,<2'
      - name: CRC-check and sample primary CCSM4 two original TIFF members at 95 cells
        run: python research/fresh_transplant/albano2025_CCSM4_primary_LGM_raster_unlabeled_v01.py --output _source_only/albano2025_primary_ccsm4_lgm_bio1_bio12_95cells_v01.json
      - uses: actions/upload-artifact@v4
        with:
          name: ttf-albano-ccsm4-primary-original-95-lGM-cells
          path: _source_only/albano2025_primary_ccsm4_lgm_bio1_bio12_95cells_v01.json
          retention-days: 90
