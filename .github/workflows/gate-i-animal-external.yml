name: gate-i-a-animal-external

on:
  push:
    branches:
      - "analysis/gate-i-geometry-calibration"
    paths:
      - "benchmarks/gate_i_animal_geometry_manifest.csv"
      - "scripts/freeze_gbif_animal_geometry.py"
      - ".github/workflows/gate-i-animal-external.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-and-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .

      - name: Freeze independent animal occurrence geometry
        run: >-
          python scripts/freeze_gbif_animal_geometry.py
          --output benchmarks/frozen/gate_i_a_animal_geometry.csv
          --ledger benchmarks/frozen/gate_i_a_animal_geometry_source.json
          --fetch-limit 1200
          --cap-per-species 120
          --minimum-records 80
          --seed 20260907

      - name: Derive geometry-only bandwidth
        run: |
          BANDWIDTH=$(python - <<'PY'
          import csv
          from collections import defaultdict
          import numpy as np
          from ttf import knn_edges

          grouped = defaultdict(list)
          with open("benchmarks/frozen/gate_i_a_animal_geometry.csv", newline="") as handle:
              for row in csv.DictReader(handle):
                  grouped[row["species"]].append(
                      [float(row["x_km"]), float(row["y_km"]), float(row["z_km"])]
                  )
          species_medians = []
          for species in sorted(grouped):
              coords = np.asarray(grouped[species], dtype=float)
              edges = knn_edges(coords, k=4)
              lengths = np.linalg.norm(coords[edges[:, 0]] - coords[edges[:, 1]], axis=1)
              species_medians.append(float(np.median(lengths)))
          print(float(np.median(species_medians)))
          PY
          )
          echo "BANDWIDTH_KM=$BANDWIDTH" >> "$GITHUB_ENV"
          echo "Geometry-only bandwidth: $BANDWIDTH km"

      - name: Run Gate-I-A pipeline pilot
        run: >-
          python scripts/run_geometry_calibration.py
          --input benchmarks/frozen/gate_i_a_animal_geometry.csv
          --coordinate-columns x_km,y_km,z_km
          --min-records 80
          --shared-fractions 0,1
          --amplitudes 2
          --replicates 5
          --resamples 199
          --k 4
          --bandwidth "$BANDWIDTH_KM"
          --moderate-amplitude 2
          --output results/gate_i_a_animal_pilot.json

      - name: Mark pilot claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("results/gate_i_a_animal_pilot.json")
          data = json.loads(path.read_text())
          data["gate"] = "I-A external non-flower geometry stress"
          data["qualification_scope"] = "pipeline_pilot_only"
          data["claim_ready"] = False
          data["claim_boundary"] = (
              "Five worlds per arm validate the external-geometry execution path only. "
              "They are not the 500-world high-precision qualification. Gate I-B on "
              "the intended empirical TTF geometry also remains required."
          )
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          PY

      - name: Freeze external geometry and pilot on branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            benchmarks/frozen/gate_i_a_animal_geometry.csv \
            benchmarks/frozen/gate_i_a_animal_geometry_source.json \
            results/gate_i_a_animal_pilot.json
          if git diff --cached --quiet; then
            echo "No frozen-output changes to commit"
            exit 0
          fi
          git commit -m "Freeze Gate-I-A external animal geometry pilot"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
