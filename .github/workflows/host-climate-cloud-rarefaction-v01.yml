name: TTF Bungalotis 665-to-26 host cloud climate corridor rarefaction (exploratory only)

on:
  push:
    branches:
      - exploratory/host-cloud-26point-rarefaction-v0-1
    paths:
      - '.github/workflows/host-climate-cloud-rarefaction-v01.yml'
      - 'scripts/pilot_host_cloud_size_rarefaction.py'
      - 'tests/test_host_cloud_rarefaction_v01.py'
      - 'docs/supporting/host_memory_bungalotis_26point_rarefaction_contract_v0.1.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  response-free-reference-count-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify response-free rarefaction and original CHELSA pathway tests
        run: |
          set -euo pipefail
          python -m pip install -e '.[test]' 'rasterio>=1.4,<2' 'scipy>=1.13,<2'
          python -m pytest -q tests/test_host_cloud_rarefaction_v01.py tests/test_climate_corridor_pilot.py
          test -s docs/supporting/host_memory_bungalotis_26point_rarefaction_contract_v0.1.json
      - name: Reconstruct original frozen 642-species geometry only
        run: |
          set -euo pipefail
          mkdir -p input/geo
          echo '92e19da615ffc2003a90569afd4089eb24871f1fc0df69cc3aface4263b96dc4  provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz' | sha256sum -c -
          tar -xJf provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz -C input/geo
          echo '037cd8fa1f059fb67c349a465540d3d5fac469b5d14a2a4d2658d74c036c0ae9  input/geo/historical_host_memory_localities_v0.1.csv' | sha256sum -c -
          echo 'ab10a876895cf00817e8ce555665ebb78a0f2ac64323d2e93c213e1857738ba9  input/geo/historical_host_memory_edges_v0.1.csv' | sha256sum -c -
          echo 'c36cbb2ba0cbf7d0222645a04538c78236cfda392dd0a3d11dd443f12347d35b  benchmarks/frozen/historical_host_memory_candidate_642_v0.1.csv' | sha256sum -c -
          echo '7d255b208a485e7bc6d02e4e5748781c5e10170ed8bf161542dce3135c897b3b  benchmarks/exploratory/historical_host_climate_lcp_bungalotis_64edges_v0.1.csv' | sha256sum -c -
          echo '6969f482a1967db2db159cbc5fd62b722268a0fc45d7dcd1b979f1973b9a3493  benchmarks/exploratory/historical_host_climate_lcp_bungalotis_summary_v0.1.json' | sha256sum -c -
      - name: Restore exact WCVP HOSTS support and previously frozen climate predictors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/hosts input/support input/previous
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10617946932/zip" > /tmp/hosts.zip
          unzip -q /tmp/hosts.zip -d input/hosts
          rm /tmp/hosts.zip
          echo '0a084fb5273e4780b03e015205c87e4545c69f0f8e517feb1a2a3879889508e9  input/hosts/insect_host_accepted.csv' | sha256sum -c -
          echo 'c731906315f7452f83ce302c1d36c75ad94afc24ce7e24d461360312244ac558  input/hosts/native_extant_nondoubtful_wgsrpd3.csv' | sha256sum -c -
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/11495066386/zip" > /tmp/support.zip
          unzip -q /tmp/support.zip -d input/support
          rm /tmp/support.zip
          echo 'd0fc12f635ec56a442dd37dec06cf3aa06684a00b14f1bb1f2db2f6fe3c4a21f  input/support/wgsrpd3_support_points_v0.1.csv' | sha256sum -c -
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/11559015421/zip" > /tmp/predictor.zip
          unzip -q /tmp/predictor.zip -d input/previous
          rm /tmp/predictor.zip
          echo '70b748d588d9ab10309ace080f85b8053c6e14aa96d7a84288724c1000272a5b  input/previous/edge_predictors_v0.1.csv' | sha256sum -c -
      - name: Restore original 8 CHELSA-TraCE21k raster layers, never genetic responses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/chelsa
          df -h .
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10791389409/zip" > /tmp/historical.zip
          echo '0a797c609d26a185ba08d209a71203a584fa60f1045c4a8c335934372cee30b2  /tmp/historical.zip' | sha256sum -c -
          unzip -q /tmp/historical.zip -d input/chelsa
          rm /tmp/historical.zip
          echo '7d82833996006fc1e99b86acb4ea7e80cde29c7f500df739ef48cb9ce145d450  input/chelsa/manifest.json' | sha256sum -c -
          for v in bio01 bio07 bio12 bio15; do
            for t in -190 20; do
              test -s "input/chelsa/historical/CHELSA_TraCE21K_${v}_${t}_V1.0.tif"
            done
          done
          df -h .
      - name: Replay original 64-edge LCP then run 64 fixed 26/665 host-cloud draws
        run: |
          set -euo pipefail
          mkdir -p results/host_cloud_26pilot
          python -u scripts/pilot_host_cloud_size_rarefaction.py \
            --contract docs/supporting/host_memory_bungalotis_26point_rarefaction_contract_v0.1.json \
            --candidates benchmarks/frozen/historical_host_memory_candidate_642_v0.1.csv \
            --localities input/geo/historical_host_memory_localities_v0.1.csv \
            --edges input/geo/historical_host_memory_edges_v0.1.csv \
            --host-pairs input/hosts/insect_host_accepted.csv \
            --native-units input/hosts/native_extant_nondoubtful_wgsrpd3.csv \
            --wgsrpd-support input/support/wgsrpd3_support_points_v0.1.csv \
            --frozen-predictors input/previous/edge_predictors_v0.1.csv \
            --manifest input/chelsa/manifest.json \
            --original-pilot-edges benchmarks/exploratory/historical_host_climate_lcp_bungalotis_64edges_v0.1.csv \
            --original-pilot-summary benchmarks/exploratory/historical_host_climate_lcp_bungalotis_summary_v0.1.json \
            --historical-asset input/chelsa/historical/CHELSA_TraCE21K_bio01_-190_V1.0.tif \
            --historical-asset input/chelsa/historical/CHELSA_TraCE21K_bio07_-190_V1.0.tif \
            --historical-asset input/chelsa/historical/CHELSA_TraCE21K_bio12_-190_V1.0.tif \
            --historical-asset input/chelsa/historical/CHELSA_TraCE21K_bio15_-190_V1.0.tif \
            --historical-asset input/chelsa/historical/CHELSA_TraCE21K_bio01_20_V1.0.tif \
            --historical-asset input/chelsa/historical/CHELSA_TraCE21K_bio07_20_V1.0.tif \
            --historical-asset input/chelsa/historical/CHELSA_TraCE21K_bio12_20_V1.0.tif \
            --historical-asset input/chelsa/historical/CHELSA_TraCE21K_bio15_20_V1.0.tif \
            --output results/host_cloud_26pilot/rarefaction_summary.json
          python - <<'PY'
          import json
          p=json.load(open('results/host_cloud_26pilot/rarefaction_summary.json'))
          assert p['status']=='EXPLORATORY_CLIMATE_ONLY_REFERENCE_SIZE_SENSITIVITY_NOT_GENETIC_TEST'
          assert p['study']['draws']==64 and p['study']['original_host_reference_n']==665
          assert p['study']['rarefied_host_reference_n']==26 and p['study']['frozen_edges']==64
          assert p['frozen_replay_max_absolute_lcp_error'] <= 1e-8
          assert p['boundary']['gene_distance_or_p_value_computed'] is False
          print('PASS_FROZEN_CLIMATE_ONLY_REFERENCE_COUNT_SENSITIVITY__NO_GENETICS')
          PY
          cat results/host_cloud_26pilot/rarefaction_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hhm-bungalotis-26-point-host-cloud-rarefaction-v0.1
          path: results/host_cloud_26pilot/
          if-no-files-found: warn
          retention-days: 30
