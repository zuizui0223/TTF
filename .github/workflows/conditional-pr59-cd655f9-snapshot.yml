name: conditional pr59 cd655f9 snapshot

on:
  push:
    branches:
      - "ops/conditional-pr59-cd655f9-snapshot-20260919"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "cd655f9f9b918414b44b57c59a8b3b1156e03e4c"
          fetch-depth: 1
      - name: Pack exact PR head
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/TTF-pr59-cd655f9.tar.gz .
          sha256sum /tmp/TTF-pr59-cd655f9.tar.gz > /tmp/TTF-pr59-cd655f9.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TTF-pr59-cd655f9-snapshot
          path: |
            /tmp/TTF-pr59-cd655f9.tar.gz
            /tmp/TTF-pr59-cd655f9.tar.gz.sha256
          if-no-files-found: error
