name: ttf-CaliPopGen-Fst-exact-geometry-synthetic-gate
on:
  push:
    branches: [research/calipopgen-fst-v01]
    paths:
      - '.github/workflows/ttf-calipopgen-fst-synthetic.yml'
      - 'research/calipopgen-fst/known_truth_gate_v01.json'
      - 'research/calipopgen-fst/calibrate_fst_worlds.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ttf-calipopgen-fst-synthetic.yml'
      - 'research/calipopgen-fst/known_truth_gate_v01.json'
      - 'research/calipopgen-fst/calibrate_fst_worlds.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  true-null-and-alternative:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy and run preregistered known-truth tests
        run: |
          python -m pip install 'numpy>=1.26,<3'
          python -m unittest discover -s research/calipopgen-fst/tests -v
      - name: Restore exact response-blind CHELSA site grid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12887306539/zip" > /tmp/climate.zip
          echo '8bacad8e331b290e541b49ef32bd6c9331ddf788376ce490cfa300f12737fac7  /tmp/climate.zip' | sha256sum -c -
          unzip -q /tmp/climate.zip -d inputs
      - name: Run frozen synthetic null and positive effects with locality dependence
        run: |
          python research/calipopgen-fst/calibrate_fst_worlds.py \
            --climate-dir inputs/climate \
            --contract research/calipopgen-fst/known_truth_gate_v01.json \
            --output results/calipopgen-fst/synthetic_gate.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ttf-calipopgen-fst-known-truth-gate
          path: results/calipopgen-fst/synthetic_gate.json
          retention-days: 30
          if-no-files-found: error
