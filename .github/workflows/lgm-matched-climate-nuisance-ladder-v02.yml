name: TTF paired LGM historical host information nuisance ladder v02
on:
  push:
    branches: [exploratory/lgm-90-climate-nuisance-ladder-v02]
    paths:
      - .github/workflows/lgm-matched-climate-nuisance-ladder-v02.yml
      - scripts/reference_helpers_min.py
      - scripts/matched_climate_nuisance_ladder_v02.py
      - tests/test_matched_climate_nuisance_ladder_v02.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ttf-matched-host-climate-nuisance-ladder-v02
  cancel-in-progress: false
jobs:
  matched-climate-without-genetics:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-safe synthetic controls, geodesics, matching, and identity
        run: |
          set -euo pipefail
          python -m pip install -e '.[test]' 'rasterio>=1.4,<2' 'scipy>=1.13,<2' 'requests>=2.31,<3'
          python -m pytest -q tests/test_matched_lgm_climate_exploratory.py tests/test_matched_climate_nuisance_ladder_v02.py
          echo 'a28fba9efa8a9dc79c162336f62c883059c5dddbfabec2861f554d038dd98044  benchmarks/exploratory/lgm_external_reference_v01/host_reference_request_manifest.csv' | sha256sum -c -
      - name: Restore exact original geography, no genetic sequences
        run: |
          set -euo pipefail
          echo '92e19da615ffc2003a90569afd4089eb24871f1fc0df69cc3aface4263b96dc4  provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz' | sha256sum -c -
          mkdir -p input/matched/geometry
          tar -xJf provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz -C input/matched/geometry
          echo '037cd8fa1f059fb67c349a465540d3d5fac469b5d14a2a4d2658d74c036c0ae9  input/matched/geometry/historical_host_memory_localities_v0.1.csv' | sha256sum -c -
          echo 'ab10a876895cf00817e8ce555665ebb78a0f2ac64323d2e93c213e1857738ba9  input/matched/geometry/historical_host_memory_edges_v0.1.csv' | sha256sum -c -
          python - <<'PYTHON'
          import json
          from pathlib import Path
          h=json.loads(Path('benchmarks/exploratory/lgm_host_reference_v01/summary.json').read_text())
          i=json.loads(Path('benchmarks/exploratory/lgm_external_reference_v01/summary.json').read_text())
          assert h['attempted_taxa']==13 and h['pending_taxa']==505
          assert h['quality_records']==10774 and h['climate_or_genetic_response_used'] is False
          assert i['attempted_species']==641 and i['retained_reference_points_50km']==62588
          assert i['genetic_response_used'] is False
          print('PASS_PARTIAL_HOST_AND_COMPLETE_INSECT_REFERENCE_BINDINGS')
          PYTHON
      - name: Restore SHA-verified global reference support and 8 CHELSA 0BP/LGM rasters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/matched/support input/matched/chelsa
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/11495066386/zip" > /tmp/support.zip
          unzip -q /tmp/support.zip -d input/matched/support
          echo 'd0fc12f635ec56a442dd37dec06cf3aa06684a00b14f1bb1f2db2f6fe3c4a21f  input/matched/support/wgsrpd3_support_points_v0.1.csv' | sha256sum -c -
          df -h .
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10791389409/zip" > /tmp/chelsa.zip
          echo '0a797c609d26a185ba08d209a71203a584fa60f1045c4a8c335934372cee30b2  /tmp/chelsa.zip' | sha256sum -c -
          unzip -q /tmp/chelsa.zip -d input/matched/chelsa
          rm /tmp/chelsa.zip
          echo '7d82833996006fc1e99b86acb4ea7e80cde29c7f500df739ef48cb9ce145d450  input/matched/chelsa/manifest.json' | sha256sum -c -
          for v in bio01 bio07 bio12 bio15; do
            for t in -190 20; do
              test -s "input/matched/chelsa/historical/CHELSA_TraCE21K_${v}_${t}_V1.0.tif"
            done
          done
          df -h .
      - name: Materialize paired climate information on exact 90 geometry-qualified taxa
        run: |
          set -euo pipefail
          python -u scripts/matched_climate_nuisance_ladder_v02.py \
            --host-manifest benchmarks/exploratory/lgm_external_reference_v01/host_reference_request_manifest.csv \
            --host-snapshot benchmarks/exploratory/lgm_host_reference_v01 \
            --insect-summary benchmarks/exploratory/lgm_external_reference_v01/all_641_species_external_reference.csv \
            --insect-points benchmarks/exploratory/lgm_external_reference_v01/external_insect_points_50km.csv.gz \
            --localities input/matched/geometry/historical_host_memory_localities_v0.1.csv \
            --edges input/matched/geometry/historical_host_memory_edges_v0.1.csv \
            --global-support input/matched/support/wgsrpd3_support_points_v0.1.csv \
            --asset-root input/matched/chelsa/historical \
            --out benchmarks/exploratory/lgm_matched_climate_nuisance_ladder_v02
          python - <<'PYTHON'
          import json
          from pathlib import Path
          q=json.loads(Path('benchmarks/exploratory/lgm_matched_climate_nuisance_ladder_v02/summary.json').read_text())
          assert q['matched_geometry_species']==90 and q['insect_panel']==641
          assert q['source_host_taxa']==12 and q['host_pending_taxa']==505
          assert q['climate_success']==90
          assert q['median_unique_before_geography'] is not None
          assert q['median_unique_before_geography'] >= q['median_unique_history_fraction']-1e-12
          assert q['status']=='EXPLORATORY_ECOLOGICAL_INFORMATION_NOT_GENETIC_RESPONSE'
          print('PASS_ECOLOGICAL_INFORMATION_ONLY_NO_GENETIC_RESPONSE')
          PYTHON
      - name: Verify the original 90-species output remains unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/previous_matched
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12167222323/zip" > /tmp/previous_matched_v01.zip
          echo '3176bbf7e6499c8632374ec6ab5a8e473b42af004a25a344f18cd780a5a4a8a7  /tmp/previous_matched_v01.zip' | sha256sum -c -
          unzip -q /tmp/previous_matched_v01.zip -d input/previous_matched
          python - <<'PYTHON'
          import csv,json,math
          from pathlib import Path
          old=Path('input/previous_matched/species_matched_history_v0.1.csv')
          new=Path('benchmarks/exploratory/lgm_matched_climate_nuisance_ladder_v02/species_matched_history_v0.1.csv')
          original={r['species']:r for r in csv.DictReader(old.open())}
          updated={r['species']:r for r in csv.DictReader(new.open())}
          assert len(original)==len(updated)==90 and original.keys()==updated.keys()
          numeric=['unique_hist_fraction_median','unique_hist_fraction_q05','unique_hist_fraction_q95',
                   'relative_history_delta_median','relative_history_delta_q05','relative_history_delta_q95']
          largest=0.
          for sp,a in original.items():
              b=updated[sp]
              for field in numeric:
                  largest=max(largest,abs(float(a[field])-float(b[field])))
              assert float(b['unique_before_geography_median'])+1e-12>=float(b['unique_hist_fraction_median'])
          assert largest<=1e-12,largest
          q=json.loads(Path('benchmarks/exploratory/lgm_matched_climate_nuisance_ladder_v02/summary.json').read_text())
          assert q['post_v01_exploratory_control_decomposition'] is True
          print(json.dumps({'baseline_q_max_absolute_error':largest,'species':90,'pre_geo_median':q['median_unique_before_geography'],'post_geo_median':q['median_unique_history_fraction']}))
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ttf-matched-climate-nuisance-ladder-v02
          path: benchmarks/exploratory/lgm_matched_climate_nuisance_ladder_v02/
          retention-days: 30
          if-no-files-found: warn
