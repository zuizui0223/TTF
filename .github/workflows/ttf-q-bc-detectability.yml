name: ttf-q-bc-detectability

on:
  push:
    branches:
      - method/ttf-q-response-blind-qualification-v0-1
    paths:
      - ".github/workflows/ttf-q-bc-detectability.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  characterize:
    strategy:
      fail-fast: false
      matrix:
        kind: [current, historical]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TTF-Q
        run: python -m pip install -e .

      - name: Verify response-blind boundary and exact C2 source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          final=json.loads(Path("benchmarks/frozen/relational_program_final_state_v0.3.json").read_text())
          c2=json.loads(Path("benchmarks/frozen/ttf_q_c2_result_receipt_v0.1.json").read_text())
          contract=json.loads(Path("docs/supporting/ttf_q_v0.1.json").read_text())
          assert final["final_state"]=="CLOSED_NO_EVALUABLE_TEST"
          assert c2["workflow"]["run_id"]==36328949191
          assert c2["workflow"]["artifact_id"]==10934507901
          assert c2["workflow"]["artifact_digest_sha256"]=="107aa5cb27fb086cf5711537d819b8e0b6021ba340eaff5e107767cbc81c6c9c"
          assert contract["boundary"]["genetic_response_opening_authorized"] is False
          assert contract["detectability_surface"]["worlds_per_cell"]==1000
          print({"status":"PASS_EXACT_RESPONSE_BLIND_DETECTABILITY_BINDING"})
          PY

      - uses: actions/download-artifact@v4
        with:
          name: ttf-q-c2-geographic-information
          path: input/c2
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36328949191

      - name: Locate exact C2 opportunity design
        run: |
          set -euo pipefail
          mkdir -p input/exact results
          DESIGN="$(find input/c2 -type f -name c2_external_opportunity.npz -print -quit)"
          test -n "$DESIGN"
          cp "$DESIGN" input/exact/c2_external_opportunity.npz
          python - <<'PY'
          import json
          from pathlib import Path
          hits=list(Path("input/c2").rglob("c2_result_receipt.json"))
          assert len(hits)==1,hits
          p=json.loads(hits[0].read_text())
          assert p["status"]=="COMPLETE_RESPONSE_BLIND_GEOGRAPHY_INFORMATION_DECOMPOSITION"
          assert p["genetic_response_used"] is False
          assert p["v03_reopened"] is False
          print({"status":"PASS_C2_ARTIFACT_BOUND"})
          PY

      - name: Run development-panel detectability surface
        run: |
          python scripts/run_ttf_q_characterization.py \
            --design input/exact/c2_external_opportunity.npz \
            --kind "${{ matrix.kind }}" \
            --panel development \
            --output "results/${{ matrix.kind }}_development_characterization.json"
          cat "results/${{ matrix.kind }}_development_characterization.json"

      - name: Compact receipt
        run: |
          KIND="${{ matrix.kind }}" python - <<'PY'
          import json,os
          from pathlib import Path
          kind=os.environ["KIND"]
          p=json.loads(Path(f"results/{kind}_development_characterization.json").read_text())
          rows=p["detectability_surface"]
          null=[r for r in rows if float(r["effect"])==0.0]
          payload={
              "schema":"ttf_q_detectability_compact_v0.1",
              "status":"COMPLETE_RESPONSE_BLIND_DETECTABILITY_CHARACTERIZATION",
              "kind":kind,
              "panel":"development",
              "nonredundancy":p["nonredundancy"],
              "dyadic_signal_support":p["dyadic_signal_support"],
              "minimum_detectable_effect_by_private_amplitude":p["minimum_detectable_effect_by_private_amplitude"],
              "null_rejection_rate_by_private_amplitude":{
                  f"{float(r['private_amplitude']):g}":float(r["rejection_rate"])
                  for r in null
              },
              "genetic_response_used":False,
              "v03_reopened":False,
          }
          Path(f"results/{kind}_compact.json").write_text(
              json.dumps(payload,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(payload,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ttf-q-detectability-${{ matrix.kind }}
          path: results/
          retention-days: 30
          if-no-files-found: error
