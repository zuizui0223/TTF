name: codistributed recurrence one-shot empirical opening

on:
  push:
    branches:
      - prospective/codistributed-recurrence-insecta-v0-1
    paths:
      - "benchmarks/frozen/genetic_codistributed_recurrence_empirical_execution_v0.1.json"

permissions:
  contents: read
  actions: read

env:
  EXECUTION: benchmarks/frozen/genetic_codistributed_recurrence_empirical_execution_v0.1.json
  CONTRACT: docs/supporting/genetic_codistributed_recurrence_empirical_execution_contract_v0.1.json
  AUTHORIZATION: benchmarks/frozen/genetic_codistributed_recurrence_identity_opening_authorization_v0.1.json
  FULL_MASK: benchmarks/frozen/genetic_codistributed_recurrence_confirmatory_mask_full_v0.1.json
  CANDIDATES: benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv
  GEOMETRY_RULE: docs/supporting/genetic_codistributed_recurrence_geometry_null_rule_v0.3.json
  SHARDING: docs/supporting/genetic_codistributed_recurrence_formal_sharding_v0.1.json
  OPENING_RULE: docs/supporting/genetic_codistributed_recurrence_empirical_opening_rule_v0.1.json
  SURVIVOR_RUN_ID: "37406111501"
  SOURCE_SHA256: 5a0fd9ac25893c749d14186fbcce4a46b99163c9d810b36e40eebce7bece61a5

jobs:
  empirical:
    name: one-shot confirmatory empirical opening
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -e .

      - name: Enforce first-attempt one-shot execution
        run: |
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Verify pre-opening execution receipt
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          contract=json.loads(Path(os.environ["CONTRACT"]).read_text())
          execution=json.loads(Path(os.environ["EXECUTION"]).read_text())
          auth_path=Path(os.environ["AUTHORIZATION"])
          if contract.get("schema")!="ttf_genetic_codistributed_recurrence_empirical_execution_contract_v0.1":
              raise SystemExit("unexpected empirical execution contract")
          if contract.get("status")!="FROZEN_BEFORE_AUTHORITATIVE_SURVIVOR_REQUALIFICATION_RESULT":
              raise SystemExit("empirical execution contract not prospectively frozen")
          if execution.get("schema")!="ttf_genetic_codistributed_recurrence_empirical_execution_v0.1":
              raise SystemExit("unexpected empirical execution receipt")
          if execution.get("status")!="AUTHORIZE_ONE_SHOT_EMPIRICAL_EXECUTION":
              raise SystemExit("one-shot empirical execution is not authorized")
          if int(execution.get("survivor_qualification_workflow_run_id",-1))!=int(os.environ["SURVIVOR_RUN_ID"]):
              raise SystemExit("survivor qualification run drift")
          if not auth_path.is_file():
              raise SystemExit("identity-opening authorization missing")
          h=hashlib.sha256(auth_path.read_bytes()).hexdigest()
          if h!=execution.get("identity_opening_authorization_sha256"):
              raise SystemExit("identity-opening authorization hash drift")
          if execution.get("empirical_result_observed_before_execution") is not False:
              raise SystemExit("execution receipt is not pre-result")
          print({"execution_status":execution["status"],"authorization_sha256":h})
          PY

      - name: Restore exact frozen phylogatR archive
        id: archive
        uses: actions/cache/restore@v4
        with:
          path: /tmp/phylogatr.zip
          key: phylogatr-5a0fd9ac25893c749d14186fbcce4a46b99163c9d810b36e40eebce7bece61a5
          restore-keys: |
            phylogatr-5a0fd9ac25893c749d14186fbcce4a46b99163c9d810b36e40eebce7bece61a5

      - name: Require exact source archive
        run: |
          test -f /tmp/phylogatr.zip
          test "$(stat -c%s /tmp/phylogatr.zip)" = "274988692"
          echo "$SOURCE_SHA256  /tmp/phylogatr.zip" | sha256sum -c -
          rm -rf /tmp/phylogatr-root
          mkdir -p /tmp/phylogatr-root
          unzip -q /tmp/phylogatr.zip -d /tmp/phylogatr-root
          ROOT="$(dirname "$(find /tmp/phylogatr-root -type f -name genes.txt -print -quit)")"
          test -f "$ROOT/genes.txt"
          test -f "$ROOT/cite.txt"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Restore qualified survivor center
        uses: actions/download-artifact@v4
        with:
          name: codistributed-survivor-resume-center-v0.1
          path: results/qualified-center
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37406111501

      - name: Restore qualified private references
        uses: actions/download-artifact@v4
        with:
          pattern: codistributed-survivor-resume-reference-*
          path: results/qualified-reference
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37406111501

      - name: Restore survivor qualification result
        uses: actions/download-artifact@v4
        with:
          name: codistributed-survivor-resume-qualification-v0.1
          path: results/qualified-result
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37406111501

      - name: Verify frozen full mask ledger
        run: |
          echo "0f3035fbc8a88a18ba274f4e97ada800b5688b8d40c26568063fbba68118e917  $FULL_MASK" | sha256sum -c -
          test -f results/qualified-center/survivor_localities.csv
          test -f results/qualified-center/survivor_edges.csv
          test -f results/qualified-center/survivor_center_v0.1.npz
          test -f results/qualified-result/survivor_fixed_tst_qualification_v0.1.json

      - name: Reproduce and verify identity-opening authorization
        run: |
          mkdir -p results/pre-opening
          python scripts/authorize_codistributed_recurrence_identity_opening.py             --root "$ROOT"             --source-archive-sha256 "$SOURCE_SHA256"             --candidates "$CANDIDATES"             --localities results/qualified-center/survivor_localities.csv             --edges results/qualified-center/survivor_edges.csv             --full-mask-ledger "$FULL_MASK"             --survivor-qualification results/qualified-result/survivor_fixed_tst_qualification_v0.1.json             --center-npz results/qualified-center/survivor_center_v0.1.npz             --reference-dir results/qualified-reference             --geometry-rule "$GEOMETRY_RULE"             --sharding "$SHARDING"             --opening-rule "$OPENING_RULE"             --output results/pre-opening/reproduced_authorization.json
          cmp "$AUTHORIZATION" results/pre-opening/reproduced_authorization.json

      - name: Execute one-shot confirmatory empirical opening
        run: |
          mkdir -p results/empirical
          python scripts/run_codistributed_recurrence_confirmatory_empirical.py             --root "$ROOT"             --source-archive-sha256 "$SOURCE_SHA256"             --candidates "$CANDIDATES"             --localities results/qualified-center/survivor_localities.csv             --edges results/qualified-center/survivor_edges.csv             --full-mask-ledger "$FULL_MASK"             --survivor-qualification results/qualified-result/survivor_fixed_tst_qualification_v0.1.json             --center-npz results/qualified-center/survivor_center_v0.1.npz             --reference-dir results/qualified-reference             --geometry-rule "$GEOMETRY_RULE"             --sharding "$SHARDING"             --opening-rule "$OPENING_RULE"             --authorization "$AUTHORIZATION"             --output results/empirical/codistributed_recurrence_empirical_result_v0.1.json

      - name: Verify one-shot result serialization boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("results/empirical/codistributed_recurrence_empirical_result_v0.1.json").read_text())
          assert p["schema"]=="ttf_genetic_codistributed_recurrence_empirical_result_v0.1"
          assert p["status"]=="ONE_SHOT_CONFIRMATORY_EMPIRICAL_RESULT_OPENED"
          assert p["outcome_state"]["confirmatory_nucleotide_identity_opened"] is True
          assert p["outcome_state"]["serialized_nucleotide_identity"] is False
          assert p["outcome_state"]["serialized_edge_genetic_distance_vectors"] is False
          assert p["outcome_state"]["serialized_dyad_T_st"] is False
          assert p["one_shot"]["post_result_retuning_allowed"] is False
          print(json.dumps({"decision":p["decision"],"primary":p["primary"],"domain":p["empirical_domain"]},sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codistributed-recurrence-one-shot-empirical-v0.1
          path: |
            results/empirical/codistributed_recurrence_empirical_result_v0.1.json
            results/pre-opening/reproduced_authorization.json
          retention-days: 30
          if-no-files-found: warn
