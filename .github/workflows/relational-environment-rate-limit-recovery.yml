name: relational-environment-rate-limit-recovery

on:
  push:
    branches:
      - relational-ttf-v01
    paths:
      - "benchmarks/frozen/relational_environment_rate_limit_recovery_v0.1.json"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen corrected acquisition core
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/acquire_relational_environment_occurrences.py)" = "34eb5d5b459e105943cc5642cf355011d86c4f07"
          test "$(git rev-parse HEAD:src/ttf/relational_environment.py)" = "d05e35866de57daa8eccacdbf7a3c0eaff055890"
          test "$(git rev-parse HEAD:src/ttf/relational_external.py)" = "4a43bf5fedcc40c9a0fecf44dc3412e726b2ad4f"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .

      - name: Recover exact four HTTP-429 species sequentially
        run: |
          mkdir -p results/recovery
          python scripts/recover_relational_environment_rate_limit.py \
            --rule benchmarks/frozen/relational_environment_rate_limit_recovery_v0.1.json \
            --output-csv results/recovery/occurrences-rate-limit-recovery.csv \
            --output-ledger results/recovery/rate-limit-recovery-ledger.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relational-environment-rate-limit-recovery-v0.1
          path: results/recovery/
          retention-days: 30
          if-no-files-found: warn
