name: Penstemon original Table S3 sample-key schema (no traits)

on:
  push:
    branches:
      - research/penstemon-ttf-source-join-20261115
  pull_request:
    paths:
      - 'research/prospective/penstemon_original_S3_trait_sample_key_preflight_20261116.py'
      - 'tests/test_penstemon_original_S3_trait_sample_key_preflight.py'
      - '.github/workflows/penstemon-original-S3-source-key-preflight.yml'

jobs:
  source-s3-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent PDF source readers
        run: python -m pip install pytest pypdf pymupdf
      - name: Synthetic original Table S3 no-outcome tests
        run: python -m pytest -q tests/test_penstemon_original_S3_trait_sample_key_preflight.py
      - name: Verify original 2026 supplement Table S3 header and voucher tokens
        run: |
          python research/prospective/penstemon_original_S3_trait_sample_key_preflight_20261116.py > /tmp/penstemon_S3_source_sample_keys_20261116.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/penstemon_S3_source_sample_keys_20261116.json').read_text())
          for name,r in d['source_engines'].items():
              print(name,'source_voucher_keys:',r['distinct_voucher_tokens'],
                 'leading_sanitized_metadata:',r['leading_text_sanitized_metadata'][:8])
          print('STATUS:',d['status'])
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: penstemon-authentic-S3-source-keys-not-phenotypes
          path: /tmp/penstemon_S3_source_sample_keys_20261116.json
          retention-days: 21
