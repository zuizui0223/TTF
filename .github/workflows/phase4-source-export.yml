name: Phase4 source export
on:
  push:
    branches:
      - ops/phase4-source-export-20260918
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export exact repository source
        uses: actions/upload-artifact@v4
        with:
          name: ttf-source-55ff72a
          path: |
            scripts
            src
            docs/supporting
            benchmarks/frozen
            pyproject.toml
          if-no-files-found: error
          retention-days: 1
