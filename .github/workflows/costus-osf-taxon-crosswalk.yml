name: Costus OSF 2025 scent and source tree taxon key crosswalk

on:
  push:
    branches:
      - research/crest-ttf-four-system-source-preflight-20261115
  pull_request:
    paths:
      - 'research/prospective/ttf_crest_costus_osf_source_taxon_crosswalk_20261115.py'
      - 'tests/test_crest_ttf_costus_osf_source_taxon_crosswalk.py'
      - '.github/workflows/costus-osf-taxon-crosswalk.yml'

jobs:
  source-taxonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic strict source taxon-key tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_crest_ttf_costus_osf_source_taxon_crosswalk.py
      - name: SHA-locked original Costus OSF taxon keys, no scent/outcome values
        run: |
          python research/prospective/ttf_crest_costus_osf_source_taxon_crosswalk_20261115.py > /tmp/costus_original_osf_taxon_source_crosswalk.json
          cat /tmp/costus_original_osf_taxon_source_crosswalk.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: costus-2025-taxon-source-crosswalk-only
          path: /tmp/costus_original_osf_taxon_source_crosswalk.json
          retention-days: 21
