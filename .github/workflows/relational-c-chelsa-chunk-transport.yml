          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Release historical working bytes
        run: rm -f /tmp/historical-artifact.zip results/chunks/historical/part-*
      - name: Download and split exact current artifact ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/chunks/current
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10791867875/zip" > /tmp/current-artifact.zip
          echo "724743d8666d32bc8717e52200a798369665c2f1965ba33021d3e5c68c5eff4c  /tmp/current-artifact.zip" | sha256sum -c -
          split -b 200000000 -d -a 2 /tmp/current-artifact.zip results/chunks/current/part-
          test "$(find results/chunks/current -type f -name 'part-*' | wc -l)" -eq 6
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rows=[]
          for p in sorted(Path("results/chunks/current").glob("part-*")):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              rows.append({"name":p.name,"size_bytes":p.stat().st_size,"sha256":h})
          Path("results/manifests/current.json").write_text(json.dumps(rows,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
