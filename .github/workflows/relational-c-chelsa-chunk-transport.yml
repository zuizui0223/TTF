          path: results/chunks/current/part-05
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Freeze chunk transport manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rule=json.loads(Path("docs/supporting/relational_historical_chelsa_artifact_chunk_transport_v0.1.json").read_text())
          payload={
              "schema":"ttf_relational_historical_chelsa_chunk_manifest_v0.1",
              "status":"PASS_EXACT_STAGED_ARTIFACT_BYTE_CHUNKING",
              "source_run":rule["source_run"],
              "source_artifacts":rule["source_artifacts"],
              "chunk_bytes":rule["chunk_bytes"],
              "historical_chunks":json.loads(Path("results/manifests/historical.json").read_text()),
              "current_chunks":json.loads(Path("results/manifests/current.json").read_text()),
              "scientific_asset_change":False,
              "relation_result_seen":False,
              "genetic_response_used":False,
          }
          Path("results/manifests/manifest.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"status":payload["status"],"historical_chunks":len(payload["historical_chunks"]),"current_chunks":len(payload["current_chunks"])},sort_keys=True))
          PY
