name: relational-c-chelsa-chunk-transport

on:
  push:
    branches:
      - relational-ttf-v01
    paths:
      - ".github/workflows/relational-c-chelsa-chunk-transport.yml"
      - "docs/supporting/relational_historical_chelsa_artifact_chunk_transport_v0.1.json"

permissions:
  contents: read
  actions: read

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen chunk-transport rule
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("docs/supporting/relational_historical_chelsa_artifact_chunk_transport_v0.1.json").read_text())
          assert p["schema"]=="ttf_relational_historical_chelsa_artifact_chunk_transport_v0.1"
          assert p["status"]=="FROZEN_TRANSPORT_ONLY_FROM_EXACT_STAGED_ARTIFACTS"
          assert p["source_run"]["workflow_run_id"]==35959224240
          assert p["source_run"]["workflow_head_sha"]=="4ea89a703bce2ed88c715cb7cfcca94d1e3b27e4"
          assert p["chunk_bytes"]==200000000
          assert p["scientific_asset_change"] is False
          assert p["alternate_asset_selection_allowed"] is False
          assert p["relation_result_seen"] is False
          assert p["genetic_response_used"] is False
          PY
      - name: Download and split exact historical artifact ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/chunks/historical results/manifests
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10791389409/zip" > /tmp/historical-artifact.zip
          echo "0a797c609d26a185ba08d209a71203a584fa60f1045c4a8c335934372cee30b2  /tmp/historical-artifact.zip" | sha256sum -c -
          split -b 200000000 -d -a 2 /tmp/historical-artifact.zip results/chunks/historical/part-
          test "$(find results/chunks/historical -type f -name 'part-*' | wc -l)" -eq 24
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rows=[]
          for p in sorted(Path("results/chunks/historical").glob("part-*")):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              rows.append({"name":p.name,"size_bytes":p.stat().st_size,"sha256":h})
          Path("results/manifests/historical.json").write_text(json.dumps(rows,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: relational-c-chelsa-historical-zip-part-00
          path: results/chunks/historical/part-00
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: relational-c-chelsa-historical-zip-part-01
          path: results/chunks/historical/part-01
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: relational-c-chelsa-historical-zip-part-02
          path: results/chunks/historical/part-02
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: relational-c-chelsa-historical-zip-part-03
          path: results/chunks/historical/part-03
