name: Penstemon Habroanthus ENA original 52 BioSample taxon metadata gate

on:
  push:
    branches:
      - research/penstemon-ttf-source-join-20261115
  pull_request:
    paths:
      - 'research/prospective/penstemon_habroanthus_ena_sample_metadata_source_gate_20261115.py'
      - 'tests/test_penstemon_habroanthus_ena_sample_metadata_source_gate.py'
      - '.github/workflows/penstemon-habroanthus-ena-sample-metadata.yml'

jobs:
  ena-biosample:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic source-only sample taxon and provenance checks
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_penstemon_habroanthus_ena_sample_metadata_source_gate.py
      - name: Query public ENA sample metadata only, no raw sequencing
        run: |
          python research/prospective/penstemon_habroanthus_ena_sample_metadata_source_gate_20261115.py > /tmp/penstemon_Habroanthus_biosample_source.json
          cat /tmp/penstemon_Habroanthus_biosample_source.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: penstemon-2026-Habroanthus-BioSample-source-only
          path: /tmp/penstemon_Habroanthus_biosample_source.json
          retention-days: 21
