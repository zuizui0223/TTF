name: genetic Decker pilot geometry freeze

on:
  workflow_dispatch:
  push:
    branches:
      - "method/genetic-ibd-crossfit"
    paths:
      - ".github/workflows/genetic-decker-geometry-freeze.yml"
      - "scripts/census_decker_genetic_geometry.py"
      - "scripts/freeze_decker_genetic_pilot_geometry.py"
      - "docs/supporting/genetic_decker_pilot_rule_v0.1.json"
      - "src/ttf/genetic_geometry.py"

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TTF branch
        uses: actions/checkout@v4

      - name: Checkout frozen Decker source
        uses: actions/checkout@v4
        with:
          repository: skdecker/PhylogeographicBreaks
          ref: 11534ba70fbe3705e667651030edef5b849fa949
          path: external/decker
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .

      - name: Reconstruct response-blind census
        run: >-
          python scripts/census_decker_genetic_geometry.py
          --root external/decker
          --output results/decker_genetic_geometry_census_v0.1.json
          --min-localities 12
          --min-endpoint-training-edges 5
          --neighbor-fraction 0.15

      - name: Freeze one-panel-per-species geometry and split
        run: >-
          python scripts/freeze_decker_genetic_pilot_geometry.py
          --root external/decker
          --census results/decker_genetic_geometry_census_v0.1.json
          --rule docs/supporting/genetic_decker_pilot_rule_v0.1.json
          --output-csv results/decker_genetic_pilot_geometry_v0.1.csv
          --output-manifest results/decker_genetic_pilot_geometry_v0.1.json

      - name: Enforce freeze contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('results/decker_genetic_pilot_geometry_v0.1.json').read_text())
          assert p['schema'] == 'ttf_genetic_decker_pilot_geometry_v0.1'
          assert p['status'] == 'frozen_response_blind_development_geometry'
          assert p['genetic_outcomes_opened'] is False
          assert p['monmonier_results_opened'] is False
          assert p['species_count'] == 221
          assert p['class_counts'] == {'Aves': 149, 'Chiroptera': 72}
          assert p['split']['train_count'] == 111
          assert p['split']['eval_count'] == 110
          print(json.dumps({
              'fingerprint': p['geometry_fingerprint_sha256'],
              'csv_sha256': p['geometry_csv_sha256'],
              'species': p['species_count'],
              'localities': p['records_localities'],
              'edges': p['edge_count'],
              'support': {k:v for k,v in p['support_at_inherited_bandwidth'].items() if k != 'per_eval_species'},
          }, sort_keys=True))
          PY

      - name: Upload frozen geometry artifacts
        uses: actions/upload-artifact@v4
        with:
          name: decker-genetic-pilot-geometry-v0.1
          path: |
            results/decker_genetic_geometry_census_v0.1.json
            results/decker_genetic_pilot_geometry_v0.1.csv
            results/decker_genetic_pilot_geometry_v0.1.json
          if-no-files-found: error
