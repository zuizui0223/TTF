name: Historical host-memory CHELSA finite host-cloud gate

on:
  push:
    branches:
      - prospective/historical-host-memory-v0-1
    paths:
      - ".github/workflows/historical-host-memory-chelsa-host-cloud-v01.yml"
      - "scripts/census_historical_host_memory_finite_climate.py"
      - "tests/test_historical_host_memory_finite_climate.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  finite-host-cloud-response-blind:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test frozen resource-count implementation
        run: |
          python -m pip install -e ".[test]"
          python -m pip install "rasterio>=1.4,<2"
          python -m pytest -q \
            tests/test_historical_host_memory_finite_climate.py \
            tests/test_historical_host_memory_source_identity.py \
            tests/test_historical_host_memory.py
          echo "c36cbb2ba0cbf7d0222645a04538c78236cfda392dd0a3d11dd443f12347d35b  benchmarks/frozen/historical_host_memory_candidate_642_v0.1.csv" | sha256sum -c -

      - name: Download exact immutable WCVP-HOSTS sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/hosts
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10617946932/zip" > /tmp/wcvp_hosts.zip
          unzip -q /tmp/wcvp_hosts.zip -d input/hosts
          rm -f /tmp/wcvp_hosts.zip
          find input/hosts -maxdepth 2 -type f
          echo "0a084fb5273e4780b03e015205c87e4545c69f0f8e517feb1a2a3879889508e9  input/hosts/insect_host_accepted.csv" | sha256sum -c -
          echo "c731906315f7452f83ce302c1d36c75ad94afc24ce7e24d461360312244ac558  input/hosts/native_extant_nondoubtful_wgsrpd3.csv" | sha256sum -c -

      - name: Download exact frozen WGSRPD3 support lattice
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/support
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/11495066386/zip" > /tmp/support.zip
          unzip -q /tmp/support.zip -d input/support
          rm -f /tmp/support.zip
          echo "d0fc12f635ec56a442dd37dec06cf3aa06684a00b14f1bb1f2db2f6fe3c4a21f  input/support/wgsrpd3_support_points_v0.1.csv" | sha256sum -c -

      - name: Retrieve exact historical CHELSA-TraCE21k staged bytes (no genetics)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/chelsa
          df -h .
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10791389409/zip" > /tmp/historical.zip
          echo "0a797c609d26a185ba08d209a71203a584fa60f1045c4a8c335934372cee30b2  /tmp/historical.zip" | sha256sum -c -
          unzip -q /tmp/historical.zip -d input/chelsa
          rm -f /tmp/historical.zip
          echo "7d82833996006fc1e99b86acb4ea7e80cde29c7f500df739ef48cb9ce145d450  input/chelsa/manifest.json" | sha256sum -c -
          df -h .

      - name: Census 0-BP climate-valid host opportunity on 642 insects
        shell: bash
        run: |
          set -euo pipefail
          python scripts/census_historical_host_memory_finite_climate.py \
            --candidates benchmarks/frozen/historical_host_memory_candidate_642_v0.1.csv \
            --host-pairs input/hosts/insect_host_accepted.csv \
            --native-units input/hosts/native_extant_nondoubtful_wgsrpd3.csv \
            --wgsrpd-support input/support/wgsrpd3_support_points_v0.1.csv \
            --rule docs/supporting/historical_host_memory_predictor_materialization_rule_v0.1.json \
            --current-asset input/chelsa/historical/CHELSA_TraCE21K_bio01_20_V1.0.tif \
            --current-asset input/chelsa/historical/CHELSA_TraCE21K_bio07_20_V1.0.tif \
            --current-asset input/chelsa/historical/CHELSA_TraCE21K_bio12_20_V1.0.tif \
            --current-asset input/chelsa/historical/CHELSA_TraCE21K_bio15_20_V1.0.tif \
            --output-receipt results/historical_host_memory_finite_cloud/receipt_v0.1.json \
            --output-species results/historical_host_memory_finite_cloud/host_support_v0.1.csv
          cat results/historical_host_memory_finite_cloud/receipt_v0.1.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-host-memory-finite-cloud-v0.1
          path: results/historical_host_memory_finite_cloud/
          retention-days: 30
          if-no-files-found: warn
