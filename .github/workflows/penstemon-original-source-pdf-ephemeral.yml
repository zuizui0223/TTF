name: Penstemon original 2026 supplement source PDF ephemeral inspection
on:
  push:
    branches:
      - research/penstemon-ttf-source-join-20261115
jobs:
  original-pdf-inspection:
    if: github.event.head_commit.message == 'Stage original Penstemon supplemental PDF for authenticated table inspection'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original public source PDF reader
        run: python -m pip install pypdf
      - name: Fetch same official Europe PMC supplement and verify exact original member SHA256
        run: |
          python - <<'PY'
          import hashlib
          import json
          import sys
          import time
          import urllib.error
          from pathlib import Path
          sys.path.insert(0,'research/prospective')
          from penstemon_original_europepmc_table_s1_index_20261115 import source_get,extract_original_pdf_member
          expected='3682720dad4f0621bebef3be7014aa667067c5f0dce9160ca8f4c4a758e7f943'
          raw=None
          for n in range(3):
              try:
                  raw=extract_original_pdf_member(source_get())
                  break
              except (TimeoutError,urllib.error.URLError):
                  if n==2: raise
                  time.sleep(2*(n+1))
          if hashlib.sha256(raw).hexdigest()!=expected: raise ValueError('Official PDF SHA256 changed')
          assert raw.startswith(b'%PDF-') and len(raw)==2808017
          target=Path('/tmp/penstemon_2026_original_pdf_evidence')
          target.mkdir(parents=True,exist_ok=True)
          (target/'media-1.pdf').write_bytes(raw)
          print(json.dumps({'status':'OFFICIAL_ORIGINAL_SHA256_VERIFIED_TEMPORARY_ONLY',
                  'pdf_bytes':len(raw),'pdf_sha256':expected,'no_scientific_outcomes_opened':True}))
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: penstemon-2026-official-media1-original-pdf-48hr
          path: /tmp/penstemon_2026_original_pdf_evidence/media-1.pdf
          retention-days: 2
