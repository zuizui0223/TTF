name: Historical host-memory deterministic arbitrary-mask attrition information bound

on:
  push:
    branches:
      - prospective/historical-host-memory-v0-1
    paths:
      - ".github/workflows/historical-host-memory-attrition-bound-v01.yml"
      - "scripts/audit_historical_host_memory_information_attrition_bound.py"
      - "tests/test_historical_host_memory_information_attrition_bound.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  worst-case-exact-subset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test mathematical all-subset lower-bound implementation
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"
          python -m pytest -q tests/test_historical_host_memory_information_attrition_bound.py
      - name: Recover exact frozen species diagnostics and roles only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/11559015421/zip" > /tmp/predictor_only.zip
          unzip -q /tmp/predictor_only.zip -d input
          rm /tmp/predictor_only.zip
          echo "bee840bf6ae207cab5aef8da4154eae7743f5ec3bbbaf23d7fe5a3dedc50a3e6  input/species_diagnostics_v0.1.csv" | sha256sum -c -
          echo "4168e7572d3378e7f1595ae562d53c81bb2ef165cbe50eb2ed8ec4e7406fc6ae  input/response_blind_panel_roles_v0.1.csv" | sha256sum -c -
      - name: Prove sharp worst-case median and fraction bounds for ANY >=200 survivors
        run: |
          set -euo pipefail
          python scripts/audit_historical_host_memory_information_attrition_bound.py \
            --diagnostics input/species_diagnostics_v0.1.csv \
            --roles input/response_blind_panel_roles_v0.1.csv \
            --qualification-rule docs/supporting/historical_host_memory_qualification_rule_v0.2.json \
            --output results/historical_host_memory_attrition_bound_v0.1.json
          cat results/historical_host_memory_attrition_bound_v0.1.json
          python - <<'PY'
          import json
          q=json.load(open("results/historical_host_memory_attrition_bound_v0.1.json"))
          assert q["status"]=="PASS_INFORMATION_GUARANTEED_FOR_ANY_SURVIVOR_SET_GE_200"
          assert q["genetic_response_opened"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: historical-host-memory-attrition-bound-v0.1
          path: results/historical_host_memory_attrition_bound_v0.1.json
          retention-days: 30
          if-no-files-found: error
