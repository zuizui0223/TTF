name: relational-historical-occurrence-repair-v02

on:
  push:
    branches:
      - relational-ttf-v01
    paths:
      - "benchmarks/frozen/relational_historical_occurrence_execution_v0.2.json"

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: plan
        name: Verify frozen response-blind repair contract
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          p=json.loads(Path("benchmarks/frozen/relational_historical_occurrence_execution_v0.2.json").read_text())
          assert p["schema"]=="ttf_relational_historical_occurrence_execution_v0.2"
          assert p["status"]=="FROZEN_TIMEOUT_SAFE_TRANSPORT_REPAIR_BEFORE_STUDY_C_EXTERNAL_RESULT"
          assert p["candidate_species"]==1000
          assert p["batch_size"]==4
          assert p["batch_count"]==250
          assert p["max_parallel"]==4
          assert p["per_species_hard_timeout_seconds"]==3300
          assert p["no_candidate_replacement"] is True
          assert p["no_backfill"] is True
          assert p["no_further_occurrence_retry_authorized"] is True
          assert not any(bool(v) for v in p["response_firewall"].values())
          for path,expected in p["implementation_git_blobs"].items():
              actual=subprocess.check_output(["git","rev-parse",f"HEAD:{path}"],text=True).strip()
              assert actual==expected,(path,actual,expected)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("matrix="+json.dumps(list(range(250)),separators=(",",":"))+"\n")
          PY

  acquire:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .

      - name: Acquire exact frozen four-species batch
        run: |
          mkdir -p results/history-occ-v02
          python scripts/acquire_relational_historical_occurrences_v02.py \
            --candidates benchmarks/frozen/relational_historical_candidates_v0.1.csv \
            --output-csv results/history-occ-v02/occurrences-${{ matrix.batch }}.csv \
            --output-ledger results/history-occ-v02/ledger-${{ matrix.batch }}.json \
            --batch-index ${{ matrix.batch }} \
            --batch-size 4 \
            --species-timeout-seconds 3300

      - name: Verify terminal response-blind ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("results/history-occ-v02/ledger-${{ matrix.batch }}.json").read_text())
          assert p["schema"]=="ttf_relational_historical_occurrence_shard_v0.1"
          assert p["execution_version"]=="v0.2-singleton-safe"
          assert p["candidate_species_total"]==1000
          assert p["species_requested"]==4
          assert len(p["species"])==4
          assert p["per_species_hard_timeout_seconds"]==3300
          assert all(
              row["status"] in {
                  "PASS_OCCURRENCE_GEOMETRY",
                  "FAIL_OCCURRENCE_GEOMETRY",
                  "REJECTED_GBIF_TAXON_MATCH",
                  "REQUEST_ERROR",
              }
              for row in p["species"]
          )
          assert all(v is False for v in p["response_firewall"].values())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: relational-historical-occ-v02-${{ matrix.batch }}
          path: results/history-occ-v02/
          retention-days: 30
          if-no-files-found: error

  aggregate:
    needs: [plan, acquire]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact 250 repaired occurrence artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: relational-historical-occ-v02-*
          path: input/history-occ-v02
          merge-multiple: true

      - name: Require exact batch coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ledgers=list(Path("input/history-occ-v02").glob("ledger-*.json"))
          csvs=list(Path("input/history-occ-v02").glob("occurrences-*.csv"))
          assert len(ledgers)==250,len(ledgers)
          assert len(csvs)==250,len(csvs)
          batches=set()
          species=[]
          for path in ledgers:
              p=json.loads(path.read_text())
              batches.add(int(p["batch_index"]))
              species.extend(str(row["species"]) for row in p["species"])
          assert batches==set(range(250))
          assert len(species)==1000
          assert len(set(species))==1000
          PY

      - name: Aggregate exact Study-C occurrence state
        run: |
          mkdir -p results/history-occ-v02
          python scripts/aggregate_relational_historical_occurrences.py \
            --input-dir input/history-occ-v02 \
            --output-csv results/history-occ-v02/occurrences_v0.2.csv \
            --output-ledger results/history-occ-v02/occurrence_ledger_v0.2.json
          python - <<'PY'
          import json
          p=json.load(open("results/history-occ-v02/occurrence_ledger_v0.2.json"))
          assert p["schema"]=="ttf_relational_historical_occurrence_acquisition_v0.1"
          assert p["candidate_species"]==1000
          assert p["status"] in {
              "PASS_TO_HISTORICAL_ASSET_EXTRACTION",
              "NOT_EVALUABLE_HISTORICAL_OCCURRENCE_GEOMETRY",
          }
          assert all(v is False for v in p["response_firewall"].values())
          print({
              "status":p["status"],
              "species_passing_ge_30":p["species_passing_ge_30"],
              "status_counts":p["status_counts"],
          })
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: relational-historical-occurrence-v0.2
          path: |
            results/history-occ-v02/occurrences_v0.2.csv
            results/history-occ-v02/occurrence_ledger_v0.2.json
          retention-days: 30
          if-no-files-found: error
