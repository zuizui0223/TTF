name: Penstemon 2026 official supplemental Table S1 PDF source index

on:
  push:
    branches:
      - research/penstemon-ttf-source-join-20261115
  pull_request:
    paths:
      - 'research/prospective/penstemon_original_2026_supplement_pdf_access_gate_20261115.py'
      - 'tests/test_penstemon_original_2026_supplement_pdf_access_gate.py'
      - '.github/workflows/penstemon-2026-supplement-access.yml'

jobs:
  official-supplement-index:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic source validation dependencies
        run: python -m pip install pytest pypdf
      - name: Verify fail-closed PDF source signature test
        run: python -m pytest -q tests/test_penstemon_original_2026_supplement_pdf_access_gate.py
      - name: Inspect only official supplement identity, SHA256 and Table S1 headings
        run: |
          python research/prospective/penstemon_original_2026_supplement_pdf_access_gate_20261115.py > /tmp/penstemon_original_supplement_index_only.json
          cat /tmp/penstemon_original_supplement_index_only.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: penstemon-2026-original-supplement-index-only
          path: /tmp/penstemon_original_supplement_index_only.json
          retention-days: 21
