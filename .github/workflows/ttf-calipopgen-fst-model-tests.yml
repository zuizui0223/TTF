name: ttf-CaliPopGen-Fst-pre-response-synthetic-tests
on:
  push:
    branches: [research/calipopgen-fst-v01]
    paths:
      - '.github/workflows/ttf-calipopgen-fst-model-tests.yml'
      - 'research/calipopgen-fst/model_fst_holdout.py'
      - 'research/calipopgen-fst/run_fst_one_shot.py'
      - 'research/calipopgen-fst/tests/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ttf-calipopgen-fst-model-tests.yml'
      - 'research/calipopgen-fst/model_fst_holdout.py'
      - 'research/calipopgen-fst/run_fst_one_shot.py'
      - 'research/calipopgen-fst/tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source-only tests and actual heldout estimator on known truth
        run: |
          python -m pip install 'numpy>=1.26,<3'
          python -m unittest discover -s research/calipopgen-fst/tests -v
      - name: Compile frozen empirical script without executing source response
        run: python -m py_compile research/calipopgen-fst/run_fst_one_shot.py
