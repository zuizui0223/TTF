name: ttf-q-trace0-exact-sampling

on:
  push:
    branches:
      - research/ttf-q-trace0-exact-v01
    paths:
      - '.github/workflows/ttf-q-trace0-exact-sampling.yml'
      - 'research/trace0-bridge/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install climate sampling dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'rasterio>=1.4,<2' 'requests>=2.31,<3'
      - name: Verify frozen coordinates and raster receipts; sample exact pixels
        run: |
          python research/trace0-bridge/sample_trace0_exact.py \
            --manifest research/trace0-bridge/trace0_asset_manifest.json \
            --coordinates research/trace0-bridge/ttf_q_trace0_coordinates.b64 \
            --work "${RUNNER_TEMP}/trace0-rasters" \
            --output results/trace0-exact
      - name: Publish small sampled climate matrix only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ttf-q-trace0-exact-samples
          path: results/trace0-exact/
          retention-days: 30
          if-no-files-found: error
