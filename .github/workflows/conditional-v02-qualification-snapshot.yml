name: conditional v02 qualification snapshot

on:
  push:
    branches:
      - "ops/conditional-v02-qualification-snapshot-20260919"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "aeddb92ac6f924096ea31c85d8902de51ee3219a"
          fetch-depth: 1
      - name: Pack repository
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/TTF-main-aeddb92ac6f9.tar.gz .
          sha256sum /tmp/TTF-main-aeddb92ac6f9.tar.gz > /tmp/TTF-main-aeddb92ac6f9.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TTF-main-aeddb92ac6f9-snapshot
          path: |
            /tmp/TTF-main-aeddb92ac6f9.tar.gz
            /tmp/TTF-main-aeddb92ac6f9.tar.gz.sha256
          if-no-files-found: error
