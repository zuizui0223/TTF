name: butterfly host breadth geography exploratory v01

on:
  push:
    branches:
      - explore/butterfly-resource-envelope-v01
    paths:
      - ".github/workflows/butterfly-host-breadth-geography-analysis-v01.yml"
      - "scripts/analyze_butterfly_host_breadth_geography.py"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore exact reconstructed S1 ecology artifact
        uses: actions/download-artifact@v4
        with:
          name: butterfly-resource-envelope-pilot-v01
          path: inputs/pilot
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: zuizui0223/TTF
          run-id: 36222306369

      - name: Verify exact descriptor table
        run: |
          cd inputs/pilot/butterfly-resource-envelope-pilot-v0.1
          echo "894f48dbca1760fc4fa75bfee8f663540ab4b9380f8b9daf2bc09440e8bb0cdc  s1_resource_descriptors.csv" | sha256sum -c -

      - name: Analyze taxonomic versus geographic host specialization
        run: |
          mkdir -p results/butterfly-host-breadth-geography-v0.1
          python scripts/analyze_butterfly_host_breadth_geography.py \
            --descriptors-csv inputs/pilot/butterfly-resource-envelope-pilot-v0.1/s1_resource_descriptors.csv \
            --output-json results/butterfly-host-breadth-geography-v0.1/result.json
          sha256sum results/butterfly-host-breadth-geography-v0.1/result.json > results/butterfly-host-breadth-geography-v0.1/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: butterfly-host-breadth-geography-v01
          path: results/butterfly-host-breadth-geography-v0.1/
          retention-days: 30
