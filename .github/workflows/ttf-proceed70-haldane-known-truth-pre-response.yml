name: ttf-evo-PROCEED70-Haldane-SYNTHETIC-PRE-RESPONSE
on:
  push:
    branches: [prospective/quaternary-phenotype-source-screen-20261112]
    paths:
      - '.github/workflows/ttf-proceed70-haldane-known-truth-pre-response.yml'
      - 'research/prospective/proceed70_haldane_rate_model_core.py'
      - 'research/prospective/proceed70_haldane_source_null_calibration.py'
      - 'research/prospective/test_proceed70_haldane_rate_model_core.py'
      - 'research/prospective/test_proceed70_haldane_source_null_calibration.py'
      - 'research/prospective/proceed70_haldane_first_shot_contract_v01.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ttf-proceed70-Haldane-known-truth-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-source-geometry-known-truth-before-any-Haldane-outcome:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GDAL_CACHEMAX: '256'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install source-pinned original numerical GIS libraries
        run: python -m pip install 'numpy==2.5.4' 'scipy==1.18.1' 'rasterio==1.5.2' 'pyproj==3.8.0' 'shapely==2.2.0'
      - name: All source-only Haldane model mathematical and known-truth toy tests
        run: |
          python -m unittest discover -s research/prospective -p 'test_proceed70_haldane_rate_model_core.py' -v
          python -m unittest discover -s research/prospective -p 'test_proceed70_haldane_source_null_calibration.py' -v
      - name: Reconstruct original 56 Haldane-presence source species and exact 8 original climate rasters; simulate null/positive worlds only
        run: |
          mkdir -p results/source_only
          python research/prospective/proceed70_haldane_source_null_calibration.py \
            --work /tmp/ttf-proceed70-56H-synthetic-only-private-original-source \
            --output results/source_only/proceed70_Haldane_known_truth_pre_response.json
      - name: Confirm actual Haldane trait values and old genetic endpoints remain closed
        run: |
          python - <<'PY'
          import json
          p='results/source_only/proceed70_Haldane_known_truth_pre_response.json'
          r=json.load(open(p))
          assert r['actual_genetic_rate_mean_SD_or_fitness_outcome_parsed'] is False
          assert r['real_Haldane_or_Darwin_outcome_fitted'] is False
          assert r['prior_TTF_frozen_outcomes_reopened'] is False
          assert r['raw_study_species_site_or_biological_response_exported'] is False
          print('HALDANE_SYNTHETIC_ONLY_GATE',r['status'])
          print('HISTORY_UNIQUE_AFTER_FULL_21_CONTROLS',r.get('history_unique_fraction_after_all_21_controls'))
          print('SYNTHETIC_NULL',r.get('known_truth',{}).get('null'))
          print('SYNTHETIC_POSITIVE',r.get('known_truth',{}).get('positive'))
          PY
      - name: Publish only source hashes and null/known-truth world aggregates; never original phenotypes or coordinates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttf-PROCEED70-Haldane-synthetic-known-truth-aggregate-only
          path: results/source_only/proceed70_Haldane_known_truth_pre_response.json
          retention-days: 30
          if-no-files-found: warn
