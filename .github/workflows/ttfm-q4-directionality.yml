name: ttfm-q4-directionality

on:
  push:
    branches:
      - "method/ttfm-mismatch-decoupling"
    paths:
      - "docs/supporting/ttfm_q4_directionality_authorization.json"

permissions:
  contents: write

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - name: Require exact frozen Q4 authorization
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          auth=json.loads(Path('docs/supporting/ttfm_q4_directionality_authorization.json').read_text())
          rule=json.loads(Path('docs/supporting/ttfm_q4_directionality_qualification_rule.json').read_text())
          ideal=json.loads(Path('results/ttfm_idealized_qualification_v0.1.json').read_text())
          assert auth['schema']=='ttfm_q4_directionality_authorization_v0.1'
          assert auth['status']=='authorize_exactly_one_q4_directionality_qualification_run'
          assert rule['status']=='frozen_before_q4_directionality_outcomes'
          assert ideal['joint_extension_pass'] is True
          assert rule['claim_firewall']['no_empirical_data'] is True
          assert rule['claim_firewall']['q5_geometry_stress_not_authorized'] is True
          expected={
            'rule_blob_sha':'docs/supporting/ttfm_q4_directionality_qualification_rule.json',
            'directionality_blob_sha':'src/ttf/directionality.py',
            'simulator_blob_sha':'src/ttf/directionality_simulate.py',
            'paired_inference_blob_sha':'src/ttf/mismatch_inference.py',
            'runner_blob_sha':'scripts/run_ttfm_q4_directionality_batch.py',
            'aggregator_blob_sha':'scripts/aggregate_ttfm_q4_directionality.py',
            'workflow_blob_sha':'.github/workflows/ttfm-q4-directionality.yml',
            'idealized_result_blob_sha':'results/ttfm_idealized_qualification_v0.1.json',
          }
          for key,path in expected.items():
            actual=subprocess.check_output(['git','rev-parse',f'HEAD:{path}'], text=True).strip()
            assert actual==auth[key], (key, actual, auth[key])
          assert auth['replicates_per_cell']==500
          assert auth['batch_size']==25
          assert auth['q4_outcomes_previously_opened'] is False
          assert auth['empirical_data_authorized'] is False
          assert auth['q5_authorized'] is False
          print({'authorization':'exact','q4_outcomes_previously_opened':False,'empirical_data':False,'q5':False})
          PY

  batches:
    needs: invariants
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        cell:
          - Q4_BREAK_shared_breakdown
          - Q4_RECOUPLE_shared_recoupling
          - Q4_ROTATE_neutral_relation_change
          - Q4_PRIVATE_private_directional_change
          - Q4_FLIP_shared_front_conflicting_sign
        start: [0,25,50,75,100,125,150,175,200,225,250,275,300,325,350,375,400,425,450,475]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Run frozen Q4 batch
        run: >-
          python scripts/run_ttfm_q4_directionality_batch.py
          --rule docs/supporting/ttfm_q4_directionality_qualification_rule.json
          --cell-id "${{ matrix.cell }}"
          --start ${{ matrix.start }}
          --count 25
          --output "batch/${{ matrix.cell }}_${{ matrix.start }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ttfm-q4-${{ matrix.cell }}-${{ matrix.start }}
          path: batch/*.json
          if-no-files-found: error

  aggregate:
    needs: batches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - uses: actions/download-artifact@v4
        with:
          pattern: ttfm-q4-*
          path: downloaded
          merge-multiple: true
      - name: Aggregate frozen Q4 Wilson gates
        run: >-
          python scripts/aggregate_ttfm_q4_directionality.py
          --rule docs/supporting/ttfm_q4_directionality_qualification_rule.json
          --batch-dir downloaded
          --output results/ttfm_q4_directionality_v0.1.json
      - uses: actions/upload-artifact@v4
        with:
          name: ttfm-q4-directionality-v0.1
          path: results/ttfm_q4_directionality_v0.1.json
          if-no-files-found: error
      - name: Commit immutable Q4 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ttfm_q4_directionality_v0.1.json
          git commit -m "Freeze TTF-M Q4 directionality v0.1"
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
