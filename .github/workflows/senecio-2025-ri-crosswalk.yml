name: Senecio 2025 independent neutral-tree and RI key crosswalk

on:
  push:
    branches:
      - research/senecio-p1-genomic-ecotype-holdout-20261115
  pull_request:
    paths:
      - 'research/prospective/senecio_p1_2025_ri_phylogeny_postoutcome_crosswalk_20261115.py'
      - 'tests/test_senecio_p1_2025_ri_phylogeny_crosswalk.py'
      - '.github/workflows/senecio-2025-ri-crosswalk.yml'

jobs:
  original-author-key-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic pair/provenance tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_senecio_p1_2025_ri_phylogeny_crosswalk.py
      - name: Reconcile pinned author 2025 neutral-tree and intrinsic-cross source
        run: |
          python research/prospective/senecio_p1_2025_ri_phylogeny_postoutcome_crosswalk_20261115.py > /tmp/senecio_2025_ri_crosswalk_aggregate.json
          cat /tmp/senecio_2025_ri_crosswalk_aggregate.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: senecio-2025-neutral-RI-crosswalk-aggregate
          path: /tmp/senecio_2025_ri_crosswalk_aggregate.json
          retention-days: 21
