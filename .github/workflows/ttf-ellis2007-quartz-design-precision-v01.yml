name: Ellis 2007 source-only quartz working-model precision
on:
  push:
    branches:
      - 'prospective/independent-transplant-overlap-20261115'
    paths:
      - '.github/workflows/ttf-ellis2007-quartz-design-precision-v01.yml'
      - 'research/prospective/ellis2007_quartz_design_precision_v01.py'
      - 'research/prospective/test_ellis2007_quartz_design_precision_v01.py'
      - 'research/prospective/source_registry/ellis2007_quartz_design_precision_v01.json'
  pull_request:
    paths:
      - '.github/workflows/ttf-ellis2007-quartz-design-precision-v01.yml'
      - 'research/prospective/ellis2007_quartz_design_precision_v01.py'
      - 'research/prospective/test_ellis2007_quartz_design_precision_v01.py'
      - 'research/prospective/source_registry/ellis2007_quartz_design_precision_v01.json'
jobs:
  exact-design-variance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Seven source-only precision tests
        run: python -m unittest discover -s research/prospective -p test_ellis2007_quartz_design_precision_v01.py -v
      - name: Verify exact frozen precision JSON
        run: |
          python research/prospective/ellis2007_quartz_design_precision_v01.py --output _source_only/ellis2007_quartz_design_precision_v01.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected=json.loads(Path("research/prospective/source_registry/ellis2007_quartz_design_precision_v01.json").read_text())
          actual=json.loads(Path("_source_only/ellis2007_quartz_design_precision_v01.json").read_text())
          assert expected==actual, "Frozen precision receipt differs in values or structure"
          print("Frozen precision JSON semantic equality: PASS")
          PY
