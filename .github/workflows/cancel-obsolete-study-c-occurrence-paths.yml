name: cancel-obsolete-study-c-occurrence-paths

on:
  push:
    branches:
      - relational-ttf-v01
    paths:
      - "benchmarks/frozen/relational_historical_obsolete_occurrence_paths_v0.1.json"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact obsolete Study-C occurrence paths
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=json.loads(Path("benchmarks/frozen/relational_historical_obsolete_occurrence_paths_v0.1.json").read_text())
          assert p["schema"]=="ttf_relational_historical_obsolete_occurrence_paths_v0.1"
          assert p["status"]=="AUTHORIZE_CANCEL_EXACT_PRE_RELATION_OCCURRENCE_PATHS"
          assert p["obsolete_run_ids"]==[35881616617,35941160248,35941257277,35941294719]
          assert all(v==0 for v in p["artifact_counts_observed_at_freeze"].values())
          assert p["authoritative_execution"]=="benchmarks/frozen/relational_historical_occurrence_execution_v0.2.json"
          assert p["relation_result_seen"] is False
          assert p["genetic_response_used"] is False
          assert not any(bool(v) for v in p["response_firewall"].values())
          wf=subprocess.check_output(
              ["git","rev-parse","HEAD:.github/workflows/cancel-obsolete-study-c-occurrence-paths.yml"],
              text=True,
          ).strip()
          assert wf==p["workflow_git_blob"],(wf,p["workflow_git_blob"])
          PY

      - name: Cancel exact obsolete runs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 35881616617 35941160248 35941257277 35941294719; do
            state="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.status')"
            conclusion="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.conclusion // ""')"
            echo "run=$id status=$state conclusion=$conclusion"
            if [ "$state" = "queued" ] || [ "$state" = "in_progress" ] || [ "$state" = "waiting" ] || [ "$state" = "requested" ] || [ "$state" = "pending" ]; then
              gh api -X POST "/repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel"
            fi
          done

      - name: Verify no obsolete assembled occurrence artifact exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 35941257277 35941294719; do
            count="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" --jq '[.artifacts[] | select(.name=="relational-historical-occurrence-assembled-v0.1" and (.expired|not))] | length' | awk '{s+=$1} END{print s+0}')"
            echo "run=$id assembled_artifacts=$count"
            test "$count" -eq 0
          done
