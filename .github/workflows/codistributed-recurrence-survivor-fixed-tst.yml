name: codistributed survivor fixed-Tst requalification

on:
  push:
    branches:
      - prospective/codistributed-recurrence-insecta-v0-1
    paths:
      - ".github/workflows/codistributed-recurrence-survivor-fixed-tst.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  LOCALITIES: transport/codistributed_recurrence_confirmatory_survivor_localities_v0.1.csv
  CANDIDATES: benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv
  MASK_RESULT: benchmarks/frozen/genetic_codistributed_recurrence_confirmatory_mask_result_v0.1.json
  SURVIVOR_INFO: benchmarks/frozen/genetic_codistributed_recurrence_survivor_information_result_v0.1.json
  RULE: docs/supporting/genetic_codistributed_recurrence_geometry_null_rule_v0.3.json
  MASK_RULE: docs/supporting/genetic_codistributed_recurrence_confirmatory_mask_rule_v0.1.json
  SHARDING: docs/supporting/genetic_codistributed_recurrence_formal_sharding_v0.1.json

jobs:
  center:
    name: survivor center
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .

      - name: Verify exact survivor locality transport
        run: |
          echo "bb6e7c6611522f2d1ef2983c8ad483b32e7144ba0e8272bdbc3d580e8a086342  $LOCALITIES" | sha256sum -c -

      - name: Reconstruct exact survivor edge graph
        run: |
          mkdir -p results/survivor-center
          python - <<'PY'
          import csv, hashlib
          from pathlib import Path
          import numpy as np
          from ttf.core import knn_edges

          loc=Path("transport/codistributed_recurrence_confirmatory_survivor_localities_v0.1.csv")
          cand=Path("benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv")
          out=Path("results/survivor-center/survivor_edges.csv")
          with cand.open(newline="",encoding="utf-8") as f:
              meta={r["species"]:r for r in csv.DictReader(f)}
          by={}
          with loc.open(newline="",encoding="utf-8") as f:
              for r in csv.DictReader(f):
                  by.setdefault(r["species"],[]).append(r)
          with out.open("w",newline="",encoding="utf-8") as f:
              fields=["species","edge_index","node_left","node_right","mid_x_km","mid_y_km","mid_z_km","panel","role"]
              w=csv.DictWriter(f,fieldnames=fields,lineterminator="\n")
              w.writeheader()
              for name in sorted(by):
                  rows=sorted(by[name],key=lambda r:int(r["locality_index"]))
                  xyz=np.asarray([[float(r["x_km"]),float(r["y_km"]),float(r["z_km"])] for r in rows],dtype=float)
                  nodes=knn_edges(xyz,k=int(meta[name]["graph_k"]))
                  mids=0.5*(xyz[nodes[:,0]]+xyz[nodes[:,1]])
                  for i,((a,b),m) in enumerate(zip(nodes,mids)):
                      w.writerow({
                          "species":name,"edge_index":i,"node_left":int(a),"node_right":int(b),
                          "mid_x_km":float(m[0]),"mid_y_km":float(m[1]),"mid_z_km":float(m[2]),
                          "panel":rows[0]["panel"],"role":rows[0]["role"],
                      })
          h=hashlib.sha256(out.read_bytes()).hexdigest()
          assert h=="b7864048347bea8393f6beaa7cb7dc4e4f3b87336700f748180d67b94af37f63",h
          print({"species":len(by),"edge_sha256":h,"bytes":out.stat().st_size})
          PY

      - name: Compute survivor frozen geometry-null center
        run: |
          python scripts/run_codistributed_recurrence_survivor_fixed_tst_shard.py             --component center             --localities "$LOCALITIES"             --edges results/survivor-center/survivor_edges.csv             --candidates "$CANDIDATES"             --mask-result "$MASK_RESULT"             --survivor-info "$SURVIVOR_INFO"             --rule "$RULE"             --mask-rule "$MASK_RULE"             --sharding "$SHARDING"             --output-npz results/survivor-center/survivor_center_v0.1.npz             --output-json results/survivor-center/survivor_center_v0.1.json

      - uses: actions/upload-artifact@v4
        with:
          name: codistributed-survivor-center-v0.1
          path: |
            transport/codistributed_recurrence_confirmatory_survivor_localities_v0.1.csv
            results/survivor-center/survivor_edges.csv
            results/survivor-center/survivor_center_v0.1.npz
            results/survivor-center/survivor_center_v0.1.json
          retention-days: 30
          if-no-files-found: error

  reference:
    name: survivor reference ${{ matrix.label }}
    needs: center
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { label: r000_200, start: 0, stop: 200 }
          - { label: r200_400, start: 200, stop: 400 }
          - { label: r400_600, start: 400, stop: 600 }
          - { label: r600_800, start: 600, stop: 800 }
          - { label: r800_999, start: 800, stop: 999 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: codistributed-survivor-center-v0.1
          path: results/survivor-center-artifact
      - name: Run survivor reference shard
        run: |
          mkdir -p results/survivor-reference
          python scripts/run_codistributed_recurrence_survivor_fixed_tst_shard.py             --component reference --start ${{ matrix.start }} --stop ${{ matrix.stop }}             --localities results/survivor-center-artifact/transport/codistributed_recurrence_confirmatory_survivor_localities_v0.1.csv             --edges results/survivor-center-artifact/results/survivor-center/survivor_edges.csv             --candidates "$CANDIDATES" --mask-result "$MASK_RESULT" --survivor-info "$SURVIVOR_INFO"             --rule "$RULE" --mask-rule "$MASK_RULE" --sharding "$SHARDING"             --center-npz results/survivor-center-artifact/results/survivor-center/survivor_center_v0.1.npz             --output-npz results/survivor-reference/reference_${{ matrix.label }}.npz
      - uses: actions/upload-artifact@v4
        with:
          name: codistributed-survivor-reference-${{ matrix.label }}
          path: results/survivor-reference/reference_${{ matrix.label }}.npz
          retention-days: 30
          if-no-files-found: error

  evaluation:
    name: survivor evaluation ${{ matrix.label }}
    needs: center
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { label: r000_200, start: 0, stop: 200 }
          - { label: r200_400, start: 200, stop: 400 }
          - { label: r400_500, start: 400, stop: 500 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: codistributed-survivor-center-v0.1
          path: results/survivor-center-artifact
      - name: Run survivor evaluation shard
        run: |
          mkdir -p results/survivor-evaluation
          python scripts/run_codistributed_recurrence_survivor_fixed_tst_shard.py             --component evaluation --start ${{ matrix.start }} --stop ${{ matrix.stop }}             --localities results/survivor-center-artifact/transport/codistributed_recurrence_confirmatory_survivor_localities_v0.1.csv             --edges results/survivor-center-artifact/results/survivor-center/survivor_edges.csv             --candidates "$CANDIDATES" --mask-result "$MASK_RESULT" --survivor-info "$SURVIVOR_INFO"             --rule "$RULE" --mask-rule "$MASK_RULE" --sharding "$SHARDING"             --center-npz results/survivor-center-artifact/results/survivor-center/survivor_center_v0.1.npz             --output-npz results/survivor-evaluation/evaluation_${{ matrix.label }}.npz
      - uses: actions/upload-artifact@v4
        with:
          name: codistributed-survivor-evaluation-${{ matrix.label }}
          path: results/survivor-evaluation/evaluation_${{ matrix.label }}.npz
          retention-days: 30
          if-no-files-found: error

  positive:
    name: survivor positive ${{ matrix.label }}
    needs: center
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { label: r000_200, start: 0, stop: 200 }
          - { label: r200_400, start: 200, stop: 400 }
          - { label: r400_500, start: 400, stop: 500 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: codistributed-survivor-center-v0.1
          path: results/survivor-center-artifact
      - name: Run survivor positive shard
        run: |
          mkdir -p results/survivor-positive
          python scripts/run_codistributed_recurrence_survivor_fixed_tst_shard.py             --component positive --start ${{ matrix.start }} --stop ${{ matrix.stop }}             --localities results/survivor-center-artifact/transport/codistributed_recurrence_confirmatory_survivor_localities_v0.1.csv             --edges results/survivor-center-artifact/results/survivor-center/survivor_edges.csv             --candidates "$CANDIDATES" --mask-result "$MASK_RESULT" --survivor-info "$SURVIVOR_INFO"             --rule "$RULE" --mask-rule "$MASK_RULE" --sharding "$SHARDING"             --center-npz results/survivor-center-artifact/results/survivor-center/survivor_center_v0.1.npz             --output-npz results/survivor-positive/positive_${{ matrix.label }}.npz
      - uses: actions/upload-artifact@v4
        with:
          name: codistributed-survivor-positive-${{ matrix.label }}
          path: results/survivor-positive/positive_${{ matrix.label }}.npz
          retention-days: 30
          if-no-files-found: error

  aggregate:
    name: aggregate survivor requalification
    needs: [center, reference, evaluation, positive]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: codistributed-survivor-center-v0.1
          path: results/survivor-center-artifact
      - uses: actions/download-artifact@v4
        with:
          pattern: codistributed-survivor-reference-*
          path: results/survivor-aggregate/reference
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: codistributed-survivor-evaluation-*
          path: results/survivor-aggregate/evaluation
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: codistributed-survivor-positive-*
          path: results/survivor-aggregate/positive
          merge-multiple: true
      - name: Aggregate survivor fixed-Tst gate
        run: |
          mkdir -p results/survivor-aggregate/final
          python scripts/run_codistributed_recurrence_survivor_fixed_tst_shard.py             --component aggregate             --mask-result "$MASK_RESULT" --survivor-info "$SURVIVOR_INFO"             --rule "$RULE" --mask-rule "$MASK_RULE" --sharding "$SHARDING"             --center-npz results/survivor-center-artifact/results/survivor-center/survivor_center_v0.1.npz             --reference-dir results/survivor-aggregate/reference             --evaluation-dir results/survivor-aggregate/evaluation             --positive-dir results/survivor-aggregate/positive             --output results/survivor-aggregate/final/survivor_fixed_tst_qualification_v0.1.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("results/survivor-aggregate/final/survivor_fixed_tst_qualification_v0.1.json").read_text())
          assert p["status"] in {
              "PASS_TO_ONE_SHOT_CONFIRMATORY_EMPIRICAL_OPENING",
              "NOT_EVALUABLE_CODISTRIBUTED_RECURRENCE_SURVIVOR_GEOMETRY",
          }
          assert all(v is False for v in p["response_firewall"].values())
          print(json.dumps({"status":p["status"],"gate":p["gate"],"private":p["private_evaluation"],"positive":p["positive_evaluation"]},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: codistributed-survivor-fixed-tst-qualification-v0.1
          path: results/survivor-aggregate/final/survivor_fixed_tst_qualification_v0.1.json
          retention-days: 30
          if-no-files-found: error
