name: TTF exploratory NOAA ETOPO present mask and illustrative -120m shoreline readiness

on:
  push:
    branches:
      - exploratory/host-climate-corridor-chelsa-pilot-v0-1
    paths:
      - '.github/workflows/host-climate-etopo-landmask-v01.yml'
      - 'scripts/audit_historical_host_lcp_etopo_mask_readiness.py'
      - 'tests/test_historical_host_lcp_etopo_mask_readiness_v01.py'
      - 'docs/supporting/historical_host_lcp_etopo_static_mask_contract_v0.1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topography-only-frozen-26-locality-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify geometry and ETOPO sensitivity contract on synthetic GeoTIFFs
        run: |
          set -euo pipefail
          python -m pip install -e '.[test]' 'rasterio>=1.4,<2'
          python -m pytest -q tests/test_historical_host_lcp_etopo_mask_readiness_v01.py
          echo '026432857596123d1628f81be969cfb3d6bc2f5f8193a17f3916c22f841edb8a  docs/supporting/historical_host_lcp_etopo_static_mask_contract_v0.1.json' | sha256sum -c -
      - name: Restore exact original response-blind localities (no genetic information)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/geo
          echo '92e19da615ffc2003a90569afd4089eb24871f1fc0df69cc3aface4263b96dc4  provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz' | sha256sum -c -
          tar -xJf provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz -C input/geo
          echo '037cd8fa1f059fb67c349a465540d3d5fac469b5d14a2a4d2658d74c036c0ae9  input/geo/historical_host_memory_localities_v0.1.csv' | sha256sum -c -
      - name: Fetch exactly named public NOAA ETOPO 2022 15s ice-surface topography tile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/etopo
          curl --fail --location --show-error --silent --retry 3 --retry-delay 4 \
            --connect-timeout 30 --max-time 200 \
            'https://www.ngdc.noaa.gov/mgg/global/relief/ETOPO2022/data/15s/15s_surface_elev_gtif/ETOPO_2022_v1_15s_N00W090_surface.tif' \
            --output input/etopo/ETOPO_2022_v1_15s_N00W090_surface.tif
          test -s input/etopo/ETOPO_2022_v1_15s_N00W090_surface.tif
          sha256sum input/etopo/ETOPO_2022_v1_15s_N00W090_surface.tif
          echo '2ccc323904068cf42d36be32d19cd68f8d47579dc4d502b8ed7955af8ffb5fd4  input/etopo/ETOPO_2022_v1_15s_N00W090_surface.tif' | sha256sum -c -
          python - <<'PYMETA'
          import rasterio
          with rasterio.open('input/etopo/ETOPO_2022_v1_15s_N00W090_surface.tif') as ds:
              print('ETOPO_FIXED_SOURCE_METADATA',dict(driver=ds.driver,crs=str(ds.crs),epsg=ds.crs.to_epsg() if ds.crs else None,bands=ds.count,shape=ds.shape,bounds=tuple(ds.bounds),transform=tuple(ds.transform),nodata=ds.nodata))
          PYMETA
      - name: Quantify CURRENT land and illustrative static -120m differences, NOT palaeo coastlines
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_historical_host_lcp_etopo_mask_readiness.py \
            --contract docs/supporting/historical_host_lcp_etopo_static_mask_contract_v0.1.json \
            --etopo-15s-surface-tif input/etopo/ETOPO_2022_v1_15s_N00W090_surface.tif \
            --frozen-original-localities input/geo/historical_host_memory_localities_v0.1.csv \
            --output results/etopo_mask_readiness_v0.1.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('results/etopo_mask_readiness_v0.1.json').read_text())
          assert x['endpoint_sampling']['n_original_localities']==26
          assert x['endpoint_sampling']['n_finite_elevations']==26
          assert x['scientific_boundary']['original_climate_lcp_unchanged'] is True
          assert x['scientific_boundary']['COI_genetic_effect_used'] is False
          assert x['scientific_boundary']['not_a_verified_paleo_coastline'] is True
          print('PASS_ETOPO_STATIC_MASK_READINESS_ONLY__NO_REAL_21KA_COASTLINE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-host-memory-etopo-static-mask-readiness-v0.1
          path: results/etopo_mask_readiness_v0.1.json
          retention-days: 30
          if-no-files-found: warn
