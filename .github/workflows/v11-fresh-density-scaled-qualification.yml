name: v11-fresh-density-scaled-qualification

on:
  push:
    branches:
      - "analysis/gate-i-geometry-calibration"
    paths:
      - "docs/supporting/v11_synthetic_qualification_authorization.json"

permissions:
  contents: write

env:
  GEOMETRY: benchmarks/frozen/v11_fresh_plant_geometry.csv
  SOURCE: benchmarks/frozen/v11_fresh_plant_geometry_source.json
  RULE: docs/supporting/v11_fresh_density_scaled_graph_rule.json
  AUDIT: results/v11_execution_geometry_audit_v0.1.json
  AUTH: docs/supporting/v11_synthetic_qualification_authorization.json
  PYTHONUNBUFFERED: "1"

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - name: Require exact v0.11 authorization and unopened fresh design
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          auth=json.loads(Path('docs/supporting/v11_synthetic_qualification_authorization.json').read_text())
          rule=json.loads(Path('docs/supporting/v11_fresh_density_scaled_graph_rule.json').read_text())
          source=json.loads(Path('benchmarks/frozen/v11_fresh_plant_geometry_source.json').read_text())
          audit=json.loads(Path('results/v11_execution_geometry_audit_v0.1.json').read_text())
          v08=json.loads(Path('results/v08_gate_d_rgfca_reserve_v0.1.json').read_text())
          v09=json.loads(Path('results/v09_gate_d_rgfca_reserve_b_v0.1.json').read_text())
          v10=json.loads(Path('results/v10_density_edge_scale_diagnostic_v0.1.json').read_text())

          assert auth['status']=='authorize_exactly_one_v11_fresh_density_scaled_synthetic_qualification'
          assert rule['schema']=='ttf_v11_fresh_density_scaled_graph_rule_v0.1'
          assert rule['status']=='frozen_before_v11_fresh_plant_geometry_acquisition_and_before_any_v11_synthetic_worlds'
          assert source['schema']=='ttf_v11_fresh_plant_geometry_source_v0.1'
          assert source['fresh_geometry_freeze_pass'] is True
          assert source['output']['species']==250 and source['output']['records']==25000 and source['output']['records_per_species']==100
          assert source['candidate_performance_evaluated_at_freeze'] is False
          assert source['synthetic_worlds_run_at_freeze']==0
          assert source['empirical_trait_or_colour_fields_read'] is False
          assert source['candidate_image_pixels_opened'] is False
          assert source['species_replacement_performed'] is False
          assert source['additional_pages_after_result_performed'] is False
          assert source['selection']['taxon_overlap_with_previous_1000']==[]
          assert audit['schema']=='ttf_v11_execution_geometry_audit_v0.1'
          assert audit['status']=='geometry_only_before_v11_synthetic_qualification'
          assert audit['synthetic_worlds_run']==0
          assert audit['empirical_colour_or_pixels_opened'] is False
          assert audit['candidate_selectable'] is False
          assert audit['graph']['k']==15
          assert v08['gate_d_pass'] is False and v08['empirical_colour_outcome_opened'] is False
          assert v09['gate_d_pass'] is False and v09['empirical_colour_outcome_opened'] is False
          assert v10['candidate_selectable'] is False

          def blob(path):
              return subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()
          for path, expected in auth['pinned_blobs'].items():
              actual=blob(path)
              assert actual==expected, (path,actual,expected)

          assert auth['geometry_sha256']==source['output']['geometry_sha256']
          assert auth['geometry_fingerprint_sha256']==audit['geometry']['fingerprint_sha256']
          assert auth['master_seed']==20260923
          assert auth['eval_fraction']==0.5 and auth['train_species']==125 and auth['eval_species']==125
          assert auth['k']==15 and auth['neighbor_fraction']==0.15 and auth['bandwidth_km']==500.0
          assert auth['edge_chunk_size']==32 and auth['train_chunk_size']==4096
          assert auth['profile_strength_draws']==999 and auth['calibration_statistic_draws']==1000
          assert auth['selected_private_configurations']==2
          assert auth['reference_worlds_per_configuration']==1999 and auth['observed_worlds_per_cell']==500
          assert auth['mandatory_cells']==[[0.0,0.5],[0.0,1.0],[0.0,2.0],[0.0,3.0],[1.0,2.0]]
          assert auth['type1_wilson_upper_ceiling']==0.10 and auth['power_wilson_lower_floor']==0.80
          assert auth['empirical_colour_or_pixels_may_open'] is False
          assert auth['failed_panel_reuse_allowed'] is False
          assert auth['post_result_tuning_allowed'] is False
          print({'authorized':True,'species':250,'records':25000,'k':15,'empirical_colour_opened':False})
          PY

  observed:
    needs: invariants
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {shared: 0, amplitude: 0.5}
          - {shared: 0, amplitude: 1}
          - {shared: 0, amplitude: 2}
          - {shared: 0, amplitude: 3}
          - {shared: 1, amplitude: 2}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run frozen v0.11 observed cell
        run: >-
          python scripts/run_v11_fresh_density_scaled_statistics.py
          --mode observed
          --input "$GEOMETRY"
          --source-ledger "$SOURCE"
          --rule "$RULE"
          --execution-audit "$AUDIT"
          --shared-fraction ${{ matrix.shared }}
          --amplitude ${{ matrix.amplitude }}
          --edge-chunk-size 32
          --train-chunk-size 4096
          --output "out/observed_s${{ matrix.shared }}_a${{ matrix.amplitude }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v11-observed-${{ strategy.job-index }}
          path: out/*.json
          if-no-files-found: error

  reference:
    needs: invariants
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        label: [A0, A0p5, A1, A2, A3, A5, A10, infinite_snr]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run frozen v0.11 private reference
        run: >-
          python scripts/run_v11_fresh_density_scaled_statistics.py
          --mode reference
          --input "$GEOMETRY"
          --source-ledger "$SOURCE"
          --rule "$RULE"
          --execution-audit "$AUDIT"
          --configuration-label "${{ matrix.label }}"
          --edge-chunk-size 32
          --train-chunk-size 4096
          --output "out/reference_${{ matrix.label }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v11-reference-${{ matrix.label }}
          path: out/*.json
          if-no-files-found: error

  aggregate:
    needs: [observed, reference]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: v11-*
          path: gathered
          merge-multiple: true
      - name: Require exact 13-file v0.11 input set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in Path('gathered').glob('*.json'):
              d=json.loads(p.read_text())
              if d.get('schema')=='ttf_v11_fresh_density_scaled_statistics_v0.1':
                  rows.append((d['mode'],d['config']['configuration_label'],d['config']['shared_fraction'],d['config']['amplitude']))
          assert len(rows)==13, rows
          assert sum(r[0]=='reference' for r in rows)==8
          assert sum(r[0]=='observed' for r in rows)==5
          print({'statistics_files':len(rows)})
          PY
      - name: Apply frozen v0.11 qualification rule
        run: >-
          python scripts/aggregate_v11_fresh_density_scaled.py
          --input-dir gathered
          --rule "$RULE"
          --source-ledger "$SOURCE"
          --execution-audit "$AUDIT"
          --output results/v11_fresh_density_scaled_qualification_v0.1.json
      - name: Freeze authorization lineage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/v11_fresh_density_scaled_qualification_v0.1.json')
          d=json.loads(p.read_text())
          d['authorization']=json.loads(Path('docs/supporting/v11_synthetic_qualification_authorization.json').read_text())
          d['lineage']={'workflow_run_id':${{ github.run_id }},'workflow_head_sha':'${{ github.sha }}'}
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v11-fresh-density-scaled-qualification-result
          path: results/v11_fresh_density_scaled_qualification_v0.1.json
      - name: Commit immutable v0.11 qualification result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v11_fresh_density_scaled_qualification_v0.1.json
          git commit -m "Freeze v0.11 fresh density-scaled qualification result"
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
