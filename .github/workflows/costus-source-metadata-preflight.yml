name: Costus independent floral system original source manifest

on:
  push:
    branches:
      - research/crest-ttf-four-system-source-preflight-20261115
  pull_request:
    paths:
      - 'research/prospective/ttf_crest_costus_source_metadata_preflight_20261115.py'
      - 'tests/test_crest_ttf_costus_source_metadata_preflight.py'
      - '.github/workflows/costus-source-metadata-preflight.yml'

jobs:
  costus-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline source identity and digest parsing guards
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_crest_ttf_costus_source_metadata_preflight.py
      - name: Original Costus primary study source inventory, no biological response opening
        run: |
          python research/prospective/ttf_crest_costus_source_metadata_preflight_20261115.py > /tmp/costus_source_metadata_only.json
          cat /tmp/costus_source_metadata_only.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: costus-2022-2025-2026-original-source-metadata-only
          path: /tmp/costus_source_metadata_only.json
          retention-days: 21
