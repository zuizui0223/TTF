name: TTF external insect references 641 species
on:
  push:
    branches: [exploratory/lgm-external-insect-reference-20261019-v01]
    paths:
      - scripts/acquire_lgm_external_references.py
      - tests/test_lgm_external_references.py
      - tests/test_reference_checkpoint.py
      - docs/supporting/external_insect_reference_contract_v0.1.json
      - .github/workflows/lgm-external-insect-reference-v01.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: lgm-external-insect-reference-v01
  cancel-in-progress: false
jobs:
  acquire-and-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate reference filters and checkpoint recovery without changing query science
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'requests>=2.31,<3' 'pytest>=8,<9'
          python -m pytest -q tests/test_lgm_external_references.py tests/test_reference_checkpoint.py
      - name: Restore exact original geometry without genetic responses
        run: |
          set -euo pipefail
          mkdir -p input/external_reference_geo
          echo '92e19da615ffc2003a90569afd4089eb24871f1fc0df69cc3aface4263b96dc4  provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz' | sha256sum -c -
          tar -xJf provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz -C input/external_reference_geo
          echo '037cd8fa1f059fb67c349a465540d3d5fac469b5d14a2a4d2658d74c036c0ae9  input/external_reference_geo/historical_host_memory_localities_v0.1.csv' | sha256sum -c -
          echo 'ab10a876895cf00817e8ce555665ebb78a0f2ac64323d2e93c213e1857738ba9  input/external_reference_geo/historical_host_memory_edges_v0.1.csv' | sha256sum -c -
      - name: Acquire a bounded snapshot of pending species and save each result immediately
        run: |
          set -euo pipefail
          out=benchmarks/exploratory/lgm_external_reference_v01
          if test -f "$out/summary.json" && python - "$out/summary.json" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]))
          sys.exit(0 if q.get('attempted_species')==641 and q.get('status')=='ACQUISITION_COMPLETE_WITH_EXPLICIT_FAILURE_STATES' else 1)
          PY
          then
            echo 'Existing complete acquisition retained unchanged; no duplicate requests.'
            exit 0
          fi
          python -u scripts/acquire_lgm_external_references.py \
            --candidates benchmarks/frozen/historical_host_memory_candidate_642_v0.1.csv \
            --localities input/external_reference_geo/historical_host_memory_localities_v0.1.csv \
            --edges input/external_reference_geo/historical_host_memory_edges_v0.1.csv \
            --contract docs/supporting/external_insect_reference_contract_v0.1.json \
            --output "$out" --max-seconds 900
          echo 'REFERENCE_SNAPSHOT_CHANGED=true' >> "$GITHUB_ENV"
      - name: Retain partial or complete source-bound snapshot on the isolated branch
        if: env.REFERENCE_SNAPSHOT_CHANGED == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path('benchmarks/exploratory/lgm_external_reference_v01')
          q=json.loads((out/'summary.json').read_text())
          assert q['attempted_species']+q['pending_species']==641 and q['genetic_response_used'] is False
          receipt={'run_id':os.environ['GITHUB_RUN_ID'],'code_commit':os.environ['GITHUB_SHA'],
            'attempted_species':q['attempted_species'],'pending_species':q['pending_species'],
            'sha256':{str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.rglob('*')) if p.is_file() and 'execution_receipt' not in p.name}}
          (out/('execution_receipt_'+os.environ['GITHUB_RUN_ID']+'.json')).write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in receipt.items() if k!='sha256'},sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/exploratory/lgm_external_reference_v01/
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve external reference snapshot and immutable species checkpoints; pending is not absence'
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lgm-external-insect-references-v01
          path: benchmarks/exploratory/lgm_external_reference_v01/
          retention-days: 30
          if-no-files-found: warn
