name: TTF external insect references 641 species
on:
  push:
    branches: [exploratory/lgm-external-insect-reference-20261019-v01]
    paths:
      - scripts/acquire_lgm_external_references.py
      - tests/test_lgm_external_references.py
      - docs/supporting/external_insect_reference_contract_v0.1.json
      - .github/workflows/lgm-external-insect-reference-v01.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: lgm-external-insect-reference-v01
  cancel-in-progress: false
jobs:
  acquire-and-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate reference filters and spherical exclusion
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'requests>=2.31,<3' 'pytest>=8,<9'
          python -m pytest -q tests/test_lgm_external_references.py
      - name: Restore exact original geometry without genetic responses
        run: |
          set -euo pipefail
          mkdir -p input/external_reference_geo
          echo '92e19da615ffc2003a90569afd4089eb24871f1fc0df69cc3aface4263b96dc4  provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz' | sha256sum -c -
          tar -xJf provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz -C input/external_reference_geo
          echo '037cd8fa1f059fb67c349a465540d3d5fac469b5d14a2a4d2658d74c036c0ae9  input/external_reference_geo/historical_host_memory_localities_v0.1.csv' | sha256sum -c -
          echo 'ab10a876895cf00817e8ce555665ebb78a0f2ac64323d2e93c213e1857738ba9  input/external_reference_geo/historical_host_memory_edges_v0.1.csv' | sha256sum -c -
      - name: Acquire all 641 external references and screen separation
        run: |
          set -euo pipefail
          python -u scripts/acquire_lgm_external_references.py \
            --candidates benchmarks/frozen/historical_host_memory_candidate_642_v0.1.csv \
            --localities input/external_reference_geo/historical_host_memory_localities_v0.1.csv \
            --edges input/external_reference_geo/historical_host_memory_edges_v0.1.csv \
            --contract docs/supporting/external_insect_reference_contract_v0.1.json \
            --output benchmarks/exploratory/lgm_external_reference_v01
      - name: Retain source and result identity on the isolated branch
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path('benchmarks/exploratory/lgm_external_reference_v01')
          q=json.loads((out/'summary.json').read_text())
          assert q['attempted_species']==641 and q['genetic_response_used'] is False
          receipt={'run_id':os.environ['GITHUB_RUN_ID'],'code_commit':os.environ['GITHUB_SHA'],
            'sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.iterdir()) if p.is_file()}}
          (out/'execution_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/exploratory/lgm_external_reference_v01/
          git commit -m 'Record all-641 external observation references and spatial support; no climate or genetics'
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lgm-external-insect-references-v01
          path: benchmarks/exploratory/lgm_external_reference_v01/
          retention-days: 30
          if-no-files-found: warn
