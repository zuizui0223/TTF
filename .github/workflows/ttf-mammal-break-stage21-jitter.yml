name: ttf-Jensen80-Stage21-50km-position-jitter-GEO-only
on:
  push:
    branches: [research/break-location-na-mammals-v01]
    paths:
      - '.github/workflows/ttf-mammal-break-stage21-jitter.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixed-spatial-uncertainty-before-genetic-model:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact GIS and source polygon tools
        run: python -m pip install 'numpy>=1.26,<3' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'pyshp>=2.3,<3'
      - name: Run artificial-geography radius, containment and determinism tests
        run: |
          python -m unittest discover -s research/break-location-na-mammals/tests \
            -p 'test_jitter_case_geometry.py' -v
      - name: Recover frozen source-qualified 80 species under exact artifact receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs results/stage21
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12889949378/zip" > /tmp/jensen-frozen-species.zip
          echo 'd2cd60f8a99fccbd53de1bda978e533a77ed3012e058408e181f09ba72c32698  /tmp/jensen-frozen-species.zip' | sha256sum -c -
          unzip -q /tmp/jensen-frozen-species.zip -d inputs
      - name: Verify every original 10km case and one frozen uniform-disk 50km displacement
        run: |
          python research/break-location-na-mammals/stage21_jitter_geometry_gate.py \
            --panel inputs/frozen_species_join.json \
            --sources research/break-location-na-mammals/original_files_v02.json \
            --contract research/break-location-na-mammals/stage21_jitter_geometry_contract_v01.json \
            --work /tmp/jensen-uncertainty-private \
            --output results/stage21/position_jitter_feasibility.json
      - name: Upload public aggregate QA only; never original or jittered coordinates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ttf-Jensen80-Stage21-50km-jitter-QA-only
          path: results/stage21/position_jitter_feasibility.json
          retention-days: 30
          if-no-files-found: error
