name: ttf-Jensen-80-species-actual-climate-barrier-extraction
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ttf-stage20-inputs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  predictor-inputs-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      GDAL_CACHEMAX: '256'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIS and numerical readers
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'shapely>=2.0,<3' 'rasterio>=1.4,<2' 'pyproj>=3.6,<4' 'pyshp>=2.3,<3'
      - name: Test real extraction math and source boundary/nodata safeguards
        run: |
          mkdir -p results/stage20
          python -m unittest discover -s research/break-location-na-mammals/tests -v 2>&1 | tee results/stage20/unit_tests.txt
      - name: Recover exact frozen 80-species metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12889949378/zip" > /tmp/ttf-frozen-species.zip
          echo 'd2cd60f8a99fccbd53de1bda978e533a77ed3012e058408e181f09ba72c32698  /tmp/ttf-frozen-species.zip' | sha256sum -c -
          unzip -q /tmp/ttf-frozen-species.zip -d inputs
      - name: Reproduce sites and extract eight exact climates and five barrier fields WITHOUT fitting genetic response
        run: |
          python research/break-location-na-mammals/extract_frozen_site_features.py \
            --panel inputs/frozen_species_join.json \
            --climate-assets research/break-location-na-mammals/stage20_chelsa8_assets.json \
            --work /tmp/ttf-stage20-private \
            --output results/stage20/feature_support.json
      - name: Store aggregate provenance only, never coordinate grids or restricted GIS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttf-Jensen80-stage20-actual-feature-support
          path: |
            results/stage20/feature_support.json
            results/stage20/unit_tests.txt
          retention-days: 30
          if-no-files-found: error
