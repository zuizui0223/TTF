name: genetic interface smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/genetic-interface-smoke.yml"
      - "src/ttf/genetic_*.py"
      - "src/ttf/phylogatr_*.py"
      - "scripts/freeze_phylogatr_confirmatory_phase1.py"
      - "scripts/run_phylogatr_confirmatory_phase1_intake.py"
      - "scripts/run_phylogatr_projected_phase1_intake.py"
      - "scripts/regenerate_phylogatr_phase1_for_phase4.py"
      - "scripts/freeze_phylogatr_confirmatory_phase2_mask.py"
      - "scripts/run_phylogatr_confirmatory_phase2_intake.py"
      - "scripts/run_phylogatr_projected_phase2_intake.py"
      - "scripts/authorize_phylogatr_phase3_gate_d.py"
      - "scripts/plan_phylogatr_phase3_shards.py"
      - "scripts/run_phylogatr_phase3_*.py"
      - "scripts/aggregate_phylogatr_phase3_*.py"
      - "scripts/authorize_phylogatr_phase4_identity_opening.py"
      - "scripts/run_phylogatr_phase4_empirical_test.py"
      - "docs/supporting/genetic_phylogatr_*.json"
      - "benchmarks/frozen/genetic_decker_species_exclusion_v0.1.json"
      - "benchmarks/frozen/genetic_empirical_opening_state_v0.1.json"
      - "benchmarks/frozen/genetic_empirical_opening_state_v0.3.json"
      - "benchmarks/frozen/genetic_phylogatr_response_blind_method_closure_v0.1.json"
      - "benchmarks/frozen/genetic_phylogatr_phase4_pre_empirical_handoff_v0.1.json"
      - "docs/PHYLOGATR_FRESH_CONFIRMATORY_RUNBOOK_V0.1.md"
      - "tests/test_genetic_*.py"
      - "tests/test_phylogatr_*.py"
  push:
    branches:
      - "method/**"
    paths:
      - ".github/workflows/genetic-interface-smoke.yml"
      - "src/ttf/genetic_*.py"
      - "src/ttf/phylogatr_*.py"
      - "scripts/freeze_phylogatr_confirmatory_phase1.py"
      - "scripts/run_phylogatr_confirmatory_phase1_intake.py"
      - "scripts/run_phylogatr_projected_phase1_intake.py"
      - "scripts/regenerate_phylogatr_phase1_for_phase4.py"
      - "scripts/freeze_phylogatr_confirmatory_phase2_mask.py"
      - "scripts/run_phylogatr_confirmatory_phase2_intake.py"
      - "scripts/run_phylogatr_projected_phase2_intake.py"
      - "scripts/authorize_phylogatr_phase3_gate_d.py"
      - "scripts/plan_phylogatr_phase3_shards.py"
      - "scripts/run_phylogatr_phase3_*.py"
      - "scripts/aggregate_phylogatr_phase3_*.py"
      - "scripts/authorize_phylogatr_phase4_identity_opening.py"
      - "scripts/run_phylogatr_phase4_empirical_test.py"
      - "docs/supporting/genetic_phylogatr_*.json"
      - "benchmarks/frozen/genetic_decker_species_exclusion_v0.1.json"
      - "benchmarks/frozen/genetic_empirical_opening_state_v0.1.json"
      - "benchmarks/frozen/genetic_empirical_opening_state_v0.3.json"
      - "benchmarks/frozen/genetic_phylogatr_response_blind_method_closure_v0.1.json"
      - "benchmarks/frozen/genetic_phylogatr_phase4_pre_empirical_handoff_v0.1.json"
      - "docs/PHYLOGATR_FRESH_CONFIRMATORY_RUNBOOK_V0.1.md"
      - "tests/test_genetic_*.py"
      - "tests/test_phylogatr_*.py"

jobs:
  pytest-genetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: >-
          pytest -q
          tests/test_genetic_geometry.py
          tests/test_genetic_geometry_io.py
          tests/test_genetic_ibd.py
          tests/test_genetic_simulate.py
          tests/test_genetic_gate.py
          tests/test_genetic_self_detectability.py
          tests/test_genetic_empirical_score.py
          tests/test_genetic_manuscript_export.py
          tests/test_genetic_phase4_supplementary.py
          tests/test_genetic_phase4_figures.py
          tests/test_genetic_manuscript_current_state.py
          tests/test_genetic_submission_readiness.py
          tests/test_genetic_conditional_protocol.py
          tests/test_genetic_conditional_simulate.py
          tests/test_genetic_conditional_qualification.py
          tests/test_genetic_conditional_qualification_cli.py
          tests/test_genetic_conditional_contrast.py
          tests/test_genetic_conditional_geometry_match.py
          tests/test_conditional_transfer.py
          tests/test_genetic_molecular_ecology_adapter.py
          tests/test_phylogatr_confirmatory.py
          tests/test_phylogatr_phase1_intake.py
          tests/test_phylogatr_projected_phase1_intake.py
          tests/test_phylogatr_phase1_source_regeneration.py
          tests/test_phylogatr_source_projection.py
          tests/test_phylogatr_compact_ibd.py
          tests/test_phylogatr_compact_self.py
          tests/test_phylogatr_self_cli_wiring.py
          tests/test_phylogatr_compact_empirical.py
          tests/test_phylogatr_fragility_cli_wiring.py
          tests/test_phylogatr_character_mask.py
          tests/test_phylogatr_empirical.py
          tests/test_phylogatr_freeze_contracts.py
          tests/test_phylogatr_phase2_freezer.py
          tests/test_phylogatr_phase2_intake.py
          tests/test_phylogatr_phase3_contract.py
          tests/test_phylogatr_phase3_self_qualification.py
          tests/test_phylogatr_phase4_contract.py
          tests/test_phylogatr_method_closure.py
          tests/test_phylogatr_phase4_pre_empirical_handoff.py
          tests/test_phylogatr_phase4_empirical_handoff.py
