name: ttf-CaliPopGen-Fst-frozen-predictor-information
on:
  push:
    branches: [research/calipopgen-fst-v01]
    paths:
      - '.github/workflows/ttf-calipopgen-fst-information.yml'
      - 'research/calipopgen-fst/climate_feature_gate.py'
      - 'research/calipopgen-fst/tests/test_climate_feature_gate.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ttf-calipopgen-fst-information.yml'
      - 'research/calipopgen-fst/climate_feature_gate.py'
      - 'research/calipopgen-fst/tests/test_climate_feature_gate.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pre-response:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy and test predictor-only geometry
        run: |
          python -m pip install 'numpy>=1.26,<3'
          python -m unittest discover -s research/calipopgen-fst/tests -v
      - name: Recover SHA-pinned CHELSA data without genetic outcome
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12887306539/zip" > /tmp/climate.zip
          echo '8bacad8e331b290e541b49ef32bd6c9331ddf788376ce490cfa300f12737fac7  /tmp/climate.zip' | sha256sum -c -
          unzip -q /tmp/climate.zip -d inputs
      - name: Test historical predictor distinctness from present climate and geography
        run: |
          python research/calipopgen-fst/climate_feature_gate.py \
            --climate-dir inputs/climate \
            --output results/calipopgen-fst/predictor_information_gate.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ttf-calipopgen-fst-train-predictor-information
          path: results/calipopgen-fst/predictor_information_gate.json
          retention-days: 30
