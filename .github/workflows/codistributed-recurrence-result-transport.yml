name: codistributed empirical result exact transport

on:
  push:
    branches:
      - prospective/codistributed-recurrence-insecta-v0-1
    paths:
      - "transport/codistributed_recurrence_empirical_result_v0.1.json.gz.b64"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Restore exact one-shot result
        run: |
          set -euo pipefail
          mkdir -p benchmarks/frozen
          base64 -d transport/codistributed_recurrence_empirical_result_v0.1.json.gz.b64 \
            | gzip -dc \
            > benchmarks/frozen/genetic_codistributed_recurrence_empirical_result_v0.1.json
          echo "d299c00485e5a31c433f87eb235315efc9a839465eb0169c043fde40109f9f0e  benchmarks/frozen/genetic_codistributed_recurrence_empirical_result_v0.1.json" | sha256sum -c -
      - name: Audit exact result before commit
        run: |
          mkdir -p /tmp/post-result-audit
          python scripts/audit_codistributed_recurrence_empirical_result.py \
            --result benchmarks/frozen/genetic_codistributed_recurrence_empirical_result_v0.1.json \
            --authorization benchmarks/frozen/genetic_codistributed_recurrence_identity_opening_authorization_v0.1.json \
            --interpretation docs/supporting/genetic_codistributed_recurrence_interpretation_v0.1.json \
            --output /tmp/post-result-audit/codistributed_recurrence_post_result_audit_v0.1.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("/tmp/post-result-audit/codistributed_recurrence_post_result_audit_v0.1.json").read_text())
          assert p["status"]=="PASS_FROZEN_ONE_SHOT_RESULT_AUDIT"
          assert p["audit"]["decision"]=="CONFIRMATORY_QUALIFIED_NULL_SHARED_GEOGRAPHIC_OPPORTUNITY_INSUFFICIENT"
          assert p["audit"]["positive"] is False
          assert p["audit"]["primary_p_value"]==0.969
          print({"status":p["status"],"decision":p["audit"]["decision"],"beta_G":p["audit"]["beta_G"],"p":p["audit"]["primary_p_value"]})
          PY
      - name: Commit only exact result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm transport/codistributed_recurrence_empirical_result_v0.1.json.gz.b64
          git add benchmarks/frozen/genetic_codistributed_recurrence_empirical_result_v0.1.json
          git commit -m "Freeze one-shot codistributed empirical result"
          git push
