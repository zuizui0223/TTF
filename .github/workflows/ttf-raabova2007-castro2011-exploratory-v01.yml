name: Exploratory corrected Raabova 2007 Castro 2011 site-name geography

on:
  push:
    branches:
      - 'prospective/independent-transplant-overlap-20261115'
    paths:
      - 'research/prospective/raabova2007_castro2011_named_sites_exploratory_contract_v01.json'
      - 'research/prospective/raabova2007_castro2011_named_sites_exploratory_v01.py'
      - 'research/prospective/test_raabova2007_castro2011_named_sites_exploratory_v01.py'
      - '.github/workflows/ttf-raabova2007-castro2011-exploratory-v01.yml'
  pull_request:
    paths:
      - 'research/prospective/raabova2007_castro2011_named_sites_exploratory_contract_v01.json'
      - 'research/prospective/raabova2007_castro2011_named_sites_exploratory_v01.py'
      - 'research/prospective/test_raabova2007_castro2011_named_sites_exploratory_v01.py'
      - '.github/workflows/ttf-raabova2007-castro2011-exploratory-v01.yml'

jobs:
  primary-sites-exploratory-nonresponse:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct primary-year/source-named 3-site synthetic tests
        run: python -m unittest discover -s research/prospective -p test_raabova2007_castro2011_named_sites_exploratory_v01.py -v
      - name: Exact original Hargreaves S1-S3 vs Castro 2011 same-named diploid site distances
        run: |
          python research/prospective/raabova2007_castro2011_named_sites_exploratory_v01.py             --output _ttf_source_only/raabova2007_castro2011_3site_exploratory_v01.json
      - name: Archive only aggregate exploratory geodistance and source provenance
        uses: actions/upload-artifact@v4
        with:
          name: ttf-raabova2007-castro2011-valid-named-sites-exploratory-v01
          path: _ttf_source_only/raabova2007_castro2011_3site_exploratory_v01.json
          retention-days: 30
          if-no-files-found: error
