name: relational-environment-cutover-timeout-repair-long

on:
  push:
    branches:
      - relational-ttf-v01
    paths:
      - "benchmarks/frozen/relational_environment_cutover_timeout_repair_long_v0.1.json"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path("benchmarks/frozen/relational_environment_cutover_timeout_repair_long_v0.1.json").read_text())
          assert p["schema"]=="ttf_relational_environment_cutover_timeout_repair_long_v0.1"
          assert p["status"]=="FROZEN_LONG_TIMEOUT_RETRY_AFTER_SINGLETON_TIMEOUT"
          assert p["query_or_scientific_contract_change"] is False
          assert p["relation_result_seen"] is False
          entries=list(p["entries"])
          assert entries
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("matrix="+json.dumps(list(range(len(entries))),separators=(",",":"))+"\n")
          PY

  repair:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        repair_index: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen corrected transport core
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/acquire_relational_environment_occurrences.py)" = "34eb5d5b459e105943cc5642cf355011d86c4f07"
          test "$(git rev-parse HEAD:src/ttf/relational_environment.py)" = "d05e35866de57daa8eccacdbf7a3c0eaff055890"
          test "$(git rev-parse HEAD:src/ttf/relational_external.py)" = "4a43bf5fedcc40c9a0fecf44dc3412e726b2ad4f"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Acquire exact singleton under longer technical timeout
        run: |
          mkdir -p results/repair
          python scripts/acquire_relational_environment_cutover_repair.py \
            --trigger benchmarks/frozen/relational_environment_cutover_timeout_repair_long_v0.1.json \
            --repair-index ${{ matrix.repair_index }} \
            --output-csv results/repair/occurrences-cutover-repair-long-${{ matrix.repair_index }}.csv \
            --output-ledger results/repair/ledger-cutover-repair-long-${{ matrix.repair_index }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: relational-env-cutover-repair-long-${{ matrix.repair_index }}
          path: results/repair/
          retention-days: 30
          if-no-files-found: error
