name: fresh phylogatR fragility diagnostic execution

on:
  push:
    branches:
      - ops/fresh-fragility-execution-20260918
    paths:
      - ".github/workflows/fresh-fragility-execution.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      reference_matrix: ${{ steps.matrix.outputs.reference_matrix }}
      level_matrix: ${{ steps.matrix.outputs.level_matrix }}
      observed_matrix: ${{ steps.matrix.outputs.observed_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -e .

      - name: Download exact formal Phase3 response-blind input
        uses: actions/download-artifact@v4
        with:
          name: phase3-input
          path: phase3-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35211192698

      - name: Download frozen fragility plan
        uses: actions/download-artifact@v4
        with:
          name: fragility-plan
          path: fragility
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35299124844

      - name: Download self qualification
        uses: actions/download-artifact@v4
        with:
          name: self-qualification
          path: self
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35244879828

      - name: Verify frozen execution contract and build matrices
        id: matrix
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          plan = json.loads(Path("fragility/execution_plan.json").read_text())
          selfq = json.loads(Path("self/qualification.json").read_text())
          compact = json.loads(
              Path("docs/supporting/genetic_phylogatr_fragility_compact_execution_v0.1.json").read_text()
          )

          assert plan["schema"] == "ttf_genetic_phylogatr_gate_d_fragility_execution_plan_v0.1"
          assert plan["status"] == "DIAGNOSTIC_SYNTHETIC_EXECUTION_PLAN_ONLY"
          assert plan["formal_anchor"]["formal_status"] == "PASS"
          assert plan["formal_gate_d_decision_made_by_this_plan"] is False
          assert plan["phase4_identity_opening_authorized_by_this_plan"] is False
          assert plan["confirmatory_sequence_identity_opened"] is False
          assert plan["confirmatory_pairwise_genetic_distances_opened"] is False
          assert plan["confirmatory_ttf_statistic_opened"] is False
          assert all(value is False for value in plan["authority_firewall"].values())

          assert selfq["status"] == "PASS" and selfq["passed"] is True
          assert selfq["confirmatory_sequence_identity_opened"] is False
          assert selfq["confirmatory_pairwise_genetic_distances_opened"] is False
          assert selfq["confirmatory_ttf_statistic_opened"] is False

          assert compact["status"] == (
              "FROZEN_AFTER_GATE_D_AND_SELF_PASS_BEFORE_FRAGILITY_SYNTHETIC_RESULT_OR_IDENTITY_OPENING"
          )
          assert compact["trigger"]["fragility_synthetic_result_seen_before_amendment"] is False
          assert all(value is False for value in compact["firewall"].values())

          refs = []
          levels = []
          obs = []
          for level in plan["levels"]:
              if level["status"] != "SYNTHETIC_DIAGNOSTIC_RUNNABLE":
                  continue
              retention = float(level["retention_fraction"])
              label = str(level["retention_label"]).replace(".", "p")
              levels.append({"retention": retention, "label": label})
              for job in level["reference_jobs"]:
                  refs.append({
                      "retention": retention,
                      "label": label,
                      "configuration": job["configuration"],
                      "start": int(job["start"]),
                      "stop": int(job["stop"]),
                  })
              for job in level["observed_jobs"]:
                  shared = float(job["shared_fraction"])
                  amplitude = float(job["residual_amplitude"])
                  cell = ("s" + f"{shared:g}" + "_a" + f"{amplitude:g}").replace(".", "p")
                  obs.append({
                      "retention": retention,
                      "label": label,
                      "shared": shared,
                      "amplitude": amplitude,
                      "cell": cell,
                      "start": int(job["start"]),
                      "stop": int(job["stop"]),
                  })

          assert len(levels) == 4, len(levels)
          assert len(refs) == 256, len(refs)
          assert len(obs) == 40, len(obs)
          assert [x["retention"] for x in levels] == [0.875, 0.75, 0.625, 0.5]

          print("reference_matrix=" + json.dumps({"include": refs}, separators=(",", ":")))
          print("level_matrix=" + json.dumps({"include": levels}, separators=(",", ":")))
          print("observed_matrix=" + json.dumps({"include": obs}, separators=(",", ":")))
          PY

      - name: Bundle response-blind inputs for this run
        run: |
          set -euo pipefail
          mkdir -p execution-bundle
          cp -a phase3-input execution-bundle/
          cp -a fragility execution-bundle/

      - uses: actions/upload-artifact@v4
        with:
          name: fragility-execution-input
          path: execution-bundle/
          retention-days: 2

  references:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.reference_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: fragility-execution-input
          path: bundle
      - name: Run frozen diagnostic reference shard
        env:
          NUMBA_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          mkdir -p out
          python scripts/run_phylogatr_gate_d_fragility_reference_shard.py \
            --execution-plan bundle/fragility/execution_plan.json \
            --geometry-dir bundle/fragility \
            --phase2-manifest bundle/phase3-input/phase2_manifest.json \
            --phase3-rule docs/supporting/genetic_phylogatr_phase3_gate_d_rule_v0.1.json \
            --retention '${{ matrix.retention }}' \
            --config-label '${{ matrix.configuration }}' \
            --start '${{ matrix.start }}' \
            --stop '${{ matrix.stop }}' \
            --output 'out/ref_${{ matrix.label }}_${{ matrix.configuration }}_${{ matrix.start }}_${{ matrix.stop }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: frag-ref-${{ matrix.label }}-${{ matrix.configuration }}-${{ matrix.start }}-${{ matrix.stop }}
          path: out/*.json
          retention-days: 2

  aggregate_references:
    needs: [prepare, references]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.level_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: fragility-execution-input
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          pattern: frag-ref-${{ matrix.label }}-*
          path: ref-shards
          merge-multiple: true
      - name: Aggregate complete private reference family for retention
        run: |
          set -euo pipefail
          python scripts/aggregate_phylogatr_gate_d_fragility_references.py \
            --input-dir ref-shards \
            --execution-plan bundle/fragility/execution_plan.json \
            --phase3-rule docs/supporting/genetic_phylogatr_phase3_gate_d_rule_v0.1.json \
            --retention '${{ matrix.retention }}' \
            --output 'references_${{ matrix.label }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: frag-references-${{ matrix.label }}
          path: references_${{ matrix.label }}.json
          retention-days: 2

  observed:
    needs: [prepare, aggregate_references]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.observed_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: fragility-execution-input
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          name: frag-references-${{ matrix.label }}
          path: refs
      - name: Run frozen diagnostic observed shard
        env:
          NUMBA_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          mkdir -p out
          python scripts/run_phylogatr_gate_d_fragility_observed_shard.py \
            --execution-plan bundle/fragility/execution_plan.json \
            --geometry-dir bundle/fragility \
            --phase2-manifest bundle/phase3-input/phase2_manifest.json \
            --phase3-rule docs/supporting/genetic_phylogatr_phase3_gate_d_rule_v0.1.json \
            --retention '${{ matrix.retention }}' \
            --references 'refs/references_${{ matrix.label }}.json' \
            --shared-fraction '${{ matrix.shared }}' \
            --residual-amplitude '${{ matrix.amplitude }}' \
            --start '${{ matrix.start }}' \
            --stop '${{ matrix.stop }}' \
            --output 'out/obs_${{ matrix.label }}_${{ matrix.cell }}_${{ matrix.start }}_${{ matrix.stop }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: frag-obs-${{ matrix.label }}-${{ matrix.cell }}-${{ matrix.start }}-${{ matrix.stop }}
          path: out/*.json
          retention-days: 2

  curve:
    needs: [prepare, observed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: fragility-execution-input
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          pattern: frag-obs-*
          path: observed
          merge-multiple: true
      - name: Aggregate complete diagnostic fragility curve
        run: |
          set -euo pipefail
          python scripts/aggregate_phylogatr_gate_d_fragility_curve.py \
            --input-dir observed \
            --execution-plan bundle/fragility/execution_plan.json \
            --phase3-rule docs/supporting/genetic_phylogatr_phase3_gate_d_rule_v0.1.json \
            --output fragility_curve.json
          cat fragility_curve.json
          python - <<'PY'
          import json
          q=json.load(open("fragility_curve.json"))
          assert q["schema"] == "ttf_genetic_phylogatr_gate_d_fragility_curve_v0.1"
          assert q["status"] == "DIAGNOSTIC_FRAGILITY_CURVE_COMPLETE"
          assert q["formal_full_geometry_status"] == "PASS"
          assert q["confirmatory_sequence_identity_opened"] is False
          assert q["confirmatory_pairwise_genetic_distances_opened"] is False
          assert q["confirmatory_ttf_statistic_opened"] is False
          assert q["formal_gate_d_decision_made_by_this_curve"] is False
          assert q["phase4_identity_opening_authorized_by_this_curve"] is False
          assert q["diagnostic_completion_is_procedural_prerequisite_only"] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fragility-curve
          path: fragility_curve.json
          retention-days: 2
