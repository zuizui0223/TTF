name: fresh phylogatR self-detectability qualification

on:
  workflow_dispatch:
  push:
    branches:
      - ops/fresh-self-detectability-run-20260918
    paths:
      - ".github/workflows/fresh-self-detectability-run.yml"

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      reference_matrix: ${{ steps.plan.outputs.reference_matrix }}
      evaluation_matrix: ${{ steps.plan.outputs.evaluation_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download exact response-blind Phase3 input from formal Gate-D run
        uses: actions/download-artifact@v4
        with:
          name: phase3-input
          path: phase3-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35211192698
      - name: Verify frozen self preconditions and plan shards
        id: plan
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          required = [
              Path('phase3-input/phase2_geometry.csv'),
              Path('phase3-input/phase2_manifest.json'),
              Path('phase3-input/authorization.json'),
          ]
          for path in required:
              assert path.is_file() and path.stat().st_size > 0, path

          auth = json.loads(Path('phase3-input/authorization.json').read_text())
          assert auth['schema'] == 'ttf_genetic_phylogatr_phase3_gate_d_authorization_v0.1'
          assert auth['status'] == 'authorize_frozen_fresh_phylogatr_phase3_gate_d'
          for key in (
              'fresh_sequence_identity_opened',
              'fresh_pairwise_genetic_distances_opened',
              'fresh_ttf_statistic_opened',
          ):
              assert auth['outcome_firewall'][key] is False

          rule = json.loads(Path('docs/supporting/genetic_phylogatr_phase3_self_detectability_rule_v0.1.json').read_text())
          assert rule['status'] == 'frozen_before_any_fresh_phylogatr_nucleotide_identity_or_self_detectability_result_is_opened'
          assert all(value is False for value in rule['outcome_firewall'].values())
          assert rule['synthetic_worlds']['independent_null_reference_worlds'] == 1000
          assert rule['synthetic_worlds']['null_evaluation_worlds'] == 500
          assert rule['synthetic_worlds']['private_A2_evaluation_worlds'] == 500
          assert rule['execution']['reference_shard_size'] == 250
          assert rule['execution']['evaluation_shard_size'] == 250

          execution_rule = json.loads(Path('docs/supporting/genetic_phylogatr_phase3_self_compact_execution_v0.1.json').read_text())
          assert execution_rule['status'] == 'FROZEN_AFTER_GATE_D_PASS_BEFORE_ANY_SELF_DETECTABILITY_RESULT_OR_NUCLEOTIDE_IDENTITY_OPENING'
          assert execution_rule['trigger']['self_detectability_result_seen_before_amendment'] is False
          assert all(value is False for value in execution_rule['firewall'].values())

          for script in (
              Path('scripts/run_phylogatr_phase3_self_reference_shard.py'),
              Path('scripts/run_phylogatr_phase3_self_evaluation_shard.py'),
          ):
              source = script.read_text()
              assert 'prepare_phylogatr_compact_ttf_design' in source
              assert 'score_phylogatr_compact_self_world_batch' in source
              assert 'prepare_genetic_ttf_design(' not in source
              assert 'score_genetic_self_world_batch(' not in source

          refs = [
              {'start': 0, 'stop': 250},
              {'start': 250, 'stop': 500},
              {'start': 500, 'stop': 750},
              {'start': 750, 'stop': 1000},
          ]
          evaluations = [
              {'cell': 'null', 'start': 0, 'stop': 250},
              {'cell': 'null', 'start': 250, 'stop': 500},
              {'cell': 'private_A2', 'start': 0, 'stop': 250},
              {'cell': 'private_A2', 'start': 250, 'stop': 500},
          ]
          print('reference_matrix=' + json.dumps({'include': refs}, separators=(',', ':')))
          print('evaluation_matrix=' + json.dumps({'include': evaluations}, separators=(',', ':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: self-phase3-input
          path: phase3-input/
          retention-days: 1

  references:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.reference_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: self-phase3-input
          path: phase3-input
      - name: Run frozen self null-reference shard
        env:
          NUMBA_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          mkdir -p out
          python scripts/run_phylogatr_phase3_self_reference_shard.py \
            --geometry phase3-input/phase2_geometry.csv \
            --phase2-manifest phase3-input/phase2_manifest.json \
            --phase3-rule docs/supporting/genetic_phylogatr_phase3_gate_d_rule_v0.1.json \
            --phase3-authorization phase3-input/authorization.json \
            --self-rule docs/supporting/genetic_phylogatr_phase3_self_detectability_rule_v0.1.json \
            --start '${{ matrix.start }}' \
            --stop '${{ matrix.stop }}' \
            --output 'out/self_ref_${{ matrix.start }}_${{ matrix.stop }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: self-ref-${{ matrix.start }}-${{ matrix.stop }}
          path: out/*.json
          retention-days: 1

  aggregate_references:
    needs: [prepare, references]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: self-phase3-input
          path: phase3-input
      - uses: actions/download-artifact@v4
        with:
          pattern: self-ref-*
          path: self-ref-shards
          merge-multiple: true
      - name: Aggregate exact independent self reference
        run: |
          set -euo pipefail
          python scripts/aggregate_phylogatr_phase3_self_references.py \
            --input-dir self-ref-shards \
            --self-rule docs/supporting/genetic_phylogatr_phase3_self_detectability_rule_v0.1.json \
            --phase3-authorization phase3-input/authorization.json \
            --output references.json
      - uses: actions/upload-artifact@v4
        with:
          name: self-references
          path: references.json
          retention-days: 1

  evaluation:
    needs: [prepare, aggregate_references]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.evaluation_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: self-phase3-input
          path: phase3-input
      - uses: actions/download-artifact@v4
        with:
          name: self-references
          path: self-references
      - name: Run frozen self evaluation shard
        env:
          NUMBA_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          mkdir -p out
          python scripts/run_phylogatr_phase3_self_evaluation_shard.py \
            --geometry phase3-input/phase2_geometry.csv \
            --phase2-manifest phase3-input/phase2_manifest.json \
            --phase3-rule docs/supporting/genetic_phylogatr_phase3_gate_d_rule_v0.1.json \
            --phase3-authorization phase3-input/authorization.json \
            --self-rule docs/supporting/genetic_phylogatr_phase3_self_detectability_rule_v0.1.json \
            --references self-references/references.json \
            --cell '${{ matrix.cell }}' \
            --start '${{ matrix.start }}' \
            --stop '${{ matrix.stop }}' \
            --output 'out/self_eval_${{ matrix.cell }}_${{ matrix.start }}_${{ matrix.stop }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: self-eval-${{ matrix.cell }}-${{ matrix.start }}-${{ matrix.stop }}
          path: out/*.json
          retention-days: 1

  qualification:
    needs: [prepare, evaluation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: self-phase3-input
          path: phase3-input
      - uses: actions/download-artifact@v4
        with:
          pattern: self-eval-*
          path: self-evaluations
          merge-multiple: true
      - name: Aggregate frozen self-detectability qualification
        run: |
          set -euo pipefail
          python scripts/aggregate_phylogatr_phase3_self_qualification.py \
            --input-dir self-evaluations \
            --self-rule docs/supporting/genetic_phylogatr_phase3_self_detectability_rule_v0.1.json \
            --phase3-authorization phase3-input/authorization.json \
            --output qualification.json
          cat qualification.json
          python - <<'PY'
          import json
          q=json.load(open('qualification.json'))
          assert q['status'] in {'PASS','SELF_DETECTABILITY_NOT_QUALIFIED'}
          assert q['passed'] in {True, False}
          assert q['confirmatory_sequence_identity_opened'] is False
          assert q['confirmatory_pairwise_genetic_distances_opened'] is False
          assert q['confirmatory_ttf_statistic_opened'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: self-qualification
          path: qualification.json
          retention-days: 1
