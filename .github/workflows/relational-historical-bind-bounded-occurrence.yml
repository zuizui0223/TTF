name: relational-historical-bind-bounded-occurrence

on:
  workflow_run:
    workflows:
      - "relational-historical-occurrence-bounded-v02"
    types:
      - completed
    branches:
      - relational-ttf-v01

permissions:
  contents: write
  actions: read

jobs:
  bind:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relational-ttf-v01

      - name: Verify prospectively frozen bounded run identity
        id: frozen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          trigger=json.loads(Path("benchmarks/frozen/relational_historical_occurrence_binding_trigger_v0.2.json").read_text())
          execution=json.loads(Path("benchmarks/frozen/relational_historical_occurrence_execution_v0.2.json").read_text())
          assert trigger["schema"]=="ttf_relational_historical_occurrence_binding_trigger_v0.2"
          assert trigger["status"]=="FROZEN_BIND_TO_BOUNDED_RUN_BEFORE_FINAL_OCCURRENCE_RESULT"
          assert trigger["workflow_name"]=="relational-historical-occurrence-bounded-v02"
          assert trigger["artifact_name"]=="relational-historical-occurrence-final-v0.2"
          assert trigger["relation_result_seen"] is False and trigger["genetic_response_used"] is False
          assert not any(bool(v) for v in trigger["response_firewall"].values())
          assert execution["schema"]=="ttf_relational_historical_occurrence_execution_v0.2"
          assert execution["status"]=="FROZEN_BOUNDED_RESPONSE_BLIND_OCCURRENCE_EXECUTION"
          run_id=int("${{ github.event.workflow_run.id }}")
          head_sha="${{ github.event.workflow_run.head_sha }}"
          assert run_id==int(trigger["workflow_run_id"]),(run_id,trigger["workflow_run_id"])
          assert head_sha==trigger["workflow_head_sha"],(head_sha,trigger["workflow_head_sha"])

          headers={
              "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
          }
          artifacts=[];page=1
          while True:
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{run_id}/artifacts?per_page=100&page={page}",
                  headers=headers,
              )
              with urllib.request.urlopen(req,timeout=60) as response:
                  p=json.load(response)
              chunk=p.get("artifacts",[]);artifacts.extend(chunk)
              if len(chunk)<100: break
              page+=1
          final=[a for a in artifacts if a.get("name")=="relational-historical-occurrence-final-v0.2" and not a.get("expired")]
          plan=[a for a in artifacts if a.get("name")=="relational-historical-bounded-retry-plan-v0.2" and not a.get("expired")]
          assert len(final)==1,final
          assert len(plan)==1,plan
          digest=str(final[0].get("digest",""))
          assert digest.startswith("sha256:") and len(digest)==71,digest
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"run_id={run_id}\n")
              f.write(f"artifact_id={int(final[0]['id'])}\n")
              f.write(f"artifact_digest={digest}\n")
          print({"run_id":run_id,"final_artifact_id":final[0]["id"],"plan_artifact_id":plan[0]["id"]})
          PY

      - uses: actions/download-artifact@v4
        with:
          name: relational-historical-occurrence-final-v0.2
          path: input/final
          run-id: ${{ steps.frozen.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: relational-historical-bounded-retry-plan-v0.2
          path: input/plan
          run-id: ${{ steps.frozen.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify and freeze bounded occurrence binding
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          trigger_path=Path("benchmarks/frozen/relational_historical_occurrence_binding_trigger_v0.2.json")
          execution_path=Path("benchmarks/frozen/relational_historical_occurrence_execution_v0.2.json")
          candidate_path=Path("benchmarks/frozen/relational_historical_candidates_v0.1.csv")
          csv_path=Path("input/final/occurrences_v0.2.csv")
          ledger_path=Path("input/final/occurrence_ledger_v0.2.json")
          plan_path=Path("input/plan/relational_historical_occurrence_retry_plan_v0.2.json")

          trigger=json.loads(trigger_path.read_text())
          ledger=json.loads(ledger_path.read_text())
          plan=json.loads(plan_path.read_text())
          assert ledger["schema"]=="ttf_relational_historical_occurrence_acquisition_v0.2"
          assert ledger["species"]==1000
          assert ledger["maximum_retry_rounds"]==1
          assert ledger["additional_retry_authorized"] is False
          assert ledger["scientific_query_change"] is False
          assert ledger["relation_result_seen"] is False and ledger["genetic_response_used"] is False
          assert all(v is False for v in ledger["response_firewall"].values())
          assert plan["schema"]=="ttf_relational_historical_occurrence_retry_plan_v0.2"
          assert plan["candidate_species"]==1000
          assert plan["maximum_retry_rounds"]==1
          assert plan["scientific_query_change"] is False
          assert all(v is False for v in plan["response_firewall"].values())
          assert sha(candidate_path)==trigger["candidate_csv_sha256"]
          assert ledger["initial_request_error_count"]==plan["request_error_count"]

          payload={
              "schema":"ttf_relational_historical_occurrence_artifact_binding_v0.2",
              "status":"FROZEN_FINAL_BOUNDED_RESPONSE_BLIND_OCCURRENCE_ARTIFACT",
              "workflow_run_id":int("${{ steps.frozen.outputs.run_id }}"),
              "workflow_head_sha":"${{ github.event.workflow_run.head_sha }}",
              "artifact_id":int("${{ steps.frozen.outputs.artifact_id }}"),
              "artifact_name":"relational-historical-occurrence-final-v0.2",
              "artifact_digest":"${{ steps.frozen.outputs.artifact_digest }}",
              "execution_rule_sha256":sha(execution_path),
              "binding_trigger_sha256":sha(trigger_path),
              "candidate_csv_sha256":sha(candidate_path),
              "occurrence_csv_sha256":sha(csv_path),
              "occurrence_ledger_sha256":sha(ledger_path),
              "retry_plan_sha256":sha(plan_path),
              "occurrence_status":ledger["status"],
              "species_passing_ge_30":int(ledger["species_passing_ge_30"]),
              "initial_request_error_count":int(ledger["initial_request_error_count"]),
              "final_request_error_count":int(ledger["final_request_error_count"]),
              "retry_rounds_completed":int(ledger["retry_rounds_completed"]),
              "genetic_response_used":False,
              "response_firewall":ledger["response_firewall"],
          }
          Path("benchmarks/frozen/relational_historical_occurrence_artifact_binding_v0.2.json").write_text(
              json.dumps(payload,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(payload,sort_keys=True))
          PY

      - name: Commit frozen bounded occurrence binding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/frozen/relational_historical_occurrence_artifact_binding_v0.2.json
          git commit -m "Freeze bounded Study C occurrence artifact"
          git fetch origin relational-ttf-v01
          git rebase origin/relational-ttf-v01
          git push origin HEAD:relational-ttf-v01


  execute_c:
    name: Execute frozen Study C after binding
    needs: bind
    if: ${{ needs.bind.result == 'success' }}
    uses: zuizui0223/TTF/.github/workflows/relational-historical-from-bounded-binding-v02.yml@d9e2c51793312b2d23504908ad0470549939ba7a
