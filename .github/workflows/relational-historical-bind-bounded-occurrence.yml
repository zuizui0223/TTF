name: relational-historical-bind-bounded-occurrence

on:
  workflow_run:
    workflows:
      - "relational-historical-occurrence-bounded-v02"
    types:
      - completed
    branches:
      - relational-ttf-v01

permissions:
  contents: write
  actions: read

jobs:
  bind:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relational-ttf-v01

      - name: Resolve exact final bounded occurrence artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          run_id=int("${{ github.event.workflow_run.id }}")
          headers={
              "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
          }
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{run_id}/artifacts?per_page=100",
              headers=headers,
          )
          with urllib.request.urlopen(req,timeout=60) as response:
              p=json.load(response)
          matches=[a for a in p.get("artifacts",[]) if a.get("name")=="relational-historical-occurrence-final-v0.2" and not a.get("expired")]
          assert len(matches)==1,matches
          a=matches[0]
          digest=str(a.get("digest",""))
          assert digest.startswith("sha256:") and len(digest)==71,digest
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"artifact_id={int(a['id'])}\n")
              f.write(f"artifact_digest={digest}\n")
          print({"run_id":run_id,"artifact_id":a["id"],"digest":digest})
          PY

      - uses: actions/download-artifact@v4
        with:
          name: relational-historical-occurrence-final-v0.2
          path: input/occ
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify bounded occurrence result and freeze binding
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          execution=json.loads(Path("benchmarks/frozen/relational_historical_occurrence_execution_v0.2.json").read_text())
          ledger_path=Path("input/occ/occurrence_ledger_v0.2.json")
          csv_path=Path("input/occ/occurrences_v0.2.csv")
          assert ledger_path.is_file() and csv_path.is_file()
          p=json.loads(ledger_path.read_text())
          assert p["schema"]=="ttf_relational_historical_occurrence_acquisition_v0.2"
          assert p["species"]==1000
          assert p["maximum_retry_rounds"]==1
          assert p["additional_retry_authorized"] is False
          assert p["scientific_query_change"] is False
          assert p["relation_result_seen"] is False
          assert p["genetic_response_used"] is False
          assert p["status"] in {
              "PASS_TO_HISTORICAL_ASSET_EXTRACTION",
              "NOT_EVALUABLE_HISTORICAL_OCCURRENCE_GEOMETRY",
              "NOT_EVALUABLE_HISTORICAL_TECHNICAL_TRANSPORT",
          }
          assert all(v is False for v in p["response_firewall"].values())
          assert execution["schema"]=="ttf_relational_historical_occurrence_execution_v0.2"
          assert execution["candidate_species"]==1000
          assert execution["relation_result_seen"] is False
          assert execution["genetic_response_used"] is False
          payload={
              "schema":"ttf_relational_historical_occurrence_artifact_binding_v0.2",
              "status":"FROZEN_RESPONSE_BLIND_BOUNDED_OCCURRENCE_ARTIFACT",
              "workflow_run_id":int("${{ github.event.workflow_run.id }}"),
              "workflow_head_sha":"${{ github.event.workflow_run.head_sha }}",
              "artifact_id":int("${{ steps.artifact.outputs.artifact_id }}"),
              "artifact_name":"relational-historical-occurrence-final-v0.2",
              "artifact_digest":"${{ steps.artifact.outputs.artifact_digest }}",
              "transport_execution":"benchmarks/frozen/relational_historical_occurrence_execution_v0.2.json",
              "occurrence_csv_sha256":sha(csv_path),
              "occurrence_ledger_sha256":sha(ledger_path),
              "occurrence_status":p["status"],
              "species_passing_ge_30":int(p["species_passing_ge_30"]),
              "final_request_error_count":int(p["final_request_error_count"]),
              "genetic_response_used":False,
              "response_firewall":p["response_firewall"],
          }
          Path("benchmarks/frozen/relational_historical_occurrence_artifact_binding_v0.2.json").write_text(
              json.dumps(payload,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(payload,sort_keys=True))
          PY

      - name: Commit frozen bounded occurrence binding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/frozen/relational_historical_occurrence_artifact_binding_v0.2.json
          git commit -m "Freeze bounded Study C occurrence artifact"
          git fetch origin relational-ttf-v01
          git rebase origin/relational-ttf-v01
          git push origin HEAD:relational-ttf-v01
