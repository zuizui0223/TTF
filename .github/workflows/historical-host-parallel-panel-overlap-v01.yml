name: Historical host parallel-panel overlap audit

on:
  push:
    branches:
      - prospective/historical-host-memory-v0-1
    paths:
      - ".github/workflows/historical-host-parallel-panel-overlap-v01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-response-blind-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/TTF
          ref: de310b843ad35a1985ee077d69a3240fcf0c6b7d
          path: _connectivity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify both frozen inputs and count actual shared insects
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          p1 = Path("benchmarks/frozen/historical_host_memory_candidate_642_v0.1.csv")
          p2 = Path("_connectivity/benchmarks/frozen/genetic_historical_host_connectivity_panel_v0.2.csv")
          expected = {
              p1: ("c36cbb2ba0cbf7d0222645a04538c78236cfda392dd0a3d11dd443f12347d35b", 642),
              p2: ("a402483497bc7bdf9b7427bfc859ce9dcc9183eebf5964d4591f352847130484", 135),
          }
          panels = []
          for path, (digest, n) in expected.items():
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"SHA256 mismatch for {path}: {actual}")
              with path.open(encoding="utf-8", newline="") as f:
                  rows = list(csv.DictReader(f))
              names = [row["species"].strip() for row in rows]
              if len(names) != n or len(set(names)) != n:
                  raise SystemExit(f"species count or uniqueness mismatch for {path}")
              panels.append(set(names))
          shared = sorted(panels[0] & panels[1])
          result = {
              "schema": "ttf_historical_host_parallel_panel_overlap_v0.1",
              "status": "RESPONSE_BLIND_CROSS_PROGRAM_IDENTITY_AUDIT",
              "panels": {
                  "memory_642": 642,
                  "connectivity_135": 135,
                  "frozen_sha256_memory": expected[p1][0],
                  "frozen_sha256_connectivity": expected[p2][0]
              },
              "overlap_species_count": len(shared),
              "overlap_species": shared,
              "meaning": "shared candidate identities are design overlap; neither study has opened fresh genetic responses",
              "decision": "Do not claim two independent genetic replications using overlapping species; retain both frozen panels unchanged",
              "not_an_empirical_genetic_result": True,
              "response_firewall": {
                  "genetic_identity_opened": False,
                  "pairwise_genetic_distances_opened": False,
                  "post_IBD_turnover_opened": False,
                  "historical_host_beta_opened": False
              }
          }
          dest = Path("results/historical_host_parallel_panels/overlap_v0.1.json")
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(json.dumps(result, ensure_ascii=False, sort_keys=True, indent=2) + "\n")
          print(json.dumps({"overlap_species_count": len(shared), "overlap_species": shared}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: historical-host-parallel-panel-overlap-v0.1
          path: results/historical_host_parallel_panels/overlap_v0.1.json
          retention-days: 30
          if-no-files-found: error
