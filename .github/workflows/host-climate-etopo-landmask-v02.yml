name: TTF ETOPO 2022 N15W090 present land and static minus-120m mask (source-pinned v0.2)

on:
  push:
    branches:
      - exploratory/host-climate-corridor-chelsa-pilot-v0-1
    paths:
      - '.github/workflows/host-climate-etopo-landmask-v02.yml'
      - 'scripts/audit_historical_host_lcp_etopo_mask_readiness_v02.py'
      - 'tests/test_historical_host_lcp_etopo_mask_readiness_v02.py'
      - 'benchmarks/frozen/historical_host_lcp_etopo_N15W090_source_pin_v0.2.json'
      - 'docs/supporting/historical_host_lcp_etopo_static_mask_contract_v0.2.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-26-modern-land-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test only synthetic compound-CRS ETOPO rasters before real source reading
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]" "rasterio>=1.4,<2"
          python -m pytest -q tests/test_historical_host_lcp_etopo_mask_readiness_v02.py
          echo "af9a7c3aa0b6c9708d9fc26e13a1ca52ac8181f3254a4d4d92618792dd9431a6  docs/supporting/historical_host_lcp_etopo_static_mask_contract_v0.2.json" | sha256sum -c -
      - name: Restore original 26 response-blind sites, never opened genetics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/geo
          echo "92e19da615ffc2003a90569afd4089eb24871f1fc0df69cc3aface4263b96dc4  provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz" | sha256sum -c -
          tar -xJf provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz -C input/geo
          echo "037cd8fa1f059fb67c349a465540d3d5fac469b5d14a2a4d2658d74c036c0ae9  input/geo/historical_host_memory_localities_v0.1.csv" | sha256sum -c -
      - name: Reuse FIRST-LOOK N15W090 metadata-only public ETOPO source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/source_artifact
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/11944988218/zip" > /tmp/etopo_v02_source.zip
          unzip -q /tmp/etopo_v02_source.zip -d input/source_artifact
          mapfile -t tif < <(find input/source_artifact -type f -name "ETOPO_2022_v1_15s_N15W090_surface.tif")
          test "${#tif[@]}" -eq 1
          echo "2e0f33efebcbe6cc50f3a6dc7c13c78f46e04f648b5f6f3a5ca180c8a5c2f35c  ${tif[0]}" | sha256sum -c -
          echo "source=${tif[0]}" >> "$GITHUB_ENV"
          python - <<'PY'
          import json
          from pathlib import Path
          items=list(Path("input/source_artifact").rglob("source_metadata_v0.2.json"))
          assert len(items)==1
          x=json.loads(items[0].read_text())
          assert x["file_sha256"]=="2e0f33efebcbe6cc50f3a6dc7c13c78f46e04f648b5f6f3a5ca180c8a5c2f35c"
          assert x["contract_sha256"]=="af9a7c3aa0b6c9708d9fc26e13a1ca52ac8181f3254a4d4d92618792dd9431a6"
          assert x["no_land_counts_or_endpoint_elevations_observed"] is True
          PY
      - name: Quantify present-day land and illustrative static minus-120m threshold, not true LGM shoreline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_historical_host_lcp_etopo_mask_readiness_v02.py \
            --contract docs/supporting/historical_host_lcp_etopo_static_mask_contract_v0.2.json \
            --source-pin benchmarks/frozen/historical_host_lcp_etopo_N15W090_source_pin_v0.2.json \
            --etopo-15s-surface-tif "$source" \
            --frozen-original-localities input/geo/historical_host_memory_localities_v0.1.csv \
            --output results/etopo_static_land_readiness_v0.2.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("results/etopo_static_land_readiness_v0.2.json").read_text())
          assert x["status"]=="EXPLORATORY_ETOPO_PRESENT_LAND_AND_ILLUSTRATIVE_MINUS120M_ONLY"
          assert x["endpoint_sampling"]["n_original_localities"]==26
          assert x["endpoint_sampling"]["n_finite_elevations"]==26
          assert x["scientific_boundary"]["original_climate_lcp_unchanged"] is True
          assert x["scientific_boundary"]["COI_genetic_effect_used"] is False
          assert x["scientific_boundary"]["not_a_verified_paleo_coastline"] is True
          print("PASS_CORRECT_ETOPO_COMPOUND_CRS_STATIC_MASK_ONLY")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hhm-corrected-etopo-N15W090-static-land-readiness-v0.2
          path: results/etopo_static_land_readiness_v0.2.json
          retention-days: 30
          if-no-files-found: warn
