name: ttf-fresh-Bontrager-source-garden-GEOMETRY-only
on:
  push:
    branches: [prospective/quaternary-phenotype-source-screen-20261112]
    paths:
      - '.github/workflows/ttf-bontrager-source-garden-geo-qualification-v01.yml'
      - 'research/prospective/bontrager_transplant_geo_contract_v01.json'
      - 'research/prospective/bontrager_transplant_geo_census_v01.py'
      - 'research/prospective/test_bontrager_transplant_geo_census_v01.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ttf-Bontrager-origin-garden-geo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-metadata-only-no-survival-reproduction-fitness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test no fitness-value leakage and strict original source/garden IDs
        run: python -m unittest discover -s research/prospective -p 'test_bontrager_transplant_geo_census_v01.py' -v
      - name: Verified original source study/garden/source-origin geography census only
        run: |
          mkdir -p results/source_only
          python research/prospective/bontrager_transplant_geo_census_v01.py --output results/source_only/Bontrager_source_garden_geography_v01.json
      - name: Verify only metadata and preserve terminal original Haldane stop
        run: |
          python - <<'PY'
          import json
          x=json.load(open('results/source_only/Bontrager_source_garden_geography_v01.json'))
          assert x['fitness_measurement_sign_or_magnitude_opened'] is False
          assert x['adaptive_fitness_or_speciation_prediction_performed'] is False
          assert x['raw_source_and_garden_coordinates_exported'] is False
          print('TRANSPLANT_SOURCE_GARDEN_STATUS',x['status'])
          print('STUDIES',x.get('qualified_original_source_studies'))
          print('TAXA',x.get('qualified_binomial_taxa'))
          print('COMMON_GARDEN_CELLS',x.get('shared_garden_fitness_type_cells_with_multiple_source_IDs_and_coordinates'))
          PY
      - name: Retain aggregated source geometry support and SHA, no rowwise source location or fitness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttf-Bontrager-origin-garden-source-geometry-aggregate-only
          path: results/source_only/Bontrager_source_garden_geography_v01.json
          retention-days: 30
          if-no-files-found: warn
