name: butterfly specialization manuscript figures v01

on:
  push:
    branches:
      - manuscript/butterfly-specialization-ecology-v01
    paths:
      - ".github/workflows/butterfly-specialization-manuscript-figures-v01.yml"
      - "scripts/render_butterfly_specialization_manuscript_figures.py"
  workflow_dispatch:

concurrency:
  group: butterfly-specialization-manuscript-figures-v01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install figure environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "matplotlib>=3.9,<4"

      - name: Restore exact S1 resource descriptors
        uses: actions/download-artifact@v4
        with:
          name: butterfly-resource-envelope-pilot-v01
          path: inputs/s1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: zuizui0223/TTF
          run-id: 36222306369

      - name: Restore exact anthropogenic resource result
        uses: actions/download-artifact@v4
        with:
          name: butterfly-anthropogenic-resource-expansion-v01
          path: inputs/anthropogenic
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: zuizui0223/TTF
          run-id: 36243549495

      - name: Restore exact host-contribution mechanism result
        uses: actions/download-artifact@v4
        with:
          name: butterfly-resource-expansion-mechanism-v01
          path: inputs/mechanism
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: zuizui0223/TTF
          run-id: 36270981110

      - name: Restore exact independent climate result
        uses: actions/download-artifact@v4
        with:
          name: butterfly-climate-release-postgate-independent-result-v01
          path: inputs/climate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: zuizui0223/TTF
          run-id: 36270581743

      - name: Verify exact source identities
        run: |
          echo "894f48dbca1760fc4fa75bfee8f663540ab4b9380f8b9daf2bc09440e8bb0cdc  inputs/s1/butterfly-resource-envelope-pilot-v0.1/s1_resource_descriptors.csv" | sha256sum -c -
          echo "7b2a20387d656dbfcd7b3c38ec6a7fe2505474ad51f783dd1f201eb6b7eabd30  inputs/anthropogenic/butterfly-anthropogenic-resource-expansion-v0.1/species_metrics.csv" | sha256sum -c -
          echo "b0f16c5fa9a5b4a0842d6d23f69de7a1f5e938a4a96fea426c97df2dd73e63aa  inputs/mechanism/species_mechanism_metrics.csv" | sha256sum -c -
          echo "a73dca6e8b669f721d8f2745f27198d9b47a5cbd05dde6146cc8d4f1ddfbf79b  inputs/climate/primary_result.json" | sha256sum -c -

      - name: Render manuscript figures
        run: |
          mkdir -p results/butterfly-specialization-manuscript-figures-v0.1
          python scripts/render_butterfly_specialization_manuscript_figures.py             --descriptors-csv inputs/s1/butterfly-resource-envelope-pilot-v0.1/s1_resource_descriptors.csv             --anthropogenic-csv inputs/anthropogenic/butterfly-anthropogenic-resource-expansion-v0.1/species_metrics.csv             --mechanism-csv inputs/mechanism/species_mechanism_metrics.csv             --climate-primary-json inputs/climate/primary_result.json             --output-dir results/butterfly-specialization-manuscript-figures-v0.1
          (
            cd results/butterfly-specialization-manuscript-figures-v0.1
            sha256sum *.pdf *.png > SHA256SUMS
          )
          ls -lh results/butterfly-specialization-manuscript-figures-v0.1

      - uses: actions/upload-artifact@v4
        with:
          name: butterfly-specialization-manuscript-figures-v01
          path: results/butterfly-specialization-manuscript-figures-v0.1/
          retention-days: 30
