name: Costus 2025 scent and 2022 phylogenomics OSF metadata

on:
  push:
    branches:
      - research/crest-ttf-four-system-source-preflight-20261115
  pull_request:
    paths:
      - 'research/prospective/ttf_crest_costus_osf_manifest_20261115.py'
      - 'tests/test_crest_ttf_costus_osf_manifest.py'
      - '.github/workflows/costus-osf-source-manifest.yml'

jobs:
  osf-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline metadata-only parser checks
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_crest_ttf_costus_osf_manifest.py
      - name: Original OSF nodes list only; no scent or gene expression values
        run: |
          python research/prospective/ttf_crest_costus_osf_manifest_20261115.py > /tmp/costus_osf_source_metadata.json
          cat /tmp/costus_osf_source_metadata.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: costus-osf-source-files-metadata-only
          path: /tmp/costus_osf_source_metadata.json
          retention-days: 21
