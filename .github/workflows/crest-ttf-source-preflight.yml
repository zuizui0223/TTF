name: CREST-TTF response-blind source preflights

on:
  push:
    branches:
      - research/crest-ttf-four-system-source-preflight-20261115
  pull_request:
    paths:
      - 'research/prospective/ttf_crest_*'
      - 'tests/test_crest_ttf_*'
      - '.github/workflows/crest-ttf-source-preflight.yml'

jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependency
        run: python -m pip install pytest
      - name: Run source-key parser tests without external data
        run: python -m pytest -q tests/test_crest_ttf_four_systems_senecio_preflight.py tests/test_crest_ttf_timema_source_only.py
