name: ttf-mammal-break-surveyed-case-background-support
on:
  push:
    branches: [research/break-location-na-mammals-v01]
    paths:
      - '.github/workflows/ttf-mammal-break-sampling-support.yml'
      - 'research/break-location-na-mammals/grid_support_gate.py'
      - 'research/break-location-na-mammals/within_survey_sampling_v01.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ttf-mammal-break-sampling-support.yml'
      - 'research/break-location-na-mammals/grid_support_gate.py'
      - 'research/break-location-na-mammals/within_survey_sampling_v01.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sampled-survey-support-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIS sampling dependencies
        run: python -m pip install 'pyshp>=2.3,<3' 'pyproj>=3.7,<4' 'shapely>=2,<3' 'numpy>=1.26,<3'
      - name: Verify original GIS receipts, sample only within surveyed ranges, report aggregate counts
        run: |
          python research/break-location-na-mammals/grid_support_gate.py \
            --manifest research/break-location-na-mammals/original_files_v02.json \
            --rule research/break-location-na-mammals/spatial_overlap_gate_v01.json \
            --sampling research/break-location-na-mammals/within_survey_sampling_v01.json \
            --work /tmp/jensen-break-grid-source \
            --out results/ttf-mammal-breaks/surveyed_grid_support_gate.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ttf-mammal-break-surveyed-background-counts
          path: results/ttf-mammal-breaks/surveyed_grid_support_gate.json
          retention-days: 30
          if-no-files-found: error
