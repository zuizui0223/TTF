name: Penstemon source-authenticated S1 visual QC only

on:
  push:
    branches:
      - research/penstemon-ttf-source-join-20261115

jobs:
  original-source-visual:
    if: github.event.head_commit.message == 'Render original Penstemon Table S1 for source-layout inspection'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authentic-source renderer
        run: python -m pip install pymupdf
      - name: Render only original DOI supplement Table S1 / immediate next-page top
        run: |
          python research/prospective/penstemon_original_S1_source_visual_render_20261116.py
      - uses: actions/upload-artifact@v4
        with:
          name: penstemon-original-S1-verified-page-source-visual
          path: /tmp/penstemon_2026_S1_source_visual/*.png
          retention-days: 2
