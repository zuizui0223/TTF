name: ttf-q-c2-geographic-information

on:
  push:
    branches:
      - method/ttf-q-response-blind-qualification-v0-1
    paths:
      - ".github/workflows/ttf-q-c2-geographic-information.yml"
  workflow_run:
    workflows:
      - "ttf-q-c1-history-information"
    types:
      - completed
  workflow_dispatch:
    inputs:
      c1_run_id:
        description: "Exact pre-result-bound C1 workflow run"
        required: true
        default: "36326997088"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  c2:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.id == 36326997088)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      C1_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.c1_run_id || 36326997088 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TTF-Q
        run: python -m pip install -e .

      - name: Verify exact pre-result C2 binding
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          rule=json.loads(Path("docs/supporting/ttf_q_c2_geographic_opportunity_v0.2.json").read_text())
          final=json.loads(Path("benchmarks/frozen/relational_program_final_state_v0.3.json").read_text())
          assert rule["schema"]=="ttf_q_c2_geographic_opportunity_v0.2"
          assert rule["status"]=="FROZEN_TECHNICAL_REBIND_BEFORE_REPAIRED_C1_RESULT"
          assert int(os.environ["C1_RUN_ID"])==rule["parent_c1"]["bound_workflow_run_id"]==36326997088
          assert rule["parent_c1"]["bound_head_sha"]=="91060f5244f6d61877201797f84bc7f08baaf930"
          assert rule["parent_c1"]["C1_result_seen"] is False
          assert final["final_state"]=="CLOSED_NO_EVALUABLE_TEST"
          assert rule["program_boundary"]["genetic_response_opening_authorized"] is False
          assert all(v is False for v in rule["response_firewall"].values())
          print({"status":"PASS_EXACT_C2_PRE_RESULT_BINDING","c1_run":os.environ["C1_RUN_ID"]})
          PY

      - name: Download exact bound C1 result artifact
        uses: actions/download-artifact@v4
        with:
          name: ttf-q-c1-history-information
          path: input/c1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.C1_RUN_ID }}

      - name: Verify C1 response-blind results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def one(name):
              hits=[p for p in Path("input/c1").rglob(name) if p.is_file()]
              assert len(hits)==1,(name,hits)
              return hits[0]

          design=one("c1_historical_design.npz")
          dev=one("c1_development.json")
          conf=one("c1_confirmatory.json")
          receipt=one("c1_result_receipt.json")

          d=json.loads(dev.read_text())
          c=json.loads(conf.read_text())
          r=json.loads(receipt.read_text())
          assert d["schema"]=="ttf_q_historical_information_result_v0.1"
          assert c["schema"]=="ttf_q_historical_information_result_v0.1"
          assert d["panel"]=="development" and c["panel"]=="confirmatory"
          assert d["program_boundary"]["genetic_response_used"] is False
          assert c["program_boundary"]["genetic_response_used"] is False
          assert r["schema"]=="ttf_q_c1_result_receipt_v0.1"
          assert r["status"]=="COMPLETE_RESPONSE_BLIND_HISTORY_INFORMATION_CHARACTERIZATION"
          assert r["v03_reopened"] is False
          assert r["genetic_response_used"] is False

          Path("input/exact").mkdir(parents=True,exist_ok=True)
          import shutil
          shutil.copy2(design,"input/exact/c1_historical_design.npz")
          shutil.copy2(dev,"input/exact/c1_development.json")
          shutil.copy2(conf,"input/exact/c1_confirmatory.json")
          print({"status":"PASS_BOUND_C1_ARTIFACT","admissible_species":r["admissible_species"]})
          PY

      - name: Download exact response-blind occurrence artifact
        uses: actions/download-artifact@v4
        with:
          name: relational-historical-occurrence-final-v0.2
          path: input/occ
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36200833241

      - name: Verify and normalize exact occurrence bytes
        run: |
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path

          def sha(path):
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for b in iter(lambda:f.read(1<<20),b""):
                      h.update(b)
              return h.hexdigest()

          binding=json.loads(Path("benchmarks/frozen/relational_historical_occurrence_artifact_binding_v0.2.json").read_text())
          wanted={
              binding["occurrence_csv_sha256"]:"occurrences.csv",
              binding["occurrence_ledger_sha256"]:"occurrence_ledger.json",
          }
          found={}
          for path in Path("input/occ").rglob("*"):
              if path.is_file():
                  digest=sha(path)
                  if digest in wanted:
                      found[wanted[digest]]=path
          assert set(found)==set(wanted.values()),found
          shutil.copy2(found["occurrences.csv"],"input/exact/occurrences.csv")
          shutil.copy2(found["occurrence_ledger.json"],"input/exact/occurrence_ledger.json")
          ledger=json.loads(Path("input/exact/occurrence_ledger.json").read_text())
          assert ledger["status"]=="NOT_EVALUABLE_HISTORICAL_TECHNICAL_TRANSPORT"
          assert ledger["species_passing_ge_30"]==653
          assert ledger["genetic_response_used"] is False
          assert all(v is False for v in ledger["response_firewall"].values())
          print({"status":"PASS_EXACT_EXTERNAL_OCCURRENCE_GEOMETRY","species_passing_ge_30":653})
          PY

      - name: Build C2 external geographic co-opportunity
        run: |
          mkdir -p results/c2
          python scripts/attach_ttf_q_external_opportunity.py             --historical-design input/exact/c1_historical_design.npz             --occurrences input/exact/occurrences.csv             --candidates benchmarks/frozen/relational_historical_candidates_v0.1.csv             --rule docs/supporting/ttf_q_c2_geographic_opportunity_v0.1.json             --panel both             --output-npz results/c2/c2_external_opportunity.npz             --output-summary results/c2/c2_external_opportunity.json

      - name: Compute nested C1-to-C2 information survival
        run: |
          python scripts/run_ttf_q_c2_geographic_information.py             --opportunity-design results/c2/c2_external_opportunity.npz             --c1-result input/exact/c1_development.json             --panel development             --output results/c2/c2_development.json
          python scripts/run_ttf_q_c2_geographic_information.py             --opportunity-design results/c2/c2_external_opportunity.npz             --c1-result input/exact/c1_confirmatory.json             --panel confirmatory             --output results/c2/c2_confirmatory.json

      - name: Freeze compact C2 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          d=json.loads(Path("results/c2/c2_development.json").read_text())
          c=json.loads(Path("results/c2/c2_confirmatory.json").read_text())
          g=json.loads(Path("results/c2/c2_external_opportunity.json").read_text())

          def compact(x):
              return {
                  "C1_total_unique_variance_fraction":x["C1_recomputed"]["total_unique_variance_fraction"],
                  "C2_total_unique_variance_fraction":x["C2_geography_adjusted"]["total_unique_variance_fraction"],
                  "geography_retained_fraction":x["nested_information"]["geography_retained_fraction"],
                  "geography_attributable_fraction_of_C1_unique_information":x["nested_information"]["geography_attributable_fraction_of_C1_unique_information"],
                  "signal_effective_sources_after_geography":x["C2_signal_support"]["signal_effective_sources"],
                  "signal_effective_targets_after_geography":x["C2_signal_support"]["signal_effective_targets"],
                  "max_source_signal_share_after_geography":x["C2_signal_support"]["max_source_signal_share"],
                  "max_target_signal_share_after_geography":x["C2_signal_support"]["max_target_signal_share"],
              }

          payload={
              "schema":"ttf_q_c2_result_receipt_v0.1",
              "status":"COMPLETE_RESPONSE_BLIND_GEOGRAPHY_INFORMATION_DECOMPOSITION",
              "development":compact(d),
              "confirmatory":compact(c),
              "geographic_opportunity":g["geographic_opportunity"],
              "pre_result_bound_c1_run_id":36326997088,
              "both_panels_reported_without_selection":True,
              "v03_reopened":False,
              "genetic_response_used":False,
          }
          Path("results/c2/c2_result_receipt.json").write_text(
              json.dumps(payload,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(payload,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ttf-q-c2-geographic-information
          path: results/c2/
          retention-days: 30
          if-no-files-found: warn
