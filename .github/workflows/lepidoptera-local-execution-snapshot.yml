name: lepidoptera local execution snapshot
on:
  push:
    branches: [feature/lepidoptera-trait-transfer-census-v0-1]
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ttf-lepidoptera-branch-snapshot
          path: |
            .
            !.git
          retention-days: 30
