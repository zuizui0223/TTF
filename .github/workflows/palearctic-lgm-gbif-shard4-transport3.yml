name: palearctic-lgm-gbif-shard4-transport3

on:
  push:
    branches:
      - method/palearctic-lgm-response-blind-v0-1
    paths:
      - ".github/workflows/palearctic-lgm-gbif-shard4-transport3.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: palearctic-lgm-gbif-shard4-transport3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen transport3 amendment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("benchmarks/frozen/genetic_palearctic_lgm_v03_shard4_transport3_amendment_v0.1.json").read_text())
          assert p["status"]=="FROZEN_BEFORE_TRANSPORT3_RESULT_AND_BEFORE_TRANSPORT2_RESULT"
          assert p["transport2"]["result_seen_before_this_amendment"] is False
          assert p["transport2"]["authority"]=="SUPERSEDED_BEFORE_RESULT_BY_TRANSPORT3"
          t=p["transport3"]
          assert t["page_workers_per_species"]==4
          assert t["species_workers"]==2
          assert t["request_timeout_seconds"]==25
          assert t["request_retries"]==8
          assert t["scientific_page_offsets_unchanged"] is True
          assert t["authoritative_if_execution_completes"] is True
          assert all(v is False for v in p["response_firewall"].values())
          print("transport3 amendment verified")
          PY

      - name: Install exact acquisition runtime
        run: |
          python -m pip install -e .
          python -m pip install shapely

      - name: Download exact parent-run Palearctic realm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p realm
          gh run download 36529160168             --repo "$GITHUB_REPOSITORY"             --name palearctic-realm-union-v02             --dir realm
          test -f realm/palearctic_union.geojson

      - name: Reacquire frozen shard 4 with bounded parallel transport
        run: |
          set -euo pipefail
          mkdir -p results
          python scripts/acquire_palearctic_lgm_occurrences_v02_transport3.py             --census benchmarks/frozen/genetic_palearctic_lgm_nonlepidoptera_census_v0.2.json             --realm-geojson realm/palearctic_union.geojson             --output-csv results/occurrences_4.csv             --output-ledger results/ledger_4.json             --shard-index 4             --shards 6
          python - <<'PY'
          import json
          p=json.load(open("results/ledger_4.json"))
          assert p["schema"]=="ttf_genetic_palearctic_lgm_occurrence_shard_v0.2"
          assert p["shard_index"]==4 and p["shards"]==6
          assert p["species_requested"]==4
          t=p["transport"]
          assert t["mode"]=="bounded_parallel_frozen_offsets"
          assert t["page_workers_per_species"]==4
          assert t["species_workers"]==2
          assert t["request_timeout_seconds"]==25
          assert t["request_retries"]==8
          assert t["scientific_page_offsets_changed"] is False
          assert [x["species"] for x in p["species"]]==[
              "Bombus lapidarius",
              "Hylaeus communis",
              "Philonthus cognatus",
              "Xantholinus linearis",
          ]
          assert all(v is False for v in p["response_firewall"].values())
          print({
              "request_errors":sum(x["status"]=="REQUEST_ERROR" for x in p["species"]),
              "statuses":{x["species"]:x["status"] for x in p["species"]},
              "retained":{x["species"]:x.get("retained_palearctic_after_exact_dedup_thinning_cap",0) for x in p["species"]},
          })
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: palearctic-lgm-v02-gbif-shard-4-transport3
          path: |
            results/occurrences_4.csv
            results/ledger_4.json
          retention-days: 30
          if-no-files-found: error
