name: Penstemon 2026 Sierra source-locked two-zone ancestry-to-hue pilot

on:
  push:
    branches:
      - research/penstemon-sierra-ttf-ancestry-hue-20261118
  pull_request:
    paths:
      - 'research/prospective/penstemon_sierra_two_zone_ancestry_hue_20261118.py'
      - 'tests/test_penstemon_sierra_two_zone_ancestry_hue.py'
      - '.github/workflows/penstemon-sierra-ancestry-hue-pilot.yml'

jobs:
  original-source-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic metadata and training-only source controls
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_penstemon_sierra_two_zone_ancestry_hue.py
      - name: One fixed author-source 421-sample 2-zone experiment
        run: |
          python research/prospective/penstemon_sierra_two_zone_ancestry_hue_20261118.py --output /tmp/penstemon_sierra_ancestry_hue_zone_pilot.json
          cat /tmp/penstemon_sierra_ancestry_hue_zone_pilot.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: penstemon-sierra-ttf-ancestry-hue-aggregate-only
          path: /tmp/penstemon_sierra_ancestry_hue_zone_pilot.json
          retention-days: 30
