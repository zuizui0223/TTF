name: conditional pr59 snapshot

on:
  push:
    branches:
      - "ops/conditional-pr59-snapshot-20260919"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "5e0a0772113380f18bbe2a1f90b9969746251915"
          fetch-depth: 1
      - name: Pack exact PR head
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/TTF-pr59-5e0a07721133.tar.gz .
          sha256sum /tmp/TTF-pr59-5e0a07721133.tar.gz > /tmp/TTF-pr59-5e0a07721133.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TTF-pr59-5e0a07721133
          path: |
            /tmp/TTF-pr59-5e0a07721133.tar.gz
            /tmp/TTF-pr59-5e0a07721133.tar.gz.sha256
          if-no-files-found: error
