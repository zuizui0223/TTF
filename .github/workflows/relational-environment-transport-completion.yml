name: relational-environment-transport-completion

on:
  push:
    branches:
      - relational-ttf-v01
    paths:
      - "benchmarks/frozen/relational_environment_transport_completion_trigger_v0.1.json"

permissions:
  contents: read
  actions: read

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Resolve frozen authoritative transport
        id: frozen
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          t=json.loads(Path("benchmarks/frozen/relational_environment_transport_execution_v0.2.json").read_text())
          trig=json.loads(Path("benchmarks/frozen/relational_environment_transport_completion_trigger_v0.1.json").read_text())
          assert t["schema"]=="ttf_relational_environment_transport_execution_v0.2"
          assert t["status"]=="FROZEN_AUTHORITATIVE_CORRECTED_TRANSPORT_BEFORE_RELATION_RESULT"
          assert trig["schema"]=="ttf_relational_environment_transport_completion_trigger_v0.1"
          assert trig["status"]=="AUTHORIZE_TRANSPORT_COMPLETION_AFTER_AUTHORITATIVE_RUN_FINISHED"
          assert int(trig["workflow_run_id"])==int(t["authoritative_execution"]["workflow_run_id"])
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"run_id={int(trig['workflow_run_id'])}\n")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -e .
          python -m pip install "rasterio>=1.4,<2"

      - name: Download authoritative 100 corrected shards
        uses: actions/download-artifact@v4
        with:
          pattern: relational-env-fixed-*
          path: input/shards
          merge-multiple: true
          run-id: ${{ steps.frozen.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Complete HTTP transport under frozen retry rule
        id: transport
        run: |
          mkdir -p results/environment rasters
          python scripts/complete_relational_environment_transport.py \
            --input-dir input/shards \
            --max-rounds 3 \
            --output-csv results/environment/occurrences_v0.2.csv \
            --output-ledger results/environment/occurrence_ledger_v0.2.json \
            --output-retry-receipt results/environment/transport_retry_receipt_v0.1.json
          python - <<'PY'
          import json,os
          p=json.load(open("results/environment/occurrence_ledger_v0.2.json"))
          assert p["species"]==1000
          complete=int(p["status_counts"].get("REQUEST_ERROR",0))==0
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"complete={'true' if complete else 'false'}\n")
          print({"status":p["status"],"request_errors":p["status_counts"].get("REQUEST_ERROR",0)})
          PY

      - name: Download frozen CHELSA V2.1
        if: steps.transport.outputs.complete == 'true'
        run: |
          set -euo pipefail
          base="https://os.zhdk.cloud.switch.ch/chelsav2/GLOBAL/climatologies/1981-2010/bio"
          for v in 1 7 12 15; do
            curl -L --fail --retry 4 --retry-delay 5 \
              "$base/CHELSA_bio${v}_1981-2010_V.2.1.tif" \
              -o "rasters/CHELSA_bio${v}_1981-2010_V.2.1.tif"
          done

      - name: Build frozen Study-B relation
        if: steps.transport.outputs.complete == 'true'
        run: |
          python scripts/build_relational_environment_relation.py \
            --occurrences results/environment/occurrences_v0.2.csv \
            --candidates benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv \
            --rule docs/supporting/relational_environment_relation_rule_v0.3.json \
            --freshness-rule docs/supporting/relational_future_family_freshness_amendment_v0.1.json \
            --raster rasters/CHELSA_bio1_1981-2010_V.2.1.tif \
            --raster rasters/CHELSA_bio7_1981-2010_V.2.1.tif \
            --raster rasters/CHELSA_bio12_1981-2010_V.2.1.tif \
            --raster rasters/CHELSA_bio15_1981-2010_V.2.1.tif \
            --output-npz results/environment/relational_environment_design_v0.3.npz \
            --output-summary results/environment/relational_environment_design_v0.3.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relational-environment-relation-v0.3
          path: |
            results/environment/occurrence_ledger_v0.2.json
            results/environment/transport_retry_receipt_v0.1.json
            results/environment/relational_environment_design_v0.3.npz
            results/environment/relational_environment_design_v0.3.json
          retention-days: 30
          if-no-files-found: warn
