name: ttf-evo-PROCEED70-Haldane-BINARY-presence-only
on:
  push:
    branches: [prospective/quaternary-phenotype-source-screen-20261112]
    paths:
      - '.github/workflows/ttf-proceed70-haldane-presence-mask-only-v01.yml'
      - 'research/prospective/proceed70_haldane_presence_mask.py'
      - 'research/prospective/test_proceed70_haldane_presence_mask.py'
      - 'research/prospective/proceed70_haldane_presence_mask_contract_v01.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ttf-proceed70-Haldane-presence-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen-70plants-source-binary-presence-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install original source parser and nonbiological imported geometry dependencies
        run: python -m pip install 'numpy==2.5.4' 'scipy==1.18.1' 'rasterio==1.5.2' 'pyproj==3.8.0' 'shapely==2.2.0'
      - name: Synthetic tests - source eligibility invariant under all Haldane mean/SD/sample numeric magnitudes
        run: python -m unittest discover -s research/prospective -p 'test_proceed70_haldane_presence_mask.py' -v
      - name: MD5-SHA verified native original source - presence bits only, NEVER numeric Haldane or genotype responses
        run: |
          mkdir -p results/source_only
          python research/prospective/proceed70_haldane_presence_mask.py --output results/source_only/proceed70_Haldane_binary_presence_v01.json
      - name: Enforce no genetic-rate model and report prespecified qualification
        run: |
          python - <<'PY'
          import json
          p='results/source_only/proceed70_Haldane_binary_presence_v01.json'
          r=json.load(open(p))
          assert r['numeric_mean_SD_n_rate_or_fitness_values_decoded'] is False
          assert r['Haldane_or_Darwin_rates_calculated'] is False
          assert r['genetic_trait_adaptation_or_plasticity_prediction_not_tested'] is True
          assert r['previous_TTF_genetic_outcomes_unchanged'] is True
          print('PRESENCE_ONLY_HALDANE_SOURCE_STATUS',r['status'])
          print('HALDANE_SOURCE_SPECIES',r.get('distinct_species_with_any_complete_mask'))
          print('HALDANE_SOURCE_SPECIES_SPLIT',r.get('complete_mask_original_species_by_role'))
          PY
      - name: Publish ONLY aggregate binary missingness and original study/species support
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttf-PROCEED70-Haldane-presence-mask-aggregate-only
          path: results/source_only/proceed70_Haldane_binary_presence_v01.json
          retention-days: 30
          if-no-files-found: warn
