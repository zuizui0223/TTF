name: v10-density-edge-scale-diagnostic

on:
  push:
    branches:
      - "analysis/gate-i-geometry-calibration"
    paths:
      - "scripts/diagnose_v10_density_edge_scale.py"
      - ".github/workflows/v10-density-edge-scale-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - name: Require v0.10 rule predates diagnostic execution and empirical outcomes remain sealed
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          rule=json.loads(Path('docs/supporting/v10_density_edge_scale_diagnostic_rule.json').read_text())
          source=json.loads(Path('benchmarks/frozen/v09_rgfca_reserve_b_max_density_geometry_source.json').read_text())
          v08=json.loads(Path('results/v08_gate_d_rgfca_reserve_v0.1.json').read_text())
          v09=json.loads(Path('results/v09_gate_d_rgfca_reserve_b_v0.1.json').read_text())
          assert rule['status']=='frozen_before_v10_density_edge_scale_diagnostic_execution'
          assert subprocess.run(['git','merge-base','--is-ancestor','4952ace816c98eb123b51f18f2767488fecfc63e','HEAD']).returncode==0
          assert v08['gate_d_pass'] is False and v08['empirical_colour_outcome_opened'] is False
          assert v09['gate_d_pass'] is False and v09['empirical_colour_outcome_opened'] is False
          assert source['empirical_trait_or_colour_fields_read'] is False
          assert source['source_audit']['candidate_pixels_opened_by_audit'] is False
          assert source['source_audit']['colour_fields_parsed'] is False
          assert rule['claim_firewall']['candidate_selection_forbidden'] is True
          print({'development_only':True,'empirical_colour_opened':False,'candidate_selection':False})
          PY
      - name: Run geometry-only density edge-scale audit
        run: >-
          python scripts/diagnose_v10_density_edge_scale.py
          --input benchmarks/frozen/v09_rgfca_reserve_b_max_density_geometry.csv
          --source-ledger benchmarks/frozen/v09_rgfca_reserve_b_max_density_geometry_source.json
          --rule docs/supporting/v10_density_edge_scale_diagnostic_rule.json
          --output results/v10_density_edge_scale_diagnostic_v0.1.json
      - uses: actions/upload-artifact@v4
        with:
          name: v10-density-edge-scale-diagnostic
          path: results/v10_density_edge_scale_diagnostic_v0.1.json
          if-no-files-found: error
      - name: Commit immutable v0.10 geometry diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v10_density_edge_scale_diagnostic_v0.1.json
          git commit -m "Freeze v0.10 density edge-scale geometry diagnosis"
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
