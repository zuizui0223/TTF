name: codistributed recurrence prepare identity authorization

on:
  push:
    branches:
      - prospective/codistributed-recurrence-insecta-v0-1
    paths:
      - "benchmarks/frozen/genetic_codistributed_recurrence_survivor_qualification_result_v0.1.json"

permissions:
  contents: read
  actions: read

env:
  QUALIFICATION: benchmarks/frozen/genetic_codistributed_recurrence_survivor_qualification_result_v0.1.json
  FULL_MASK: benchmarks/frozen/genetic_codistributed_recurrence_confirmatory_mask_full_v0.1.json
  CANDIDATES: benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv
  GEOMETRY_RULE: docs/supporting/genetic_codistributed_recurrence_geometry_null_rule_v0.3.json
  SHARDING: docs/supporting/genetic_codistributed_recurrence_formal_sharding_v0.1.json
  OPENING_RULE: docs/supporting/genetic_codistributed_recurrence_empirical_opening_rule_v0.1.json
  SURVIVOR_RUN_ID: "37406111501"
  SOURCE_SHA256: 5a0fd9ac25893c749d14186fbcce4a46b99163c9d810b36e40eebce7bece61a5

jobs:
  authorize:
    name: prepare hash-bound identity authorization
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -e .

      - name: Restore exact frozen phylogatR archive
        uses: actions/cache/restore@v4
        with:
          path: /tmp/phylogatr.zip
          key: phylogatr-5a0fd9ac25893c749d14186fbcce4a46b99163c9d810b36e40eebce7bece61a5
          restore-keys: |
            phylogatr-5a0fd9ac25893c749d14186fbcce4a46b99163c9d810b36e40eebce7bece61a5

      - name: Require exact source archive without opening identity
        run: |
          test -f /tmp/phylogatr.zip
          test "$(stat -c%s /tmp/phylogatr.zip)" = "274988692"
          echo "$SOURCE_SHA256  /tmp/phylogatr.zip" | sha256sum -c -
          rm -rf /tmp/phylogatr-root
          mkdir -p /tmp/phylogatr-root
          unzip -q /tmp/phylogatr.zip -d /tmp/phylogatr-root
          ROOT="$(dirname "$(find /tmp/phylogatr-root -type f -name genes.txt -print -quit)")"
          test -f "$ROOT/genes.txt"
          test -f "$ROOT/cite.txt"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Restore exact qualified survivor center
        uses: actions/download-artifact@v4
        with:
          name: codistributed-survivor-resume-center-v0.1
          path: results/qualified-center
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37406111501

      - name: Restore exact qualified private references
        uses: actions/download-artifact@v4
        with:
          pattern: codistributed-survivor-resume-reference-*
          path: results/qualified-reference
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37406111501

      - name: Restore exact qualification artifact
        uses: actions/download-artifact@v4
        with:
          name: codistributed-survivor-resume-qualification-v0.1
          path: results/qualified-result
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37406111501

      - name: Require committed qualification to equal run artifact
        run: |
          cmp "$QUALIFICATION" results/qualified-result/survivor_fixed_tst_qualification_v0.1.json
          echo "0f3035fbc8a88a18ba274f4e97ada800b5688b8d40c26568063fbba68118e917  $FULL_MASK" | sha256sum -c -
          test -f results/qualified-center/survivor_localities.csv
          test -f results/qualified-center/survivor_edges.csv
          test -f results/qualified-center/survivor_center_v0.1.npz

      - name: Refuse authorization unless scientific survivor gate passed
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path(os.environ["QUALIFICATION"]).read_text())
          assert p["schema"]=="ttf_genetic_codistributed_recurrence_survivor_fixed_tst_qualification_v0.1"
          assert p["status"]=="PASS_TO_ONE_SHOT_CONFIRMATORY_EMPIRICAL_OPENING"
          assert p["gate"]["overall_pass"] is True
          assert all(v is False for v in p["response_firewall"].values())
          assert "artifact_binding" in p
          print({"status":p["status"],"gate":p["gate"]})
          PY

      - name: Generate response-blind identity-opening authorization
        run: |
          mkdir -p results/authorization
          python scripts/authorize_codistributed_recurrence_identity_opening.py             --root "$ROOT"             --source-archive-sha256 "$SOURCE_SHA256"             --candidates "$CANDIDATES"             --localities results/qualified-center/survivor_localities.csv             --edges results/qualified-center/survivor_edges.csv             --full-mask-ledger "$FULL_MASK"             --survivor-qualification "$QUALIFICATION"             --center-npz results/qualified-center/survivor_center_v0.1.npz             --reference-dir results/qualified-reference             --geometry-rule "$GEOMETRY_RULE"             --sharding "$SHARDING"             --opening-rule "$OPENING_RULE"             --output results/authorization/genetic_codistributed_recurrence_identity_opening_authorization_v0.1.json

      - name: Verify authorization still has closed response state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("results/authorization/genetic_codistributed_recurrence_identity_opening_authorization_v0.1.json").read_text())
          assert p["schema"]=="ttf_genetic_codistributed_recurrence_identity_opening_authorization_v0.1"
          assert p["status"]=="AUTHORIZE_ONE_SHOT_CODISTRIBUTED_NUCLEOTIDE_IDENTITY_OPENING"
          state=p["identity_opening"]
          assert state["nucleotide_identity_opened_at_authorization_time"] is False
          assert state["pairwise_genetic_distances_opened_at_authorization_time"] is False
          assert state["empirical_T_st_opened_at_authorization_time"] is False
          assert state["empirical_beta_G_opened_at_authorization_time"] is False
          print({"status":p["status"],"qualification":p["qualification"],"reference_shards":len(p["reference_shards_sha256"])})
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: codistributed-recurrence-identity-authorization-v0.1
          path: results/authorization/genetic_codistributed_recurrence_identity_opening_authorization_v0.1.json
          retention-days: 30
          if-no-files-found: error
