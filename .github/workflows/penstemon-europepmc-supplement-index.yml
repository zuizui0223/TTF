name: Penstemon Europe PMC source-of-vouchers supplemental index

on:
  push:
    branches:
      - research/penstemon-ttf-source-join-20261115
  pull_request:
    paths:
      - 'research/prospective/penstemon_europepmc_supplement_archive_gate_20261115.py'
      - 'tests/test_penstemon_europepmc_supplement_archive_gate.py'
      - '.github/workflows/penstemon-europepmc-supplement-index.yml'

jobs:
  official-archive-source-index:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source XML links and ZIP metadata firewall
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_penstemon_europepmc_supplement_archive_gate.py
      - name: Check alternative official supplemental ZIP and JATS links
        run: |
          python research/prospective/penstemon_europepmc_supplement_archive_gate_20261115.py > /tmp/penstemon_official_supplement_archive_index.json
          cat /tmp/penstemon_official_supplement_archive_index.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: penstemon-official-europepmc-supplement-index-only
          path: /tmp/penstemon_official_supplement_archive_index.json
          retention-days: 21
