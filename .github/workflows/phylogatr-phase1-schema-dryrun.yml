name: phylogatR phase-1 schema drift canary

on:
  workflow_dispatch:
  push:
    branches:
      - "method/genetic-ibd-crossfit"
    paths:
      - ".github/workflows/phylogatr-phase1-schema-dryrun.yml"
      - "scripts/freeze_phylogatr_confirmatory_phase1.py"
      - "src/ttf/phylogatr_confirmatory.py"
      - "docs/supporting/genetic_phylogatr_*.json"
      - "benchmarks/frozen/genetic_decker_species_exclusion_v0.1.json"

jobs:
  legacy-schema-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OSC/phylogatr-web
          ref: 7aeb3c8501eb8431f1df9f6b9e6df28d116daf66
          path: external/phylogatr-web
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Confirm legacy official fixture is rejected before geometry freeze
        run: |
          set +e
          python scripts/freeze_phylogatr_confirmatory_phase1.py \
            --root external/phylogatr-web/test/data/squamata_results \
            --protocol docs/supporting/genetic_phylogatr_confirmatory_protocol_v0.1.json \
            --parser-rule docs/supporting/genetic_phylogatr_phase1_parser_rule_v0.1.json \
            --digest-rule docs/supporting/genetic_phylogatr_phase1_digest_rule_v0.1.json \
            --execution-rule docs/supporting/genetic_phylogatr_phase1_execution_rule_v0.1.json \
            --decker-exclusion benchmarks/frozen/genetic_decker_species_exclusion_v0.1.json \
            --output-csv results/legacy_fixture.csv \
            --output-manifest results/legacy_fixture.json \
            >results/legacy_stdout.txt 2>results/legacy_stderr.txt
          code=$?
          set -e
          test "$code" -ne 0
          grep -F "unexpected TSV schema" results/legacy_stderr.txt
          grep -F "['accession', 'source_id', 'latitude', 'longitude', 'basis_of_record', 'geodetic_datum', 'coordinate_uncertainty_in_meters', 'issue']" results/legacy_stderr.txt
          test ! -e results/legacy_fixture.json
          test ! -e results/legacy_fixture.csv
      - name: Record canary receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p={
            'schema':'ttf_phylogatr_legacy_schema_drift_canary_v0.1',
            'status':'PASS_EXPECTED_REJECTION_BEFORE_PHASE1_FREEZE',
            'fixture_repository':'OSC/phylogatr-web',
            'fixture_commit':'7aeb3c8501eb8431f1df9f6b9e6df28d116daf66',
            'legacy_occurrence_headers':['accession','source_id','latitude','longitude','basis_of_record','geodetic_datum','coordinate_uncertainty_in_meters','issue'],
            'required_current_occurrence_headers':['phylogatr_id','accession','source_id','latitude','longitude','basis_of_record','coordinate_uncertainty_in_meters','issue','flag'],
            'sequence_identity_opened':False,
            'geometry_frozen':False,
            'interpretation':'Older phylogatR archives with legacy occurrence schema are rejected rather than silently coerced. A fresh confirmatory archive must match the frozen current export schema exactly.'
          }
          Path('results/phylogatr_legacy_schema_canary.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phylogatr-legacy-schema-drift-canary
          path: results/phylogatr_legacy_schema_canary.json
          if-no-files-found: error
