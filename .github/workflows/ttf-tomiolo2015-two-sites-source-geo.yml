name: Tomiolo original source IDs vs three published sites nonresponse geo
on:
  push:
    branches:
      - 'prospective/independent-transplant-overlap-20261115'
    paths:
      - 'research/prospective/tomiolo2015_geo_proxy_site_matrix_contract_v01.json'
      - 'research/prospective/tomiolo2015_geo_proxy_site_matrix_v01.py'
      - 'research/prospective/test_tomiolo2015_geo_proxy_site_matrix_v01.py'
      - 'research/prospective/source_registry/hargreaves35_independent_source_firstwave_eligibility_v01.json'
      - 'research/prospective/source_registry/tomiolo2015_geo_proxy_matrix_v01.json'
      - 'research/prospective/source_registry/tomiolo2015_figshare_appendixA_source_provenance_v01.json'
      - '.github/workflows/ttf-tomiolo2015-two-sites-source-geo.yml'
  pull_request:
    paths:
      - 'research/prospective/tomiolo2015_geo_proxy_site_matrix_contract_v01.json'
      - 'research/prospective/tomiolo2015_geo_proxy_site_matrix_v01.py'
      - 'research/prospective/test_tomiolo2015_geo_proxy_site_matrix_v01.py'
      - 'research/prospective/source_registry/hargreaves35_independent_source_firstwave_eligibility_v01.json'
      - 'research/prospective/source_registry/tomiolo2015_geo_proxy_matrix_v01.json'
      - 'research/prospective/source_registry/tomiolo2015_figshare_appendixA_source_provenance_v01.json'
      - '.github/workflows/ttf-tomiolo2015-two-sites-source-geo.yml'
jobs:
  original-study-site-geometry-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic source ID versus source-climate-site qualification tests
        run: python -m unittest discover -s research/prospective -p test_tomiolo2015_geo_proxy_site_matrix_v01.py -v
      - name: Original authenticated Hargreaves study site proxy versus published Appendix A coordinates
        run: |
          python research/prospective/tomiolo2015_geo_proxy_site_matrix_v01.py \
            --output _ttf_source_only/tomiolo2015_geo_proxy_matrix_v01.json
      - name: Retain anonymized site distance matrix, no original source/garden coordinates
        uses: actions/upload-artifact@v4
        with:
          name: ttf-tomiolo2015-source-only-two-point-geometry-v01
          path: _ttf_source_only/tomiolo2015_geo_proxy_matrix_v01.json
          if-no-files-found: error
          retention-days: 30
