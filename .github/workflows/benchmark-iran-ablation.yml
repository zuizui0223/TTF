name: benchmark-iran-ablation

on:
  push:
    branches:
      - "benchmark/independent-biogeography"
    paths:
      - "src/ttf/crossfit.py"
      - "src/ttf/nuisance.py"
      - "tests/test_crossfit.py"
      - "tests/test_nuisance.py"
      - "scripts/run_iran_method_ablation.py"
      - "scripts/aggregate_iran_method_ablation.py"
      - ".github/workflows/benchmark-iran-ablation.yml"
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acquire frozen supplements
        run: >-
          python scripts/acquire_iran_plateau_supplements.py
          --output-dir benchmark_artifacts/iran_plateau
      - name: Audit and freeze geometry
        run: >-
          python scripts/prepare_iran_plateau_benchmark.py
          --supplement-dir benchmark_artifacts/iran_plateau
          --output-dir prepared/iran_plateau
      - uses: actions/upload-artifact@v4
        with:
          name: iran-ablation-geometry
          path: prepared/iran_plateau/
          if-no-files-found: error
          retention-days: 90

  cell:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [crossfit_raw, single_ibd, crossfit_ibd]
        signal:
          - {shared: "0", amplitude: "0.5", slug: "s0-a0.5"}
          - {shared: "0", amplitude: "1", slug: "s0-a1"}
          - {shared: "0", amplitude: "2", slug: "s0-a2"}
          - {shared: "0", amplitude: "3", slug: "s0-a3"}
          - {shared: "1", amplitude: "2", slug: "s1-a2"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: iran-ablation-geometry
          path: prepared/iran_plateau
      - name: Run paired ablation cell
        run: >-
          python scripts/run_iran_method_ablation.py
          --geometry prepared/iran_plateau/geometry.json
          --variant ${{ matrix.variant }}
          --shared-fraction ${{ matrix.signal.shared }}
          --amplitude ${{ matrix.signal.amplitude }}
          --replicates 100
          --bootstrap 1999
          --alpha 0.05
          --k 4
          --noise-sd 0.8
          --transition-width 0.20
          --min-crossing-species 6
          --split-seed 20260907
          --fold-seed 20260907
          --ibd-degree 1
          --seed 20260907
          --output results/${{ matrix.variant }}-${{ matrix.signal.slug }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: iran-ablation-${{ matrix.variant }}-${{ matrix.signal.slug }}
          path: results/${{ matrix.variant }}-${{ matrix.signal.slug }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: cell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: iran-ablation-*
          path: results/cells
          merge-multiple: true
      - name: Aggregate paired method ablation
        run: >-
          python scripts/aggregate_iran_method_ablation.py
          --input-dir results/cells
          --output results/iran-method-ablation.json
      - name: Print ablation result
        run: cat results/iran-method-ablation.json
      - uses: actions/upload-artifact@v4
        with:
          name: iran-method-ablation-v0.1
          path: results/iran-method-ablation.json
          if-no-files-found: error
          retention-days: 90
