name: relational-environment-cutover-long-repair

on:
  push:
    branches:
      - relational-ttf-v01
    paths:
      - "benchmarks/frozen/relational_environment_cutover_long_repair_v0.1.json"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repair_index: [0,1]
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen corrected transport core
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/acquire_relational_environment_occurrences.py)" = "34eb5d5b459e105943cc5642cf355011d86c4f07"
          test "$(git rev-parse HEAD:src/ttf/relational_environment.py)" = "d05e35866de57daa8eccacdbf7a3c0eaff055890"
          test "$(git rev-parse HEAD:src/ttf/relational_external.py)" = "4a43bf5fedcc40c9a0fecf44dc3412e726b2ad4f"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .

      - name: Acquire exact long-timeout singleton
        run: |
          mkdir -p results/repair
          python scripts/acquire_relational_environment_cutover_repair.py \
            --trigger benchmarks/frozen/relational_environment_cutover_long_repair_v0.1.json \
            --repair-index ${{ matrix.repair_index }} \
            --output-csv results/repair/occurrences-cutover-long-${{ matrix.repair_index }}.csv \
            --output-ledger results/repair/ledger-cutover-long-${{ matrix.repair_index }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: relational-env-cutover-long-repair-${{ matrix.repair_index }}
          path: results/repair/
          retention-days: 30
          if-no-files-found: error
