name: ttfm-structural-diagnostic

on:
  push:
    branches:
      - "method/ttfm-mismatch-decoupling"
    paths:
      - "docs/supporting/ttfm_structural_diagnostic_rule.json"
      - "scripts/run_ttfm_structural_diagnostic.py"
      - "src/ttf/mismatch.py"
      - "src/ttf/mismatch_simulate.py"
      - ".github/workflows/ttfm-structural-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - name: Require frozen development-only rule and no empirical inputs
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          rule=json.loads(Path('docs/supporting/ttfm_structural_diagnostic_rule.json').read_text())
          assert rule['status']=='frozen_before_structural_diagnostic_outcomes'
          assert rule['formal_pass_fail_forbidden'] is True
          assert rule['candidate_selection_forbidden'] is True
          assert rule['empirical_data_forbidden'] is True
          assert rule['claim_firewall']['no_flower_colour_outcome'] is True
          assert subprocess.run([
              'git','merge-base','--is-ancestor',
              '07d7a79c20392d64b9d29c6dba10b7dae5f56214','HEAD'
          ]).returncode==0
          print({'development_only':True,'empirical_data':False,'formal_pass_fail':False})
          PY
      - name: Run structural paired-state diagnostic
        run: >-
          python scripts/run_ttfm_structural_diagnostic.py
          --rule docs/supporting/ttfm_structural_diagnostic_rule.json
          --output results/ttfm_structural_diagnostic_v0.1.json
      - uses: actions/upload-artifact@v4
        with:
          name: ttfm-structural-diagnostic-v0.1
          path: results/ttfm_structural_diagnostic_v0.1.json
          if-no-files-found: error
      - name: Commit immutable development diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ttfm_structural_diagnostic_v0.1.json
          git commit -m "Freeze TTF-M structural diagnostic v0.1"
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
