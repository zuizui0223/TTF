name: Penstemon 2026 five original BioSample XML identity pilot

on:
  push:
    branches:
      - research/penstemon-ttf-source-join-20261115
  pull_request:
    paths:
      - 'research/prospective/penstemon_habroanthus_biosample_xml_pilot_20261115.py'
      - 'tests/test_penstemon_habroanthus_biosample_xml_pilot.py'
      - '.github/workflows/penstemon-biosample-xml-pilot.yml'

jobs:
  original-biosample-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline XML metadata and source integrity tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_penstemon_habroanthus_biosample_xml_pilot.py
      - name: Fetch only the first five verified original BioSample source XML records
        run: |
          python research/prospective/penstemon_habroanthus_biosample_xml_pilot_20261115.py > /tmp/penstemon_2026_biosample_five_source_only.json
          cat /tmp/penstemon_2026_biosample_five_source_only.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: penstemon-2026-five-biosample-source-identities
          path: /tmp/penstemon_2026_biosample_five_source_only.json
          retention-days: 21
