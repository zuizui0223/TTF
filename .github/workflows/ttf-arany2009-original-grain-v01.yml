name: Arany 2009 original seed source and garden provenance audit
on:
  push:
    branches:
      - 'prospective/independent-transplant-overlap-20261115'
    paths:
      - '.github/workflows/ttf-arany2009-original-grain-v01.yml'
      - 'research/prospective/arany2009_original_source_garden_grain_v01.py'
      - 'research/prospective/test_arany2009_original_source_garden_grain_v01.py'
      - 'research/prospective/hargreaves35_primary_article_recovery_shortlist_v01.json'
  pull_request:
    paths:
      - '.github/workflows/ttf-arany2009-original-grain-v01.yml'
      - 'research/prospective/arany2009_original_source_garden_grain_v01.py'
      - 'research/prospective/test_arany2009_original_source_garden_grain_v01.py'
      - 'research/prospective/hargreaves35_primary_article_recovery_shortlist_v01.json'
jobs:
  original-source-maternal-grain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Nine source-only original experimental-unit tests
        run: python -m unittest discover -s research/prospective -p test_arany2009_original_source_garden_grain_v01.py -v
      - name: Reproduce original Arany source and garden provenance
        run: python research/prospective/arany2009_original_source_garden_grain_v01.py --output _source_only/arany2009_original_source_garden_grain_v01.json
      - uses: actions/upload-artifact@v4
        with:
          name: ttf-arany2009-original-source-grain-v01
          path: _source_only/arany2009_original_source_garden_grain_v01.json
          retention-days: 30
