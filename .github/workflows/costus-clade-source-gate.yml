name: Costus 2022 original phylogeny blocked TTF source gate

on:
  push:
    branches:
      - research/crest-ttf-four-system-source-preflight-20261115
  pull_request:
    paths:
      - 'research/prospective/ttf_crest_costus_clade_holdout_source_gate_20261115.py'
      - 'tests/test_crest_ttf_costus_clade_holdout_source_gate.py'
      - '.github/workflows/costus-clade-source-gate.yml'

jobs:
  source-only-clade:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic tree and source-only support tests
        run: |
          python -m pip install pytest dendropy==5.0.8
          python -m pytest -q tests/test_crest_ttf_costus_clade_holdout_source_gate.py
      - name: Verify immutable original rooted-tree STOP and exact source identity without network re-fetch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source=Path("research/prospective")
          root=json.loads((source/"costus_rooted_clade_source_stop_receipt_20261115.json").read_text())
          unrooted=json.loads((source/"costus_unrooted_phylogenetic_neighborhood_stop_receipt_20261115.json").read_text())
          assert root["status"]=="NOT_EVALUABLE_ORIGINAL_CHRONOGRAM_NOT_ROOTED"
          assert root["source_observed_is_rooted"] is False
          assert root["original_rooted_clade_run_id"]==43700817708
          assert root["source_original_tree_sha256"]==unrooted["source_original_tree_sha256"]
          assert unrooted["source_original_tree_rooted"] is False
          assert unrooted["source_scent_taxa"]==27
          assert unrooted["result"]=="SOURCE_GEOMETRY_NOT_EVALUABLE"
          assert root["scent_outcome_values_opened"] is False
          assert unrooted["scent_response_values_read"] is False
          print("PASS: original rooted source STOP and unrooted receipt bindings, no re-download")
          PY
