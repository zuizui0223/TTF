name: ttf-evo-PROCEED70-plant-TRAIT-metadata-no-rates
on:
  push:
    branches: [prospective/quaternary-phenotype-source-screen-20261112]
    paths:
      - '.github/workflows/ttf-proceed70-plant-trait-metadata-qualification-v01.yml'
      - 'research/prospective/proceed70_plant_rate_eligibility.py'
      - 'research/prospective/test_proceed70_plant_rate_eligibility.py'
      - 'research/prospective/proceed70_plant_rate_eligibility_contract_v01.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ttf-proceed70-source-trait-metadata-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-source-trait-categories-and-time-metadata-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned import dependencies for reused original source geometry helpers
        run: python -m pip install 'numpy==2.5.4' 'scipy==1.18.1' 'rasterio==1.5.2' 'pyproj==3.8.0' 'shapely==2.2.0'
      - name: Verify synthetic invariance to original rate and phenotype values
        run: python -m unittest discover -s research/prospective -p 'test_proceed70_plant_rate_eligibility.py' -v
      - name: Original SHA verified source phenotype-metadata categories without effect values
        run: |
          mkdir -p results/source_only
          python research/prospective/proceed70_plant_rate_eligibility.py --output results/source_only/proceed70_rate_metadata_qualification.json
      - name: Enforce response never used and report source-only design counts
        run: |
          python - <<'PY'
          import json
          r=json.load(open('results/source_only/proceed70_rate_metadata_qualification.json'))
          assert r['phenotypic_change_or_genetic_effect_rate_values_read'] is False
          assert r['model_fit_or_history_effect_tested'] is False
          assert r['original_TTF_outcomes_reopened'] is False
          print('PLANT_RATE_METADATA_ONLY',r['status'])
          print('SOURCE_TRAIT_FAMILIES',list(r.get('trait_family_metadata',{})))
          print('DATA_TYPE_CODES',r.get('source_data_type_global_counts'))
          PY
      - name: Retain aggregate study, trait and time-data coverage only; no rates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttf-PROCEED70-plant-rate-source-metadata-aggregate
          path: results/source_only/proceed70_rate_metadata_qualification.json
          retention-days: 30
          if-no-files-found: warn
