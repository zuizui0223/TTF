name: relational-environment-rerun-final-audit-after-recovery

on:
  workflow_run:
    workflows:
      - "relational-environment-request-error-recovery-v02"
    types:
      - completed
    branches:
      - relational-ttf-v01

permissions:
  contents: read
  actions: write

jobs:
  rerun-audit:
    if: github.event.workflow_run.id == 35827478403 && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact frozen recovery and cancelled audit state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          recovery="$(gh api "/repos/$REPO/actions/runs/35827478403")"
          audit="$(gh api "/repos/$REPO/actions/runs/35828444286")"
          test "$(jq -r '.status' <<<"$recovery")" = "completed"
          test "$(jq -r '.conclusion' <<<"$recovery")" = "success"
          test "$(jq -r '.head_branch' <<<"$recovery")" = "relational-ttf-v01"
          test "$(jq -r '.status' <<<"$audit")" = "completed"
          test "$(jq -r '.conclusion' <<<"$audit")" = "cancelled"
          test "$(jq -r '.run_attempt' <<<"$audit")" = "1"

      - name: Re-run exact frozen audit run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST "/repos/$REPO/actions/runs/35828444286/rerun"
          sleep 5
          audit="$(gh api "/repos/$REPO/actions/runs/35828444286")"
          test "$(jq -r '.run_attempt' <<<"$audit")" = "2"
          case "$(jq -r '.status' <<<"$audit")" in
            queued|in_progress) ;;
            *) echo "$audit"; exit 1 ;;
          esac
