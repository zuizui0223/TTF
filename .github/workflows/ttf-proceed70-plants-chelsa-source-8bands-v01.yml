name: ttf-evo-PROCEED70-plant-genetic-CHELSA8-SOURCE-only
on:
  push:
    branches: [prospective/quaternary-phenotype-source-screen-20261112]
    paths:
      - '.github/workflows/ttf-proceed70-plants-chelsa-source-8bands-v01.yml'
      - 'research/prospective/proceed_plant_chelsa_source_support.py'
      - 'research/prospective/test_proceed_plant_chelsa_source_support.py'
      - 'research/prospective/proceed_plant_chelsa_source_support_contract_v01.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ttf-proceed70-chelsa8-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reconstruct-original-plant-pairs-and-verified-climate-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GDAL_CACHEMAX: '256'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install exact numerical GIS original-source versions
        run: python -m pip install 'numpy==2.5.4' 'scipy==1.18.1' 'shapely==2.2.0' 'rasterio==1.5.2' 'pyproj==3.8.0' 'pyshp==2.4.2'
      - name: Test source-only frozen 70-species roles and zero response access
        run: python -m unittest discover -s research/prospective -p 'test_proceed_plant_chelsa_source_support.py' -v
      - name: Recover exact native PROCEED source and 8 original SHA-pinned CHELSA COGs for original localities
        run: |
          mkdir -p results/source_only
          python research/prospective/proceed_plant_chelsa_source_support.py \
            --work /tmp/ttf-proceed70-original-climate-private \
            --output results/source_only/plant70_CHELSA8_original_site_support.json
      - name: Confirm source-only rather than trait or genetic model
        run: |
          python - <<'PY'
          import json
          r=json.load(open('results/source_only/plant70_CHELSA8_original_site_support.json'))
          assert r['phenotype_rate_values_opened'] is False
          assert r['genetic_fitness_effect_fitted'] is False
          assert r['prior_TTF_heldout_response_reopened'] is False
          print('PLANT70_CHELSA8_SOURCE_STATUS',r['status'])
          print('CLIMATE_COMPLETE_SPECIES',r.get('climate_complete_species'))
          print('CLIMATE_COMPLETE_ARMS',r.get('climate_complete_species_per_original_role'))
          PY
      - name: Publish aggregate source support and immutable numerical SHA only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttf-PROCEED70-plant-original-CHELSA8-source-aggregate
          path: results/source_only/plant70_CHELSA8_original_site_support.json
          retention-days: 30
          if-no-files-found: warn
