name: historical host Neotoma LGM validation

on:
  push:
    branches:
      - prospective/historical-host-connectivity-v0-1
    paths:
      - ".github/workflows/historical-host-neotoma-validation.yml"
      - "scripts/census_historical_host_neotoma.py"
      - "docs/supporting/genetic_historical_host_neotoma_validation_rule_v0.1.json"
      - "benchmarks/frozen/genetic_historical_host_connectivity_panel_v0.1.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . requests
      - name: Census frozen LGM host occurrence coverage
        run: |
          set -euo pipefail
          python scripts/census_historical_host_neotoma.py \
            --panel benchmarks/frozen/genetic_historical_host_connectivity_panel_v0.1.csv \
            --rule docs/supporting/genetic_historical_host_neotoma_validation_rule_v0.1.json \
            --output-dir results/historical_host_neotoma \
            --workers 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-host-neotoma-validation-v0.1
          path: results/historical_host_neotoma/
          retention-days: 30
          if-no-files-found: error
