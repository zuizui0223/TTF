name: historical host Neotoma LGM validation

on:
  push:
    branches:
      - prospective/historical-host-connectivity-v0-1
    paths:
      - ".github/workflows/historical-host-neotoma-validation.yml"
      - "scripts/census_historical_host_neotoma.py"
      - "docs/supporting/genetic_historical_host_neotoma_validation_rule_v0.1.json"
      - "benchmarks/frozen/genetic_historical_host_connectivity_panel_v0.1.csv"
      - "benchmarks/frozen/genetic_historical_host_panel_identity_correction_v0.1.json"
      - "scripts/export_historical_host_wcvp_names.R"
      - "scripts/export_historical_host_names_from_sidecar.py"
      - "benchmarks/frozen/genetic_historical_host_sidecar_replay_repair_v0.1.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download exact frozen WCVP/HOSTS sidecar
        uses: actions/download-artifact@v4
        with:
          name: wcvp-v13-hosts-sidecar
          path: _host_sidecar
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35548477097
      - name: Verify exact sidecar bytes
        run: |
          echo "c731906315f7452f83ce302c1d36c75ad94afc24ce7e24d461360312244ac558  _host_sidecar/native_extant_nondoubtful_wgsrpd3.csv" | sha256sum -c -
      - name: Export canonical accepted host names from exact sidecar
        run: |
          python scripts/export_historical_host_names_from_sidecar.py \
            --panel benchmarks/frozen/genetic_historical_host_connectivity_panel_v0.1.csv \
            --native-sidecar _host_sidecar/native_extant_nondoubtful_wgsrpd3.csv \
            --output results/wcvp/accepted_host_names.csv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . requests
      - name: Census frozen LGM host occurrence coverage
        run: |
          set -euo pipefail
          python scripts/census_historical_host_neotoma.py \
            --panel benchmarks/frozen/genetic_historical_host_connectivity_panel_v0.1.csv \
            --rule docs/supporting/genetic_historical_host_neotoma_validation_rule_v0.1.json \
            --identity-correction benchmarks/frozen/genetic_historical_host_panel_identity_correction_v0.1.json \
            --wcvp-names results/wcvp/accepted_host_names.csv \
            --output-dir results/historical_host_neotoma \
            --workers 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-host-neotoma-validation-v0.1
          path: results/historical_host_neotoma/
          retention-days: 30
          if-no-files-found: error
