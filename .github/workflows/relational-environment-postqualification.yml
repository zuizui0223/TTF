name: relational-environment-postqualification

on:
  push:
    branches:
      - relational-ttf-v01
    paths:
      - "benchmarks/frozen/relational_environment_qualification_artifact_binding_v0.1.json"

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.binding.outputs.run_id }}
      pass_to_mask: ${{ steps.binding.outputs.pass_to_mask }}
      program_state: ${{ steps.binding.outputs.program_state }}
    steps:
      - uses: actions/checkout@v4
      - id: binding
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path("benchmarks/frozen/relational_environment_qualification_artifact_binding_v0.1.json").read_text())
          assert p["schema"]=="ttf_relational_environment_qualification_artifact_binding_v0.1"
          assert p["status"]=="FROZEN_RESPONSE_BLIND_STUDY_B_QUALIFICATION_ARTIFACT"
          assert p["artifact_name"]=="relational-environment-qualification-v0.2"
          assert all(v is False for v in p["response_firewall"].values())
          state=p["program_state"]
          assert state in {"PASS_TO_CONFIRMATORY_CHARACTER_MASK_PREPARATION","NOT_EVALUABLE_B"}
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"run_id={int(p['workflow_run_id'])}\n")
              f.write(f"program_state={state}\n")
              f.write(f"pass_to_mask={'true' if state=='PASS_TO_CONFIRMATORY_CHARACTER_MASK_PREPARATION' else 'false'}\n")
          PY

  postqualification:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .

      - name: Download exact frozen qualification artifact
        uses: actions/download-artifact@v4
        with:
          name: relational-environment-qualification-v0.2
          path: input/qualification
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify qualification binding hashes
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for b in iter(lambda:f.read(1<<20),b""):h.update(b)
              return h.hexdigest()
          bind=json.loads(Path("benchmarks/frozen/relational_environment_qualification_artifact_binding_v0.1.json").read_text())
          mapping={
              "relational_environment_pregenetic_state_v0.3.json":"input/qualification/relational_environment_pregenetic_state_v0.3.json",
              "relational_environment_geometry_reconstruction_v0.2.json":"input/qualification/relational_environment_geometry_reconstruction_v0.2.json",
              "relational_environment_opportunity_design_v0.2.json":"input/qualification/relational_environment_opportunity_design_v0.2.json",
              "relational_environment_opportunity_design_v0.2.npz":"input/qualification/relational_environment_opportunity_design_v0.2.npz",
          }
          q="input/qualification/relational_environment_qualification_result_v0.2.json"
          if Path(q).is_file():
              mapping["relational_environment_qualification_result_v0.2.json"]=q
          for name,path in mapping.items():
              assert bind["files_sha256"][name]==sha(path),(name,bind["files_sha256"][name],sha(path))
          PY

      - name: Freeze direct NOT_EVALUABLE transition candidate
        if: needs.resolve.outputs.pass_to_mask != 'true'
        run: |
          mkdir -p results/final
          python - <<'PY'
          import json
          p={
            "schema":"ttf_relational_environment_program_transition_v0.3",
            "B_state":"NOT_EVALUABLE_B",
            "C_open_authorized":True,
            "C_entry_state":"PROCEED_TO_C_AFTER_B_NOT_EVALUABLE",
            "source_stage":"development_qualification_or_opportunity_gate",
            "Study_B_empirical_response_opened":False,
          }
          open("results/final/relational_environment_program_transition_v0.3.json","w").write(json.dumps(p,indent=2,sort_keys=True)+"\n")
          PY

      - name: Restore exact frozen phylogatR archive
        if: needs.resolve.outputs.pass_to_mask == 'true'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/phylogatr.zip
          key: phylogatr-5a0fd9ac25893c749d14186fbcce4a46b99163c9d810b36e40eebce7bece61a5

      - name: Extract exact source archive
        if: needs.resolve.outputs.pass_to_mask == 'true'
        id: source
        run: |
          set -euo pipefail
          test -f /tmp/phylogatr.zip
          test "$(stat -c%s /tmp/phylogatr.zip)" = "274988692"
          echo "5a0fd9ac25893c749d14186fbcce4a46b99163c9d810b36e40eebce7bece61a5  /tmp/phylogatr.zip" | sha256sum -c -
          rm -rf /tmp/phylogatr-root
          mkdir -p /tmp/phylogatr-root
          unzip -q /tmp/phylogatr.zip -d /tmp/phylogatr-root
          ROOT="$(dirname "$(find /tmp/phylogatr-root -type f -name genes.txt -print -quit)")"
          test -f "$ROOT/genes.txt"
          test -f "$ROOT/cite.txt"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Open confirmatory canonical-valid masks only
        if: needs.resolve.outputs.pass_to_mask == 'true'
        run: |
          mkdir -p results/final
          python scripts/freeze_relational_environment_character_mask.py \
            --root "${{ steps.source.outputs.root }}" \
            --opportunity-design input/qualification/relational_environment_opportunity_design_v0.2.npz \
            --opportunity-summary input/qualification/relational_environment_opportunity_design_v0.2.json \
            --development-qualification input/qualification/relational_environment_qualification_result_v0.2.json \
            --candidates benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv \
            --mask-rule docs/supporting/relational_environment_character_mask_rule_v0.1.json \
            --output-mask-result results/final/relational_environment_character_mask_result_v0.1.json \
            --output-survivor-design results/final/relational_environment_survivor_design_v0.1.npz \
            --output-survivor-summary results/final/relational_environment_survivor_summary_v0.1.json

      - name: Requalify exact confirmatory survivor geometry
        if: needs.resolve.outputs.pass_to_mask == 'true'
        id: survivor
        run: |
          python scripts/run_relational_environment_qualification.py \
            --opportunity-design results/final/relational_environment_survivor_design_v0.1.npz \
            --opportunity-summary results/final/relational_environment_survivor_summary_v0.1.json \
            --rule docs/supporting/relational_environment_qualification_rule_v0.2.json \
            --output results/final/relational_environment_survivor_qualification_v0.1.json
          python - <<'PY'
          import json,os
          p=json.load(open("results/final/relational_environment_survivor_qualification_v0.1.json"))
          passed=p["status"]=="PASS_TO_EMPIRICAL_IDENTITY_OPENING_PREPARATION" and p["gates"]["overall_pass"] is True
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"passed={'true' if passed else 'false'}\n")
          PY

      - name: Freeze mask/survivor NOT_EVALUABLE transition
        if: needs.resolve.outputs.pass_to_mask == 'true' && steps.survivor.outputs.passed != 'true'
        run: |
          python - <<'PY'
          import json
          p={
            "schema":"ttf_relational_environment_program_transition_v0.3",
            "B_state":"NOT_EVALUABLE_B",
            "C_open_authorized":True,
            "C_entry_state":"PROCEED_TO_C_AFTER_B_NOT_EVALUABLE",
            "source_stage":"confirmatory_character_mask_or_survivor_requalification",
            "Study_B_empirical_response_opened":False,
          }
          open("results/final/relational_environment_program_transition_v0.3.json","w").write(json.dumps(p,indent=2,sort_keys=True)+"\n")
          PY

      - name: Freeze one-shot identity-opening authorization
        if: steps.survivor.outputs.passed == 'true'
        run: |
          python scripts/freeze_relational_environment_empirical_authorization.py \
            --root "${{ steps.source.outputs.root }}" \
            --source-archive-sha256 5a0fd9ac25893c749d14186fbcce4a46b99163c9d810b36e40eebce7bece61a5 \
            --survivor-design results/final/relational_environment_survivor_design_v0.1.npz \
            --survivor-summary results/final/relational_environment_survivor_summary_v0.1.json \
            --mask-result results/final/relational_environment_character_mask_result_v0.1.json \
            --survivor-qualification results/final/relational_environment_survivor_qualification_v0.1.json \
            --candidates benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv \
            --opening-rule docs/supporting/relational_environment_empirical_opening_rule_v0.1.json \
            --output results/final/relational_environment_identity_opening_authorization_v0.1.json

      - name: Execute authorized one-shot Study-B empirical test
        if: steps.survivor.outputs.passed == 'true'
        run: |
          python scripts/run_relational_environment_empirical.py \
            --root "${{ steps.source.outputs.root }}" \
            --source-archive-sha256 5a0fd9ac25893c749d14186fbcce4a46b99163c9d810b36e40eebce7bece61a5 \
            --survivor-design results/final/relational_environment_survivor_design_v0.1.npz \
            --survivor-summary results/final/relational_environment_survivor_summary_v0.1.json \
            --mask-result results/final/relational_environment_character_mask_result_v0.1.json \
            --survivor-qualification results/final/relational_environment_survivor_qualification_v0.1.json \
            --candidates benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv \
            --opening-rule docs/supporting/relational_environment_empirical_opening_rule_v0.1.json \
            --authorization results/final/relational_environment_identity_opening_authorization_v0.1.json \
            --output results/final/relational_environment_empirical_result_v0.1.json

      - name: Resolve empirical program transition
        if: steps.survivor.outputs.passed == 'true'
        run: |
          python - <<'PY'
          import json
          r=json.load(open("results/final/relational_environment_empirical_result_v0.1.json"))
          d=r["decision"]
          if d=="STUDY_B_ENVIRONMENT_RELATIONAL_POSITIVE":
              state="DETECTED_B"; copen=False; entry=None
          elif d=="STUDY_B_ENVIRONMENT_RELATIONAL_NULL_WITH_QUALIFIED_POWER":
              state=d; copen=True; entry="PROCEED_TO_C_AFTER_B_NULL"
          else:
              raise SystemExit(f"unexpected Study-B empirical decision: {d}")
          p={
            "schema":"ttf_relational_environment_program_transition_v0.3",
            "B_state":state,
            "C_open_authorized":copen,
            "source_stage":"one_shot_empirical",
            "Study_B_empirical_response_opened":True,
          }
          if entry is not None:p["C_entry_state"]=entry
          open("results/final/relational_environment_program_transition_v0.3.json","w").write(json.dumps(p,indent=2,sort_keys=True)+"\n")
          print(p)
          PY

      - name: Validate frozen B-to-C transition state
        if: always()
        run: |
          test -f results/final/relational_environment_program_transition_v0.3.json
          python - <<'PY'
          import json
          from pathlib import Path
          rule=json.loads(Path("docs/supporting/relational_program_transition_rule_v0.1.json").read_text())
          p=json.loads(Path("results/final/relational_environment_program_transition_v0.3.json").read_text())
          assert p["schema"]==rule["receipt_schema"]
          state=p["B_state"]
          contract=rule["allowed_B_states"][state]
          assert p["C_open_authorized"] is contract["C_open_authorized"]
          if contract["C_open_authorized"]:
              assert p["C_entry_state"]==contract["C_entry_state"]
          else:
              assert "C_entry_state" not in p
          print({"B_state":state,"C_open_authorized":p["C_open_authorized"]})
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relational-environment-postqualification-v0.1
          path: results/final/
          retention-days: 30
          if-no-files-found: error
