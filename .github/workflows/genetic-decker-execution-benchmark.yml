name: genetic Decker execution benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - "method/genetic-ibd-crossfit"
    paths:
      - ".github/workflows/genetic-decker-execution-benchmark.yml"
      - "docs/supporting/genetic_decker_execution_benchmark_authorization_v0.1.json"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TTF branch
        uses: actions/checkout@v4

      - name: Checkout frozen Decker source
        uses: actions/checkout@v4
        with:
          repository: skdecker/PhylogeographicBreaks
          ref: 11534ba70fbe3705e667651030edef5b849fa949
          path: external/decker
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .

      - name: Reconstruct frozen response-blind geometry
        run: |
          python scripts/census_decker_genetic_geometry.py \
            --root external/decker \
            --output results/decker_genetic_geometry_census_v0.1.json \
            --min-localities 12 \
            --min-endpoint-training-edges 5 \
            --neighbor-fraction 0.15
          python scripts/freeze_decker_genetic_pilot_geometry.py \
            --root external/decker \
            --census results/decker_genetic_geometry_census_v0.1.json \
            --rule docs/supporting/genetic_decker_pilot_rule_v0.1.json \
            --output-csv results/decker_genetic_pilot_geometry_v0.1.csv \
            --output-manifest results/decker_genetic_pilot_geometry_v0.1.json

      - name: Run exactly three authorized synthetic worlds
        run: >-
          python scripts/benchmark_genetic_decker_pipeline.py
          --geometry results/decker_genetic_pilot_geometry_v0.1.csv
          --manifest results/decker_genetic_pilot_geometry_v0.1.json
          --source-ledger benchmarks/frozen/genetic_decker_pilot_geometry_source_v0.1.json
          --rule docs/supporting/genetic_decker_pilot_rule_v0.1.json
          --authorization docs/supporting/genetic_decker_execution_benchmark_authorization_v0.1.json
          --output results/decker_genetic_execution_benchmark_v0.1.json

      - name: Enforce benchmark claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('results/decker_genetic_execution_benchmark_v0.1.json').read_text())
          assert p['status'] == 'synthetic_execution_benchmark_only_not_qualification'
          assert p['species_count'] == 221
          assert p['train_species'] == 111 and p['eval_species'] == 110
          assert p['empirical_genetic_outcomes_opened'] is False
          assert p['qualification_claim_made'] is False
          assert len(p['cases']) == 3
          assert all(row['finite_eval_species_scores'] == 110 for row in p['cases'])
          PY

      - name: Upload benchmark receipt
        uses: actions/upload-artifact@v4
        with:
          name: decker-genetic-execution-benchmark-v0.1
          path: results/decker_genetic_execution_benchmark_v0.1.json
          if-no-files-found: error
