name: TTF 348-species same-insect-niche reference split null v04
on:
  push:
    branches: [exploratory/lgm-host-vs-same-niche-null-v04]
    paths:
      - .github/workflows/lgm-same-niche-null-v04.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ttf-lgm-348-same-niche-null-v04
  cancel-in-progress: false
jobs:
  sampling-null-no-genotypes:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test frozen 518-taxon host source and equal-count climate estimator
        run: |
          set -euo pipefail
          python -m pip install -e '.[test]' 'rasterio>=1.4,<2' 'scipy>=1.13,<2' 'requests>=2.31,<3'
          python -m pytest -q tests/test_same_niche_null_v04.py tests/test_matched_climate_yearstrat_v03.py tests/test_matched_lgm_climate_exploratory.py
          echo 'cffb1144a61151c9da78737b1c7a84034398fb50d03ea5ecb46642b317d93634  benchmarks/exploratory/lgm_host_reference_yearstrat_v02/summary.json' | sha256sum -c -
          echo 'a28fba9efa8a9dc79c162336f62c883059c5dddbfabec2861f554d038dd98044  benchmarks/exploratory/lgm_external_reference_v01/host_reference_request_manifest.csv' | sha256sum -c -
          python - <<'PY'
          import json
          q=json.load(open('docs/supporting/lgm_yearstrat_398_matched_climate_v03.json'))
          assert q['status']=='EXPLORATORY_SPECIFICATION_BEFORE_NEW_398_SPECIES_CHELSA_VALUES'
          assert q['eligibility']['both_paired_ge30']==398
          assert q['eligibility']['paired_all_known_host_ids_positive_observations']==381
          assert q['climate']['matched_draws_per_species']==32
          w=json.load(open('docs/supporting/lgm_same_niche_reference_null_v04.json'))
          assert w['status']=='EXPLORATORY_RESPONSE_FREE_NULL_DESIGN_FROZEN_BEFORE_V04_CLIMATE'
          assert w['eligibility']['qualifying_before_climate']==348
          assert w['null_design']['draws']==32
          print('PASS_FROZEN_348_SPLIT_NULL_RESPONSE_FIREWALL')
          PY
      - name: Unpack original response-free genetic sampling geometry only
        run: |
          set -euo pipefail
          mkdir -p input/v03/geography
          echo '92e19da615ffc2003a90569afd4089eb24871f1fc0df69cc3aface4263b96dc4  provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz' | sha256sum -c -
          tar -xJf provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz -C input/v03/geography
          echo '037cd8fa1f059fb67c349a465540d3d5fac469b5d14a2a4d2658d74c036c0ae9  input/v03/geography/historical_host_memory_localities_v0.1.csv' | sha256sum -c -
          echo 'ab10a876895cf00817e8ce555665ebb78a0f2ac64323d2e93c213e1857738ba9  input/v03/geography/historical_host_memory_edges_v0.1.csv' | sha256sum -c -
      - name: Restore exact 6343 global climate support and original eight CHELSA rasters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/v03/support input/v03/chelsa
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/11495066386/zip" > /tmp/support.zip
          unzip -q /tmp/support.zip -d input/v03/support
          echo 'd0fc12f635ec56a442dd37dec06cf3aa06684a00b14f1bb1f2db2f6fe3c4a21f  input/v03/support/wgsrpd3_support_points_v0.1.csv' | sha256sum -c -
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10791389409/zip" > /tmp/chelsa.zip
          echo '0a797c609d26a185ba08d209a71203a584fa60f1045c4a8c335934372cee30b2  /tmp/chelsa.zip' | sha256sum -c -
          unzip -q /tmp/chelsa.zip -d input/v03/chelsa
          rm /tmp/chelsa.zip
          echo '7d82833996006fc1e99b86acb4ea7e80cde29c7f500df739ef48cb9ce145d450  input/v03/chelsa/manifest.json' | sha256sum -c -
          for v in bio01 bio07 bio12 bio15; do
            for t in -190 20; do
              test -s "input/v03/chelsa/historical/CHELSA_TraCE21K_${v}_${t}_V1.0.tif"
            done
          done
          df -h .
      - name: Compute actual-host versus disjoint pseudo-host same-niche reference samples
        run: |
          set -euo pipefail
          python -u scripts/run_same_niche_null_v04.py \
            --host-manifest benchmarks/exploratory/lgm_external_reference_v01/host_reference_request_manifest.csv \
            --host-snapshot benchmarks/exploratory/lgm_host_reference_yearstrat_v02 \
            --insect-summary benchmarks/exploratory/lgm_external_reference_v01/all_641_species_external_reference.csv \
            --insect-points benchmarks/exploratory/lgm_external_reference_v01/external_insect_points_50km.csv.gz \
            --localities input/v03/geography/historical_host_memory_localities_v0.1.csv \
            --edges input/v03/geography/historical_host_memory_edges_v0.1.csv \
            --global-support input/v03/support/wgsrpd3_support_points_v0.1.csv \
            --asset-root input/v03/chelsa/historical \
            --out results/lgm_same_niche_null_v04
      - name: Validate all 348 split outcomes and preserve source receipt
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import json,csv,os,hashlib
          from pathlib import Path
          p=Path('results/lgm_same_niche_null_v04')
          q=json.loads((p/'summary.json').read_text())
          rows=list(csv.DictReader((p/'species_same_niche_null_v0.4.csv').open()))
          allrows=list(csv.DictReader((p/'all_641_split_eligibility_v0.4.csv').open()))
          assert q['status']=='EXPLORATORY_SAMPLING_NULL_NOT_HISTORICAL_PLANT_OCCUPANCY_OR_GENETIC_RESPONSE'
          assert (q['insect_panel'],q['split_eligible_species'])==(641,348)
          assert len(allrows)==641 and len(rows)==348
          assert q['split_draws_per_species']==32
          assert sum(q['status_counts'].values())==348
          assert 0<q['null_computable_species']<=347
          receipt={'schema':'ttf_lgm_split_sameniche_null_v0.4_receipt',
            'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],
            'outputs_sha256':{f.name:hashlib.sha256(f.read_bytes()).hexdigest()
                             for f in sorted(p.iterdir()) if f.is_file()},
            'genetic_response_used':False,'LGM_host_occupancy_claimed':False,
            'same_niche_sampling_null_only':True}
          (p/'execution_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(q,sort_keys=True))
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ttf-same-insect-niche-null-v04
          path: results/lgm_same_niche_null_v04/
          retention-days: 30
          if-no-files-found: warn
