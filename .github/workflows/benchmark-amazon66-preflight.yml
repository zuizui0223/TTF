name: benchmark-amazon66-preflight

on:
  push:
    branches:
      - "benchmark/independent-biogeography"
    paths:
      - "scripts/acquire_amazon66_preflight.py"
      - "scripts/acquire_amazon66_public_metadata.py"
      - ".github/workflows/benchmark-amazon66-preflight.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze Dryad version and file inventory
        run: >-
          python scripts/acquire_amazon66_preflight.py
          --output-dir benchmark_artifacts/amazon66_inventory
      - name: Acquire frozen public geometry metadata only
        run: >-
          python scripts/acquire_amazon66_public_metadata.py
          --output-dir benchmark_artifacts/amazon66_geometry_metadata
      - name: Print geometry metadata manifest
        run: cat benchmark_artifacts/amazon66_geometry_metadata/geometry_metadata_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: amazon66-metadata-preflight-v0.2
          path: benchmark_artifacts/
          if-no-files-found: error
          retention-days: 90
