name: conditional v03 screen snapshot

on:
  push:
    branches:
      - "ops/conditional-v03-screen-snapshot-20260919"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "4314f72d31213e7bad0511a071407134c000808c"
          fetch-depth: 1
      - name: Pack repository
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/TTF-main-4314f72d3121.tar.gz .
          sha256sum /tmp/TTF-main-4314f72d3121.tar.gz > /tmp/TTF-main-4314f72d3121.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TTF-main-4314f72d3121-snapshot
          path: |
            /tmp/TTF-main-4314f72d3121.tar.gz
            /tmp/TTF-main-4314f72d3121.tar.gz.sha256
          if-no-files-found: error
