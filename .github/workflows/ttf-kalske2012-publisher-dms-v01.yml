name: Kalske 2012 publisher DMS source-only quarantine
on:
  push:
    branches:
      - 'prospective/independent-transplant-overlap-20261115'
    paths:
      - '.github/workflows/ttf-kalske2012-publisher-dms-v01.yml'
      - 'research/prospective/kalske2012_publisher_dms_quarantine_v01.py'
      - 'research/prospective/test_kalske2012_publisher_dms_quarantine_v01.py'
  pull_request:
    paths:
      - '.github/workflows/ttf-kalske2012-publisher-dms-v01.yml'
      - 'research/prospective/kalske2012_publisher_dms_quarantine_v01.py'
      - 'research/prospective/test_kalske2012_publisher_dms_quarantine_v01.py'
jobs:
  dms-source-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test syntax quarantine
        run: python -m unittest discover -s research/prospective -p test_kalske2012_publisher_dms_quarantine_v01.py -v
      - name: Emit source-only evidence
        run: python research/prospective/kalske2012_publisher_dms_quarantine_v01.py --output _source_only/kalske2012_publisher_dms_v01.json
      - uses: actions/upload-artifact@v4
        with:
          name: ttf-kalske2012-publisher-dms-source-only
          path: _source_only/kalske2012_publisher_dms_v01.json
          retention-days: 30
