name: ttfm-q5-1-coupling-geometry

on:
  push:
    branches:
      - "method/ttfm-q5-1-coupling-geometry-control"
    paths:
      - "docs/supporting/ttfm_q5_1_coupling_geometry_authorization.json"

permissions:
  contents: write

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - name: Require exact Q5.1 authorization
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          auth=json.loads(Path('docs/supporting/ttfm_q5_1_coupling_geometry_authorization.json').read_text())
          rule=json.loads(Path('docs/supporting/ttfm_q5_1_coupling_geometry_rule.json').read_text())
          q5=json.loads(Path('results/ttfm_q5_geometry_stress_v0.1.json').read_text())
          diag=json.loads(Path('results/ttfm_q5_factor_diagnostic_v0.1.json').read_text())
          assert auth['schema']=='ttfm_q5_1_coupling_geometry_authorization_v0.1'
          assert auth['status']=='authorize_exactly_one_formal_q5_1_run'
          assert rule['status']=='frozen_before_q5_1_outcomes'
          assert q5['joint_Q5_pass'] is False and q5['TTF_M_Q5_pass'] is True and q5['TTF_C_Q5_pass'] is False
          assert diag['status']=='development_factor_isolation_complete'
          assert diag['candidate_selected'] is None
          assert rule['prerequisites']['factor_diagnostic_candidate_selected_must_be_null'] is True
          assert rule['candidate']['evaluation_side_geometry_residualization'] is False
          assert rule['candidate']['heldout_outcomes_used_to_choose_correction'] is False
          assert rule['claim_firewall']['q5_remains_immutable_fail'] is True
          assert not Path('results/ttfm_q5_1_coupling_geometry_v0.1.json').exists()
          expected={
            'rule_blob_sha':'docs/supporting/ttfm_q5_1_coupling_geometry_rule.json',
            'candidate_blob_sha':'src/ttf/q51_inference.py',
            'geometry_control_blob_sha':'src/ttf/geometry_control.py',
            'simulator_blob_sha':'src/ttf/heterogeneous_simulate.py',
            'runner_blob_sha':'scripts/run_ttfm_q5_1_batch.py',
            'aggregator_blob_sha':'scripts/aggregate_ttfm_q5_1.py',
            'workflow_blob_sha':'.github/workflows/ttfm-q5-1-coupling-geometry.yml',
            'q5_result_blob_sha':'results/ttfm_q5_geometry_stress_v0.1.json',
            'factor_diagnostic_blob_sha':'results/ttfm_q5_factor_diagnostic_v0.1.json',
          }
          for key,path in expected.items():
            actual=subprocess.check_output(['git','rev-parse',f'HEAD:{path}'], text=True).strip()
            assert actual==auth[key], (key, actual, auth[key])
          assert auth['replicates_per_cell']==500
          assert auth['bootstrap_resamples']==1999
          assert auth['formal_outcomes_previously_opened'] is False
          assert auth['empirical_data_authorized'] is False
          print({'authorization':'exact','q5_immutable_fail':True,'empirical_data':False})
          PY

  batches:
    needs: invariants
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        cell:
          - Q51_NULL_COMPONENT
          - Q51_NULL_PRIVATE_M
          - Q51_NULL_PRIVATE_C
          - Q51_POWER_M
          - Q51_POWER_C
          - Q51_SHIFT_M
          - Q51_SHIFT_C
        start: [0,25,50,75,100,125,150,175,200,225,250,275,300,325,350,375,400,425,450,475]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Run frozen Q5.1 batch
        run: >-
          python scripts/run_ttfm_q5_1_batch.py
          --rule docs/supporting/ttfm_q5_1_coupling_geometry_rule.json
          --cell-id "${{ matrix.cell }}"
          --start ${{ matrix.start }}
          --count 25
          --output "batch/${{ matrix.cell }}_${{ matrix.start }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ttfm-q5-1-${{ matrix.cell }}-${{ matrix.start }}
          path: batch/*.json
          if-no-files-found: error

  aggregate:
    needs: batches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - uses: actions/download-artifact@v4
        with:
          pattern: ttfm-q5-1-*
          path: downloaded
          merge-multiple: true
      - name: Aggregate Q5.1 qualification
        run: >-
          python scripts/aggregate_ttfm_q5_1.py
          --rule docs/supporting/ttfm_q5_1_coupling_geometry_rule.json
          --batch-dir downloaded
          --output results/ttfm_q5_1_coupling_geometry_v0.1.json
      - uses: actions/upload-artifact@v4
        with:
          name: ttfm-q5-1-coupling-geometry-v0.1
          path: results/ttfm_q5_1_coupling_geometry_v0.1.json
          if-no-files-found: error
      - name: Commit immutable Q5.1 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ttfm_q5_1_coupling_geometry_v0.1.json
          git commit -m "Freeze TTF-M Q5.1 coupling geometry result v0.1"
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
