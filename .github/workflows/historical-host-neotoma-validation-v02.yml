name: historical host Neotoma fossil coverage v0.2

on:
  push:
    branches:
      - prospective/historical-host-connectivity-v0-1
    paths:
      - ".github/workflows/historical-host-neotoma-validation-v02.yml"

permissions:
  contents: read
  actions: read

jobs:
  response-blind-fossil-census:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download exact frozen HOSTS/WCVP sidecar
        uses: actions/download-artifact@v4
        with:
          name: wcvp-v13-hosts-sidecar
          path: _host_sidecar
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35548477097
      - name: Verify exact response-blind input bytes
        run: |
          set -euo pipefail
          echo "c731906315f7452f83ce302c1d36c75ad94afc24ce7e24d461360312244ac558  _host_sidecar/native_extant_nondoubtful_wgsrpd3.csv" | sha256sum -c -
          echo "a402483497bc7bdf9b7427bfc859ce9dcc9183eebf5964d4591f352847130484  benchmarks/frozen/genetic_historical_host_connectivity_panel_v0.2.csv" | sha256sum -c -
      - name: Export exact accepted WCVP host names
        run: |
          python scripts/export_historical_host_names_from_sidecar.py \
            --panel benchmarks/frozen/genetic_historical_host_connectivity_panel_v0.2.csv \
            --native-sidecar _host_sidecar/native_extant_nondoubtful_wgsrpd3.csv \
            --output results/wcvp/accepted_host_names.csv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . requests
      - name: Query dated Neotoma pollen and plant macrofossil occurrences
        run: |
          python scripts/census_historical_host_neotoma.py \
            --panel benchmarks/frozen/genetic_historical_host_connectivity_panel_v0.2.csv \
            --rule docs/supporting/genetic_historical_host_neotoma_validation_rule_v0.2.json \
            --identity-correction benchmarks/frozen/genetic_historical_host_panel_identity_binding_v0.2.json \
            --wcvp-names results/wcvp/accepted_host_names.csv \
            --output-dir results/historical_host_neotoma_v02 \
            --workers 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-host-neotoma-validation-v0.2
          path: results/historical_host_neotoma_v02/
          retention-days: 30
          if-no-files-found: warn
