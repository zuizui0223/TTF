name: codistributed recurrence frozen result audit

on:
  push:
    branches:
      - prospective/codistributed-recurrence-insecta-v0-1
    paths:
      - "benchmarks/frozen/genetic_codistributed_recurrence_empirical_result_v0.1.json"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Audit one-shot result against frozen interpretation
        run: |
          mkdir -p results/post-result-audit
          python scripts/audit_codistributed_recurrence_empirical_result.py \
            --result benchmarks/frozen/genetic_codistributed_recurrence_empirical_result_v0.1.json \
            --authorization benchmarks/frozen/genetic_codistributed_recurrence_identity_opening_authorization_v0.1.json \
            --interpretation docs/supporting/genetic_codistributed_recurrence_interpretation_v0.1.json \
            --output results/post-result-audit/codistributed_recurrence_post_result_audit_v0.1.json
      - uses: actions/upload-artifact@v4
        with:
          name: codistributed-recurrence-post-result-audit-v0.1
          path: results/post-result-audit/codistributed_recurrence_post_result_audit_v0.1.json
          if-no-files-found: error
          retention-days: 30
