name: Historical host-memory survivor synthetic preflight (no mask opened)

on:
  push:
    branches:
      - prospective/historical-host-memory-v0-1
    paths:
      - ".github/workflows/historical-host-memory-survivor-preflight-v01.yml"
      - "scripts/qualify_historical_host_memory_survivor_synthetic.py"
      - "tests/test_historical_host_memory_survivor_synthetic.py"
      - "scripts/verify_and_extract_historical_host_mask_source.py"
      - "tests/test_historical_host_memory_archive_intake.py"
      - ".github/workflows/historical-host-memory-manual-mask-intake-v01.yml"
      - "docs/supporting/historical_host_memory_survivor_synthetic_contract_v0.1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-survivor-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test survivor-only synthetic world and no-retune boundaries
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]" "scipy>=1.13,<2"
          python -m pytest -q \
            tests/test_historical_host_memory_synthetic.py \
            tests/test_historical_host_memory_survivor_synthetic.py \
            tests/test_historical_host_memory_survivor_information.py \
            tests/test_historical_host_memory_character_masks.py \
            tests/test_historical_host_memory_archive_intake.py
      - name: Confirm this is not an empirical genetic opening
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          world=json.loads(Path("docs/supporting/historical_host_memory_survivor_synthetic_contract_v0.1.json").read_text())
          mask=json.loads(Path("docs/supporting/historical_host_memory_character_mask_rule_v0.1.json").read_text())
          assert world["status"]=="FROZEN_BEFORE_ANY_REAL_CONFIRMATORY_MASK_RESULT"
          assert world["randomization"]["independent_seed_namespace"]=="historical-host-memory-survivor-v0.1"
          assert mask["post_mask"]["do_not_reuse_pre_mask_power_as_survivor_power"] is True
          assert world["decision"]["no_authorization_to_read_nucleotide_identity_from_this_result_alone"] is True
          assert mask["firewall"]["confirmatory_nucleotide_identity_opened"] is False
          print("PASS_INDEPENDENT_SURVIVOR_SYNTHETIC_PREFLIGHT_ONLY")
          PY
