name: Senecio P1 one-shot exploratory genotype locality holdout

on:
  push:
    branches:
      - research/senecio-p1-genomic-ecotype-holdout-20261115

jobs:
  source-pinned-exploratory-opening:
    if: github.event.head_commit.message == 'Open Senecio P1 genotype outcome once'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconfirm synthetic train-only and AUC implementation
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_senecio_p1_genomic_holdout.py
      - name: Execute registered source-pinned exploratory genomic score exactly once
        run: |
          python research/prospective/senecio_p1_genomic_holdout_20261115.py --output /tmp/senecio_p1_genomic_heldout_aggregate.json
          cat /tmp/senecio_p1_genomic_heldout_aggregate.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: senecio-p1-one-shot-genomic-aggregate-only
          path: /tmp/senecio_p1_genomic_heldout_aggregate.json
          retention-days: 30
