name: relational-environment-final-producer-trigger

on:
  workflow_run:
    workflows:
      - "relational-environment-final-recovery-audit-v03"
    types:
      - completed
    branches:
      - relational-ttf-v01

permissions:
  contents: write
  actions: read

jobs:
  freeze-trigger:
    if: github.event.workflow_run.id == 35828444286 && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relational-ttf-v01

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download exact zero-error final-round audit
        uses: actions/download-artifact@v4
        with:
          name: relational-environment-request-error-recovery-audit-v0.3
          path: input/audit
          run-id: 35828444286
          github-token: ${{ github.token }}

      - name: Verify exact audit and resolve artifact identity
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          audit=json.loads(
              Path("input/audit/relational_environment_request_error_recovery_audit_v0.3.json").read_text()
          )
          assert audit["schema"]=="ttf_relational_environment_request_error_recovery_audit_v0.3"
          assert audit["status"]=="PASS_FINAL_ROUND_ZERO_REQUEST_ERROR",audit
          assert int(audit["retry_round"])==4
          assert int(audit["recovery_workflow_run_id"])==35827478403
          assert int(audit["audit_workflow_run_id"])==35828444286
          assert int(audit["species"])==556
          assert int(audit["request_error_count_after_final_round"])==0
          assert audit["unresolved_request_error_species"]==[]
          assert audit["network_retrieval_performed"] is False
          assert audit["no_fifth_round_authorized"] is True
          assert audit["relation_result_seen"] is False
          assert audit["genetic_response_used"] is False
          assert not any(bool(v) for v in audit["response_firewall"].values())

          url=f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/35828444286/artifacts?per_page=100"
          req=urllib.request.Request(url,headers={
              "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
          })
          with urllib.request.urlopen(req,timeout=60) as response:
              payload=json.load(response)
          matches=[
              a for a in payload.get("artifacts",[])
              if a.get("name")=="relational-environment-request-error-recovery-audit-v0.3"
              and not a.get("expired")
          ]
          assert len(matches)==1,matches
          artifact=matches[0]
          digest=str(artifact.get("digest",""))
          assert digest.startswith("sha256:") and len(digest)==71,digest

          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"artifact_id={int(artifact['id'])}\n")
              f.write(f"artifact_digest={digest}\n")
          print({
              "artifact_id":artifact["id"],
              "digest":digest,
              "status":audit["status"],
          })
          PY

      - name: Freeze unique final producer trigger
        run: |
          python scripts/freeze_relational_environment_final_producer_trigger.py \
            --audit input/audit/relational_environment_request_error_recovery_audit_v0.3.json \
            --promotion-rule docs/supporting/relational_environment_final_producer_promotion_rule_v0.2.json \
            --producer-contract benchmarks/frozen/relational_environment_final_producer_contract_v0.2.json \
            --producer-receipt benchmarks/frozen/relational_environment_relation_producer_v0.1.json \
            --audit-artifact-id "${{ steps.audit.outputs.artifact_id }}" \
            --audit-artifact-digest "${{ steps.audit.outputs.artifact_digest }}" \
            --frozen-on 2026-09-23 \
            --output benchmarks/frozen/relational_environment_final_producer_trigger_v0.2.json

      - name: Commit final producer trigger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/frozen/relational_environment_final_producer_trigger_v0.2.json
          git commit -m "Freeze final Study B producer trigger"
          git fetch origin relational-ttf-v01
          git rebase origin/relational-ttf-v01
          git push origin HEAD:relational-ttf-v01
