name: ttf-mammal-break-shared-page-metadata
on:
  push:
    branches: [research/break-location-na-mammals-v01]
    paths:
      - '.github/workflows/ttf-mammal-break-shared-page.yml'
      - 'research/break-location-na-mammals/probe_shared_page_metadata.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ttf-mammal-break-shared-page.yml'
      - 'research/break-location-na-mammals/probe_shared_page_metadata.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  page-ids-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identify article/file handles from three public share pages only
        run: |
          python research/break-location-na-mammals/probe_shared_page_metadata.py \
            --output results/ttf-mammal-breaks/share_page_structure.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ttf-mammal-break-share-page-structure
          path: results/ttf-mammal-breaks/share_page_structure.json
          retention-days: 30
          if-no-files-found: error
