name: codistributed recurrence formal sharded qualification

on:
  push:
    branches:
      - prospective/codistributed-recurrence-insecta-v0-1
    paths:
      - ".github/workflows/codistributed-recurrence-formal-sharded.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DESIGN: benchmarks/frozen/genetic_codistributed_recurrence_response_blind_design_v0.1.json
  RULE: docs/supporting/genetic_codistributed_recurrence_geometry_null_rule_v0.3.json
  SHARDING: docs/supporting/genetic_codistributed_recurrence_formal_sharding_v0.1.json
  SCREEN: benchmarks/frozen/genetic_codistributed_recurrence_fixed_tst_screen_result_v0.3.json
  CANDIDATES: benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv

jobs:
  center:
    name: formal center
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .

      - name: Restore exact response-blind development geometry
        run: |
          mkdir -p results/formal-center
          base64 -d transport/codistributed_recurrence_development_localities_v0.1.xz.b64 \
            | xz -d > results/formal-center/development_localities.csv
          echo "e17f4dfdf5f184443e087f5ddcd829aa1c3c03cacfbfac123502d05911f56a3a  results/formal-center/development_localities.csv" | sha256sum -c -
          python - <<'PY'
          import csv, hashlib
          from pathlib import Path
          import numpy as np
          from ttf.core import knn_edges

          loc=Path("results/formal-center/development_localities.csv")
          cand=Path("benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv")
          out=Path("results/formal-center/development_edges.csv")
          with cand.open(newline="",encoding="utf-8") as f:
              meta={r["species"]:r for r in csv.DictReader(f)}
          order=[]; loc_by={}; role={}; panel={}
          with loc.open(newline="",encoding="utf-8") as f:
              for r in csv.DictReader(f):
                  n=r["species"]
                  if n not in loc_by:
                      order.append(n); loc_by[n]=[]
                  loc_by[n].append(r); role[n]=r["role"]; panel[n]=r["panel"]
          with out.open("w",newline="",encoding="utf-8") as f:
              fields=["species","edge_index","node_left","node_right","mid_x_km","mid_y_km","mid_z_km","panel","role"]
              w=csv.DictWriter(f,fieldnames=fields,lineterminator="\n")
              w.writeheader()
              for n in order:
                  rows=sorted(loc_by[n],key=lambda r:int(r["locality_index"]))
                  xyz=np.asarray([[float(r["x_km"]),float(r["y_km"]),float(r["z_km"])] for r in rows],dtype=float)
                  nodes=knn_edges(xyz,k=int(meta[n]["graph_k"]))
                  mids=0.5*(xyz[nodes[:,0]]+xyz[nodes[:,1]])
                  for i,((a,b),m) in enumerate(zip(nodes,mids)):
                      w.writerow({
                          "species":n,"edge_index":i,"node_left":int(a),"node_right":int(b),
                          "mid_x_km":float(m[0]),"mid_y_km":float(m[1]),"mid_z_km":float(m[2]),
                          "panel":panel[n],"role":role[n],
                      })
          h=hashlib.sha256(out.read_bytes()).hexdigest()
          assert h=="613aca949cf0b2e3fd233c0e7bb54e34ec8e627aeeb4ff54b1fb84e90bb9da6b",h
          print({"edge_sha256":h,"bytes":out.stat().st_size})
          PY

      - name: Compute frozen formal geometry-null center
        run: |
          python scripts/run_codistributed_recurrence_fixed_tst_formal_shard.py \
            --component center \
            --localities results/formal-center/development_localities.csv \
            --edges results/formal-center/development_edges.csv \
            --candidates "$CANDIDATES" \
            --design "$DESIGN" \
            --rule "$RULE" \
            --sharding "$SHARDING" \
            --screen-result "$SCREEN" \
            --output-npz results/formal-center/formal_center_v0.1.npz \
            --output-json results/formal-center/formal_center_v0.1.json

      - uses: actions/upload-artifact@v4
        with:
          name: codistributed-formal-center-v0.1
          path: |
            results/formal-center/development_localities.csv
            results/formal-center/development_edges.csv
            results/formal-center/formal_center_v0.1.npz
            results/formal-center/formal_center_v0.1.json
          retention-days: 30
          if-no-files-found: error

  reference:
    name: formal reference ${{ matrix.label }}
    needs: center
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { label: r000_200, start: 0, stop: 200 }
          - { label: r200_400, start: 200, stop: 400 }
          - { label: r400_600, start: 400, stop: 600 }
          - { label: r600_800, start: 600, stop: 800 }
          - { label: r800_999, start: 800, stop: 999 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: codistributed-formal-center-v0.1
          path: results/formal-center
      - name: Run frozen reference shard
        run: |
          mkdir -p results/formal-reference
          python scripts/run_codistributed_recurrence_fixed_tst_formal_shard.py \
            --component reference \
            --start ${{ matrix.start }} --stop ${{ matrix.stop }} \
            --localities results/formal-center/development_localities.csv \
            --edges results/formal-center/development_edges.csv \
            --candidates "$CANDIDATES" \
            --design "$DESIGN" \
            --rule "$RULE" \
            --sharding "$SHARDING" \
            --screen-result "$SCREEN" \
            --center-npz results/formal-center/formal_center_v0.1.npz \
            --output-npz results/formal-reference/reference_${{ matrix.label }}.npz
      - uses: actions/upload-artifact@v4
        with:
          name: codistributed-formal-reference-${{ matrix.label }}
          path: results/formal-reference/reference_${{ matrix.label }}.npz
          retention-days: 30
          if-no-files-found: error

  evaluation:
    name: formal evaluation ${{ matrix.label }}
    needs: center
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { label: r000_200, start: 0, stop: 200 }
          - { label: r200_400, start: 200, stop: 400 }
          - { label: r400_500, start: 400, stop: 500 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: codistributed-formal-center-v0.1
          path: results/formal-center
      - name: Run frozen private-evaluation shard
        run: |
          mkdir -p results/formal-evaluation
          python scripts/run_codistributed_recurrence_fixed_tst_formal_shard.py \
            --component evaluation \
            --start ${{ matrix.start }} --stop ${{ matrix.stop }} \
            --localities results/formal-center/development_localities.csv \
            --edges results/formal-center/development_edges.csv \
            --candidates "$CANDIDATES" \
            --design "$DESIGN" \
            --rule "$RULE" \
            --sharding "$SHARDING" \
            --screen-result "$SCREEN" \
            --center-npz results/formal-center/formal_center_v0.1.npz \
            --output-npz results/formal-evaluation/evaluation_${{ matrix.label }}.npz
      - uses: actions/upload-artifact@v4
        with:
          name: codistributed-formal-evaluation-${{ matrix.label }}
          path: results/formal-evaluation/evaluation_${{ matrix.label }}.npz
          retention-days: 30
          if-no-files-found: error

  positive:
    name: formal positive ${{ matrix.label }}
    needs: center
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { label: r000_200, start: 0, stop: 200 }
          - { label: r200_400, start: 200, stop: 400 }
          - { label: r400_500, start: 400, stop: 500 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: codistributed-formal-center-v0.1
          path: results/formal-center
      - name: Run frozen shared-positive shard
        run: |
          mkdir -p results/formal-positive
          python scripts/run_codistributed_recurrence_fixed_tst_formal_shard.py \
            --component positive \
            --start ${{ matrix.start }} --stop ${{ matrix.stop }} \
            --localities results/formal-center/development_localities.csv \
            --edges results/formal-center/development_edges.csv \
            --candidates "$CANDIDATES" \
            --design "$DESIGN" \
            --rule "$RULE" \
            --sharding "$SHARDING" \
            --screen-result "$SCREEN" \
            --center-npz results/formal-center/formal_center_v0.1.npz \
            --output-npz results/formal-positive/positive_${{ matrix.label }}.npz
      - uses: actions/upload-artifact@v4
        with:
          name: codistributed-formal-positive-${{ matrix.label }}
          path: results/formal-positive/positive_${{ matrix.label }}.npz
          retention-days: 30
          if-no-files-found: error

  aggregate:
    name: aggregate formal qualification
    needs: [center, reference, evaluation, positive]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: codistributed-formal-center-v0.1
          path: results/formal-center
      - uses: actions/download-artifact@v4
        with:
          pattern: codistributed-formal-reference-*
          path: results/formal-aggregate/reference
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: codistributed-formal-evaluation-*
          path: results/formal-aggregate/evaluation
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: codistributed-formal-positive-*
          path: results/formal-aggregate/positive
          merge-multiple: true
      - name: Aggregate frozen formal gate
        run: |
          mkdir -p results/formal-aggregate/final
          python scripts/run_codistributed_recurrence_fixed_tst_formal_shard.py \
            --component aggregate \
            --design "$DESIGN" \
            --rule "$RULE" \
            --sharding "$SHARDING" \
            --screen-result "$SCREEN" \
            --center-npz results/formal-center/formal_center_v0.1.npz \
            --reference-dir results/formal-aggregate/reference \
            --evaluation-dir results/formal-aggregate/evaluation \
            --positive-dir results/formal-aggregate/positive \
            --output results/formal-aggregate/final/fixed_tst_qualification_v0.3.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("results/formal-aggregate/final/fixed_tst_qualification_v0.3.json").read_text())
          assert p["schema"]=="ttf_genetic_codistributed_recurrence_fixed_tst_qualification_v0.3"
          assert p["status"] in {
              "PASS_TO_CONFIRMATORY_CHARACTER_MASK_PREPARATION",
              "NOT_EVALUABLE_CODISTRIBUTED_RECURRENCE_FIXED_TST",
          }
          assert all(v is False for v in p["response_firewall"].values())
          print(json.dumps({"status":p["status"],"gate":p["gate"],"private":p["private_evaluation"],"positive":p["positive_evaluation"]},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: codistributed-formal-qualification-v0.3
          path: results/formal-aggregate/final/fixed_tst_qualification_v0.3.json
          retention-days: 30
          if-no-files-found: error
