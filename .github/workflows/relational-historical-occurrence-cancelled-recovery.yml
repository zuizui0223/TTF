name: relational-historical-occurrence-cancelled-recovery

on:
  push:
    branches:
      - relational-ttf-v01
    paths:
      - "benchmarks/frozen/relational_historical_occurrence_cancelled_shard_recovery_v0.1.json"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Verify frozen recovery contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("benchmarks/frozen/relational_historical_occurrence_cancelled_shard_recovery_v0.1.json").read_text())
          assert p["schema"]=="ttf_relational_historical_occurrence_cancelled_shard_recovery_v0.1"
          assert p["status"]=="FROZEN_TECHNICAL_RECOVERY_ONLY"
          assert p["source_workflow_run_id"]==35881616617
          assert p["cancelled_shards"]==[0,1,2,3]
          assert p["recovery_shards"]==[0,1,2,3]
          assert p["shards_total"]==20
          assert p["max_parallel"]==1
          assert p["scientific_query_change"] is False
          assert p["candidate_change"] is False
          assert p["rule_change"] is False
          assert all(v is False for v in p["response_firewall"].values())
          PY
      - name: Acquire exact frozen Study-C shard
        run: |
          mkdir -p results/history-occ
          python scripts/acquire_relational_historical_occurrences.py \
            --candidates benchmarks/frozen/relational_historical_candidates_v0.1.csv \
            --output-csv results/history-occ/occurrences-${{ matrix.shard }}.csv \
            --output-ledger results/history-occ/ledger-${{ matrix.shard }}.json \
            --shard-index ${{ matrix.shard }} \
            --shards 20
      - name: Verify response firewall
        run: |
          python - <<'PY'
          import glob,json
          paths=glob.glob("results/history-occ/ledger-*.json")
          assert len(paths)==1
          p=json.load(open(paths[0]))
          assert p["schema"]=="ttf_relational_historical_occurrence_shard_v0.1"
          assert p["candidate_species_total"]==1000
          assert all(v is False for v in p["response_firewall"].values())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: relational-historical-occ-recovery-${{ matrix.shard }}
          path: results/history-occ/
          retention-days: 30
          if-no-files-found: error
