name: v03-freeze-rgfca-reserve-geometry

on:
  push:
    branches:
      - "analysis/gate-i-geometry-calibration"
    paths:
      - "scripts/freeze_rgfca_reserve_ttf_geometry.py"
      - ".github/workflows/v03-freeze-rgfca-reserve-geometry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Checkout exact pre-reserve-pixel FCP state
        run: |
          rm -rf /tmp/fcp
          git clone --filter=blob:none --no-checkout https://github.com/zuizui0223/fcp.git /tmp/fcp
          git -C /tmp/fcp fetch origin 9a3dbd1c433356c4235de87553f9cb9963c11943
          git -C /tmp/fcp checkout --detach 9a3dbd1c433356c4235de87553f9cb9963c11943
          git -C /tmp/fcp sparse-checkout init --no-cone
          cat >/tmp/fcp/.git/info/sparse-checkout <<'EOF'
          /data/frozen/global_monte_carlo_candidate_photos_v1.csv
          /data/frozen/rgfca_reserve_geometry_audit_v1.csv
          /docs/supporting/rgfca_reserve_metadata_audit_v1.json
          /docs/supporting/rgfca_reserve_replication_contract_v1.json
          EOF
          git -C /tmp/fcp read-tree -mu HEAD
      - name: Freeze outcome-unopened reserve geometry
        run: >-
          python scripts/freeze_rgfca_reserve_ttf_geometry.py
          --fcp-root /tmp/fcp
          --source-commit 9a3dbd1c433356c4235de87553f9cb9963c11943
          --species-count 250
          --records-per-species 20
          --seed 20260908
          --output benchmarks/frozen/v03_rgfca_reserve_geometry.csv
          --ledger benchmarks/frozen/v03_rgfca_reserve_geometry_source.json
      - name: Enforce intended-domain holdout firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('benchmarks/frozen/v03_rgfca_reserve_geometry_source.json')
          d = json.loads(p.read_text())
          assert d['validation_role'] == 'prospectively_frozen_fresh_intended_domain_geometry_for_v03'
          assert d['source_audit']['discovery_taxon_overlap'] == 0
          assert d['source_audit']['candidate_pixels_opened_by_audit'] is False
          assert d['source_audit']['colour_fields_parsed'] is False
          assert d['source_audit']['measurement_authorized'] is False
          assert d['empirical_trait_or_colour_fields_read'] is False
          assert d['synthetic_worlds_run_at_freeze'] == 0
          assert d['candidate_performance_evaluated_at_freeze'] is False
          assert d['output']['species'] == 250
          assert d['output']['records'] == 5000
          assert d['prospective_execution'] == {
              'k': 3,
              'bandwidth_km': 500.0,
              'eval_fraction': 0.5,
              'seed': 20260908,
              'train_species': 125,
              'eval_species': 125,
          }
          print({'reserve_geometry':'frozen','species':250,'records':5000})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v03-rgfca-reserve-geometry
          path: |
            benchmarks/frozen/v03_rgfca_reserve_geometry.csv
            benchmarks/frozen/v03_rgfca_reserve_geometry_source.json
          if-no-files-found: error
      - name: Commit untouched intended-domain geometry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/frozen/v03_rgfca_reserve_geometry.csv benchmarks/frozen/v03_rgfca_reserve_geometry_source.json
          git commit -m "Freeze untouched v0.3 RGFCA reserve geometry"
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
