name: v02 source snapshot

on:
  push:
    branches:
      - "ops/v02-source-snapshot"
    paths:
      - ".github/workflows/v02-source-snapshot.yml"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ttf-v02-source
          path: |
            pyproject.toml
            src/
            scripts/
            docs/supporting/genetic_conditional_order_contrast_qualification_rule_v0.2.json
          if-no-files-found: error
          retention-days: 1
