name: palearctic-lgm-climate-ttfq

on:
  push:
    branches:
      - method/palearctic-lgm-response-blind-v0-1
    paths:
      - ".github/workflows/palearctic-lgm-climate-ttfq.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: palearctic-lgm-climate-ttfq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Stop superseded Lepidoptera-dominated v0.1 route
        run: |
          echo "SUPERSEDED_RESPONSE_BLIND_BEFORE_LGM_RELATION_OR_TTFQ_RESULT"
          echo "The 44-species v0.1 panel contained 26 Lepidoptera and is retired"
          echo "before any LGM relation, TTF-Q result, or subgroup genetic response."
          echo "Continue only through the non-Lepidoptera v0.2 route."
