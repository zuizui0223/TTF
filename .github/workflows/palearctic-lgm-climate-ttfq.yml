name: palearctic-lgm-climate-ttfq

on:
  push:
    branches:
      - method/palearctic-lgm-response-blind-v0-1
    paths:
      - ".github/workflows/palearctic-lgm-climate-ttfq.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: palearctic-lgm-climate-ttfq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  climate_ttfq:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install response-blind LGM runtime
        run: |
          python -m pip install -e .
          python -m pip install "rasterio>=1.4,<2" "shapely>=2"

      - name: Wait for exact frozen GBIF run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch 36509957093 --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Bind and download exact GBIF occurrence artifact
        id: occurrence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/occ results
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/36509957093/artifacts" > /tmp/gbif_artifacts.json
          python - <<'PY' > /tmp/gbif_artifact.env
          import json
          x=json.load(open("/tmp/gbif_artifacts.json"))
          hits=[a for a in x["artifacts"] if a["name"]=="palearctic-lgm-gbif-occurrences"]
          if len(hits)!=1:
              raise SystemExit(f"expected one occurrence artifact, got {len(hits)}")
          a=hits[0]
          print(f"ARTIFACT_ID={a['id']}")
          print(f"ARTIFACT_DIGEST={a.get('digest','')}")
          PY
          source /tmp/gbif_artifact.env
          export ARTIFACT_ID ARTIFACT_DIGEST
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/occ.zip
          unzip -q /tmp/occ.zip -d input/occ
          rm -f /tmp/occ.zip
          test -f input/occ/palearctic_lgm_occurrences_v0.1.csv
          test -f input/occ/palearctic_lgm_occurrences_v0.1.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path("input/occ/palearctic_lgm_occurrences_v0.1.json").read_text())
          passed=p["status"]=="PASS_TO_CURRENT_LGM_CLIMATE_EXTRACTION"
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"passed={'true' if passed else 'false'}\n")
          prov={
              "schema":"ttf_genetic_palearctic_lgm_occurrence_artifact_binding_v0.1",
              "status":p["status"],
              "source_workflow_run_id":36509957093,
              "artifact_id":int(os.environ["ARTIFACT_ID"]),
              "artifact_digest":os.environ.get("ARTIFACT_DIGEST",""),
              "response_firewall":p["response_firewall"],
          }
          Path("results/occurrence_artifact_binding.json").write_text(
              json.dumps(prov,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps({
              "status":p["status"],
              "admissible_species":p["admissible_species"],
              "source_clusters":p["source_clusters"],
              "target_clusters":p["target_clusters"],
          },sort_keys=True))
          PY

      - name: Download exact frozen Palearctic realm union
        if: steps.occurrence.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/realm
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/36509957093/artifacts" > /tmp/gbif_artifacts.json
          ID="$(python - <<'PY'
          import json
          x=json.load(open("/tmp/gbif_artifacts.json"))
          hits=[a for a in x["artifacts"] if a["name"]=="palearctic-realm-union"]
          if len(hits)!=1: raise SystemExit(1)
          print(hits[0]["id"])
          PY
          )"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > /tmp/realm.zip
          unzip -q /tmp/realm.zip -d input/realm
          rm -f /tmp/realm.zip
          test -f input/realm/palearctic_union.geojson

      - name: Download exact staged historical CHELSA artifact
        if: steps.occurrence.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/chelsa-historical
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10791389409/zip" > /tmp/historical.zip
          echo "0a797c609d26a185ba08d209a71203a584fa60f1045c4a8c335934372cee30b2  /tmp/historical.zip" | sha256sum -c -
          unzip -q /tmp/historical.zip -d input/chelsa-historical
          rm -f /tmp/historical.zip
          test -f input/chelsa-historical/historical/CHELSA_TraCE21K_bio01_-190_V1.0.tif
          test -f input/chelsa-historical/historical/CHELSA_TraCE21K_bio01_20_V1.0.tif
          df -h .

      - name: Download exact staged current CHELSA artifact
        if: steps.occurrence.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/chelsa-current
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10791867875/zip" > /tmp/current.zip
          echo "724743d8666d32bc8717e52200a798369665c2f1965ba33021d3e5c68c5eff4c  /tmp/current.zip" | sha256sum -c -
          unzip -q /tmp/current.zip -d input/chelsa-current
          rm -f /tmp/current.zip
          test -f input/chelsa-current/current/CHELSA_bio1_1981-2010_V.2.1.tif
          df -h .

      - name: Build frozen Palearctic current/LGM climate inputs
        if: steps.occurrence.outputs.passed == 'true'
        id: climate
        run: |
          python scripts/prepare_palearctic_lgm_climate_inputs.py \
            --occurrences input/occ/palearctic_lgm_occurrences_v0.1.csv \
            --panel-metadata benchmarks/frozen/genetic_palearctic_lgm_panel_metadata_v0.1.json \
            --realm-geojson input/realm/palearctic_union.geojson \
            --climate-rule docs/supporting/genetic_palearctic_lgm_climate_input_rule_v0.2.json \
            --current-bio1 input/chelsa-current/current/CHELSA_bio1_1981-2010_V.2.1.tif \
            --current-bio7 input/chelsa-current/current/CHELSA_bio7_1981-2010_V.2.1.tif \
            --current-bio12 input/chelsa-current/current/CHELSA_bio12_1981-2010_V.2.1.tif \
            --current-bio15 input/chelsa-current/current/CHELSA_bio15_1981-2010_V.2.1.tif \
            --lgm-bio1 input/chelsa-historical/historical/CHELSA_TraCE21K_bio01_-190_V1.0.tif \
            --lgm-bio7 input/chelsa-historical/historical/CHELSA_TraCE21K_bio07_-190_V1.0.tif \
            --lgm-bio12 input/chelsa-historical/historical/CHELSA_TraCE21K_bio12_-190_V1.0.tif \
            --lgm-bio15 input/chelsa-historical/historical/CHELSA_TraCE21K_bio15_-190_V1.0.tif \
            --trace0-bio1 input/chelsa-historical/historical/CHELSA_TraCE21K_bio01_20_V1.0.tif \
            --trace0-bio7 input/chelsa-historical/historical/CHELSA_TraCE21K_bio07_20_V1.0.tif \
            --trace0-bio12 input/chelsa-historical/historical/CHELSA_TraCE21K_bio12_20_V1.0.tif \
            --trace0-bio15 input/chelsa-historical/historical/CHELSA_TraCE21K_bio15_20_V1.0.tif \
            --output-occurrence-climate results/palearctic_lgm_occurrence_climate_v0.1.csv \
            --output-grid results/palearctic_lgm_climate_grid_v0.1.npz \
            --output-summary results/palearctic_lgm_climate_inputs_v0.1.json
          python - <<'PY'
          import json,os
          p=json.load(open("results/palearctic_lgm_climate_inputs_v0.1.json"))
          passed=p["status"]=="PASS_TO_RESPONSE_BLIND_LGM_RELATION_BUILD"
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"passed={'true' if passed else 'false'}\n")
          print(json.dumps(p,sort_keys=True))
          PY

      - name: Build response-blind LGM/current dyadic relation
        if: steps.climate.outputs.passed == 'true'
        id: relation
        run: |
          python scripts/build_palearctic_lgm_relation.py \
            --panel-metadata benchmarks/frozen/genetic_palearctic_lgm_panel_metadata_v0.1.json \
            --occurrence-climate-csv results/palearctic_lgm_occurrence_climate_v0.1.csv \
            --grid-npz results/palearctic_lgm_climate_grid_v0.1.npz \
            --rule docs/supporting/genetic_palearctic_lgm_subpanel_rule_v0.1.json \
            --external-rule docs/supporting/genetic_palearctic_lgm_external_data_rule_v0.1.json \
            --climate-rule docs/supporting/genetic_palearctic_lgm_climate_input_rule_v0.2.json \
            --output-npz results/palearctic_lgm_relation_v0.1.npz \
            --output-summary results/palearctic_lgm_relation_v0.1.json \
            --chunk-size 4096
          python - <<'PY'
          import json,os
          p=json.load(open("results/palearctic_lgm_relation_v0.1.json"))
          passed=p["status"]=="PASS_TO_TTF_Q_RESPONSE_BLIND_CHARACTERIZATION"
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"passed={'true' if passed else 'false'}\n")
          print(json.dumps(p,sort_keys=True))
          PY

      - name: Run frozen TTF-Q evaluable-envelope gate
        if: steps.relation.outputs.passed == 'true'
        run: |
          python scripts/run_palearctic_lgm_ttf_q.py \
            --design-npz results/palearctic_lgm_relation_v0.1.npz \
            --design-summary results/palearctic_lgm_relation_v0.1.json \
            --execution docs/supporting/genetic_palearctic_lgm_ttf_q_execution_v0.1.json \
            --parent-rule docs/supporting/genetic_palearctic_lgm_subpanel_rule_v0.1.json \
            --output results/palearctic_lgm_ttf_q_v0.1.json
          cat results/palearctic_lgm_ttf_q_v0.1.json

      - name: Freeze no-genetic-response state
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=Path("results/palearctic_lgm_ttf_q_v0.1.json")
          if result.exists():
              q=json.loads(result.read_text())
              status=q["status"]
              gates=q["opening_gates"]
          else:
              status="INCOMPLETE_BEFORE_TTF_Q_RESULT"
              gates=None
          payload={
              "schema":"ttf_genetic_palearctic_lgm_pregenetic_state_v0.1",
              "status":status,
              "opening_gates":gates,
              "pairwise_subpanel_T_st_computed":False,
              "beta_LGM_computed":False,
              "species_level_genetic_scores_used":False,
          }
          Path("results/palearctic_lgm_pregenetic_state_v0.1.json").write_text(
              json.dumps(payload,indent=2,sort_keys=True)+"\n"
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palearctic-lgm-climate-ttfq
          path: results/
          retention-days: 30
          if-no-files-found: warn
