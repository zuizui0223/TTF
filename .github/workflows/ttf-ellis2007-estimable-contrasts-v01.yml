name: Ellis 2007 source-only estimable quartz contrasts
on:
  push:
    branches:
      - 'prospective/independent-transplant-overlap-20261115'
    paths:
      - '.github/workflows/ttf-ellis2007-estimable-contrasts-v01.yml'
      - 'research/prospective/ellis2007_estimable_contrasts_v01.py'
      - 'research/prospective/test_ellis2007_estimable_contrasts_v01.py'
      - 'research/prospective/source_registry/ellis2007_estimable_contrasts_v01.json'
  pull_request:
    paths:
      - '.github/workflows/ttf-ellis2007-estimable-contrasts-v01.yml'
      - 'research/prospective/ellis2007_estimable_contrasts_v01.py'
      - 'research/prospective/test_ellis2007_estimable_contrasts_v01.py'
      - 'research/prospective/source_registry/ellis2007_estimable_contrasts_v01.json'
jobs:
  exact-nullspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Seven exact-rational source-only tests
        run: python -m unittest discover -s research/prospective -p test_ellis2007_estimable_contrasts_v01.py -v
      - name: Compare exact frozen result
        run: |
          python research/prospective/ellis2007_estimable_contrasts_v01.py --output _source_only/ellis2007_estimable_contrasts_v01.json
          cmp research/prospective/source_registry/ellis2007_estimable_contrasts_v01.json _source_only/ellis2007_estimable_contrasts_v01.json
