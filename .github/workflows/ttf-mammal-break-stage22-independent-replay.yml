name: ttf-Jensen80-Stage22-independent-source-replay
on:
  push:
    branches: [research/break-location-na-mammals-v01]
    paths:
      - '.github/workflows/ttf-mammal-break-stage22-independent-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ttf-stage22-independent-replay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-frozen-jittered-feature-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      GDAL_CACHEMAX: '256'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install source-frozen numerical GIS readers
        run: python -m pip install 'numpy==2.5.4' 'scipy==1.18.1' 'shapely==2.2.0' 'rasterio==1.5.2' 'pyproj==3.8.0' 'pyshp==2.4.2'
      - name: Verify synthetic-only source-jitter tests
        run: python -m unittest discover -s research/break-location-na-mammals/tests -p 'test_stage22_jittered_predictor_support.py' -v
      - name: Fetch original frozen 80-species panel and Stage20 aggregate only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/stage20 results/stage22
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12889949378/zip" > /tmp/jensen80-source.zip
          echo 'd2cd60f8a99fccbd53de1bda978e533a77ed3012e058408e181f09ba72c32698  /tmp/jensen80-source.zip' | sha256sum -c -
          unzip -q /tmp/jensen80-source.zip -d inputs
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12894059862/zip" > /tmp/jensen80-stage20-report.zip
          echo '36c6c1f4d74a3743f3eaea928c5b4ae3c106d62eab575d77f62654e6a7a51845  /tmp/jensen80-stage20-report.zip' | sha256sum -c -
          unzip -q /tmp/jensen80-stage20-report.zip -d inputs/stage20
      - name: Independently regenerate all 13 original predictors at frozen moved cases (no genetic effect fit)
        run: |
          python research/break-location-na-mammals/stage22_jittered_predictor_support.py \
            --panel inputs/frozen_species_join.json \
            --climate-assets research/break-location-na-mammals/stage20_chelsa8_assets.json \
            --work /tmp/jensen80-stage22-restricted-replay \
            --stage20-report inputs/stage20/feature_support.json \
            --output results/stage22/jittered_predictor_support.json
      - name: Exact equality against FIRST successful Ubuntu24 Stage22 sample
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('results/stage22/jittered_predictor_support.json').read_text())
          expected={
              'status':'PASS_JITTERED_INPUT_SUPPORT_NOT_EMPIRICAL_EFFECT',
              'frozen_original_coordinate_sha256':'fad49f6ec345ef45c1387ef76c8b3b724caf5f39322f8e9c3da56227a7a40bfd',
              'frozen_case_label_sha256':'e08632a14a990804a7a1c83e236b70834056ac61b7157b9832b8f91c0df855d5',
              'moved_coordinate_sha256':'efd256c588c072d35d323006d13e27939aacd354e517d7330579006ef4415045',
              'moved_feature_matrix_sha256':'2621d503b8f6df7a2f9ca85fdf651bb20fa8a72354c8049b25d04d9ba8b916aa',
              'eligible_species':80,
              'eligible_species_roles':[44,36],
              'all_eight_climates_complete':76700,
              'all_thirteen_features_complete':76700,
              'restricted_geometries_or_coordinates_exported':False,
              'real_break_AUC_opened':False,
          }
          for k,v in expected.items():
              if x.get(k)!=v: raise SystemExit(f'STOP original/replay mismatch: {k} {x.get(k)!r} != {v!r}')
          print('STAGE22_INDEPENDENT_BYTE_EXACT_REPLAY_PASS', x['moved_feature_matrix_sha256'])
          PY
      - name: Publish aggregate-only source receipt, never pointwise IUCN or UNEP data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ttf-Jensen80-Stage22-independent-replay-aggregate-only
          path: results/stage22/jittered_predictor_support.json
          retention-days: 30
          if-no-files-found: error
