name: palearctic-lgm-gbif-shard4-technical-failover

on:
  push:
    branches:
      - method/palearctic-lgm-response-blind-v0-1
    paths:
      - ".github/workflows/palearctic-lgm-gbif-shard4-technical-failover.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: palearctic-lgm-gbif-shard4-technical-failover-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen failover contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("benchmarks/frozen/genetic_palearctic_lgm_v03_shard4_technical_failover_v0.1.json").read_text())
          assert p["status"]=="FROZEN_BEFORE_FAILOVER_SHARD4_RESULT"
          assert p["authoritative_parent_run_id"]==36529160168
          assert p["shard_index"]==4 and p["shards"]==6
          assert p["species"]==[
              "Bombus lapidarius",
              "Hylaeus communis",
              "Philonthus cognatus",
              "Xantholinus linearis",
          ]
          assert p["priority_rule"]["choosing_between_two_successful_results_by_ecological_content"] is False
          assert all(v is False for v in p["response_firewall"].values())
          print("failover contract verified")
          PY

      - name: Install exact acquisition runtime
        run: |
          python -m pip install -e .
          python -m pip install shapely

      - name: Download exact parent-run Palearctic realm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p realm
          gh run download 36529160168             --repo "$GITHUB_REPOSITORY"             --name palearctic-realm-union-v02             --dir realm
          test -f realm/palearctic_union.geojson

      - name: Reacquire only frozen shard 4
        run: |
          set -euo pipefail
          mkdir -p results
          python scripts/acquire_palearctic_lgm_occurrences_v02.py             --census benchmarks/frozen/genetic_palearctic_lgm_nonlepidoptera_census_v0.2.json             --realm-geojson realm/palearctic_union.geojson             --output-csv results/occurrences_4.csv             --output-ledger results/ledger_4.json             --shard-index 4             --shards 6
          python - <<'PY'
          import json
          p=json.load(open("results/ledger_4.json"))
          assert p["schema"]=="ttf_genetic_palearctic_lgm_occurrence_shard_v0.2"
          assert p["shard_index"]==4 and p["shards"]==6
          assert p["species_requested"]==4
          assert all(v is False for v in p["response_firewall"].values())
          assert [x["species"] for x in p["species"]]==[
              "Bombus lapidarius",
              "Hylaeus communis",
              "Philonthus cognatus",
              "Xantholinus linearis",
          ]
          print({
              "request_errors":sum(x["status"]=="REQUEST_ERROR" for x in p["species"]),
              "statuses":{x["species"]:x["status"] for x in p["species"]},
          })
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: palearctic-lgm-v02-gbif-shard-4-technical-failover
          path: |
            results/occurrences_4.csv
            results/ledger_4.json
          retention-days: 30
          if-no-files-found: error
