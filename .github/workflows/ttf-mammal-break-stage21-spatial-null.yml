name: ttf-Jensen80-Stage21-spatial-null-and-power-PRE-RESPONSE
on:
  push:
    branches: [research/break-location-na-mammals-v01]
    paths:
      - '.github/workflows/ttf-mammal-break-stage21-spatial-null.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: ttf-stage21-pre-response-one-calibration
  cancel-in-progress: false
jobs:
  exact-site-synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GDAL_CACHEMAX: '256'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction, numerical estimation and test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'shapely>=2.0,<3' 'rasterio>=1.4,<2' 'pyproj>=3.6,<4' 'pyshp>=2.3,<3' 'scikit-learn>=1.6,<2'
      - name: Unit-test geometry and synthetic case/out-of-species AUC BEFORE using original sites
        run: python -m unittest discover -s research/break-location-na-mammals/tests -v
      - name: Verify and retrieve frozen Latin species panel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs results/stage21
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12889949378/zip" > /tmp/jensen-frozen-species.zip
          echo 'd2cd60f8a99fccbd53de1bda978e533a77ed3012e058408e181f09ba72c32698  /tmp/jensen-frozen-species.zip' | sha256sum -c -
          unzip -q /tmp/jensen-frozen-species.zip -d inputs
      - name: Independently regenerate original 80-species predictors in ephemeral runner
        run: |
          python research/break-location-na-mammals/extract_frozen_site_features.py \
            --panel inputs/frozen_species_join.json \
            --climate-assets research/break-location-na-mammals/stage20_chelsa8_assets.json \
            --work /tmp/ttf-stage21-private \
            --output results/stage21/input_reproduction_receipt.json
      - name: Run 200 null plus 200 positive spatially correlated synthetic worlds
        run: |
          python research/break-location-na-mammals/calibrate_spatial_null.py \
            --private /tmp/ttf-stage21-private/ephemeral_site_features.npz \
            --stage20-receipt results/stage21/input_reproduction_receipt.json \
            --panel inputs/frozen_species_join.json \
            --contract research/break-location-na-mammals/stage21_spatial_null_contract_v01.json \
            --output results/stage21/exact_design_spatial_calibration.json
      - name: Publish aggregate simulation and input receipts only (NO coordinates/feature matrix)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttf-Jensen80-Stage21-spatial-null-aggregate
          path: |
            results/stage21/input_reproduction_receipt.json
            results/stage21/exact_design_spatial_calibration.json
          retention-days: 30
          if-no-files-found: error
