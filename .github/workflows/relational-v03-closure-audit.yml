permissions:
  contents: read

concurrency:
  group: relational-v03-closure-audit
  cancel-in-progress: true

jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify complete finite v0.3 contract
        run: |
          python scripts/verify_relational_program_v03_closure.py --output /tmp/relational_program_v03_closure.json
          cat /tmp/relational_program_v03_closure.json
      - name: Run focused Study-B closure tests
        run: |
          pytest -q tests/test_relational_program_v03_closure.py tests/test_relational_environment_artifact_binding.py tests/test_relational_environment_final_producer_trigger.py tests/test_relational_environment_compact_geometry.py tests/test_relational_historical_full_pipeline.py tests/test_relational_historical_bounded_transport.py
