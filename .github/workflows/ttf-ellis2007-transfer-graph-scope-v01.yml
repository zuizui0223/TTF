name: Ellis 2007 source-only transplant comparison graph
on:
  push:
    branches:
      - 'prospective/independent-transplant-overlap-20261115'
    paths:
      - '.github/workflows/ttf-ellis2007-transfer-graph-scope-v01.yml'
      - 'research/prospective/ellis2007_transfer_graph_scope_v01.py'
      - 'research/prospective/test_ellis2007_transfer_graph_scope_v01.py'
      - 'research/prospective/source_registry/ellis2007_transfer_graph_scope_v01.json'
      - 'research/prospective/source_registry/ellis2007_24_to_18_origin_garden_arm_audit_v02.json'
  pull_request:
    paths:
      - '.github/workflows/ttf-ellis2007-transfer-graph-scope-v01.yml'
      - 'research/prospective/ellis2007_transfer_graph_scope_v01.py'
      - 'research/prospective/test_ellis2007_transfer_graph_scope_v01.py'
      - 'research/prospective/source_registry/ellis2007_transfer_graph_scope_v01.json'
      - 'research/prospective/source_registry/ellis2007_24_to_18_origin_garden_arm_audit_v02.json'
jobs:
  topology-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run seven source-only fail-closed tests without network
        run: python -m unittest discover -s research/prospective -p test_ellis2007_transfer_graph_scope_v01.py -v
      - name: Verify frozen graph result is exactly reproducible
        run: |
          python research/prospective/ellis2007_transfer_graph_scope_v01.py --output _source_only/ellis2007_transfer_graph_scope_v01.json
          cmp research/prospective/source_registry/ellis2007_transfer_graph_scope_v01.json _source_only/ellis2007_transfer_graph_scope_v01.json
