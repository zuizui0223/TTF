name: TTF exploratory 26-of-665 host climate rarefaction result QA (no genomes)
on:
  push:
    branches:
      - exploratory/host-cloud-size-rarefaction-v0-1
    paths:
      - '.github/workflows/host-cloud-size-rarefaction-receipt-v01.yml'
      - 'tests/test_hhm_host_cloud_reference_receipt.py'
      - 'benchmarks/exploratory/historical_host_lcp_reference_size_26of665_result_v0.1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-result-and-quantiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source-scope and 50-draw arithmetic regression tests
        run: |
          set -euo pipefail
          python -m pip install -e '.[test]' 'rasterio>=1.4,<2' 'scipy>=1.13,<2'
          python -m pytest -q \
            tests/test_hhm_host_cloud_reference_receipt.py \
            tests/test_hhm_cloud_rarefaction.py \
            tests/test_host_corridor_counterexample.py
      - name: Confirm exact original genetic terminal result and no invented p-values
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('benchmarks/exploratory/historical_host_lcp_reference_size_26of665_result_v0.1.json').read_text())
          prior=json.loads(Path('benchmarks/frozen/historical_host_memory_259_one_shot_empirical_result_v0.1.json').read_text())
          assert q['status']=='EXPLORATORY_HOST_REFERENCE_SIZE_SENSITIVITY_ONLY'
          assert prior['status']=='NOT_EVALUABLE_EMPIRICAL_RESPONSE'
          assert prior['monte_carlo_p'] is None
          assert q['rarefaction']['new_p_values']==0
          assert len(q['rarefaction']['host_delta_mean_by_draw'])==50
          print('PASS_HOST_REFERENCE_SIZE_50_DRAW_RECEIPT_ONLY_NO_GENETIC_EFFECT')
          PY
