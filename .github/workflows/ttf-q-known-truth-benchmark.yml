name: ttf-q-known-truth-benchmark

on:
  push:
    branches:
      - method/ttf-q-known-truth-benchmark
    paths:
      - "src/ttf/relational_benchmark.py"
      - "scripts/run_ttf_q_known_truth_benchmark.py"
      - "docs/supporting/ttf_q_known_truth_benchmark_v0.1.json"
      - "tests/test_relational_benchmark.py"
      - ".github/workflows/ttf-q-known-truth-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TTF-Q
        run: python -m pip install -e ".[test]"
      - name: Verify exact identities
        run: pytest -q tests/test_relational_benchmark.py
      - name: Run pre-result-frozen known-truth grid
        run: |
          python scripts/run_ttf_q_known_truth_benchmark.py \
            --contract docs/supporting/ttf_q_known_truth_benchmark_v0.1.json \
            --output results/ttf_q_known_truth_decomposition_v0.1.json
      - uses: actions/upload-artifact@v4
        with:
          name: ttf-q-known-truth-decomposition
          path: results/ttf_q_known_truth_decomposition_v0.1.json
          retention-days: 30
          if-no-files-found: error
