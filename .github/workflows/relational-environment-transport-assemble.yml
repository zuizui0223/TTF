name: relational-environment-transport-assemble

on:
  push:
    branches:
      - relational-ttf-v01
    paths:
      - "benchmarks/frozen/relational_environment_transport_assembly_trigger_v0.1.json"

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Resolve frozen transport components
        id: frozen
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path("benchmarks/frozen/relational_environment_transport_assembly_trigger_v0.1.json").read_text())
          assert p["schema"]=="ttf_relational_environment_transport_assembly_trigger_v0.1"
          assert p["status"]=="AUTHORIZE_ASSEMBLY_AFTER_FROZEN_TRANSPORT_COMPONENTS"
          assert p["relation_result_seen"] is False
          assert p["genetic_response_used"] is False
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"base_run_id={int(p['base_run_id'])}\n")
              f.write(f"repair_r1_run_id={int(p['repair_round_1_run_id'])}\n")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -e .
          python -m pip install "rasterio>=1.4,<2"

      - name: Download successful base transport artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: relational-env-fixed-v2-*
          path: input/base
          merge-multiple: true
          run-id: ${{ steps.frozen.outputs.base_run_id }}
          github-token: ${{ github.token }}

      - name: Download frozen timeout-repair round-1 artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: relational-env-timeout-repair-r1-*
          path: input/repair-r1
          merge-multiple: true
          run-id: ${{ steps.frozen.outputs.repair_r1_run_id }}
          github-token: ${{ github.token }}

      - name: Combine transport pieces without silent overlap
        run: |
          mkdir -p input/all results/environment rasters
          cp input/base/occurrences-*.csv input/all/ || true
          cp input/base/ledger-*.json input/all/ || true
          cp input/repair-r1/occurrences-*.csv input/all/ || true
          cp input/repair-r1/ledger-*.json input/all/ || true
          python scripts/complete_relational_environment_transport.py \
            --input-dir input/all \
            --max-rounds 3 \
            --output-csv results/environment/occurrences_v0.2.csv \
            --output-ledger results/environment/occurrence_ledger_v0.2.json \
            --output-retry-receipt results/environment/transport_retry_receipt_v0.1.json

      - name: Require exact zero-error 1000-species transport
        id: transport
        run: |
          python - <<'PY'
          import json,os
          p=json.load(open("results/environment/occurrence_ledger_v0.2.json"))
          assert p["species"]==1000
          request_errors=int(p["status_counts"].get("REQUEST_ERROR",0))
          complete=request_errors==0
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"complete={'true' if complete else 'false'}\n")
          if not complete:
              raise SystemExit(f"transport remains incomplete: REQUEST_ERROR={request_errors}")
          print({
              "status":p["status"],
              "species_passing_ge_30":p["species_passing_ge_30"],
              "status_counts":p["status_counts"],
          })
          PY

      - name: Download frozen CHELSA V2.1
        if: steps.transport.outputs.complete == 'true'
        run: |
          set -euo pipefail
          base="https://os.zhdk.cloud.switch.ch/chelsav2/GLOBAL/climatologies/1981-2010/bio"
          for v in 1 7 12 15; do
            curl -L --fail --retry 4 --retry-delay 5 \
              "$base/CHELSA_bio${v}_1981-2010_V.2.1.tif" \
              -o "rasters/CHELSA_bio${v}_1981-2010_V.2.1.tif"
          done

      - name: Build frozen response-blind Study-B relation
        if: steps.transport.outputs.complete == 'true'
        run: |
          python scripts/build_relational_environment_relation.py \
            --occurrences results/environment/occurrences_v0.2.csv \
            --candidates benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv \
            --rule docs/supporting/relational_environment_relation_rule_v0.3.json \
            --freshness-rule docs/supporting/relational_future_family_freshness_amendment_v0.1.json \
            --raster rasters/CHELSA_bio1_1981-2010_V.2.1.tif \
            --raster rasters/CHELSA_bio7_1981-2010_V.2.1.tif \
            --raster rasters/CHELSA_bio12_1981-2010_V.2.1.tif \
            --raster rasters/CHELSA_bio15_1981-2010_V.2.1.tif \
            --output-npz results/environment/relational_environment_design_v0.3.npz \
            --output-summary results/environment/relational_environment_design_v0.3.json

      - name: Assert response firewall
        if: steps.transport.outputs.complete == 'true'
        run: |
          python - <<'PY'
          import json
          p=json.load(open("results/environment/relational_environment_design_v0.3.json"))
          assert p["status"] in {
              "PASS_RESPONSE_BLIND_ENVIRONMENT_RELATION_DESIGN",
              "NOT_EVALUABLE_ENVIRONMENT_FRESHNESS",
          }
          assert all(v is False for v in p["response_firewall"].values())
          print({
              "status":p["status"],
              "environment_admissible_before_freshness":p.get("environment_admissible_before_freshness"),
              "freshness_excluded_environment_admissible":p.get("freshness_excluded_environment_admissible"),
              "environment_admissible_species":p.get("environment_admissible_species"),
          })
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relational-environment-relation-v0.3
          path: |
            results/environment/occurrence_ledger_v0.2.json
            results/environment/transport_retry_receipt_v0.1.json
            results/environment/relational_environment_design_v0.3.npz
            results/environment/relational_environment_design_v0.3.json
          retention-days: 30
          if-no-files-found: warn
