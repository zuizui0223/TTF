name: relational-environment-transport-assemble

on:
  push:
    branches:
      - relational-ttf-v01
    paths:
      - "benchmarks/frozen/relational_environment_transport_assembly_trigger_v0.1.json"

permissions:
  contents: write
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Resolve frozen v0.7 transport components
        id: frozen
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          transport=json.loads(Path("benchmarks/frozen/relational_environment_transport_execution_v0.7.json").read_text())
          trigger=json.loads(Path("benchmarks/frozen/relational_environment_transport_assembly_trigger_v0.1.json").read_text())
          assert transport["schema"]=="ttf_relational_environment_transport_execution_v0.7"
          assert transport["status"]=="FROZEN_FINAL_AUTHORITATIVE_COMPOSITE_TRANSPORT_BEFORE_RELATION_RESULT"
          assert trigger["schema"]=="ttf_relational_environment_transport_assembly_trigger_v0.1"
          assert trigger["status"]=="AUTHORIZE_ASSEMBLY_AFTER_FROZEN_V07_COMPONENTS"
          assert trigger["relation_result_seen"] is False
          assert trigger["genetic_response_used"] is False
          assert int(trigger["base_run_id"])==int(transport["frozen_base_component"]["workflow_run_id"])
          assert int(trigger["cutover_run_id"])==int(transport["cutover_component"]["workflow_run_id"])
          assert int(trigger["short_repair_run_id"])==int(transport["short_timeout_repair_component"]["workflow_run_id"])
          assert int(trigger["long_repair_run_id"])==int(transport["long_timeout_repair_component"]["workflow_run_id"])
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"base_run_id={int(trigger['base_run_id'])}\n")
              f.write(f"cutover_run_id={int(trigger['cutover_run_id'])}\n")
              f.write(f"short_repair_run_id={int(trigger['short_repair_run_id'])}\n")
              f.write(f"long_repair_run_id={int(trigger['long_repair_run_id'])}\n")
          PY

      - name: Wait for frozen long-timeout repair component
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPAIR_RUN_ID: ${{ steps.frozen.outputs.long_repair_run_id }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          repo=os.environ["REPO"]; token=os.environ["GH_TOKEN"]; run_id=int(os.environ["REPAIR_RUN_ID"])
          headers={
              "Authorization":f"Bearer {token}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
          }
          deadline=time.time()+150*60
          while True:
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}",
                  headers=headers,
              )
              with urllib.request.urlopen(req,timeout=60) as response:
                  payload=json.load(response)
              status=payload["status"]; conclusion=payload.get("conclusion")
              print(json.dumps({"repair_run_id":run_id,"status":status,"conclusion":conclusion},sort_keys=True))
              if status=="completed":
                  if conclusion!="success":
                      raise SystemExit(f"frozen long-timeout repair run did not complete successfully: {conclusion}")
                  break
              if time.time()>=deadline:
                  raise SystemExit("timed out waiting for frozen long-timeout repair run")
              time.sleep(30)
          PY

      - name: Freeze relation producer before relation result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload={
              "schema":"ttf_relational_environment_relation_producer_v0.1",
              "status":"FROZEN_RELATION_PRODUCER_BEFORE_RESULT",
              "frozen_on":"2026-09-22",
              "transport_execution":"benchmarks/frozen/relational_environment_transport_execution_v0.7.json",
              "workflow_run_id":int("${{ github.run_id }}"),
              "workflow_head_sha":"${{ github.sha }}",
              "workflow_name":"relational-environment-transport-assemble",
              "relation_artifact_name":"relational-environment-relation-v0.3",
              "relation_result_seen":False,
              "genetic_response_used":False,
              "response_firewall":{
                  "Study_B_sequence_identity_opened":False,
                  "Study_B_pairwise_genetic_distances_opened":False,
                  "Study_B_T_st_computed":False,
                  "Study_B_beta_R_computed":False,
              },
          }
          out=Path("benchmarks/frozen/relational_environment_relation_producer_v0.1.json")
          out.write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")
          print(json.dumps(payload,sort_keys=True))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/frozen/relational_environment_relation_producer_v0.1.json
          git commit -m "Freeze Study B relation producer"
          git fetch origin relational-ttf-v01
          git rebase origin/relational-ttf-v01
          git push origin HEAD:relational-ttf-v01

      - name: Verify frozen corrected transport core
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/acquire_relational_environment_occurrences.py)" = "34eb5d5b459e105943cc5642cf355011d86c4f07"
          test "$(git rev-parse HEAD:src/ttf/relational_environment.py)" = "d05e35866de57daa8eccacdbf7a3c0eaff055890"
          test "$(git rev-parse HEAD:src/ttf/relational_external.py)" = "4a43bf5fedcc40c9a0fecf44dc3412e726b2ad4f"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -e .
          python -m pip install "rasterio>=1.4,<2"

      - name: Download exact frozen base-success artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_RUN_ID: ${{ steps.frozen.outputs.base_run_id }}
        run: |
          mkdir -p input/base
          python - <<'PY'
          import io,json,os,urllib.request,zipfile
          from pathlib import Path

          transport=json.loads(Path("benchmarks/frozen/relational_environment_transport_execution_v0.7.json").read_text())
          expected=[
              f"relational-env-fixed-v2-{int(x)}"
              for x in transport["frozen_base_component"]["accepted_success_shards_200way"]
          ]
          token=os.environ["GH_TOKEN"]; repo=os.environ["REPO"]; run_id=int(os.environ["BASE_RUN_ID"])
          artifacts=[]
          for page in (1,2,3):
              url=f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100&page={page}"
              req=urllib.request.Request(url,headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
              })
              with urllib.request.urlopen(req,timeout=60) as response:
                  payload=json.load(response)
              artifacts.extend(payload.get("artifacts",[]))
              if len(payload.get("artifacts",[]))<100:
                  break
          by_name={a["name"]:a for a in artifacts if not a.get("expired")}
          missing=[name for name in expected if name not in by_name]
          assert not missing, missing
          assert len(expected)==33
          out=Path("input/base")
          for name in expected:
              a=by_name[name]
              req=urllib.request.Request(a["archive_download_url"],headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
              })
              with urllib.request.urlopen(req,timeout=120) as response:
                  data=response.read()
              with zipfile.ZipFile(io.BytesIO(data)) as zf:
                  zf.extractall(out)
          print({"downloaded_base_artifacts":len(expected)})
          PY

      - name: Download exact frozen cutover artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: relational-env-cutover-*
          path: input/cutover
          merge-multiple: true
          run-id: ${{ steps.frozen.outputs.cutover_run_id }}
          github-token: ${{ github.token }}

      - name: Download exact accepted short-repair artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHORT_REPAIR_RUN_ID: ${{ steps.frozen.outputs.short_repair_run_id }}
        run: |
          mkdir -p input/repair-short
          python - <<'PY'
          import io,json,os,urllib.request,zipfile
          from pathlib import Path

          transport=json.loads(Path("benchmarks/frozen/relational_environment_transport_execution_v0.7.json").read_text())
          expected=[
              f"relational-env-cutover-repair-{int(x)}"
              for x in transport["short_timeout_repair_component"]["accepted_repair_indices"]
          ]
          token=os.environ["GH_TOKEN"]; repo=os.environ["REPO"]; run_id=int(os.environ["SHORT_REPAIR_RUN_ID"])
          artifacts=[]
          for page in (1,2):
              url=f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100&page={page}"
              req=urllib.request.Request(url,headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
              })
              with urllib.request.urlopen(req,timeout=60) as response:
                  payload=json.load(response)
              artifacts.extend(payload.get("artifacts",[]))
              if len(payload.get("artifacts",[]))<100:
                  break
          by_name={a["name"]:a for a in artifacts if not a.get("expired")}
          missing=[name for name in expected if name not in by_name]
          assert not missing, missing
          out=Path("input/repair-short")
          for name in expected:
              a=by_name[name]
              req=urllib.request.Request(a["archive_download_url"],headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
              })
              with urllib.request.urlopen(req,timeout=120) as response:
                  data=response.read()
              with zipfile.ZipFile(io.BytesIO(data)) as zf:
                  zf.extractall(out)
          print({"downloaded_short_repair_artifacts":len(expected)})
          PY

      - name: Download exact frozen long-repair artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: relational-env-cutover-repair-long-*
          path: input/repair-long
          merge-multiple: true
          run-id: ${{ steps.frozen.outputs.long_repair_run_id }}
          github-token: ${{ github.token }}

      - name: Assemble exact frozen 1000 species and complete HTTP retries
        run: |
          mkdir -p input/all results/environment rasters
          cp input/base/occurrences-*.csv input/all/
          cp input/base/ledger-*.json input/all/
          cp input/cutover/occurrences-cutover-*.csv input/all/
          cp input/cutover/ledger-cutover-*.json input/all/
          rm -f input/all/occurrences-cutover-167.csv input/all/ledger-cutover-167.json
          rm -f input/all/occurrences-cutover-170.csv input/all/ledger-cutover-170.json
          cp input/repair-short/occurrences-cutover-repair-*.csv input/all/
          cp input/repair-short/ledger-cutover-repair-*.json input/all/
          cp input/repair-long/occurrences-cutover-repair-long-*.csv input/all/
          cp input/repair-long/ledger-cutover-repair-long-*.json input/all/
          python scripts/complete_relational_environment_transport.py \
            --input-dir input/all \
            --max-rounds 3 \
            --output-csv results/environment/occurrences_v0.2.csv \
            --output-ledger results/environment/occurrence_ledger_v0.2.json \
            --output-retry-receipt results/environment/transport_retry_receipt_v0.1.json

      - name: Require exact zero-error transport
        id: transport
        run: |
          python - <<'PY'
          import json,os
          p=json.load(open("results/environment/occurrence_ledger_v0.2.json"))
          assert p["species"]==1000
          errors=int(p["status_counts"].get("REQUEST_ERROR",0))
          complete=errors==0
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"complete={'true' if complete else 'false'}\n")
          if not complete:
              raise SystemExit(f"unresolved technical transport: REQUEST_ERROR={errors}")
          print({
              "status":p["status"],
              "species_passing_ge_30":p["species_passing_ge_30"],
              "status_counts":p["status_counts"],
          })
          PY

      - name: Download frozen CHELSA V2.1
        if: steps.transport.outputs.complete == 'true'
        run: |
          set -euo pipefail
          base="https://os.zhdk.cloud.switch.ch/chelsav2/GLOBAL/climatologies/1981-2010/bio"
          for v in 1 7 12 15; do
            curl -L --fail --retry 4 --retry-delay 5 \
              "$base/CHELSA_bio${v}_1981-2010_V.2.1.tif" \
              -o "rasters/CHELSA_bio${v}_1981-2010_V.2.1.tif"
          done

      - name: Build frozen response-blind Study-B relation
        if: steps.transport.outputs.complete == 'true'
        run: |
          python scripts/build_relational_environment_relation.py \
            --occurrences results/environment/occurrences_v0.2.csv \
            --candidates benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv \
            --rule docs/supporting/relational_environment_relation_rule_v0.3.json \
            --freshness-rule docs/supporting/relational_future_family_freshness_amendment_v0.1.json \
            --raster rasters/CHELSA_bio1_1981-2010_V.2.1.tif \
            --raster rasters/CHELSA_bio7_1981-2010_V.2.1.tif \
            --raster rasters/CHELSA_bio12_1981-2010_V.2.1.tif \
            --raster rasters/CHELSA_bio15_1981-2010_V.2.1.tif \
            --output-npz results/environment/relational_environment_design_v0.3.npz \
            --output-summary results/environment/relational_environment_design_v0.3.json

      - name: Assert response-blind relation result class
        if: steps.transport.outputs.complete == 'true'
        run: |
          python - <<'PY'
          import json
          p=json.load(open("results/environment/relational_environment_design_v0.3.json"))
          assert p["status"] in {
              "PASS_RESPONSE_BLIND_ENVIRONMENT_RELATION_DESIGN",
              "NOT_EVALUABLE_ENVIRONMENT_FRESHNESS",
              "NOT_EVALUABLE_GENERAL_CROSS_TAXON_RELATIONAL_TTF",
          }
          assert all(v is False for v in p["response_firewall"].values())
          print({
              "status":p["status"],
              "environment_admissible_before_freshness":p.get("environment_admissible_before_freshness"),
              "freshness_excluded_environment_admissible":p.get("freshness_excluded_environment_admissible"),
              "environment_admissible_species":p.get("environment_admissible_species"),
          })
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relational-environment-relation-v0.3
          path: |
            results/environment/occurrence_ledger_v0.2.json
            results/environment/transport_retry_receipt_v0.1.json
            results/environment/relational_environment_design_v0.3.npz
            results/environment/relational_environment_design_v0.3.json
          retention-days: 30
          if-no-files-found: warn
