name: ttf-q-submission-renderer-smoke

on:
  push:
    branches:
      - main
    paths:
      - "scripts/render_ttf_q_submission_files.py"
      - "manuscript/ttf_q_methods_blinded_v0.1.md"
      - "manuscript/ttf_q_title_page_template.md"
      - ".github/workflows/ttf-q-submission-renderer-smoke.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/render_ttf_q_submission_files.py"
      - "manuscript/ttf_q_methods_blinded_v0.1.md"
      - "manuscript/ttf_q_title_page_template.md"
      - ".github/workflows/ttf-q-submission-renderer-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install python-docx
      - name: Render and structurally verify current manuscript inputs
        run: |
          python - <<'PY'
          import runpy
          import tempfile
          from pathlib import Path

          ns=runpy.run_path("scripts/render_ttf_q_submission_files.py")
          main=Path("manuscript/ttf_q_methods_blinded_v0.1.md")
          title=Path("manuscript/ttf_q_title_page_template.md")
          assert main.is_file()
          assert title.is_file()

          with tempfile.TemporaryDirectory() as td:
              root=Path(td)
              reference=root/"reference.docx"
              main_out=root/"main.docx"
              title_out=root/"title.docx"

              ns["make_reference_docx"](reference)
              ns["run_pandoc"](main,main_out,reference)
              ns["run_pandoc"](title,title_out,reference)
              ns["assert_submission_docx"](main_out,require_line_numbers=True)
              ns["assert_submission_docx"](title_out,require_line_numbers=False)

              assert main_out.stat().st_size > 10000
              assert title_out.stat().st_size > 1000
              print({
                  "status":"PASS_TTF_Q_CURRENT_MANUSCRIPT_RENDERER_SMOKE",
                  "main_bytes":main_out.stat().st_size,
                  "title_bytes":title_out.stat().st_size,
              })
          PY
