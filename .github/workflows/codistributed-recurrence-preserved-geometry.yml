name: codistributed recurrence preserved geometry qualification

on:
  push:
    branches:
      - prospective/codistributed-recurrence-insecta-v0-1
    paths:
      - ".github/workflows/codistributed-recurrence-preserved-geometry.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GEOMETRY_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-c648-8206-bb29-c9a786ef5294/raw?se=2026-10-05T05%3A03%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=e510133b-3886-50cc-9165-edffe2e4d648&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T22%3A33%3A43Z&ske=2026-10-05T22%3A33%3A43Z&sks=b&skv=2026-02-06&sig=G7DJw17%2BLBOLI3L9Ic09/8uTZk9chCMfhvQO7hIde%2B8%3D"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen implementation
        run: python -m pip install -e .

      - name: Recover exact preserved response-blind development geometry
        run: |
          mkdir -p results/codistribution-preserved
          curl --fail --location "$GEOMETRY_URL" -o /tmp/development_geometry.zip
          echo "b5464ef977218dd069278fddcab2734db6ee1d882df8bf0bc7aaf197111c7fab  /tmp/development_geometry.zip" | sha256sum -c -
          unzip -q /tmp/development_geometry.zip -d results/codistribution-preserved
          echo "e17f4dfdf5f184443e087f5ddcd829aa1c3c03cacfbfac123502d05911f56a3a  results/codistribution-preserved/development_localities.csv" | sha256sum -c -
          echo "613aca949cf0b2e3fd233c0e7bb54e34ec8e627aeeb4ff54b1fb84e90bb9da6b  results/codistribution-preserved/development_edges.csv" | sha256sum -c -

      - name: Run frozen development fixed-dyad screen
        run: |
          python scripts/run_codistributed_recurrence_fixed_tst_screen.py             --stage screen             --localities results/codistribution-preserved/development_localities.csv             --edges results/codistribution-preserved/development_edges.csv             --candidates benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv             --design benchmarks/frozen/genetic_codistributed_recurrence_response_blind_design_v0.1.json             --rule docs/supporting/genetic_codistributed_recurrence_geometry_null_rule_v0.3.json             --world-batch-size 200             --output results/codistribution-preserved/fixed_tst_screen_v0.3.json

      - name: Read screen gate
        id: gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path("results/codistribution-preserved/fixed_tst_screen_v0.3.json").read_text())
          assert p["schema"]=="ttf_genetic_codistributed_recurrence_fixed_tst_screen_v0.3"
          passed=p["status"]=="PASS_TO_FORMAL_FIXED_TST_QUALIFICATION"
          assert bool(p["gate"]["overall_pass"]) == passed
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"passed={'true' if passed else 'false'}\n")
          print(json.dumps({"status":p["status"],"gate":p["gate"],"private":p["private_evaluation"],"positive":p["positive_evaluation"]},sort_keys=True))
          PY

      - name: Run frozen formal qualification after screen PASS
        if: steps.gate.outputs.passed == 'true'
        run: |
          python scripts/run_codistributed_recurrence_fixed_tst_screen.py             --stage formal             --screen-result results/codistribution-preserved/fixed_tst_screen_v0.3.json             --localities results/codistribution-preserved/development_localities.csv             --edges results/codistribution-preserved/development_edges.csv             --candidates benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv             --design benchmarks/frozen/genetic_codistributed_recurrence_response_blind_design_v0.1.json             --rule docs/supporting/genetic_codistributed_recurrence_geometry_null_rule_v0.3.json             --world-batch-size 200             --output results/codistribution-preserved/fixed_tst_qualification_v0.3.json

      - name: Summarize formal gate
        if: steps.gate.outputs.passed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("results/codistribution-preserved/fixed_tst_qualification_v0.3.json").read_text())
          print(json.dumps({"status":p["status"],"gate":p["gate"],"private":p["private_evaluation"],"positive":p["positive_evaluation"]},sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codistributed-recurrence-preserved-geometry-qualification
          path: |
            results/codistribution-preserved/fixed_tst_screen_v0.3.json
            results/codistribution-preserved/fixed_tst_qualification_v0.3.json
          if-no-files-found: warn
          retention-days: 30
