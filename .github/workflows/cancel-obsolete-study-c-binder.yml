name: cancel-obsolete-study-c-binder

on:
  push:
    branches:
      - relational-ttf-v01
    paths:
      - "benchmarks/frozen/relational_historical_obsolete_binder_v0.1.json"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify obsolete binder cancellation contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("benchmarks/frozen/relational_historical_obsolete_binder_v0.1.json").read_text())
          assert p["schema"]=="ttf_relational_historical_obsolete_binder_v0.1"
          assert p["status"]=="AUTHORIZE_CANCEL_OBSOLETE_WAITING_BINDER_PRE_RESULT"
          assert p["obsolete_binder_run_id"]==35942247633
          assert p["authoritative_bounded_run_id"]==35941577015
          assert p["binding_observed_at_freeze"] is False
          assert p["final_occurrence_artifact_observed_at_freeze"] is False
          assert p["relation_result_seen"] is False
          assert p["genetic_response_used"] is False
          assert not any(bool(v) for v in p["response_firewall"].values())
          assert not Path("benchmarks/frozen/relational_historical_occurrence_artifact_binding_v0.2.json").exists()
          PY

      - name: Cancel exact obsolete waiting binder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=35942247633
          state="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.status')"
          conclusion="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.conclusion // ""')"
          echo "run=$id status=$state conclusion=$conclusion"
          if [ "$state" = "queued" ] || [ "$state" = "in_progress" ] || [ "$state" = "waiting" ] || [ "$state" = "requested" ] || [ "$state" = "pending" ]; then
            gh api -X POST "/repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel"
          fi
