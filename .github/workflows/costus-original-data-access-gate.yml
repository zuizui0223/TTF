name: Costus original Dryad bytes hash and response-blind access

on:
  push:
    branches:
      - research/crest-ttf-four-system-source-preflight-20261115
  pull_request:
    paths:
      - 'research/prospective/ttf_crest_costus_original_data_access_gate_20261115.py'
      - 'tests/test_crest_ttf_costus_original_data_access_gate.py'
      - '.github/workflows/costus-original-data-access-gate.yml'

jobs:
  source-access:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check synthetic source hash and row firewall
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_crest_ttf_costus_original_data_access_gate.py
      - name: Verify exact public 2022/2026 Costus originals or log access failure without effect values
        run: |
          python research/prospective/ttf_crest_costus_original_data_access_gate_20261115.py > /tmp/costus_original_access_only.json
          cat /tmp/costus_original_access_only.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: costus-original-access-source-only
          path: /tmp/costus_original_access_only.json
          retention-days: 21
