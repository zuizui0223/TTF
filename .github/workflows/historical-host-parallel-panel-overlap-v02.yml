name: Historical host parallel-panel exact source replay

on:
  push:
    branches:
      - prospective/historical-host-memory-v0-1
    paths:
      - "benchmarks/frozen/historical_host_memory_candidate_642_v0.1.csv"
      - "benchmarks/frozen/historical_host_parallel_panel_input_overlap_audit_v0.1.json"
      - "scripts/audit_historical_host_parallel_panels.py"
      - "tests/test_historical_host_parallel_panels.py"
      - ".github/workflows/historical-host-parallel-panel-overlap-v02.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/TTF
          ref: de310b843ad35a1985ee077d69a3240fcf0c6b7d
          path: _connectivity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test exact frozen-source refusal and host-ID overlap
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_historical_host_parallel_panels.py
      - name: Replay 642 x 135 exact sources and 73 shared species
        run: |
          python scripts/audit_historical_host_parallel_panels.py \
            --memory benchmarks/frozen/historical_host_memory_candidate_642_v0.1.csv \
            --connectivity _connectivity/benchmarks/frozen/genetic_historical_host_connectivity_panel_v0.2.csv \
            --frozen-receipt benchmarks/frozen/historical_host_parallel_panel_input_overlap_audit_v0.1.json \
            --output results/historical_host_parallel_panels/overlap_exact_source_v0.2.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-host-parallel-panel-exact-source-v0.2
          path: results/historical_host_parallel_panels/overlap_exact_source_v0.2.json
          retention-days: 30
          if-no-files-found: error
