name: relational-historical-from-occurrence-binding

on:
  push:
    branches:
      - relational-ttf-v01
    paths:
      - "benchmarks/frozen/relational_historical_occurrence_artifact_binding_v0.1.json"

permissions:
  contents: read
  actions: read

jobs:
  pregenetic:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - id: binding
        name: Verify frozen occurrence binding
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          b=json.loads(Path("benchmarks/frozen/relational_historical_occurrence_artifact_binding_v0.1.json").read_text())
          assert b["schema"]=="ttf_relational_historical_occurrence_artifact_binding_v0.1"
          assert b["status"]=="FROZEN_RESPONSE_BLIND_OCCURRENCE_ARTIFACT"
          assert b["artifact_name"]=="relational-historical-occurrence-assembled-v0.1"
          assert b["genetic_response_used"] is False
          assert all(v is False for v in b["response_firewall"].values())
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"run_id={int(b['workflow_run_id'])}\n")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -e .
          python -m pip install "rasterio>=1.4,<2"
      - uses: actions/download-artifact@v4
        with:
          name: relational-historical-occurrence-assembled-v0.1
          path: input/occ
          run-id: ${{ steps.binding.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify exact assembled occurrence artifact
        id: occ
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          b=json.loads(Path("benchmarks/frozen/relational_historical_occurrence_artifact_binding_v0.1.json").read_text())
          assert sha("input/occ/occurrences_v0.1.csv")==b["occurrence_csv_sha256"]
          assert sha("input/occ/occurrence_ledger_v0.1.json")==b["occurrence_ledger_sha256"]
          p=json.loads(Path("input/occ/occurrence_ledger_v0.1.json").read_text())
          assert p["candidate_species_total"]==1000
          assert all(v is False for v in p["response_firewall"].values())
          passed=p["status"]=="PASS_TO_HISTORICAL_ASSET_EXTRACTION"
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"passed={'true' if passed else 'false'}\n")
          print({"status":p["status"],"status_counts":p.get("status_counts"),"species_passing_ge_30":p.get("species_passing_ge_30")})
          PY

      - name: Resolve exact CHELSA-TraCE21k assets
        if: steps.occ.outputs.passed == 'true'
        run: |
          mkdir -p results/history rasters/history rasters/current
          : > results/history/resolved_urls.txt
          for var in bio01 bio07 bio12 bio15; do
            for idx in -190 20; do
              logical="CHELSA_TraCE21K_${var}_${idx}_V1.0.tif"
              alt="CHELSA_TraCE21k_${var}_${idx}_V1.0.tif"
              found=""
              for base in \
                "https://os.zhdk.cloud.switch.ch/chelsav1/chelsa_trace/bio" \
                "https://os.zhdk.cloud.switch.ch/envicloud/chelsa/chelsa_V1/chelsa_trace/bio"; do
                for remote in "$logical" "$alt"; do
                  url="$base/$remote"
                  if curl -L --fail --retry 5 --retry-delay 5 --connect-timeout 30 "$url" -o "rasters/history/$logical"; then
                    found="$url"; break 2
                  fi
                done
              done
              test -n "$found" || { echo "Unresolvable frozen historical asset: $logical"; exit 3; }
              echo "$found" >> results/history/resolved_urls.txt
            done
          done
          mapfile -t URLS < results/history/resolved_urls.txt
          python scripts/freeze_relational_historical_asset_receipt.py \
            --rule docs/supporting/relational_historical_climate_exposure_rule_v0.1.json \
            --asset rasters/history/CHELSA_TraCE21K_bio01_-190_V1.0.tif \
            --asset rasters/history/CHELSA_TraCE21K_bio07_-190_V1.0.tif \
            --asset rasters/history/CHELSA_TraCE21K_bio12_-190_V1.0.tif \
            --asset rasters/history/CHELSA_TraCE21K_bio15_-190_V1.0.tif \
            --asset rasters/history/CHELSA_TraCE21K_bio01_20_V1.0.tif \
            --asset rasters/history/CHELSA_TraCE21K_bio07_20_V1.0.tif \
            --asset rasters/history/CHELSA_TraCE21K_bio12_20_V1.0.tif \
            --asset rasters/history/CHELSA_TraCE21K_bio15_20_V1.0.tif \
            --resolved-url "${URLS[0]}" --resolved-url "${URLS[2]}" \
            --resolved-url "${URLS[4]}" --resolved-url "${URLS[6]}" \
            --resolved-url "${URLS[1]}" --resolved-url "${URLS[3]}" \
            --resolved-url "${URLS[5]}" --resolved-url "${URLS[7]}" \
            --output results/history/historical_asset_receipt_v0.1.json

      - name: Download current CHELSA nuisance layers
        if: steps.occ.outputs.passed == 'true'
        run: |
          base="https://os.zhdk.cloud.switch.ch/chelsav2/GLOBAL/climatologies/1981-2010/bio"
          for v in 1 7 12 15; do
            curl -L --fail --retry 5 --retry-delay 5 "$base/CHELSA_bio${v}_1981-2010_V.2.1.tif" -o "rasters/current/CHELSA_bio${v}_1981-2010_V.2.1.tif"
          done

      - name: Build frozen Study-C relation
        id: relation
        if: steps.occ.outputs.passed == 'true'
        run: |
          python scripts/build_relational_historical_relation.py \
            --occurrences input/occ/occurrences_v0.1.csv \
            --candidates benchmarks/frozen/relational_historical_candidates_v0.1.csv \
            --rule docs/supporting/relational_historical_climate_exposure_rule_v0.1.json \
            --asset-receipt results/history/historical_asset_receipt_v0.1.json \
            --historical-asset rasters/history/CHELSA_TraCE21K_bio01_-190_V1.0.tif \
            --historical-asset rasters/history/CHELSA_TraCE21K_bio07_-190_V1.0.tif \
            --historical-asset rasters/history/CHELSA_TraCE21K_bio12_-190_V1.0.tif \
            --historical-asset rasters/history/CHELSA_TraCE21K_bio15_-190_V1.0.tif \
            --historical-asset rasters/history/CHELSA_TraCE21K_bio01_20_V1.0.tif \
            --historical-asset rasters/history/CHELSA_TraCE21K_bio07_20_V1.0.tif \
            --historical-asset rasters/history/CHELSA_TraCE21K_bio12_20_V1.0.tif \
            --historical-asset rasters/history/CHELSA_TraCE21K_bio15_20_V1.0.tif \
            --current-bio1 rasters/current/CHELSA_bio1_1981-2010_V.2.1.tif \
            --current-bio7 rasters/current/CHELSA_bio7_1981-2010_V.2.1.tif \
            --current-bio12 rasters/current/CHELSA_bio12_1981-2010_V.2.1.tif \
            --current-bio15 rasters/current/CHELSA_bio15_1981-2010_V.2.1.tif \
            --output-npz results/history/relational_historical_design_v0.1.npz \
            --output-summary results/history/relational_historical_design_v0.1.json
          python - <<'PY'
          import json,os
          p=json.load(open("results/history/relational_historical_design_v0.1.json"))
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"passed={'true' if p['status']=='PASS_RESPONSE_BLIND_HISTORICAL_RELATION_DESIGN' else 'false'}\n")
          PY

      - name: Attach frozen Study-C opportunity
        id: opportunity
        if: steps.relation.outputs.passed == 'true'
        run: |
          python scripts/attach_relational_historical_opportunity.py \
            --historical-design results/history/relational_historical_design_v0.1.npz \
            --edges benchmarks/frozen/relational_historical_edges_v0.1.csv \
            --candidates benchmarks/frozen/relational_historical_candidates_v0.1.csv \
            --opportunity-rule docs/supporting/relational_historical_climate_opportunity_rule_v0.1.json \
            --output-npz results/history/relational_historical_opportunity_v0.1.npz \
            --output-summary results/history/relational_historical_opportunity_v0.1.json
          python - <<'PY'
          import json,os
          p=json.load(open("results/history/relational_historical_opportunity_v0.1.json"))
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"passed={'true' if p['status']=='PASS_TO_HISTORICAL_DEVELOPMENT_SYNTHETIC_QUALIFICATION' else 'false'}\n")
          PY

      - name: Run frozen Study-C qualification
        if: steps.opportunity.outputs.passed == 'true'
        run: |
          python scripts/run_relational_historical_climate_qualification.py \
            --opportunity-design results/history/relational_historical_opportunity_v0.1.npz \
            --opportunity-summary results/history/relational_historical_opportunity_v0.1.json \
            --rule docs/supporting/relational_historical_climate_qualification_rule_v0.1.json \
            --output results/history/relational_historical_qualification_v0.1.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relational-historical-pregenetic-v0.1
          path: results/history/
          retention-days: 30
          if-no-files-found: warn
