name: genetic v0.5 batch-width benchmark

on:
  push:
    branches:
      - "method/genetic-ibd-crossfit"
    paths:
      - ".github/workflows/genetic-v05-batch-width-benchmark.yml"
      - "docs/supporting/genetic_v05_batch_width_benchmark_authorization.json"
  workflow_dispatch:

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        width: [8, 16, 32, 64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: skdecker/PhylogeographicBreaks
          ref: 11534ba70fbe3705e667651030edef5b849fa949
          path: external/decker
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Verify frozen runtime-only benchmark lineage
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          def blob(path): return subprocess.check_output(['git','hash-object',path],text=True).strip()
          a=json.loads(Path('docs/supporting/genetic_v05_batch_width_benchmark_authorization.json').read_text())
          checks={
            'docs/supporting/genetic_transfer_batch_v05_rule.json':'parent_rule_blob_sha',
            'src/ttf/cached_chunked_transfer.py':'cached_transfer_blob_sha',
            'src/ttf/genetic_batch_execution.py':'genetic_batch_execution_blob_sha',
            'scripts/benchmark_genetic_v05_batch_width.py':'runner_blob_sha',
          }
          assert a['schema']=='ttf_genetic_v05_batch_width_benchmark_authorization'
          for path,key in checks.items(): assert blob(path)==a[key], (path,blob(path),a[key])
          PY
      - name: Reconstruct frozen v0.2 geometry
        run: |
          python scripts/census_decker_genetic_geometry.py --root external/decker --output results/decker_genetic_geometry_census_v0.1.json --min-localities 12 --min-endpoint-training-edges 5 --neighbor-fraction 0.15
          python scripts/freeze_decker_genetic_pilot_geometry_v02.py --root external/decker --census results/decker_genetic_geometry_census_v0.1.json --rule docs/supporting/genetic_decker_pilot_rule_v0.1.json --output-csv results/decker_genetic_pilot_geometry_v0.2.csv --output-manifest results/decker_genetic_pilot_geometry_v0.2.json
      - name: Benchmark frozen batch width
        run: |
          python scripts/benchmark_genetic_v05_batch_width.py \
            --geometry results/decker_genetic_pilot_geometry_v0.2.csv \
            --manifest results/decker_genetic_pilot_geometry_v0.2.json \
            --pilot-rule docs/supporting/genetic_decker_pilot_rule_v0.1.json \
            --authorization docs/supporting/genetic_v05_batch_width_benchmark_authorization.json \
            --batch-width ${{ matrix.width }} \
            --output results/genetic_v05_batch_width_${{ matrix.width }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: genetic-v05-batch-width-${{ matrix.width }}
          path: results/genetic_v05_batch_width_${{ matrix.width }}.json
          if-no-files-found: error

  select:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: genetic-v05-batch-width-*
          path: results/candidates
          merge-multiple: true
      - name: Apply frozen runtime-only selection rule
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for path in sorted(Path('results/candidates').glob('genetic_v05_batch_width_*.json')):
              p=json.loads(path.read_text())
              assert p['schema']=='ttf_genetic_v05_batch_width_benchmark_v0.1'
              assert p['status']=='runtime_only_candidate_passed_equivalence'
              assert p['finite_score_invariant'] is True
              assert p['empirical_genetic_outcomes_opened'] is False
              assert p['qualification_claim_made'] is False
              assert p['statistic_values_persisted'] is False
              assert max(
                  p['max_abs_statistic_difference_from_sequential_first_world'],
                  p['max_abs_training_strength_difference_from_sequential_first_world'],
                  p['max_abs_species_score_difference_from_sequential_first_world'],
              ) <= 1e-12
              rows.append(p)
          assert sorted(r['batch_width'] for r in rows)==[8,16,32,64]
          selected=min(rows,key=lambda r:(r['total_scoring_seconds'],r['batch_width']))
          out={
              'schema':'ttf_genetic_v05_batch_width_selection_v0.1',
              'status':'selected_by_frozen_runtime_only_rule',
              'selected_batch_width':selected['batch_width'],
              'candidates':rows,
              'selection_used_statistic_sign_or_magnitude':False,
              'empirical_genetic_outcomes_opened':False,
              'qualification_claim_made':False,
          }
          Path('results/genetic_v05_batch_width_selection_v0.1.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: genetic-v05-batch-width-selection-v0.1
          path: results/genetic_v05_batch_width_selection_v0.1.json
          if-no-files-found: error
