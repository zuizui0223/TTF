name: relational-environment-transport-cutover

on:
  push:
    branches:
      - relational-ttf-v01
    paths:
      - "benchmarks/frozen/relational_environment_transport_cutover_v0.1.json"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path("benchmarks/frozen/relational_environment_transport_cutover_v0.1.json").read_text())
          assert p["schema"]=="ttf_relational_environment_transport_cutover_v0.1"
          assert p["status"]=="FROZEN_FINAL_TRANSPORT_CUTOVER_BEFORE_RELATION_RESULT"
          assert p["relation_result_seen"] is False
          assert p["query_or_scientific_contract_change"] is False
          n=int(p["cutover_batch_count"])
          assert n==209
          assert len(p["batches"])==n
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("matrix="+json.dumps(list(range(n)),separators=(",",":"))+"\n")
          PY

  acquire:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen corrected transport core
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/acquire_relational_environment_occurrences.py)" = "34eb5d5b459e105943cc5642cf355011d86c4f07"
          test "$(git rev-parse HEAD:src/ttf/relational_environment.py)" = "d05e35866de57daa8eccacdbf7a3c0eaff055890"
          test "$(git rev-parse HEAD:src/ttf/relational_external.py)" = "4a43bf5fedcc40c9a0fecf44dc3412e726b2ad4f"
          test "$(git rev-parse HEAD:benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv)" = "bb4fcc8ee55686aab722a4be7778d833d08c3784"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Acquire frozen cutover batch
        run: |
          mkdir -p results/cutover
          python scripts/acquire_relational_environment_cutover_batch.py \
            --manifest benchmarks/frozen/relational_environment_transport_cutover_v0.1.json \
            --batch-index ${{ matrix.batch }} \
            --output-csv results/cutover/occurrences-cutover-${{ matrix.batch }}.csv \
            --output-ledger results/cutover/ledger-cutover-${{ matrix.batch }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: relational-env-cutover-${{ matrix.batch }}
          path: results/cutover/
          retention-days: 30
          if-no-files-found: error
