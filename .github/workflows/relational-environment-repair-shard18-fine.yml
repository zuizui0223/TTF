name: relational-environment-repair-shard18-fine

on:
  push:
    branches:
      - relational-ttf-v01
    paths:
      - "benchmarks/frozen/relational_environment_fine_repair_trigger_v0.1.json"

permissions:
  contents: read
  actions: read

env:
  FROZEN_B_CODE_SHA: c1b4b6e1084573412bc87c5fb3922e382fafb6dd
  ORIGINAL_RUN_ID: "35613625571"
  COARSE_REPAIR_RUN_ID: "35684589339"

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [38,138,58,158,98,198]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_B_CODE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Acquire exact fine subset of original shard 18
        run: |
          mkdir -p results/repair
          python scripts/acquire_relational_environment_occurrences.py \
            --candidates benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv \
            --output-csv results/repair/occurrences-${{ matrix.shard }}of200.csv \
            --output-ledger results/repair/ledger-${{ matrix.shard }}of200.json \
            --shard-index ${{ matrix.shard }} \
            --shards 200
      - uses: actions/upload-artifact@v4
        with:
          name: relational-env-occ-fine-${{ matrix.shard }}
          path: results/repair/
          retention-days: 30
          if-no-files-found: error

  relation:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_B_CODE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -e .
          python -m pip install "rasterio>=1.4,<2"

      - uses: actions/download-artifact@v4
        with:
          pattern: relational-env-occ-*
          path: results/original
          merge-multiple: true
          run-id: ${{ env.ORIGINAL_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Require exactly 19 original coarse shards
        run: |
          rm -f results/original/occurrences-18.csv results/original/ledger-18.json
          test "$(ls results/original/occurrences-*.csv | wc -l)" = "19"
          test "$(ls results/original/ledger-*.json | wc -l)" = "19"

      - uses: actions/download-artifact@v4
        with:
          name: relational-env-occ-repair-18
          path: results/coarse-keep
          run-id: ${{ env.COARSE_REPAIR_RUN_ID }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: relational-env-occ-repair-78
          path: results/coarse-keep
          run-id: ${{ env.COARSE_REPAIR_RUN_ID }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          pattern: relational-env-occ-fine-*
          path: results/fine
          merge-multiple: true

      - name: Assemble exact frozen 1000 species
        run: |
          mkdir -p results/all results/environment rasters
          cp results/original/occurrences-*.csv results/all/
          cp results/original/ledger-*.json results/all/
          cp results/coarse-keep/occurrences-*.csv results/all/
          cp results/coarse-keep/ledger-*.json results/all/
          cp results/fine/occurrences-*.csv results/all/
          cp results/fine/ledger-*.json results/all/
          python scripts/aggregate_relational_environment_occurrences.py \
            --input-dir results/all \
            --output-csv results/environment/occurrences_v0.2.csv \
            --output-ledger results/environment/occurrence_ledger_v0.2.json

      - name: Download frozen CHELSA V2.1
        run: |
          set -euo pipefail
          base="https://os.zhdk.cloud.switch.ch/chelsav2/GLOBAL/climatologies/1981-2010/bio"
          for v in 1 7 12 15; do
            curl -L --fail --retry 4 --retry-delay 5 \
              "$base/CHELSA_bio${v}_1981-2010_V.2.1.tif" \
              -o "rasters/CHELSA_bio${v}_1981-2010_V.2.1.tif"
          done

      - name: Build unchanged Study-B relation
        run: |
          python scripts/build_relational_environment_relation.py \
            --occurrences results/environment/occurrences_v0.2.csv \
            --candidates benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv \
            --rule docs/supporting/relational_environment_relation_rule_v0.3.json \
            --freshness-rule docs/supporting/relational_future_family_freshness_amendment_v0.1.json \
            --raster rasters/CHELSA_bio1_1981-2010_V.2.1.tif \
            --raster rasters/CHELSA_bio7_1981-2010_V.2.1.tif \
            --raster rasters/CHELSA_bio12_1981-2010_V.2.1.tif \
            --raster rasters/CHELSA_bio15_1981-2010_V.2.1.tif \
            --output-npz results/environment/relational_environment_design_v0.3.npz \
            --output-summary results/environment/relational_environment_design_v0.3.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relational-environment-relation-v0.3-repaired-fine
          path: |
            results/environment/occurrence_ledger_v0.2.json
            results/environment/relational_environment_design_v0.3.npz
            results/environment/relational_environment_design_v0.3.json
          retention-days: 30
          if-no-files-found: warn
