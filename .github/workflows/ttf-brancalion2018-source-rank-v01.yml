name: Brancalion 2018 original source-level climate design ceiling
on:
  push:
    branches:
      - 'prospective/independent-transplant-overlap-20261115'
    paths:
      - '.github/workflows/ttf-brancalion2018-source-rank-v01.yml'
      - 'research/prospective/brancalion2018_source_level_design_ceiling_v01.py'
      - 'research/prospective/test_brancalion2018_source_level_design_ceiling_v01.py'
      - 'research/prospective/brancalion2018_maternal_cohort_gate_v01.py'
      - 'research/prospective/hargreaves35_primary_article_recovery_shortlist_v01.json'
  pull_request:
    paths:
      - '.github/workflows/ttf-brancalion2018-source-rank-v01.yml'
      - 'research/prospective/brancalion2018_source_level_design_ceiling_v01.py'
      - 'research/prospective/test_brancalion2018_source_level_design_ceiling_v01.py'
      - 'research/prospective/brancalion2018_maternal_cohort_gate_v01.py'
      - 'research/prospective/hargreaves35_primary_article_recovery_shortlist_v01.json'
jobs:
  original-source-rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Nine source-only study unit tests
        run: python -m unittest discover -s research/prospective -p test_brancalion2018_source_level_design_ceiling_v01.py -v
      - name: Compute original source geography rank ceiling
        run: python research/prospective/brancalion2018_source_level_design_ceiling_v01.py --output _source_only/brancalion2018_source_level_design_ceiling_v01.json
      - uses: actions/upload-artifact@v4
        with:
          name: ttf-brancalion2018-original-source-rank-v01
          path: _source_only/brancalion2018_source_level_design_ceiling_v01.json
          retention-days: 30
