name: Brancalion 2018 original Table S1 official-source preflight
on:
  push:
    branches:
      - 'prospective/independent-transplant-overlap-20261115'
    paths:
      - '.github/workflows/ttf-brancalion2018-original-table-s1-v01.yml'
      - 'research/prospective/brancalion2018_original_table_s1_preflight_v01.py'
      - 'research/prospective/test_brancalion2018_original_table_s1_preflight_v01.py'
  pull_request:
    paths:
      - '.github/workflows/ttf-brancalion2018-original-table-s1-v01.yml'
      - 'research/prospective/brancalion2018_original_table_s1_preflight_v01.py'
      - 'research/prospective/test_brancalion2018_original_table_s1_preflight_v01.py'
jobs:
  original-supplement-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Nine offline source-only provenance tests
        run: python -m unittest discover -s research/prospective -p test_brancalion2018_original_table_s1_preflight_v01.py -v
      - name: Check only official original supplementary archives
        run: python research/prospective/brancalion2018_original_table_s1_preflight_v01.py --output _source_only/brancalion2018_original_table_s1_preflight_v01.json
      - uses: actions/upload-artifact@v4
        with:
          name: ttf-brancalion2018-original-TableS1-source-only-v01
          path: _source_only/brancalion2018_original_table_s1_preflight_v01.json
          retention-days: 30
