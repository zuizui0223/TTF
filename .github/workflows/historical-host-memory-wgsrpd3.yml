name: historical host memory WGSRPD3 support

on:
  push:
    branches:
      - prospective/historical-host-memory-v0-1
    paths:
      - ".github/workflows/historical-host-memory-wgsrpd3.yml"
      - "scripts/export_historical_host_memory_wgsrpd3_support.R"
      - "docs/supporting/historical_host_memory_predictor_materialization_rule_v0.1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _wcvp
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sf
            any::digest
      - name: Verify exact WGSRPD3 source blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _wcvp rev-parse HEAD)" = "65bed76bae9d644ccb6ad200c05f9f5071d89e05"
          git -C _wcvp hash-object data/wgsrpd3.rda | grep -Fx "f005f28d1ca51b818b1071e13741b905a8cacaa9"
          sha256sum _wcvp/data/wgsrpd3.rda
      - name: Build response-blind support points
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/export_historical_host_memory_wgsrpd3_support.R             _wcvp/data/wgsrpd3.rda results/historical_host_memory_wgsrpd3
          cat results/historical_host_memory_wgsrpd3/counts.tsv
          sha256sum             results/historical_host_memory_wgsrpd3/wgsrpd3_support_points_v0.1.csv             results/historical_host_memory_wgsrpd3/counts.tsv             > results/historical_host_memory_wgsrpd3/SHA256SUMS
          cat results/historical_host_memory_wgsrpd3/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: historical-host-memory-wgsrpd3-v0.1
          path: results/historical_host_memory_wgsrpd3/
          retention-days: 30
          if-no-files-found: error
