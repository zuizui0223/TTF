name: ttf-CaliPopGen-Fst-exact-CHELSA-climate-blind
on:
  push:
    branches: [research/calipopgen-fst-v01]
    paths:
      - '.github/workflows/ttf-calipopgen-fst-climate.yml'
      - 'research/calipopgen-fst/sample_exact_chelsa_blind.py'
      - 'research/calipopgen-fst/chelsa_original_eight_v01.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ttf-calipopgen-fst-climate.yml'
      - 'research/calipopgen-fst/sample_exact_chelsa_blind.py'
      - 'research/calipopgen-fst/chelsa_original_eight_v01.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  COG-only:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install climate dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'requests>=2.31,<3' 'rasterio>=1.4,<2'
      - name: Rebuild Fst-blind study-species-marker cohort
        run: |
          python research/calipopgen-fst/qualify_fst_blind.py \
            --lock research/calipopgen-fst/published_source_lock_v01.json \
            --out results/calipopgen-fst/qualified.json
      - name: Verify original C1 eight COGs and sample all frozen Fst-blind sites
        run: |
          python research/calipopgen-fst/sample_exact_chelsa_blind.py \
            --qualified results/calipopgen-fst/qualified.json \
            --assets research/calipopgen-fst/chelsa_original_eight_v01.json \
            --out results/calipopgen-fst/climate
      - name: Retain response-blind climate site evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ttf-calipopgen-fst-CHELSA-blind
          path: |
            results/calipopgen-fst/qualified.json
            results/calipopgen-fst/climate/climate_receipt.json
            results/calipopgen-fst/climate/site_keys.csv
            results/calipopgen-fst/climate/climate_values.npy
            results/calipopgen-fst/climate/eligible_pair_coordinates.json
          retention-days: 30
          if-no-files-found: error
