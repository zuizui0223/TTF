name: TTF v05 actual host versus climate-matched unlisted plant LGM comparison
on:
  push:
    branches: [exploratory/lgm-matched-alternative-plants-v05]
    paths:
      - .github/workflows/lgm-unlistedplant-LGM-v05.yml
      - scripts/score_matched_alternative_plants_v05.py
      - tests/test_score_alt_plants_v05.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ttf-lgm-v05-frozen-unlisted-plants
  cancel-in-progress: false
jobs:
  compare-frozen-alt-plants-without-genotypes:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify observed cloud identity, scoring and null regression tests
        run: |
          set -euo pipefail
          python -m pip install -e '.[test]' 'rasterio>=1.4,<2' 'scipy>=1.13,<2' 'requests>=2.31,<3'
          python -m pytest -q tests/test_score_alt_plants_v05.py tests/test_alternative_plant_match_v05.py tests/test_same_niche_null_v04.py tests/test_matched_climate_yearstrat_v03.py
          echo 'cffb1144a61151c9da78737b1c7a84034398fb50d03ea5ecb46642b317d93634  benchmarks/exploratory/lgm_host_reference_yearstrat_v02/summary.json' | sha256sum -c -
          echo 'a28fba9efa8a9dc79c162336f62c883059c5dddbfabec2861f554d038dd98044  benchmarks/exploratory/lgm_external_reference_v01/host_reference_request_manifest.csv' | sha256sum -c -
      - name: Freeze exact modern-only plant matching source outcome before reading LGM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/v05/plan input/v05/geometry
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12177817341/zip" > /tmp/v05-currentonly-plan.zip
          echo '001c6357f5a116f06bf546a8ee3eedd0520750da688367a20d5a16d070d2815c  /tmp/v05-currentonly-plan.zip' | sha256sum -c -
          unzip -q /tmp/v05-currentonly-plan.zip -d input/v05/plan
          echo 'c8099e516a42850c8ab946c4cdc23e71afe1e8eb5360a90fcd848365b3cb8075  input/v05/plan/source_bound_0bp_alternatives.json' | sha256sum -c -
          python - <<'PYTHON'
          import json
          from pathlib import Path
          q=json.loads(Path('input/v05/plan/source_bound_0bp_alternatives.json').read_text())
          assert q['stage']=='CURRENT_0BP_SELECTION_ONLY_NO_LGM_CLIMATE_OPENED'
          assert q['eligible_alternative_control_n']==335
          assert q['source_348_reference_split_cohort']==348
          assert q['plant_taxa_considered']==462
          assert len(q['matched_species'])==335
          assert all(len(x['alternative_groups'])==8 for x in q['matched_species'].values())
          assert q['no_lgm_raster_or_genetic_data_used'] is True
          print('PASS_335_SPECIES_EIGHT_PER_SPECIES_MODERNONLY_FIXED_GROUPS')
          PYTHON
          echo '92e19da615ffc2003a90569afd4089eb24871f1fc0df69cc3aface4263b96dc4  provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz' | sha256sum -c -
          tar -xJf provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz -C input/v05/geometry
          echo '037cd8fa1f059fb67c349a465540d3d5fac469b5d14a2a4d2658d74c036c0ae9  input/v05/geometry/historical_host_memory_localities_v0.1.csv' | sha256sum -c -
          echo 'ab10a876895cf00817e8ce555665ebb78a0f2ac64323d2e93c213e1857738ba9  input/v05/geometry/historical_host_memory_edges_v0.1.csv' | sha256sum -c -
      - name: Restore SHA-pinned 6343 climate support and exact 8 0BP-LGM CHELSA rasters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/v05/support input/v05/chelsa
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/11495066386/zip" > /tmp/support.zip
          unzip -q /tmp/support.zip -d input/v05/support
          echo 'd0fc12f635ec56a442dd37dec06cf3aa06684a00b14f1bb1f2db2f6fe3c4a21f  input/v05/support/wgsrpd3_support_points_v0.1.csv' | sha256sum -c -
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/10791389409/zip" > /tmp/chelsa.zip
          echo '0a797c609d26a185ba08d209a71203a584fa60f1045c4a8c335934372cee30b2  /tmp/chelsa.zip' | sha256sum -c -
          unzip -q /tmp/chelsa.zip -d input/v05/chelsa
          rm /tmp/chelsa.zip
          echo '7d82833996006fc1e99b86acb4ea7e80cde29c7f500df739ef48cb9ce145d450  input/v05/chelsa/manifest.json' | sha256sum -c -
          for var in bio01 bio07 bio12 bio15; do
            for t in -190 20; do
              test -s "input/v05/chelsa/historical/CHELSA_TraCE21K_${var}_${t}_V1.0.tif"
            done
          done
      - name: Compare fixed actual and modern-matched alternative plants on LGM climate
        run: |
          set -euo pipefail
          python -u scripts/score_matched_alternative_plants_v05.py \
            --matched-plan input/v05/plan/source_bound_0bp_alternatives.json \
            --host-manifest benchmarks/exploratory/lgm_external_reference_v01/host_reference_request_manifest.csv \
            --host-snapshot benchmarks/exploratory/lgm_host_reference_yearstrat_v02 \
            --insect-points benchmarks/exploratory/lgm_external_reference_v01/external_insect_points_50km.csv.gz \
            --localities input/v05/geometry/historical_host_memory_localities_v0.1.csv \
            --edges input/v05/geometry/historical_host_memory_edges_v0.1.csv \
            --global-support input/v05/support/wgsrpd3_support_points_v0.1.csv \
            --asset-root input/v05/chelsa/historical \
            --out results/lgm_v05_climate_matched_altplants
      - name: Validate counts and freeze traceable receipt
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import csv,json,hashlib,os
          from pathlib import Path
          out=Path('results/lgm_v05_climate_matched_altplants')
          q=json.loads((out/'summary.json').read_text())
          rows=list(csv.DictReader((out/'species_v05.csv').open()))
          assert q['status']=='EXPLORATORY_PLANT_NEGATIVE_CONTROL_NOT_GENETIC_OR_OCCUPANCY'
          assert len(rows)==335 and q['source_matched_species']==335
          assert q['source_plan_sha256']=='c8099e516a42850c8ab946c4cdc23e71afe1e8eb5360a90fcd848365b3cb8075'
          assert 0<q['climate_completed_species']<=335
          assert sum(q['statuses'].values())==335
          assert q['no_genetic_response_opened'] and q['not_historical_plant_occupancy']
          receipt={'schema':'ttf_lgm_v05_altplant_negative_control_receipt',
                   'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],
                   'input_0BP_plan_sha256':q['source_plan_sha256'],
                   'sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.iterdir()) if p.is_file()},
                   'no_genetic_response_used':True,
                   'alternative_host_taxa_not_verified_nonhosts':True}
          (out/'execution_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(q,sort_keys=True))
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ttf-lgm-v05-climate-matched-altplant-scoring
          path: results/lgm_v05_climate_matched_altplants/
          if-no-files-found: warn
          retention-days: 30
