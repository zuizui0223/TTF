name: ttf-Jensen80-Stage22-two-run-per-column-numeric-diagnostic
on:
  push:
    branches: [research/break-location-na-mammals-v01]
    paths:
      - '.github/workflows/ttf-mammal-break-stage22-column-hash-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-original-source-column-hashes:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      GDAL_CACHEMAX: '256'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install exact source numeric/GIS reader versions
        run: python -m pip install 'numpy==2.5.4' 'scipy==1.18.1' 'shapely==2.2.0' 'rasterio==1.5.2' 'pyproj==3.8.0' 'pyshp==2.4.2'
      - name: Synthetic tests on original SHA and jitter
        run: python -m unittest discover -s research/break-location-na-mammals/tests -p 'test_stage22_jittered_predictor_support.py' -v
      - name: Restore original artifact-locked panel and Stage20 source report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/stage20 results/stage22
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12889949378/zip" > /tmp/jensen80-locked.zip
          echo 'd2cd60f8a99fccbd53de1bda978e533a77ed3012e058408e181f09ba72c32698  /tmp/jensen80-locked.zip' | sha256sum -c -
          unzip -q /tmp/jensen80-locked.zip -d inputs
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12894059862/zip" > /tmp/jensen80-oldreport.zip
          echo '36c6c1f4d74a3743f3eaea928c5b4ae3c106d62eab575d77f62654e6a7a51845  /tmp/jensen80-oldreport.zip' | sha256sum -c -
          unzip -q /tmp/jensen80-oldreport.zip -d inputs/stage20
      - name: Extract source-only numeric columns and quantized hash diagnostics, no genetics
        run: |
          python research/break-location-na-mammals/stage22_jittered_predictor_support.py \
            --panel inputs/frozen_species_join.json \
            --climate-assets research/break-location-na-mammals/stage20_chelsa8_assets.json \
            --work /tmp/jensen80-stage22-numeric-diagnostics-restricted \
            --stage20-report inputs/stage20/feature_support.json \
            --output results/stage22/column_hash_diagnostics.json
      - name: Log only aggregate numeric source identity; no relaxations
        run: |
          python - <<'PY'
          import json
          x=json.load(open('results/stage22/column_hash_diagnostics.json'))
          print('STAGE22_SOURCE_SUPPORT',x['status'])
          print('MOVED_NUMERIC_SHA',x['moved_feature_matrix_sha256'])
          print('MATCH_TO_FIRST_SUCCESS',x['moved_feature_matrix_sha256']=='2621d503b8f6df7a2f9ca85fdf651bb20fa8a72354c8049b25d04d9ba8b916aa')
          print('COLUMN_HASHES',json.dumps(x['diagnostic_per_feature_raw_sha256'],sort_keys=True))
          PY
      - name: Retain only aggregate hashes/metrics, not points or restricted data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttf-Jensen80-Stage22-column-sha-diagnostic-aggregate
          path: results/stage22/column_hash_diagnostics.json
          retention-days: 30
          if-no-files-found: warn
