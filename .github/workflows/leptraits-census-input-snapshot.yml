name: leptraits census input snapshot
on:
  push:
    branches: [feature/lepidoptera-trait-transfer-census-v0-1]
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: leptraits-consensus-v1
          path: data/external/leptraits_consensus_v1.0.csv
          retention-days: 30
