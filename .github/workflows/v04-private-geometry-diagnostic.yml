name: v04-private-geometry-diagnostic

on:
  push:
    branches:
      - "analysis/gate-i-geometry-calibration"
    paths:
      - "src/ttf/private_geometry_control.py"
      - "tests/test_private_geometry_control.py"
      - "scripts/diagnose_v04_private_geometry.py"
      - ".github/workflows/v04-private-geometry-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - name: Freeze failed-v0.3 development boundary and reserve firewall
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          v03 = json.loads(Path('results/v03_fresh_external_precision_v0.1.json').read_text())
          reserve = json.loads(Path('benchmarks/frozen/v03_rgfca_reserve_geometry_source.json').read_text())
          assert v03['v03_fresh_external_pass'] is False
          assert v03['precision_qualification']['type1_pass'] is False
          assert v03['precision_qualification']['power_pass'] is True
          assert subprocess.check_output(
              ['git','rev-parse','HEAD:results/v03_fresh_external_precision_v0.1.json'], text=True
          ).strip() == '8a820e4f13a93e69dcc016e7c701ef1ca995efba'
          assert reserve['synthetic_worlds_run_at_freeze'] == 0
          assert reserve['candidate_performance_evaluated_at_freeze'] is False
          assert reserve['empirical_trait_or_colour_fields_read'] is False
          assert not Path('docs/supporting/v03_reserve_qualification_authorization.json').exists()
          print({'v03_failure_frozen': True, 'reserve_opened': False})
          PY
      - name: Run paired random-private geometry diagnosis
        run: >-
          python scripts/diagnose_v04_private_geometry.py
          --input benchmarks/frozen/v03_fresh_animal_geometry.csv
          --source-ledger benchmarks/frozen/v03_fresh_animal_geometry_source.json
          --v03-result results/v03_fresh_external_precision_v0.1.json
          --reserve-ledger benchmarks/frozen/v03_rgfca_reserve_geometry_source.json
          --coordinate-columns x_km,y_km,z_km
          --min-records 80
          --k 4
          --bandwidth 125.29246372510903
          --replicates 500
          --resamples 1999
          --propensity-directions 2048
          --transition-width 0.2
          --noise-sd 0.8
          --seed 20260908
          --output results/v04_private_geometry_diagnostic_v0.1.json
      - name: Print diagnosis
        run: cat results/v04_private_geometry_diagnostic_v0.1.json
      - uses: actions/upload-artifact@v4
        with:
          name: v04-private-geometry-diagnostic
          path: results/v04_private_geometry_diagnostic_v0.1.json
          if-no-files-found: error
      - name: Commit development-only diagnosis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v04_private_geometry_diagnostic_v0.1.json
          git commit -m "Freeze v0.4 private-geometry diagnosis"
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
