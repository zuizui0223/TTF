name: relational-environment-qualification-v03

on:
  workflow_dispatch:
    inputs:
      relation_run_id:
        description: "Completed relational-environment-relation workflow run ID containing relational-environment-relation-v0.3"
        required: true
        type: string
  push:
    branches:
      - relational-ttf-v01
    paths:
      - "benchmarks/frozen/relational_environment_relation_artifact_binding_v0.3.json"

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Resolve exact frozen relation workflow run
        id: relation
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_id=${{ inputs.relation_run_id }}" >> "$GITHUB_OUTPUT"
          else
            python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path("benchmarks/frozen/relational_environment_relation_artifact_binding_v0.3.json").read_text())
          assert p["schema"] == "ttf_relational_environment_relation_artifact_binding_v0.3"
          assert p["status"] == "FROZEN_RESPONSE_BLIND_RELATION_ARTIFACT"
          assert p["artifact_name"] == "relational-environment-relation-v0.3"
          run_id=int(p["workflow_run_id"])
          assert run_id > 0
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"run_id={run_id}\n")
          print(json.dumps({"workflow_run_id":run_id,"head_sha":p["head_sha"]},sort_keys=True))
          PY
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -e .

      - name: Download exact frozen Study-B environment relation artifact
        uses: actions/download-artifact@v4
        with:
          name: relational-environment-relation-v0.3
          path: input/relation
          run-id: ${{ steps.relation.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify relation artifact is response-blind v0.3
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          def sha(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for b in iter(lambda:f.read(1<<20),b""): h.update(b)
              return h.hexdigest()
          p=json.loads(Path("input/relation/relational_environment_design_v0.3.json").read_text())
          binding=json.loads(Path("benchmarks/frozen/relational_environment_relation_artifact_binding_v0.3.json").read_text())
          assert binding["schema"] == "ttf_relational_environment_relation_artifact_binding_v0.3"
          assert binding["status"] == "FROZEN_RESPONSE_BLIND_RELATION_ARTIFACT"
          assert binding["artifact_name"] == "relational-environment-relation-v0.3"
          assert int(binding["workflow_run_id"]) == int("${{ steps.relation.outputs.run_id }}")
          assert p["schema"] == "ttf_relational_environment_relation_design_v0.3", p["schema"]
          assert p["status"] == "PASS_RESPONSE_BLIND_ENVIRONMENT_RELATION_DESIGN", p["status"]
          assert binding["relation_status"] == p["status"]
          assert p["freshness_excluded_total"] == 70
          assert p["inputs"]["rule_sha256"] == sha("docs/supporting/relational_environment_relation_rule_v0.3.json")
          assert p["inputs"]["freshness_rule_sha256"] == sha("docs/supporting/relational_future_family_freshness_amendment_v0.1.json")
          assert p["inputs"]["candidate_csv_sha256"] == sha("benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv")
          assert binding["rules_sha256"]["relational_environment_relation_rule_v0.3.json"] == p["inputs"]["rule_sha256"]
          assert binding["rules_sha256"]["relational_future_family_freshness_amendment_v0.1.json"] == p["inputs"]["freshness_rule_sha256"]
          for filename in (
              "relational_environment_design_v0.3.json",
              "relational_environment_design_v0.3.npz",
              "occurrence_ledger_v0.2.json",
          ):
              assert binding["files_sha256"][filename] == sha(Path("input/relation") / filename), filename
          assert all(v is False for v in binding["response_firewall"].values()), binding["response_firewall"]
          assert all(v is False for v in p["response_firewall"].values()), p["response_firewall"]
          print({k:p[k] for k in (
              "environment_admissible_before_freshness",
              "freshness_excluded_environment_admissible",
              "environment_admissible_species",
              "development_species",
              "confirmatory_species",
          )})
          PY

      - name: Restore exact frozen phylogatR archive cache
        id: archive
        uses: actions/cache/restore@v4
        with:
          path: /tmp/phylogatr.zip
          key: phylogatr-5a0fd9ac25893c749d14186fbcce4a46b99163c9d810b36e40eebce7bece61a5

      - name: Require exact frozen archive
        run: |
          test -f /tmp/phylogatr.zip || {
            echo "Exact frozen archive cache is absent. Seed it with seed-phylogatr-archive-cache.yml before running this qualification workflow.";
            exit 2;
          }
          test "$(stat -c%s /tmp/phylogatr.zip)" = "274988692"
          echo "5a0fd9ac25893c749d14186fbcce4a46b99163c9d810b36e40eebce7bece61a5  /tmp/phylogatr.zip" | sha256sum -c -

      - name: Extract archive and locate source root
        id: source
        run: |
          rm -rf /tmp/phylogatr-root
          mkdir -p /tmp/phylogatr-root
          unzip -q /tmp/phylogatr.zip -d /tmp/phylogatr-root
          ROOT="$(dirname "$(find /tmp/phylogatr-root -type f -name genes.txt -print -quit)")"
          test -n "$ROOT"
          test -f "$ROOT/genes.txt"
          test -f "$ROOT/cite.txt"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Reconstruct response-blind fresh-1000 geometry
        run: |
          mkdir -p results/qualification
          python scripts/reconstruct_relational_environment_geometry.py \
            --root "${{ steps.source.outputs.root }}" \
            --candidates benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv \
            --source-archive-sha256 5a0fd9ac25893c749d14186fbcce4a46b99163c9d810b36e40eebce7bece61a5 \
            --contract docs/supporting/relational_environment_geometry_reconstruction_contract_v0.1.json \
            --neighbor-fraction 0.15 \
            --output-localities results/qualification/relational_environment_localities_v0.2.csv \
            --output-edges results/qualification/relational_environment_edges_v0.2.csv \
            --output-receipt results/qualification/relational_environment_geometry_reconstruction_v0.2.json

      - name: Require frozen semantic geometry reproduction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          legacy=json.loads(Path("benchmarks/frozen/relational_environment_genetic_geometry_receipt_v0.1.json").read_text())
          contract=json.loads(Path("docs/supporting/relational_environment_geometry_reconstruction_contract_v0.1.json").read_text())
          got=json.loads(Path("results/qualification/relational_environment_geometry_reconstruction_v0.2.json").read_text())
          for key in ("source_archive_sha256","candidate_csv_sha256","species","locality_rows","edge_rows"):
              assert got[key] == legacy[key], (key,got[key],legacy[key])
          assert got["verification_failures"] == 0
          assert contract["legacy_byte_hash_policy"]["exact_byte_match_required"] is False
          assert all(v is False for v in got["response_firewall"].values()), got["response_firewall"]
          print(json.dumps({
              "status":got["status"],
              "species":got["species"],
              "locality_rows":got["locality_rows"],
              "edge_rows":got["edge_rows"],
              "new_locality_sha256":got["locality_csv_sha256"],
              "new_edge_sha256":got["edge_csv_sha256"],
          },sort_keys=True))
          PY

      - name: Attach frozen geographic opportunity
        run: |
          python scripts/attach_relational_environment_opportunity.py \
            --environment-design input/relation/relational_environment_design_v0.3.npz \
            --edges results/qualification/relational_environment_edges_v0.2.csv \
            --candidates benchmarks/frozen/relational_fresh_candidate_1000_v0.1.csv \
            --opportunity-rule docs/supporting/relational_environment_opportunity_rule_v0.2.json \
            --output-npz results/qualification/relational_environment_opportunity_design_v0.2.npz \
            --output-summary results/qualification/relational_environment_opportunity_design_v0.2.json

      - name: Record opportunity gate
        id: opportunity
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open("results/qualification/relational_environment_opportunity_design_v0.2.json"))
          assert all(v is False for v in p["response_firewall"].values()), p["response_firewall"]
          assert p["status"] in {
              "PASS_TO_DEVELOPMENT_SYNTHETIC_QUALIFICATION",
              "NOT_EVALUABLE_ENVIRONMENT_OPPORTUNITY_GEOMETRY",
          }, p["status"]
          passed=p["status"]=="PASS_TO_DEVELOPMENT_SYNTHETIC_QUALIFICATION"
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"passed={'true' if passed else 'false'}\n")
          print(json.dumps({"status":p["status"],"development":p["panels"]["development"]},sort_keys=True))
          PY

      - name: Run frozen alpha-0.025 synthetic qualification
        if: steps.opportunity.outputs.passed == 'true'
        run: |
          python scripts/run_relational_environment_qualification.py \
            --opportunity-design results/qualification/relational_environment_opportunity_design_v0.2.npz \
            --opportunity-summary results/qualification/relational_environment_opportunity_design_v0.2.json \
            --rule docs/supporting/relational_environment_qualification_rule_v0.2.json \
            --output results/qualification/relational_environment_qualification_result_v0.2.json

      - name: Assert qualification response firewall
        if: steps.opportunity.outputs.passed == 'true'
        run: |
          python - <<'PY'
          import json
          p=json.load(open("results/qualification/relational_environment_qualification_result_v0.2.json"))
          assert p["alpha"] == 0.025
          assert all(v is False for v in p["response_firewall"].values()), p["response_firewall"]
          print(json.dumps({"status":p["status"],"gates":p["gates"],"geometry":p["geometry"]},sort_keys=True))
          PY

      - name: Freeze response-blind Study-B pre-genetic state
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path("results/qualification")
          relation=json.loads(Path("input/relation/relational_environment_design_v0.3.json").read_text())
          payload={
              "schema":"ttf_relational_environment_pregenetic_state_v0.3",
              "relation_status":relation["status"],
              "response_opened":False,
          }
          opp=out/"relational_environment_opportunity_design_v0.2.json"
          qual=out/"relational_environment_qualification_result_v0.2.json"
          if opp.exists():
              payload["opportunity_status"]=json.loads(opp.read_text())["status"]
          if qual.exists():
              q=json.loads(qual.read_text())
              payload["qualification_status"]=q["status"]
              payload["qualification_alpha"]=q["alpha"]
          if payload.get("opportunity_status") == "NOT_EVALUABLE_ENVIRONMENT_OPPORTUNITY_GEOMETRY":
              payload["program_state"]="NOT_EVALUABLE_B"
              payload["terminal_stage"]="geographic_opportunity"
          elif payload.get("qualification_status") == "PASS_TO_CONFIRMATORY_CHARACTER_MASK_PREPARATION":
              payload["program_state"]="PASS_TO_CONFIRMATORY_CHARACTER_MASK_PREPARATION"
              payload["terminal_stage"]=None
          elif "qualification_status" in payload:
              payload["program_state"]="NOT_EVALUABLE_B"
              payload["terminal_stage"]="synthetic_qualification"
          else:
              payload["program_state"]="INCOMPLETE_TECHNICAL_EXECUTION"
              payload["terminal_stage"]="infrastructure_or_missing_input"
          (out/"relational_environment_pregenetic_state_v0.3.json").write_text(
              json.dumps(payload,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(payload,sort_keys=True))
          PY

      - name: Upload response-blind qualification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relational-environment-qualification-v0.2
          path: |
            results/qualification/relational_environment_geometry_reconstruction_v0.2.json
            results/qualification/relational_environment_opportunity_design_v0.2.json
            results/qualification/relational_environment_opportunity_design_v0.2.npz
            results/qualification/relational_environment_qualification_result_v0.2.json
            results/qualification/relational_environment_pregenetic_state_v0.3.json
          retention-days: 30
          if-no-files-found: warn
