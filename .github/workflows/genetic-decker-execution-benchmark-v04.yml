name: genetic Decker execution benchmark v0.4

on:
  push:
    branches:
      - "method/genetic-ibd-crossfit"
    paths:
      - ".github/workflows/genetic-decker-execution-benchmark-v04.yml"
      - "docs/supporting/genetic_decker_execution_benchmark_authorization_v0.4.json"
  workflow_dispatch:

jobs:
  benchmark-v04:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TTF branch
        uses: actions/checkout@v4
      - name: Checkout frozen Decker source
        uses: actions/checkout@v4
        with:
          repository: skdecker/PhylogeographicBreaks
          ref: 11534ba70fbe3705e667651030edef5b849fa949
          path: external/decker
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Verify frozen v0.4 lineage
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          def blob(path):
              return subprocess.check_output(['git','hash-object',path], text=True).strip()
          a=json.loads(Path('docs/supporting/genetic_decker_execution_benchmark_authorization_v0.4.json').read_text())
          checks={
            'benchmarks/frozen/genetic_decker_pilot_geometry_source_v0.2.json':'geometry_source_ledger_blob_sha',
            'docs/supporting/genetic_decker_pilot_rule_v0.1.json':'pilot_rule_blob_sha',
            'docs/supporting/genetic_ibd_exact_fast_v04_rule.json':'exact_fast_rule_blob_sha',
            'docs/supporting/genetic_ibd_v04_exact_scale_addendum.json':'exact_scale_addendum_blob_sha',
            'scripts/benchmark_genetic_decker_pipeline_v04.py':'runner_blob_sha',
            'src/ttf/genetic_simulate.py':'genetic_simulate_blob_sha',
            'src/ttf/genetic_ibd.py':'genetic_ibd_blob_sha',
            'src/ttf/genetic_gate.py':'genetic_gate_blob_sha',
          }
          assert a['schema']=='ttf_genetic_decker_execution_benchmark_authorization_v0.4'
          assert a['status']=='authorize_exactly_one_v04_exact_fast_execution_benchmark'
          for path,key in checks.items():
              actual=blob(path)
              assert actual==a[key], (path, actual, a[key])
          PY
      - name: Reconstruct frozen v0.2 geometry
        run: |
          python scripts/census_decker_genetic_geometry.py \
            --root external/decker \
            --output results/decker_genetic_geometry_census_v0.1.json \
            --min-localities 12 \
            --min-endpoint-training-edges 5 \
            --neighbor-fraction 0.15
          python scripts/freeze_decker_genetic_pilot_geometry_v02.py \
            --root external/decker \
            --census results/decker_genetic_geometry_census_v0.1.json \
            --rule docs/supporting/genetic_decker_pilot_rule_v0.1.json \
            --output-csv results/decker_genetic_pilot_geometry_v0.2.csv \
            --output-manifest results/decker_genetic_pilot_geometry_v0.2.json
      - name: Run exactly three frozen v0.4 benchmark worlds
        run: |
          python scripts/benchmark_genetic_decker_pipeline_v04.py \
            --geometry results/decker_genetic_pilot_geometry_v0.2.csv \
            --manifest results/decker_genetic_pilot_geometry_v0.2.json \
            --source-ledger benchmarks/frozen/genetic_decker_pilot_geometry_source_v0.2.json \
            --pilot-rule docs/supporting/genetic_decker_pilot_rule_v0.1.json \
            --exact-fast-rule docs/supporting/genetic_ibd_exact_fast_v04_rule.json \
            --exact-scale-addendum docs/supporting/genetic_ibd_v04_exact_scale_addendum.json \
            --authorization docs/supporting/genetic_decker_execution_benchmark_authorization_v0.4.json \
            --output results/decker_genetic_execution_benchmark_v0.4.json
      - name: Enforce benchmark boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('results/decker_genetic_execution_benchmark_v0.4.json').read_text())
          assert p['schema']=='ttf_genetic_decker_execution_benchmark_v0.4'
          assert p['status']=='exact_fast_execution_benchmark_passed_invariants_not_qualification'
          assert p['empirical_genetic_outcomes_opened'] is False
          assert p['qualification_claim_made'] is False
          assert p['v02_v03_failures_remain_immutable'] is True
          assert p['species_count']==221 and p['train_species']==111 and p['eval_species']==110
          assert len(p['cases'])==3
          assert all(c['finite_eval_species_scores']==110 for c in p['cases'])
          ibd=next(c for c in p['cases'] if c['label']=='ibd_only')
          assert ibd['statistic']==0.0 and ibd['training_strength']==0.0
          print(json.dumps(p,sort_keys=True))
          PY
      - name: Upload benchmark receipt
        uses: actions/upload-artifact@v4
        with:
          name: decker-genetic-execution-benchmark-v0.4
          path: results/decker_genetic_execution_benchmark_v0.4.json
          if-no-files-found: error
