name: v05-one-sided-geometry-diagnostic

on:
  push:
    branches:
      - "analysis/gate-i-geometry-calibration"
    paths:
      - "benchmarks/frozen/v05_confirmation_panels_source.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - name: Require confirmation panels sealed before diagnostic outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rule=json.loads(Path('docs/supporting/v05_one_sided_geometry_candidate_rule.json').read_text())
          panels=json.loads(Path('benchmarks/frozen/v05_confirmation_panels_source.json').read_text())
          reserve=json.loads(Path('benchmarks/frozen/v03_rgfca_reserve_geometry_source.json').read_text())
          v03=json.loads(Path('results/v03_fresh_external_precision_v0.1.json').read_text())
          v04=json.loads(Path('results/v04_fresh_external_precision_v0.1.json').read_text())
          assert rule['status']=='frozen_before_v05_diagnostic_outcomes'
          assert panels['status']=='both_panels_frozen_before_v05_candidate_confirmation'
          assert panels['candidate_performance_evaluated_at_freeze'] is False
          assert panels['synthetic_worlds_run_at_freeze']==0
          assert panels['conjunctive_confirmation_required'] is True
          assert v03['v03_fresh_external_pass'] is False
          assert v04['v04_fresh_external_pass'] is False
          assert reserve['synthetic_worlds_run_at_freeze']==0
          assert reserve['candidate_performance_evaluated_at_freeze'] is False
          assert not Path('docs/supporting/v05_confirmation_authorization.json').exists()
          print({'confirmation_panels_sealed':True,'development_panels_failed':True,'reserve_opened':False})
          PY

  cell:
    needs: invariants
    strategy:
      fail-fast: false
      matrix:
        include:
          - panel: v03
            input: benchmarks/frozen/v03_fresh_animal_geometry.csv
            split_result: results/v03_fresh_external_precision_v0.1.json
            baseline_result: results/v04_propensity_seed_lock_audit_v0.1.json
            bandwidth: 125.29246372510903
            world_seed: 20260908
            shared: 0
            amplitude: 0.5
          - panel: v03
            input: benchmarks/frozen/v03_fresh_animal_geometry.csv
            split_result: results/v03_fresh_external_precision_v0.1.json
            baseline_result: results/v04_propensity_seed_lock_audit_v0.1.json
            bandwidth: 125.29246372510903
            world_seed: 20260908
            shared: 0
            amplitude: 1
          - panel: v03
            input: benchmarks/frozen/v03_fresh_animal_geometry.csv
            split_result: results/v03_fresh_external_precision_v0.1.json
            baseline_result: results/v04_propensity_seed_lock_audit_v0.1.json
            bandwidth: 125.29246372510903
            world_seed: 20260908
            shared: 0
            amplitude: 2
          - panel: v03
            input: benchmarks/frozen/v03_fresh_animal_geometry.csv
            split_result: results/v03_fresh_external_precision_v0.1.json
            baseline_result: results/v04_propensity_seed_lock_audit_v0.1.json
            bandwidth: 125.29246372510903
            world_seed: 20260908
            shared: 0
            amplitude: 3
          - panel: v03
            input: benchmarks/frozen/v03_fresh_animal_geometry.csv
            split_result: results/v03_fresh_external_precision_v0.1.json
            baseline_result: results/v04_propensity_seed_lock_audit_v0.1.json
            bandwidth: 125.29246372510903
            world_seed: 20260908
            shared: 1
            amplitude: 2
          - panel: v04
            input: benchmarks/frozen/v04_fresh_animal_geometry.csv
            split_result: results/v04_fresh_external_precision_v0.1.json
            baseline_result: results/v04_fresh_external_precision_v0.1.json
            bandwidth: 81.44335899069378
            world_seed: 20260909
            shared: 0
            amplitude: 0.5
          - panel: v04
            input: benchmarks/frozen/v04_fresh_animal_geometry.csv
            split_result: results/v04_fresh_external_precision_v0.1.json
            baseline_result: results/v04_fresh_external_precision_v0.1.json
            bandwidth: 81.44335899069378
            world_seed: 20260909
            shared: 0
            amplitude: 1
          - panel: v04
            input: benchmarks/frozen/v04_fresh_animal_geometry.csv
            split_result: results/v04_fresh_external_precision_v0.1.json
            baseline_result: results/v04_fresh_external_precision_v0.1.json
            bandwidth: 81.44335899069378
            world_seed: 20260909
            shared: 0
            amplitude: 2
          - panel: v04
            input: benchmarks/frozen/v04_fresh_animal_geometry.csv
            split_result: results/v04_fresh_external_precision_v0.1.json
            baseline_result: results/v04_fresh_external_precision_v0.1.json
            bandwidth: 81.44335899069378
            world_seed: 20260909
            shared: 0
            amplitude: 3
          - panel: v04
            input: benchmarks/frozen/v04_fresh_animal_geometry.csv
            split_result: results/v04_fresh_external_precision_v0.1.json
            baseline_result: results/v04_fresh_external_precision_v0.1.json
            bandwidth: 81.44335899069378
            world_seed: 20260909
            shared: 1
            amplitude: 2
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run paired v0.5 diagnostic cell
        run: >-
          python scripts/diagnose_v05_one_sided_cell.py
          --panel "${{ matrix.panel }}"
          --input "${{ matrix.input }}"
          --split-result "${{ matrix.split_result }}"
          --baseline-result "${{ matrix.baseline_result }}"
          --coordinate-columns x_km,y_km,z_km
          --min-records 80
          --shared-fraction "${{ matrix.shared }}"
          --amplitude "${{ matrix.amplitude }}"
          --replicates 500
          --resamples 1999
          --k 4
          --bandwidth "${{ matrix.bandwidth }}"
          --world-seed "${{ matrix.world_seed }}"
          --propensity-seed 20260908
          --propensity-directions 2048
          --transition-width 0.2
          --noise-sd 0.8
          --output "results/v05_one_sided_cells/cell-${{ matrix.panel }}-s${{ matrix.shared }}-a${{ matrix.amplitude }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v05-diagnostic-${{ matrix.panel }}-s${{ matrix.shared }}-a${{ matrix.amplitude }}
          path: results/v05_one_sided_cells/*.json
          if-no-files-found: error

  aggregate:
    needs: cell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: v05-diagnostic-*
          path: results/v05_one_sided_cells
          merge-multiple: true
      - name: Require exact ten-cell set
        run: test "$(find results/v05_one_sided_cells -name 'cell-*.json' | wc -l)" -eq 10
      - name: Apply frozen two-panel Wilson selection rule
        run: >-
          python scripts/aggregate_v05_one_sided_diagnostic.py
          --input-dir results/v05_one_sided_cells
          --rule docs/supporting/v05_one_sided_geometry_candidate_rule.json
          --output results/v05_one_sided_diagnostic_v0.1.json
      - uses: actions/upload-artifact@v4
        with:
          name: v05-one-sided-diagnostic
          path: results/v05_one_sided_diagnostic_v0.1.json
          if-no-files-found: error
      - name: Commit development-only diagnosis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v05_one_sided_diagnostic_v0.1.json
          git commit -m "Freeze v0.5 two-panel geometry diagnosis"
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
