name: genetic IBD-only numeric diagnostic

on:
  push:
    branches:
      - "method/genetic-ibd-crossfit"
    paths:
      - ".github/workflows/genetic-ibd-only-numeric-diagnostic.yml"
      - "scripts/diagnose_genetic_ibd_only_numeric_v0.1.py"
      - "docs/supporting/genetic_ibd_only_numeric_diagnostic_authorization_v0.1.json"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: skdecker/PhylogeographicBreaks
          ref: 11534ba70fbe3705e667651030edef5b849fa949
          path: external/decker
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Reconstruct frozen v0.2 geometry only
        run: |
          python scripts/census_decker_genetic_geometry.py --root external/decker --output results/decker_genetic_geometry_census_v0.1.json --min-localities 12 --min-endpoint-training-edges 5 --neighbor-fraction 0.15
          python scripts/freeze_decker_genetic_pilot_geometry_v02.py --root external/decker --census results/decker_genetic_geometry_census_v0.1.json --rule docs/supporting/genetic_decker_pilot_rule_v0.1.json --output-csv results/decker_genetic_pilot_geometry_v0.2.csv --output-manifest results/decker_genetic_pilot_geometry_v0.2.json
      - name: Run only authorized IBD-only numerical diagnostic
        run: |
          python scripts/diagnose_genetic_ibd_only_numeric_v0.1.py \
            --geometry results/decker_genetic_pilot_geometry_v0.2.csv \
            --manifest results/decker_genetic_pilot_geometry_v0.2.json \
            --rule docs/supporting/genetic_decker_pilot_rule_v0.1.json \
            --authorization docs/supporting/genetic_ibd_only_numeric_diagnostic_authorization_v0.1.json \
            --output results/genetic_ibd_only_numeric_diagnostic_v0.1.json
      - name: Enforce diagnostic firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('results/genetic_ibd_only_numeric_diagnostic_v0.1.json').read_text())
          assert p['schema']=='ttf_genetic_ibd_only_numeric_diagnostic_v0.1'
          assert p['private_or_shared_performance_opened'] is False
          assert p['empirical_genetic_outcomes_opened'] is False
          assert p['threshold_grid_search_performed'] is False
          print(json.dumps({k:v for k,v in p.items() if k!='per_species'},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: genetic-ibd-only-numeric-diagnostic-v0.1
          path: results/genetic_ibd_only_numeric_diagnostic_v0.1.json
          if-no-files-found: error
