name: Penstemon 239-species nuclear phylogeny original source-only audit

on:
  push:
    branches:
      - research/penstemon-ttf-source-join-20261115
  pull_request:
    paths:
      - 'research/prospective/penstemon_239_nuclear_source_gate_20261115.py'
      - 'tests/test_penstemon_239_nuclear_source_gate.py'
      - '.github/workflows/penstemon-nuclear-source-preflight.yml'

jobs:
  nuclear-source:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Dryad exact source identities and fail-closed source parser
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_penstemon_239_nuclear_source_gate.py
      - name: Verify published source versions and small tree archive structure only
        run: |
          python research/prospective/penstemon_239_nuclear_source_gate_20261115.py > /tmp/penstemon_nuclear_source_metadata.json
          cat /tmp/penstemon_nuclear_source_metadata.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: penstemon-239-nuclear-source-metadata-only
          path: /tmp/penstemon_nuclear_source_metadata.json
          retention-days: 21
