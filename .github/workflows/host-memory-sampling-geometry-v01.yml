name: TTF historical host-climate vs sampling geometry (exploratory only)

on:
  push:
    branches:
      - exploratory/host-memory-geometry-separation-v0-1
    paths:
      - '.github/workflows/host-memory-sampling-geometry-v01.yml'
      - 'scripts/audit_host_memory_sampling_geometry.py'
      - 'tests/test_host_sampling_confound.py'
      - 'tests/test_host_sampling_receipt.py'
      - 'scripts/probe_host_corridor_nonidentifiability.py'
      - 'tests/test_host_corridor_counterexample.py'
      - 'benchmarks/exploratory/synthetic_host_corridor_nonidentifiability_v0.1.json'
      - 'benchmarks/exploratory/host_memory_sampling_overlap_v0.1.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sampling-confounding-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only the existing TTF dependencies and tests
        run: |
          set -euo pipefail
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_host_sampling_confound.py tests/test_host_sampling_receipt.py tests/test_host_corridor_counterexample.py
      - name: Restore frozen 642-species external geography only
        run: |
          set -euo pipefail
          mkdir -p input/geometry
          echo '92e19da615ffc2003a90569afd4089eb24871f1fc0df69cc3aface4263b96dc4  provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz' | sha256sum -c -
          tar -xJf provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz -C input/geometry
          echo '037cd8fa1f059fb67c349a465540d3d5fac469b5d14a2a4d2658d74c036c0ae9  input/geometry/historical_host_memory_localities_v0.1.csv' | sha256sum -c -
          echo 'ab10a876895cf00817e8ce555665ebb78a0f2ac64323d2e93c213e1857738ba9  input/geometry/historical_host_memory_edges_v0.1.csv' | sha256sum -c -
      - name: Restore frozen ecological predictor and original split, never genotypes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/external
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/11559015421/zip" > /tmp/frozen_predictors.zip
          unzip -q /tmp/frozen_predictors.zip -d input/external
          rm -f /tmp/frozen_predictors.zip
          echo '70b748d588d9ab10309ace080f85b8053c6e14aa96d7a84288724c1000272a5b  input/external/edge_predictors_v0.1.csv' | sha256sum -c -
          echo '4168e7572d3378e7f1595ae562d53c81bb2ef165cbe50eb2ed8ec4e7406fc6ae  input/external/response_blind_panel_roles_v0.1.csv' | sha256sum -c -
      - name: Independently recompute sampling-geometry overlap from unchanged original sources
        run: |
          set -euo pipefail
          python scripts/audit_host_memory_sampling_geometry.py \
            --predictors input/external/edge_predictors_v0.1.csv \
            --roles input/external/response_blind_panel_roles_v0.1.csv \
            --edges input/geometry/historical_host_memory_edges_v0.1.csv \
            --localities input/geometry/historical_host_memory_localities_v0.1.csv \
            --original-result benchmarks/frozen/historical_host_memory_259_one_shot_empirical_result_v0.1.json \
            --output results/host_memory_sampling_overlap_v0.1.json
          python - <<'PY'
          import json,math
          from pathlib import Path
          a=json.loads(Path('results/host_memory_sampling_overlap_v0.1.json').read_text())
          b=json.loads(Path('benchmarks/exploratory/host_memory_sampling_overlap_v0.1.json').read_text())
          assert a['status']==b['status']=='POST_OUTCOME_RESPONSE_BLIND_PREDICTOR_GEOMETRY_AUDIT'
          assert a['source_sha256']==b['source_sha256']
          assert (a['source_bound_species'],a['response_blind_external_edge_rows'])==(641,71520)
          for key in ['all','development','confirmatory']:
            for metric in a['panels'][key]:
              for field,v in a['panels'][key][metric].items():
                w=b['panels'][key][metric][field]
                assert math.isclose(v,w,rel_tol=0,abs_tol=1e-7), (key,metric,field)
          assert a['interpretation']['coefficient_or_p_value_tested'] is False
          assert a['interpretation']['original_259_empirical_status']=='NOT_EVALUABLE_EMPIRICAL_RESPONSE'
          print('PASS_PREVIOUSLY_FROZEN_641_SPECIES_EXTERNAL_ONLY__NO_NEW_GENETIC_TEST')
          PY
      - name: Verify same five-point cost can hide different illustrative 2D corridors
        run: |
          set -euo pipefail
          python scripts/probe_host_corridor_nonidentifiability.py \
            --output results/synthetic_host_corridor_nonidentifiability_v0.1.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/synthetic_host_corridor_nonidentifiability_v0.1.json')
          q=Path('benchmarks/exploratory/synthetic_host_corridor_nonidentifiability_v0.1.json')
          assert json.loads(p.read_text())==json.loads(q.read_text())
          d=json.loads(q.read_text())
          assert d['five_point_straight_line_cost']=={'with_alternative_corridor':20.0,'without_alternative_corridor':20.0}
          assert d['least_cost_distance']=={'with_alternative_corridor':10.0,'without_alternative_corridor':141.0}
          assert d['not_an_empirical_LGM_result'] is True
          print('PASS_SYNTHETIC_FIVE_POINT_VERSUS_CORRIDOR_NONIDENTIFIABILITY_ONLY')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: host-memory-sampling-geometry-only-v0.1
          path: results/*.json
          retention-days: 30
          if-no-files-found: error
